w":["XML is a data format.","","UML is a modelling language.","CSS styles web pages."]},{"id":"s50","u":15,"q":"Which of the following statements best describes the primary key in a database table?","o":["The primary key uniquely identifies each record.","The primary key must be a composite key.","The primary key is the same thing as a foreign key.","The primary key can contain a null attribute."],"a":0,"e":"A primary key is unique and not null.","s":"sample","n":50,"k":106,"w":["","A primary key can be a single column.","They are different keys.","Primary keys cannot be NULL."]},{"id":"s51","u":15,"q":"Why is UML important when creating a database?","o":["To test.","To design.","To record.","To model."],"a":3,"e":"UML is a modelling language.","s":"sample","n":51,"k":104,"w":["UML is not a testing tool.","Design is close, but UML's purpose is modelling.","UML is not for recording data.",""]},{"id":"s52","u":15,"q":"Which of the following SQL query statements will list book titles by all authors whose names begin with the letter C?","o":["SELECT title, author FROM book WHERE author LIKE 'C'","SELECT title, author FROM book WHERE author = 'C%'","SELECT title, author FROM book WHERE author LIKE 'C%'","SELECT title, author FROM book WHERE author = 'C____'"],"a":2,"e":"Wildcards (%) only work with LIKE. 'C%' = starts with C.","s":"sample","n":52,"k":106,"w":["LIKE 'C' only matches exactly C.","= does not use wildcards.","","= with underscores matches literal underscores, not a pattern."]},{"id":"s53","u":15,"q":"Which one of the following is a key security issue to consider in database design?","o":["Redundancy of data.","Multi-user access control.","Use of primary keys.","Naming conventions."],"a":1,"e":"Controlling who can access what (multi-user access control) is the security issue.","s":"sample","n":53,"k":105,"w":["Redundancy is a design issue.","","Primary keys are about integrity.","Naming is about readability."]},{"id":"s54","u":15,"q":"What result will the following SQL statement give?\nSELECT Orders.OrderID, Customers.CustomerName FROM Orders RIGHT JOIN Customers ON Orders.CustomerID=Customers.CustomerID;","o":["It will list all the names of Customers.","It will list all the Order ID numbers.","It will list the names of all Customers and any Orders they have placed.","It will list all the Order ID numbers and the names of Customers that placed them."],"a":2,"e":"RIGHT JOIN keeps every row of the right table (Customers) plus matching orders (NULL if none).","s":"sample","n":54,"k":106,"w":["It also shows orders, not just names.","Orders without customers are dropped by a RIGHT JOIN.","","Customers with no orders are kept too."]},{"id":"s55","u":16,"q":"Which layer manages the rate of data transmission between two nodes on a network?","o":["Transport layer.","Session layer.","Network layer.","Data link layer."],"a":0,"e":"The transport layer (layer 4) controls the rate of data flow (flow control) between the two end computers. The data link layer only controls one direct link.","s":"sample","n":55,"k":107,"w":["","The session layer manages sessions.","The network layer routes packets.","Data link manages one physical link; the course answer is transport."]},{"id":"s56","u":16,"q":"What is XML data stored in?","o":["HTML files.","Text files","RSS feeds.","Javascript."],"a":1,"e":"XML is stored as plain text files.","s":"sample","n":56,"w":["HTML files hold web pages.","","RSS is one use of XML.","JavaScript is code."]},{"id":"s57","u":16,"q":"The diagram represents part of the document tree for an XML document. How many siblings does the element \u003cName> have?","o":["1.","2.","3.","4."],"a":2,"e":"\u003cName>, \u003cPayroll number>, \u003cDate of Birth> and \u003cGender> share one parent, so \u003cName> has 3 siblings. The Department attribute is not an element sibling.","s":"sample","n":57,"img":"xmltree","k":110,"w":["\u003cName> has more than one sibling.","Count again: there are three.","","The attribute is not a sibling."]},{"id":"s58","u":16,"q":"Which one of the following best describes an XML schema?","o":["It is converted from an XML file using an XML parser.","It is an XML alternative to DTD.","It needs an XML file to be loaded on different servers.","It needs an XML parser to be installed before using XML files."],"a":1,"e":"XML Schema (XSD) is the XML-based alternative to DTD.","s":"sample","n":58,"k":112,"w":["Schemas are written, not converted from XML.","","Schemas do not need XML files on several servers.","A parser is needed for XML anyway; this does not describe a schema."]},{"id":"s59","u":17,"q":"What hardware device is used to amplify network signals when sending them from one part of the network to another?","o":["A bridge.","A router.","A repeater.","A switch."],"a":2,"e":"A repeater regenerates/amplifies signals to extend range.","s":"sample","n":59,"k":114,"w":["A bridge connects segments.","A router connects networks.","","A switch connects devices."]},{"id":"s60","u":17,"q":"Which one of the following is the best way to train a user to operate a new IT software program?","o":["Demonstrate the features for them to practice.","Upload the manual to the internet.","Give them the technical documentation.","Talk them through how to use it over the telephone."],"a":0,"e":"Demonstrate, then let them practise: the most effective one-to-one method.","s":"sample","n":60,"k":114,"w":["","Uploading a manual is passive.","Technical documentation is too detailed for training.","Phone talk-throughs give no hands-on practice."]},{"id":"d1","u":1,"q":"Which SDLC model completes each phase fully before the next one starts, with little room to go back?","o":["Waterfall","Spiral","Agile","Prototyping"],"a":0,"e":"Waterfall is linear and sequential. Spiral and Agile are iterative.","s":"draft","k":5,"w":["","Spiral repeats cycles with risk analysis, so phases are revisited.","Agile works in short iterations and expects change.","Prototyping builds early versions and refines them, so phases repeat."]},{"id":"d2","u":1,"q":"Which SDLC model is driven by repeated cycles of risk analysis?","o":["Spiral","Waterfall","V-model","Big Bang"],"a":0,"e":"Each loop of the Spiral model includes planning, risk analysis, engineering and evaluation.","s":"draft","k":5,"w":["","Waterfall is linear; risk is not revisited in cycles.","The V-model pairs each phase with a test phase; it is not risk-driven.","Big Bang has little planning or risk analysis at all."]},{"id":"d3","u":1,"q":"In the V-model, each development phase is paired with:","o":["A matching testing phase","A marketing phase","A customer payment","A maintenance release"],"a":0,"e":"The V-model links each development stage to a test stage (e.g. requirements ↔ acceptance testing).","s":"draft","k":5,"w":["","Marketing is not part of the V-model.","Payments are a business matter, not a V-model stage.","Maintenance comes after release; it is not paired with each phase."]},{"id":"d4","u":1,"q":"Which of the following is pseudocode used for?","o":["Describing an algorithm in plain, structured language","Translating finished source code into machine language","Styling the layout of web pages with rules","Storing program data permanently in tables"],"a":0,"e":"Pseudocode expresses logic in readable steps without the syntax of a real language.","s":"draft","k":6,"w":["","That is what a compiler does.","That is what CSS does for web pages.","That is what a database does."]},{"id":"d5","u":1,"q":"The three basic control structures of structured programming are:","o":["Sequence, selection, iteration","Classes, objects and their methods","Input, output, storage","Compile, link, run"],"a":0,"e":"Any algorithm can be built from sequence, selection (if) and iteration (loops).","s":"draft","k":8,"w":["","Classes, objects and methods are object-oriented ideas, not the three control structures.","Input, output and storage describe what a computer does with data.","Compile, link and run are steps in building a program."]},{"id":"d6","u":1,"q":"Which flowchart symbol represents a decision?","o":["Diamond","Rectangle","Oval","Parallelogram"],"a":0,"e":"Diamond = decision; rectangle = process; oval = start/end; parallelogram = input/output.","s":"draft","k":6,"w":["","A rectangle shows a process step.","An oval shows the start or end.","A parallelogram shows input or output."]},{"id":"d7","u":1,"q":"What does a compiler do?","o":["Translates the whole program before it runs","Executes source code one line at a time","Runs the program inside a web browser","Links the program to a database server"],"a":0,"e":"A compiler translates everything first; an interpreter translates and runs line by line.","s":"draft","k":1,"w":["","That describes an interpreter, not a compiler.","Running in a browser is done by scripts or applets, not by compiling.","Connecting to a database is done by drivers such as JDBC."]},{"id":"d8","u":1,"q":"In event-driven programming, the code that runs when a button is clicked is called:","o":["An event handler","A compiler","A loop counter","A data type"],"a":0,"e":"Event handlers (listeners) respond to events such as clicks and key presses.","s":"draft","k":11,"w":["","A compiler translates source code; it does not respond to clicks.","A loop counter counts repetitions of a loop.","A data type describes what kind of value a variable holds."]},{"id":"d9","u":1,"q":"Which programming paradigm organises code around objects that combine data and behaviour?","o":["Object-oriented","Procedural","Machine code","Assembly"],"a":0,"e":"OOP bundles data (attributes) and behaviour (methods) into objects.","s":"draft","k":1,"w":["","Procedural programming is organised around procedures (functions), not objects.","Machine code is binary instructions, not a paradigm built on objects.","Assembly is a low-level language using mnemonics, not object-based."]},{"id":"d10","u":1,"q":"Which of these is a low-level language?","o":["Assembly language","Java","Python","C#"],"a":0,"e":"Assembly is close to machine code; Java, Python and C# are high-level.","s":"draft","k":1,"w":["","Java is a high-level language.","Python is a high-level language.","C# is a high-level language."]},{"id":"d11","u":1,"q":"What does the Agile approach emphasise?","o":["Short iterations with frequent customer feedback","One long phase with no feedback","Writing complete documentation before any code is written","Avoiding testing until the end"],"a":0,"e":"Agile delivers working software in short sprints and adapts to feedback.","s":"draft","k":5,"w":["","That describes Waterfall, the opposite of Agile.","Agile values working software over heavy upfront documentation.","Agile tests continuously in every iteration."]},{"id":"d12","u":1,"q":"The binary number 1010 equals which decimal number?","o":["10","8","12","5"],"a":0,"e":"1×8 + 0×4 + 1×2 + 0×1 = 10.","s":"draft","k":1,"w":["","8 is 1000 in binary.","12 is 1100 in binary.","5 is 101 in binary."]},{"id":"d13","u":2,"q":"Which is an example of a functional requirement?","o":["The system must let users reset their password by email","The system must load pages in under 2 seconds","The system must be available 99.9% of the time, day and night","The system must use the company colour scheme"],"a":0,"e":"Functional = what the system does. Speed, availability and appearance are non-functional.","s":"draft","w":["","Speed is a quality (non-functional) requirement.","Availability is a non-functional requirement.","Appearance is a non-functional requirement."]},{"id":"d14","u":2,"q":"Which is an example of a non-functional requirement?","o":["The system must support 500 simultaneous users","The system must print invoices","The system must calculate tax","The system must store each customer's name and address"],"a":0,"e":"Performance/capacity is a non-functional (quality) requirement.","s":"draft","w":["","Printing invoices is something the system does: functional.","Calculating tax is functional.","Storing customer details is functional."]},{"id":"d15","u":2,"q":"Which technique gathers requirements by watching users do their normal work?","o":["Observation","Questionnaire","Prototyping","Code review"],"a":0,"e":"Observation shows how users really work, including steps they forget to mention.","s":"draft","w":["","Questionnaires ask users questions; they do not watch them work.","Prototyping shows users an early model for feedback.","Code review examines code, not users' work."]},{"id":"d16","u":2,"q":"Which document records agreed requirements for a software project?","o":["Software Requirements Specification (SRS)","User manual for the finished system","Test log of the executed test cases","Release notes describing the first version of the system"],"a":0,"e":"The SRS is the formal record of agreed requirements.","s":"draft","w":["","A user manual explains how to use the finished system.","A test log records test results.","Release notes describe what changed in a version."]},{"id":"d17","u":2,"q":"What should happen FIRST when a client asks for a new feature mid-project?","o":["Submit a formal change request for assessment","Start coding the feature straight away","Wait until the project ends, then add it","Remove another feature to make room for it"],"a":0,"e":"Change management: request → impact analysis → approval → implement.","s":"draft","k":16,"w":["","Coding before approval leads to scope creep.","Delaying is not the first step; the request must be assessed first.","Removing features is a possible outcome of assessment, not the first step."]},{"id":"d18","u":2,"q":"What is impact analysis in change management?","o":["Assessing a change's effect on cost, time and scope","Testing the user interface after the change","Updating the user manual to match the change","Installing the approved software update on every user's PC"],"a":0,"e":"Impact analysis estimates the effect of a change before it is approved.","s":"draft","k":16,"w":["","UI testing happens after the change is made.","Updating the manual comes after the change is approved and built.","Installing the update is deployment, the last step."]},{"id":"d19","u":2,"q":"Who normally approves or rejects change requests on a project?","o":["A change control board or project sponsor","Any developer working on the project","The end user who originally asked for the change","The tester who will check the change"],"a":0,"e":"A change control board (or sponsor) authorises changes.","s":"draft","k":16,"w":["","Developers implement changes; they do not approve them.","The user requests the change but does not approve it.","Testers check changes after they are made."]},{"id":"d20","u":2,"q":"A use case diagram mainly shows:","o":["Actors and the goals they achieve with the system","Database tables and the primary and foreign keys that link them","Classes with their attributes and methods","Messages between objects in time order"],"a":0,"e":"Use case diagrams show who (actors) does what (use cases) with the system.","s":"draft","k":12,"w":["","That is an ERD.","That is a class diagram.","That is a sequence diagram."]},{"id":"d21","u":2,"q":"Which UML diagram shows the order of messages between objects over time?","o":["Sequence diagram","Class diagram","Use case diagram","Deployment diagram"],"a":0,"e":"Sequence diagrams show interactions in time order.","s":"draft","k":12,"w":["","A class diagram shows static structure, not time order.","A use case diagram shows actors and goals.","A deployment diagram shows hardware and where software runs."]},{"id":"d22","u":2,"q":"What is 'scope creep'?","o":["Uncontrolled growth in project requirements","A defect that spreads to other modules","A database error caused by missing primary keys","A testing technique for large systems"],"a":0,"e":"Scope creep is adding requirements without controlling time, cost and approval.","s":"draft","w":["","That is a defect spreading, not scope creep.","That is a database design error.","Scope creep is not a testing technique."]},{"id":"d23","u":2,"q":"Requirement traceability means:","o":["Each requirement links to its design, code and tests","Requirements are kept secret from the users","Requirements are written as comments directly in the code","Only the manager may read the requirements"],"a":0,"e":"A traceability matrix links requirements to design elements and test cases.","s":"draft","w":["","Requirements are shared with stakeholders, not hidden.","Requirements are kept in the SRS, not in code comments.","Requirements are available to the whole team."]},{"id":"d24","u":2,"q":"What is a Data Flow Diagram (DFD) used for?","o":["Showing how data moves between processes and stores","Showing which classes inherit from other classes","Showing the planned costs of each project phase","Showing the layout of each screen in the system"],"a":0,"e":"DFDs model the flow of data through a system.","s":"draft","w":["","Inheritance is shown in a class diagram.","Costs are shown in a budget or project plan.","Screen layouts are shown in wireframes."]},{"id":"d25","u":3,"q":"What is the purpose of a software review?","o":["To find defects early by examining work products","To market the software to new customers","To install the software on users' machines after release","To delete old code that is no longer used"],"a":0,"e":"Reviews (walkthroughs, inspections) catch defects before testing.","s":"draft","w":["","Marketing is a business activity, not a review.","Installing software is deployment.","Deleting old code is refactoring or clean-up, not a review."]},{"id":"d26","u":3,"q":"Which review type is the most formal, with defined roles and checklists?","o":["Inspection","Walkthrough","Informal chat","Pair programming"],"a":0,"e":"Inspections are formal: moderator, reader, recorder, checklists and metrics.","s":"draft","w":["","A walkthrough is led by the author and less formal.","An informal chat has no roles or checklists.","Pair programming is two people coding together, not a formal review."]},{"id":"d27","u":3,"q":"Lines of Code (LOC) is an example of:","o":["A software size metric","A testing tool","A programming language","A UML diagram"],"a":0,"e":"LOC measures size; function points measure functionality.","s":"draft","k":20,"w":["","LOC is a measurement, not a tool.","LOC is not a language.","LOC is not a diagram."]},{"id":"d28","u":3,"q":"Cyclomatic complexity measures:","o":["The number of independent paths through code","The number of lines in each source file","The number of users the system can support at one time","The time a program takes to run once"],"a":0,"e":"Higher cyclomatic complexity = more paths = harder to test and maintain.","s":"draft","k":20,"w":["","Counting lines is LOC.","User capacity is a performance measure.","Run time is a performance measure."]},{"id":"d29","u":3,"q":"Which tool is an IDE (Integrated Development Environment)?","o":["Eclipse","Microsoft Paint","Windows Explorer","Adobe Reader"],"a":0,"e":"IDEs like Eclipse, NetBeans, IntelliJ combine editor, compiler and debugger.","s":"draft","k":23,"w":["","Paint is a graphics program.","Windows Explorer is a file manager.","Adobe Reader opens PDF files."]},{"id":"d30","u":3,"q":"What does a version control system such as Git do?","o":["Tracks code changes so teams can merge and roll back","Compiles Java code into bytecode for the JVM","Designs the database tables and the relationships between them","Encrypts source files before they are shared"],"a":0,"e":"Version control records history, supports branching/merging and rollback.","s":"draft","k":22,"w":["","Compiling is the job of javac.","Database design is done with ERDs and a DBMS.","Encryption is a security tool's job."]},{"id":"d31","u":3,"q":"Which criterion matters MOST when choosing a software tool for a team?","o":["It meets the requirements and fits existing systems","It has the most modern and colourful interface","It is the newest product released on the market","It is the most expensive option, so the best"],"a":0,"e":"Choose tools by fitness for purpose, compatibility, support and cost.","s":"draft","w":["","Appearance matters less than fitness for purpose.","Newest does not mean suitable or stable.","Price does not guarantee suitability."]},{"id":"d32","u":3,"q":"Defect density is calculated as:","o":["Number of defects ÷ size (e.g. per KLOC)","Number of testers ÷ number of modules","Lines of code × number of releases","Total cost ÷ development time"],"a":0,"e":"Defect density = defects per unit size, e.g. per 1000 lines.","s":"draft","k":20,"w":["","Testers per module is not a quality metric.","This does not measure defects.","This is a cost rate, not defect density."]},{"id":"d33","u":3,"q":"Static analysis tools examine code:","o":["Without running it","Only while it runs","Only after release","Only on paper"],"a":0,"e":"Static analysis checks source code for problems without executing it.","s":"draft","w":["","Examining running code is dynamic analysis.","Static analysis is done during development.","Static analysis tools are software, not paper checks."]},{"id":"d34","u":3,"q":"A peer code review is mainly used to:","o":["Find errors and improve code quality before release","Measure how fast each developer writes code","Replace testing, so the code no longer has to be tested","Produce the user manual from the comments"],"a":0,"e":"Another developer reads the code to catch defects and suggest improvements.","s":"draft","w":["","Reviews are not for measuring speed.","Reviews complement testing; they do not replace it.","Manuals are written separately."]},{"id":"d35","u":4,"q":"What type of error stops a program from compiling?","o":["Syntax error","Logic error","Runtime error","User error"],"a":0,"e":"Syntax errors break language rules, so the compiler rejects the code.","s":"draft","w":["","Logic errors compile and run but give wrong results.","Runtime errors happen while the program runs.","\"User error\" is a mistake by the person using the program."]},{"id":"d36","u":4,"q":"A program runs without crashing but gives the wrong total. This is a:","o":["Logic error","Syntax error","Compilation error","Hardware fault"],"a":0,"e":"Logic errors give wrong results without crashing.","s":"draft","w":["","A syntax error stops the program compiling.","A compilation error stops the program compiling.","A hardware fault is a physical problem, not a wrong total from code."]},{"id":"d37","u":4,"q":"Dividing by zero while a program is running causes a:","o":["Runtime error","Syntax error","Design error","Typing error"],"a":0,"e":"Runtime errors happen during execution (e.g. divide by zero, null reference).","s":"draft","w":["","Syntax errors are found before the program runs.","A design error is a planning mistake.","A typing error usually causes a syntax error."]},{"id":"d38","u":4,"q":"What is a breakpoint in a debugger?","o":["A marker where execution pauses for inspection","A line that deletes code when it is reached","A fatal error that stops the program","The last line of the program's main method"],"a":0,"e":"Breakpoints pause execution for inspection.","s":"draft","k":29,"w":["","Breakpoints never delete code.","A breakpoint is set deliberately; it is not an error.","A breakpoint can be on any line."]},{"id":"d39","u":4,"q":"Which testing method tests the internal code paths and logic?","o":["White-box testing","Black-box testing","Acceptance testing","Usability testing"],"a":0,"e":"White-box = internal structure known; black-box = only inputs/outputs.","s":"draft","k":31,"w":["","Black-box testing ignores the internal code.","Acceptance testing checks the system against user needs.","Usability testing checks ease of use."]},{"id":"d40","u":4,"q":"Black-box testing is based on:","o":["Requirements and expected outputs only","The structure of the source code","The design of the database only","The developer's opinion of the code"],"a":0,"e":"Black-box testers test behaviour against specifications.","s":"draft","k":31,"w":["","The structure of the code is used in white-box testing.","It is not limited to the database.","It uses the specification, not opinion."]},{"id":"d41","u":4,"q":"Which testing level checks individual functions or classes in isolation?","o":["Unit testing","System testing","Acceptance testing","Integration testing"],"a":0,"e":"Unit tests check the smallest testable parts.","s":"draft","w":["","System testing tests the whole system.","Acceptance testing is done by users at the end.","Integration testing checks modules working together."]},{"id":"d42","u":4,"q":"Which testing checks that modules work correctly together?","o":["Integration testing","Unit testing","Alpha testing","Static testing"],"a":0,"e":"Integration testing checks interfaces between modules.","s":"draft","k":30,"w":["","Unit testing checks modules on their own.","Alpha testing is in-house testing of the whole product.","Static testing reviews code without running it."]},{"id":"d43","u":4,"q":"Re-running earlier tests after a change to make sure nothing else broke is:","o":["Regression testing","Smoke testing","Stress testing","Beta testing"],"a":0,"e":"Regression testing catches side-effects of changes.","s":"draft","k":30,"w":["","Smoke testing is a quick check that the main functions work.","Stress testing pushes the system beyond normal load.","Beta testing is done by real users before release."]},{"id":"d44","u":4,"q":"Testing by real users at their own sites before final release is:","o":["Beta testing","Alpha testing","Unit testing","White-box testing"],"a":0,"e":"Alpha = in-house users; beta = real users in the real environment.","s":"draft","k":30,"w":["","Alpha testing is done in-house, not at users' sites.","Unit testing checks small parts of code.","White-box testing is done by developers who know the code."]},{"id":"d45","u":4,"q":"A test case should include:","o":["Input data, steps and the expected result","The programmer's name and the date","The full source code of the module being tested","The design of the user interface"],"a":0,"e":"Test cases specify inputs, steps, expected and actual results.","s":"draft","w":["","Name and date are admin details, not the core of a test case.","Test cases do not include the full source code.","UI design is a design document."]},{"id":"d46","u":4,"q":"Testing with values at the edges of valid ranges (e.g. 0, 1, 100, 101) is:","o":["Boundary value analysis","Equivalence partitioning","Smoke testing","Load testing"],"a":0,"e":"Errors cluster at boundaries, so test at and just beyond them.","s":"draft","k":32,"w":["","Equivalence partitioning tests one value from each group of inputs.","Smoke testing is a quick check of main functions.","Load testing tests many users."]},{"id":"d47","u":5,"q":"Who is the main audience for a user manual?","o":["End users of the system","Database administrators only","Compiler designers","Hardware engineers"],"a":0,"e":"User manuals explain how to use the system to end users.","s":"draft","k":35,"w":["","Administrators use technical documentation.","Compiler designers do not use application user manuals.","Hardware engineers use technical documentation."]},{"id":"d48","u":5,"q":"Which document helps developers maintain and update a system later?","o":["Technical (system) documentation","Marketing brochure for the product","Sales invoice for the licence","Social media post about the release"],"a":0,"e":"Technical documentation explains design, code and configuration for maintainers.","s":"draft","k":35,"w":["","Brochures are for marketing.","Invoices are financial.","Social media posts are promotion."]},{"id":"d49","u":5,"q":"What is the purpose of a style guide in technical writing?","o":["To keep terminology, formatting and tone consistent","To store the source code that the document describes","To test the program before the manual is written","To design the database the document refers to"],"a":0,"e":"Style guides ensure consistency across documents and writers.","s":"draft","k":34,"w":["","Source code is stored in a repository.","Testing is a separate activity.","Database design is a separate activity."]},{"id":"d50","u":5,"q":"Why should screenshots be included in user documentation?","o":["They show users exactly what they will see","They make the file larger and more detailed","They replace the need for any written steps","They hide errors that users might notice"],"a":0,"e":"Visuals reduce ambiguity in step-by-step instructions.","s":"draft","w":["","File size is not a benefit.","Screenshots support written steps; they do not replace them.","Screenshots should show the real interface, not hide errors."]},{"id":"d51","u":5,"q":"Which writing style suits procedures in user guides?","o":["Numbered steps in short, active instructions","Long paragraphs that explain the background","Passive sentences full of technical jargon","Steps listed in alphabetical order"],"a":0,"e":"Numbered, imperative steps (e.g. 'Click Save') are easiest to follow.","s":"draft","k":34,"w":["","Long paragraphs are hard to follow when doing a task.","Passive voice and jargon confuse users.","Steps must follow the order of the task."]},{"id":"d52","u":5,"q":"Why is version control important for documentation?","o":["Readers can see which version matches the software","It makes every document longer and more complete","It removes the need for anyone to review it","It translates the document into other languages"],"a":0,"e":"Version numbers and change history keep docs in step with releases.","s":"draft","w":["","Version control does not lengthen documents.","Reviews are still needed.","Translation is a separate task."]},{"id":"d53","u":5,"q":"What is a glossary in technical documentation?","o":["A list of terms with their definitions","A list of known bugs and their fixes","A list of customers and their contacts","A table of the test results for each feature"],"a":0,"e":"A glossary defines technical terms for readers.","s":"draft","w":["","Known bugs are listed in release notes.","Customer lists are business records.","Test results are in test reports."]},{"id":"d54","u":5,"q":"Before publishing documentation, the BEST check is to:","o":["Have a target user follow the instructions","Count the pages and check the page numbers","Change the font to make it look professional","Remove all images to make the file smaller"],"a":0,"e":"Usability-testing documents with real users catches gaps and errors.","s":"draft","k":34,"w":["","Page numbers matter less than whether users can follow it.","Fonts do not show whether instructions work.","Images often help users."]},{"id":"d55","u":5,"q":"Online help that appears next to the field a user is working on is called:","o":["Context-sensitive help","A printed manual","Release notes","A licence agreement"],"a":0,"e":"Context-sensitive help shows information relevant to the current screen or field.","s":"draft","k":35,"w":["","A printed manual is not shown next to a field.","Release notes describe changes in a version.","A licence agreement sets legal terms."]},{"id":"d56","u":5,"q":"Release notes mainly describe:","o":["New features, fixes and known issues in a version","How to install the hardware the software needs","The history of the company that made the software","Prices and discounts for the new version"],"a":0,"e":"Release notes summarise what changed in a release.","s":"draft","w":["","Hardware installation is in an installation guide.","Company history is not release notes.","Prices are in sales material."]},{"id":"d57","u":7,"q":"Which keyword creates a new object in Java?","o":["new","class","static","void"],"a":0,"e":"new allocates an object and calls its constructor, e.g. new Student().","s":"draft","k":49,"w":["","class declares a class; it does not create an object.","static marks members that belong to the class.","void means a method returns nothing."]},{"id":"d58","u":7,"q":"What is a constructor in Java?","o":["A special method that initialises a new object","A loop that creates many objects at once","A variable that holds an object's address","A comment that describes what a class does"],"a":0,"e":"Constructors have the class name and no return type.","s":"draft","k":49,"w":["","Loops repeat code; a constructor runs once per new object.","A reference variable holds the object; it is not a constructor.","Comments do not run."]},{"id":"d59","u":7,"q":"Which Java concept hides data by making fields private and providing getters/setters?","o":["Encapsulation","Inheritance","Polymorphism","Compilation"],"a":0,"e":"Encapsulation protects internal state.","s":"draft","k":49,"w":["","Inheritance reuses another class's features.","Polymorphism lets one call behave differently per object.","Compilation translates code."]},{"id":"d60","u":7,"q":"Which keyword lets a class inherit from another class in Java?","o":["extends","implements","import","inherits"],"a":0,"e":"class Car extends Vehicle. 'implements' is for interfaces.","s":"draft","k":49,"w":["","implements is for interfaces.","import brings in classes from packages.","inherits is not a Java keyword."]},{"id":"d61","u":7,"q":"Java source code is compiled into:","o":["Bytecode run by the Java Virtual Machine (JVM)","HTML","Machine code that runs on one specific CPU only","SQL"],"a":0,"e":"javac produces .class bytecode; the JVM runs it on any platform.","s":"draft","k":51,"w":["","HTML is web markup, not compiled Java output.","Java is compiled to portable bytecode, not CPU-specific machine code.","SQL is a database language."]},{"id":"d62","u":7,"q":"Which is the correct Java main method signature?","o":["public static void main(String[] args)","public void main()","public static int main(String args)","void Main(String[] args)"],"a":0,"e":"The JVM looks for public static void main(String[] args).","s":"draft","k":54,"w":["","It must be static and take String[] args.","It must return void and take an array, String[].","It must be public static, with a lower-case main."]},{"id":"d63","u":7,"q":"Which Java data type stores whole numbers?","o":["int","double","boolean","String"],"a":0,"e":"int = whole numbers; double = decimals; boolean = true/false.","s":"draft","k":54,"w":["","double stores decimals.","boolean stores true or false.","String stores text."]},{"id":"d64","u":7,"q":"Which loop is best when you know exactly how many times to repeat?","o":["for loop","while loop","do-while loop","if statement"],"a":0,"e":"for loops suit a known number of iterations.","s":"draft","k":53,"w":["","while suits an unknown number of repeats.","do-while runs at least once and suits an unknown count.","if makes a decision; it does not repeat."]},{"id":"d65","u":7,"q":"Polymorphism in Java means:","o":["One method call behaves differently per object","A class may contain only one method","A variable's value can never change","Code that runs on only one operating system"],"a":0,"e":"Overriding/overloading let one interface have many forms.","s":"draft","k":49,"w":["","Classes can contain many methods.","That describes a constant (final).","That is platform dependence, the opposite of Java."]},{"id":"d66","u":7,"q":"What does the 'static' keyword mean on a Java method?","o":["It belongs to the class, not to an object","It cannot be called from another class","It runs only once when the program starts","It can only be used inside its own package"],"a":0,"e":"Static members are shared by the class and called without creating an object.","s":"draft","k":49,"w":["","Access is controlled by private/public, not static.","That describes a static initialiser block, not a static method.","Package access is the default modifier, not static."]},{"id":"d67","u":7,"q":"Which statement handles exceptions in Java?","o":["try ... catch","if ... else","for ... each","switch ... case"],"a":0,"e":"try/catch catches and handles exceptions.","s":"draft","w":["","if...else makes decisions.","for-each loops over items.","switch chooses between cases."]},{"id":"d68","u":7,"q":"What will System.out.println(7 / 2); print in Java?","o":["3","3.5","4","3.0"],"a":0,"e":"Both operands are int, so integer division gives 3.","s":"draft","k":54,"w":["","3.5 needs a decimal type such as 7.0 / 2.","Integer division truncates; it does not round up.","3.0 would need a double."]},{"id":"d69","u":8,"q":"What is a software component?","o":["A reusable, self-contained unit with an interface","A hardware cable that links two computers together","A user manual that describes a system","A single row stored in a database table"],"a":0,"e":"Components are reusable building blocks with clear interfaces.","s":"draft","k":59,"w":["","Cables are hardware, not software components.","A manual is documentation.","A table row is stored data."]},{"id":"d70","u":8,"q":"What is the main benefit of reusing existing software components?","o":["Faster development with already-tested code","The program runs faster on every computer","Developers no longer need to write any code","Testing is no longer needed after reuse"],"a":0,"e":"Reuse saves time and relies on proven code, but still needs integration testing.","s":"draft","k":59,"w":["","Reuse does not make programs run faster.","Developers still write code to connect components.","Integration testing is still needed."]},{"id":"d71","u":8,"q":"In Java, which statement makes classes from a library available in your code?","o":["import","include","require","using"],"a":0,"e":"import java.util.ArrayList; brings in library classes.","s":"draft","k":57,"w":["","#include is C and C++.","require is JavaScript (Node) or PHP.","using is C#."]},{"id":"d72","u":8,"q":"An API (Application Programming Interface) is:","o":["Methods a component exposes for other code to use","A program that spreads between computers","A table that stores a component's data","A screen layout that users interact with directly"],"a":0,"e":"APIs define how software components communicate.","s":"draft","k":59,"w":["","A program that spreads between computers is a worm.","A table is data storage.","A screen layout is the UI."]},{"id":"d73","u":8,"q":"Which Java package contains collection classes like ArrayList and HashMap?","o":["java.util","java.io","java.net","java.awt"],"a":0,"e":"java.util holds the Collections Framework.","s":"draft","k":57,"w":["","java.io is for input and output.","java.net is for networking.","java.awt is for graphics."]},{"id":"d74","u":8,"q":"Before using a third-party component, you should check:","o":["Its licence, compatibility, documentation and support","Only its colour scheme and how its interface looks","Only the file name and file size","Only the number of downloads it has"],"a":0,"e":"Licensing and compatibility problems are common risks of reuse.","s":"draft","k":59,"w":["","Looks are not the key check.","File name and size tell you little.","Popularity does not show suitability."]},{"id":"d75","u":8,"q":"A JAR file in Java is:","o":["A package of compiled classes and resources","A text document describing a Java program","An image format used by Java applications","A database file used by Java servlets"],"a":0,"e":"JAR (Java ARchive) bundles .class files for distribution and reuse.","s":"draft","k":57,"w":["","It is not a text document.","It is not an image format.","It is not a database file."]},{"id":"d76","u":8,"q":"Which document explains how to use a library's classes and methods?","o":["API documentation (e.g. Javadoc)","The project's sales invoice","The test log from the last release","The network diagram of the servers"],"a":0,"e":"Javadoc/API docs describe each class, method and parameter.","s":"draft","k":59,"w":["","An invoice is financial.","A test log records tests.","A network diagram shows servers."]},{"id":"d77","u":8,"q":"What is an interface in Java?","o":["A contract of methods a class must implement","A graphical window that displays a form to the user","A connection to a database server","A loop that repeats a block of code"],"a":0,"e":"Interfaces define what methods a class must provide.","s":"draft","k":57,"w":["","A window is a GUI element.","A database connection uses JDBC.","A loop is a control structure."]},{"id":"d78","u":8,"q":"Which statement about open-source components is correct?","o":["Their licence lets anyone use and modify the source","They can never be used in commercial products","They are released with no licence of any kind","They are always less secure than paid components"],"a":0,"e":"Open-source licences (MIT, GPL, Apache) set the rules for use.","s":"draft","k":59,"w":["","Many open-source licences allow commercial use.","Open-source software always has a licence.","Security depends on the code, not the price."]},{"id":"k0","u":1,"q":"What is the purpose of design in a systems development cycle?","o":["To formulate a logical approach to system implementation","To formulate a physical solution to system requirements","To formulate code in order to implement a website template","To formulate a solution to realize system requirements"],"a":3,"e":"Design turns the agreed requirements into a solution that can be built.","s":"booklet","w":["A logical approach is only part of design; the aim is a complete solution to the requirements.","A physical solution is only one part; design must realise all the requirements.","Writing code to a website template is implementation, not design.",""]},{"id":"k1","u":1,"q":"What best describes a Flowchart in software development?","o":["A sequence of events to be carried out","A rapid application design model","A use case diagram","A waterfall method"],"a":0,"e":"A flowchart shows the sequence of steps (events) to be carried out.","s":"booklet","k":6,"w":["","RAD is a development methodology, not a diagram of steps.","A use case diagram shows actors and goals, not a sequence of steps.","Waterfall is a lifecycle model, not a diagram."]},{"id":"k2","u":1,"q":"Which type of programming has extensive use of subroutines?","o":["Spaghetti","Modular","Unit","Structured"],"a":1,"e":"Modular programming breaks a program into many subroutines (modules).","s":"booklet","k":7,"w":["Spaghetti code has tangled jumps and little structure, not many subroutines.","","\"Unit\" refers to testing, not a programming style.","Structured programming uses sequence, selection and iteration; heavy use of subroutines defines modular programming."]},{"id":"k4","u":1,"q":"Which of these describes an event driven program?","o":["It stores event data in a tree structure","It uses classes and methods to define events","It is coded in a procedural programming language","It responds to events triggered by the user"],"a":3,"e":"Event-driven programs respond to events such as clicks and key presses.","s":"booklet","k":11,"w":["Events are not stored in a tree; the program reacts to them.","Classes can model events, but this does not define an event-driven program.","Event-driven programs can be written in many languages, including object-oriented ones.",""]},{"id":"k5","u":1,"q":"Which is a programming tool?","o":["Compiler","Computator","Coder","Comparator"],"a":0,"e":"A compiler is a programming tool; the other words are not real tools.","s":"booklet","k":2,"w":["","\"Computator\" is not a programming tool.","A coder is a person, not a tool.","A comparator is a hardware circuit, not a programming tool."]},{"id":"k7","u":1,"q":"What is a type of Structured Programming?","o":["Unit Programming","Formal Programming","Modular Programming","Spaghetti Programming"],"a":2,"e":"Modular programming is a type of structured programming.","s":"booklet","k":7,"w":["\"Unit programming\" is not a recognised style; unit refers to testing.","\"Formal programming\" is not a type of structured programming.","","Spaghetti programming is the unstructured opposite."]},{"id":"k8","u":1,"q":"What allows users to work with a system?","o":["A layer","A structure","A program","An interface"],"a":3,"e":"An interface lets users work with a system.","s":"booklet","w":["A layer is part of a system's architecture, not what users work with.","A structure organises data or code; it does not let users interact.","A program is the software itself; the interface is how users work with it.",""]},{"id":"k9","u":1,"q":"What feature is unique to event driven programs?","o":["Operational code","Trigger functions","Documentation","Trigger loops"],"a":1,"e":"Event-driven programs rely on trigger functions (handlers) that run when an event fires.","s":"booklet","k":11,"w":["All programs have operational code.","","All good programs have documentation.","\"Trigger loops\" are not a real feature; event programs use trigger functions."]},{"id":"k10","u":1,"q":"What is a unique feature of an event driven program?","o":["Loop functions","Trigger functions","Event testers","Event forms"],"a":1,"e":"Trigger functions (event handlers) are the unique feature of event-driven programs.","s":"booklet","k":11,"w":["Loops appear in all kinds of programs.","","\"Event testers\" are not a programming feature.","\"Event forms\" are not a defining feature."]},{"id":"k11","u":1,"q":"What is the purpose of Pseudocode in software development?","o":["To express the life cycle","To understand charts","To understand trees","To express algorithms"],"a":3,"e":"Pseudocode expresses an algorithm in plain, structured language.","s":"booklet","k":6,"w":["The life cycle is shown with SDLC models, not pseudocode.","Charts are read, not explained by pseudocode.","Trees are data structures; pseudocode describes algorithms.",""]},{"id":"k12","u":1,"q":"What tool is used to write Java programs?","o":["Editor","Interpreter","Compiler","Java VM"],"a":0,"e":"Java source code is written in an editor (or IDE); the compiler then translates it.","s":"booklet","k":2,"w":["","An interpreter runs code; it is not used to write it.","The compiler translates code after it is written in the editor.","The JVM runs compiled bytecode; you do not write code in it."]},{"id":"k13","u":1,"q":"What best describes the form of a programming language?","o":["Elements","Sections","Semantics","Syntax"],"a":3,"e":"Syntax is the form (grammar) of a language; semantics is its meaning.","s":"booklet","w":["Elements are parts of a program, not the language's form.","Sections organise a document, not a language's grammar.","Semantics is the meaning of code; syntax is its form.",""]},{"id":"k14","u":1,"q":"What statement describes Java source code files?","o":["Each source file must begin with an import statement","Each source file can hold many public classes","Each source file ends in the extension class","Each source file can have only one public class"],"a":3,"e":"A Java source file may contain many classes but only one public class, named after the file.","s":"booklet","w":["Import statements are optional; a file can begin with a package or class.","Only one public class is allowed per source file.","Source files end in .java; .class files are compiled bytecode.",""]},{"id":"k16","u":1,"q":"What is byte code?","o":["XML code","Machine independent code","Machine specific code","Java code"],"a":1,"e":"Bytecode is machine-independent; the JVM runs it on any platform.","s":"booklet","w":["XML is a markup language, not compiled Java output.","","Bytecode is not tied to one machine; the JVM makes it portable.","Java code is the source; bytecode is what the compiler produces from it."]},{"id":"k17","u":1,"q":"What are user tasks used for?","o":["To show privileges","To show executable code","To test algorithms","To determine objects"],"a":3,"e":"User tasks (use cases) are analysed to identify the objects a system needs.","s":"booklet","k":6,"w":["Privileges are set by security settings, not found from user tasks.","Executable code is produced by compiling, not by user tasks.","Algorithms are tested with test data, not user tasks.",""]},{"id":"k18","u":1,"q":"What is pseudocode in software development?","o":["An informal way of describing a process","A formal way of structuring a process","An informal way of structuring a program","A formal way of describing a program"],"a":0,"e":"Pseudocode is an informal, plain-language way of describing a process.","s":"booklet","k":6,"w":["","Pseudocode is informal, not a formal structure.","It describes a process, not the structure of a program.","Pseudocode is informal, not formal."]},{"id":"k19","u":1,"q":"What are event handlers used for?","o":["To calculate metrics from events","To allow the programmer to work on multiple events","To distribute the data for events","To run when a corresponding event occurs"],"a":3,"e":"An event handler runs when its matching event occurs.","s":"booklet","k":11,"w":["Metrics are calculated by measurement tools, not event handlers.","Handlers respond to one event each; they are not for managing many events.","Handlers do not distribute data; they run when their event happens.",""]},{"id":"k20","u":2,"q":"What is the purpose of a class diagram?","o":["To show class definitions and the relationships between them","To show the sequence of class events and the activities in a program","To show the behavioral aspects of a program","To show the inheritance in a program"],"a":0,"e":"Class diagrams show classes (attributes, methods) and the relationships between them.","s":"booklet","k":12,"w":["","The sequence of events is shown in sequence and activity diagrams.","Behaviour is shown in activity, sequence and state diagrams.","Inheritance is only one relationship; a class diagram shows all classes and relationships."]},{"id":"k21","u":2,"q":"Which diagram is used as the equivalent of flowcharts and data-flow diagrams in object-oriented modelling?","o":["Object diagram","Class diagram","State diagram","Activity diagram"],"a":3,"e":"Activity diagrams are UML's equivalent of flowcharts and data-flow diagrams.","s":"booklet","k":12,"w":["An object diagram shows objects at one moment.","A class diagram shows static structure.","A state diagram shows the states of one object.",""]},{"id":"k22","u":2,"q":"What is a key feature of Software Quality?","o":["Usability","Simplicity","Flexibility","Adaptability"],"a":0,"e":"Usability is a key software-quality characteristic (ISO 9126/25010).","s":"booklet","k":14,"w":["","Simplicity is a design aim, not a standard quality characteristic.","Flexibility is less central; usability is the key characteristic listed.","Adaptability is less central; usability is the key characteristic listed."]},{"id":"k23","u":2,"q":"What is a change request form used for?","o":["To document changes already made to a configuration","To document the need to update user requirements","To document requests for changes in configuration","To document changes in the requirements"],"a":1,"e":"A change request form records the need to change (update) the user requirements before the change is approved.","s":"booklet","k":16,"w":["Changes already made are logged in configuration records, not requested.","","Configuration changes are handled by configuration management.","This is close, but the form records the need for a change before it happens, not the changes themselves."]},{"id":"k24","u":2,"q":"What is an event tree?","o":["A visual representation of a single failure sequence","A visual representation of a multiple failure sequence","A visual representation of a series of tasks","A visual representation of pathways in a system"],"a":3,"e":"An event tree maps the possible outcomes or pathways that follow one initiating event (Unit 2 slides 229–234).","s":"booklet","k":18,"w":["A fault tree traces back from a single failure; an event tree shows many pathways forward.","An event tree is not limited to failure sequences.","A series of tasks is shown in a flowchart or activity diagram.",""]},{"id":"k25","u":2,"q":"What best describes the purpose of modeling requirements in software development?","o":["To document details from system testing","To communicate the detail for system design","To train the end users of the program","To evaluate the completed program"],"a":1,"e":"Requirement models communicate the detail needed for system design.","s":"booklet","w":["Test details are recorded in test logs.","","Training uses manuals and tutorials.","Evaluating the finished program is testing and review."]},{"id":"k26","u":2,"q":"Which is a reason for using flowcharts?","o":["To document data handling processes","To enable the visualization of a process","To manage the movement of data","To identify the entities in a database"],"a":1,"e":"Flowcharts let people visualise a process.","s":"booklet","k":13,"w":["Documenting data handling is the job of a DFD.","","Managing data movement is done by software, not diagrams.","Database entities are identified with an ERD."]},{"id":"k27","u":2,"q":"What best describes the purpose of process standards?","o":["Provides standards on return on investment (ROI)","They define how the software process should be carried out","They define cost-benefit analysis of the software process","Provides standards on benchmarking across the industry"],"a":1,"e":"Process standards define how the software process should be carried out.","s":"booklet","k":14,"w":["ROI is a financial measure, not a process standard.","","Cost-benefit analysis is a business decision, not a process standard.","Benchmarking compares performance; it is not a process standard."]},{"id":"k28","u":2,"q":"What form is used to document a change to user requirements?","o":["A change management form","A change approval form","A change tracking form","A change request form"],"a":3,"e":"Changes to user requirements are documented on a change request form.","s":"booklet","k":16,"w":["Change management is the whole process, not the form's name.","Approval is a later step.","Tracking happens after the request.",""]},{"id":"k29","u":2,"q":"What describes fault tree analysis?","o":["Risk factor analysis","System analysis","Event analysis","Interface analysis"],"a":0,"e":"Fault tree analysis is a risk (risk-factor) analysis technique.","s":"booklet","k":17,"w":["","System analysis studies a whole system, not risk factors.","Event analysis forward from an event is an event tree.","Interface analysis looks at UI or system interfaces."]},{"id":"k30","u":2,"q":"Which is a UML diagram?","o":["Dataflow diagram","Classification diagram","Composition diagram","Activity diagram"],"a":3,"e":"The activity diagram is a UML diagram; DFDs are not part of UML.","s":"booklet","k":12,"w":["DFDs are structured-analysis diagrams, not UML.","\"Classification diagram\" is not a UML diagram; the UML one is a class diagram.","Composition is a relationship type, not a diagram.",""]},{"id":"k31","u":2,"q":"Who starts the change request process?","o":["The project manager","The business analyst","The software developer","The customer"],"a":3,"e":"Change requests normally start with the customer asking for a change.","s":"booklet","k":16,"w":["The project manager manages the change but does not start it.","The analyst assesses the request.","The developer implements the approved change.",""]},{"id":"k32","u":2,"q":"What is fault tree analysis?","o":["Event analysis","Risk factor analysis","Network analysis","System analysis"],"a":1,"e":"Fault tree analysis is risk-factor analysis.","s":"booklet","k":17,"w":["Event analysis is the event tree.","","Network analysis is a different technique.","System analysis is broader than risk."]},{"id":"k33","u":2,"q":"What symbol is used for Associations in UML notation?","o":["Broken lines","Arrows","Stick figures","Solid lines"],"a":3,"e":"UML associations are drawn as solid lines between classes.","s":"booklet","k":12,"w":["Broken (dashed) lines show dependencies.","Arrows show direction or inheritance, not plain associations.","Stick figures represent actors.",""]},{"id":"k34","u":2,"q":"What best contributes to the quality of a delivered software system?","o":["A change management plan","A change of project manager","A change of programmer","A configuration management plan"],"a":3,"e":"A configuration management plan controls versions and changes, protecting the quality of the delivered system.","s":"booklet","k":16,"w":["Change management handles requests; configuration management protects the delivered product's versions.","Changing managers does not improve quality.","Changing programmers does not improve quality.",""]},{"id":"k35","u":2,"q":"What is the importance of UML?","o":["It automates system interface development","It provides database development","It provides a standard view for system design","It documents visual programming languages"],"a":2,"e":"UML gives everyone a standard way to view a system's design.","s":"booklet","k":12,"w":["UML does not automate interface development.","UML does not build databases.","","UML is not a documentation format for visual programming languages."]},{"id":"k36","u":2,"q":"When are associations used in UML modeling?","o":["In a sequence diagram","In an activity diagram","In a use case diagram","In a data flow diagram"],"a":2,"e":"Associations link actors to use cases in a use case diagram.","s":"booklet","k":12,"w":["Sequence diagrams use messages between lifelines.","Activity diagrams use flows between activities.","","DFDs are not UML."]},{"id":"k38","u":2,"q":"When in the software lifecycle is the developer most likely to use UML?","o":["Review stage","Planning stage","Testing stage","Development stage"],"a":3,"e":"UML is used while the system is being designed and developed.","s":"booklet","k":12,"w":["Review happens after work is done.","Planning is about schedules and resources.","Testing checks the built system.",""]},{"id":"k39","u":2,"q":"When does the Change Management process take place?","o":["When the programmer is changed","When a customer requests a change in the requirements","When a customer requests a change in the development team","When the project manager is changed"],"a":1,"e":"Change management starts when the customer requests a change to the requirements.","s":"booklet","k":16,"w":["A change of programmer is a staffing change, not change management.","","A change of team is staffing.","A change of manager is staffing."]},{"id":"k40","u":3,"q":"Which is an International standard for software lifecycle processes?","o":["ISO 12207","ISO 9999","ISO 9407","ISO 9050"],"a":0,"e":"ISO/IEC 12207 is the international standard for software life-cycle processes.","s":"booklet","k":19,"w":["","ISO 9999 covers assistive products for people with disabilities.","ISO 9407 is about shoe sizes, not software.","ISO 9050 is about glass in buildings, not software."]},{"id":"k41","u":3,"q":"What is a real-time operating system?","o":["LINUX","VxWorks","BSD","PALM"],"a":1,"e":"VxWorks is a real-time operating system used in embedded devices.","s":"booklet","k":26,"w":["Linux is a general-purpose OS, not a real-time OS by default.","","BSD is a general-purpose Unix-like OS.","Palm OS was a handheld OS, not real-time."]},{"id":"k42","u":3,"q":"What is the purpose of quality assurance?","o":["To ensure adequate controls in the system","To ensure the system meets its intended aim","To ensure the system is tested","To ensure the system design has been carried out"],"a":1,"e":"Quality assurance makes sure the system meets its intended aim (is fit for purpose).","s":"booklet","k":19,"w":["Controls are part of it, but QA's aim is that the system meets its intended aim.","","Testing is quality control; QA covers the whole process.","Design being done is a milestone, not QA's purpose."]},{"id":"k43","u":3,"q":"Which is a Network Operating System?","o":["Windows 9X/ME","Pocket PC","Palm OS","UNIX"],"a":3,"e":"UNIX is a network operating system; the others are desktop or handheld OSs.","s":"booklet","k":26,"w":["Windows 9x/ME were desktop operating systems.","Pocket PC was a handheld OS.","Palm OS was a handheld OS.",""]},{"id":"k44","u":3,"q":"What is the main purpose of a trace tool?","o":["To check the program line by line","To run the program faster","To have a dry run","To list the code"],"a":0,"e":"A trace tool follows a program line by line to show its execution path.","s":"booklet","w":["","Tracing does not speed a program up.","A dry run is done by hand, often with a trace table.","Listing code just prints it."]},{"id":"k45","u":3,"q":"Which of these operating systems is natively aware of networks?","o":["LINUX","Pocket PC","Palm OS","Windows 9XJME"],"a":0,"e":"Linux supports networking natively.","s":"booklet","k":26,"w":["","Pocket PC was a handheld OS without native networking at its core.","Palm OS was a handheld OS.","Windows 9x/ME were desktop systems with limited networking."]},{"id":"k46","u":3,"q":"What does CASE stand for?","o":["Computer and software engineering","Computer aided system environment","Computer-aided software engineering","Computer and system engineering"],"a":2,"e":"CASE = Computer-Aided Software Engineering.","s":"booklet","k":22,"w":["The A stands for Aided, not And.","The S stands for Software, not System.","","CASE is about software engineering with computer aid."]},{"id":"k47","u":3,"q":"What best describes Software Quality Management?","o":["Ensuring best practice in the management team","Ensuring that standards of the quality management team are followed","Ensuring best practice in the programming team","Ensuring quality standards and procedures are followed"],"a":3,"e":"Software quality management ensures quality standards and procedures are followed.","s":"booklet","k":19,"w":["It is about quality procedures, not management best practice.","It is about the organisation's quality standards, not just the team's.","It covers the whole process, not just programming.",""]},{"id":"k48","u":4,"q":"What technique is used to review code against specifications?","o":["Configuration testing","Static testing","Acceptance testing","Stress testing"],"a":1,"e":"Static testing reviews code against the specification without running it.","s":"booklet","k":31,"w":["Configuration testing checks different hardware and software set-ups.","","Acceptance testing is done by users.","Stress testing pushes the system beyond its limits."]},{"id":"k49","u":4,"q":"What is the purpose of Validation in software testing?","o":["To make sure the product is built correctly","To make sure quality is built into the product","To make sure the requirements have been met","To make sure the product is built on time"],"a":2,"e":"Validation checks the requirements have been met: are we building the right product?","s":"booklet","k":33,"w":["Building it correctly is verification.","Building quality in is QA.","","Being on time is project management."]},{"id":"k50","u":4,"q":"What process ensures software meets the customer's expectations?","o":["Validation","Critical appraisal","Critical review","Verification"],"a":0,"e":"Validation confirms the software meets the customer's needs and expectations.","s":"booklet","k":33,"w":["","Critical appraisal is not a testing process.","Critical review is not the term used.","Verification checks it is built to specification, not that it meets expectations."]},{"id":"k52","u":4,"q":"What are trace tables?","o":["A method of locating errors","A method for prototyping","A method to execute code","A method to re-run code"],"a":0,"e":"Trace tables are a dry-run method for locating errors.","s":"booklet","k":28,"w":["","Prototyping builds early versions.","Trace tables record execution by hand; they do not execute code.","Re-running code is regression testing."]},{"id":"k53","u":4,"q":"Which type of test is used first in a linear development project?","o":["Alpha","Scenario","Beta","Acceptance"],"a":0,"e":"Alpha testing comes first: in-house testing as soon as the software can run.","s":"booklet","k":30,"w":["","Scenario testing is done later.","Beta testing comes after alpha.","Acceptance testing comes at the end."]},{"id":"k54","u":4,"q":"What is a static testing technique?","o":["Performance monitoring","Walkthrough","Partitioning","Boundary analysis"],"a":1,"e":"A walkthrough is a static technique: the code is reviewed, not executed.","s":"booklet","k":31,"w":["Performance monitoring runs the system, so it is dynamic.","","Partitioning is a dynamic test-design technique.","Boundary analysis is a dynamic test-design technique."]},{"id":"k55","u":4,"q":"What is a quality assurance practice when creating user interfaces?","o":["Navigation mapping","Project management","Usability testing","Architecture design"],"a":2,"e":"Usability testing is a QA practice for user interfaces.","s":"booklet","w":["Navigation mapping is design, not QA testing.","Project management is not a UI QA practice.","","Architecture design is design."]},{"id":"k56","u":4,"q":"What method is used to locate program errors?","o":["Prototyping","Execution","Trace tables","Code segment"],"a":2,"e":"Trace tables track variable values step by step to locate program errors.","s":"booklet","k":28,"w":["Prototyping builds early versions.","Execution just runs the program.","","A code segment is part of code, not a method."]},{"id":"k57","u":4,"q":"In a linear software development cycle, what test type is used when the software is first able to run?","o":["White box","Alpha","Beta","Black box"],"a":1,"e":"Alpha testing is used when the software is first able to run.","s":"booklet","k":30,"w":["White box is a method, not the first test stage.","","Beta comes after alpha.","Black box is a method, not the first stage."]},{"id":"k58","u":4,"q":"When should test plans be drawn up?","o":["At the design stage","At the feasibility stage","Just before implementation","When requirements are stable"],"a":0,"e":"Test plans are drawn up at the design stage, alongside the design (V-model).","s":"booklet","k":32,"w":["","Feasibility is too early; the design is not known.","Just before implementation is too late in the course model.","Waiting for stable requirements is too vague; plans start at design."]},{"id":"k59","u":4,"q":"What is another name for System Testing?","o":["Acceptance testing","White box testing","Black box testing","Module testing"],"a":2,"e":"System testing is usually black-box: the whole system is tested against requirements without looking at code.","s":"booklet","k":31,"w":["Acceptance testing is done by users.","White-box testing looks at code; system testing usually does not.","","Module testing is unit testing."]},{"id":"k60","u":4,"q":"What is the purpose of Verification in software testing?","o":["To ensure quality","To ensure best performance","To test non-functional correctness","To prove functional correctness"],"a":3,"e":"Verification proves the product is built correctly to its functional specification.","s":"booklet","k":33,"w":["Ensuring quality is QA's broad aim.","Performance is non-functional.","Non-functional correctness is checked by performance and usability testing.",""]},{"id":"k61","u":4,"q":"What best describes a system failure?","o":["When a system is not complete","When a system is not fit for purpose","When a system is delivered late","When a system went over budget"],"a":1,"e":"A system failure means the system is not fit for purpose.","s":"booklet","k":33,"w":["Incomplete systems are unfinished, not failed.","","Late delivery is a project problem.","Over budget is a project problem."]},{"id":"k62","u":4,"q":"Which is a live-by-the-line test for software?","o":["Unit test","Debugging test","Acceptance test","Function point test"],"a":1,"e":"Debugging steps through software line by line.","s":"booklet","k":29,"w":["Unit tests run whole functions, not line by line.","","Acceptance tests run whole scenarios.","Function points measure size."]},{"id":"k63","u":4,"q":"What type of testing ensures requirements are met?","o":["Beta","Performance","White box","Black box"],"a":3,"e":"Black-box testing checks requirements are met by testing inputs and outputs.","s":"booklet","k":31,"w":["Beta testing is user feedback before release.","Performance testing checks speed.","White-box testing checks code paths.",""]},{"id":"k64","u":4,"q":"When is Beta Testing first carried out?","o":["Throughout the development cycle","When the software is first able to run","Before commercial release","In the middle of the development cycle"],"a":2,"e":"Beta testing is done by real users just before commercial release.","s":"booklet","k":30,"w":["Beta is not continuous.","When first able to run is alpha.","","Beta is not in the middle."]},{"id":"k65","u":4,"q":"What is a type of user testing?","o":["White box","Alpha","Debugging","Black box"],"a":1,"e":"Alpha testing is a type of user (acceptance) testing done in-house.","s":"booklet","k":30,"w":["White box is done by developers.","","Debugging is done by developers.","Black box is a method, not a user test."]},{"id":"k66","u":5,"q":"What file format is used by most organizations to distribute software user reference manuals?","o":[".pdf",".doc",".jpg",".rtf"],"a":0,"e":"PDF keeps its layout on every device, so it is the usual format for manuals.","s":"booklet","k":36,"w":["",".doc files can be edited and may look different on other computers.",".jpg is an image format, not for manuals.",".rtf is a basic editable text format."]},{"id":"k67","u":5,"q":"Who is most likely to read the software test log?","o":["The end user","The quality manager","The network administrator","The business analyst"],"a":1,"e":"Test logs are read by quality managers and testers, not end users.","s":"booklet","k":35,"w":["End users read the user manual, not test logs.","","Network administrators read network documentation.","Analysts read requirements documents."]},{"id":"k68","u":5,"q":"Where does a developer describe program functions, subroutines, variables and constants?","o":["Within the source code","Within the user manual","Within a pdf document","Within a help file"],"a":0,"e":"Developers describe functions and variables in comments within the source code.","s":"booklet","k":38,"w":["","The user manual explains how to use the program, not its code.","A PDF is a distribution format, not where code is described.","Help files are for users."]},{"id":"k69","u":5,"q":"Why is an interview useful to gather feedback about IT system documentation?","o":["To gather detailed feedback","To get feedback from lots of people","To keep feedback anonymous","To gather feedback quickly"],"a":0,"e":"Interviews give detailed feedback; surveys reach many people quickly.","s":"booklet","k":39,"w":["","Surveys reach many people.","Surveys can be anonymous; interviews are not.","Surveys are quicker; interviews give depth."]},{"id":"k70","u":5,"q":"What is the main purpose of a document template?","o":["To create duplicate copies of the same document","To save disk space in the file storage system","To provide consistent styles for new documents","To provide sample wording for the document"],"a":2,"e":"Templates give new documents consistent styles and layout.","s":"booklet","k":34,"w":["Copying duplicates a document; a template is a starting point.","Templates do not save disk space.","","Some templates include sample text, but their main purpose is consistent styles."]},{"id":"k71","u":5,"q":"What is the main consideration of the technical writer?","o":["Target audience","Expected form","Documentation type","When is the documentation needed"],"a":0,"e":"The technical writer's main consideration is the target audience.","s":"booklet","k":37,"w":["","Form follows from the audience.","Document type follows from the audience.","Timing matters, but the audience comes first."]},{"id":"k72","u":5,"q":"What is the main purpose of an application software user guide?","o":["To support software sales and marketing","To improve user efficiency and satisfaction","To support software development","To explain key functions in simple terms"],"a":3,"e":"A user guide explains the software's key functions in simple terms.","s":"booklet","k":35,"w":["Sales and marketing use brochures.","Efficiency is an outcome; the main purpose is explaining functions simply.","Developers use technical documentation.",""]},{"id":"k73","u":5,"q":"What is the best method for gathering feedback on technical documentation from large numbers of people?","o":["Workshops","Interviews","Focus groups","Surveys"],"a":3,"e":"Surveys collect feedback from large numbers of people.","s":"booklet","k":39,"w":["Workshops involve a few people.","Interviews are one person at a time.","Focus groups are small.",""]},{"id":"k74","u":5,"q":"What statement best describes a technical workshop for gathering feedback?","o":["A team meeting of subject matter experts","A one-on-one discussion between two system users","A stakeholder meeting to allow discussion","A short structured discussion with a few carefully selected people"],"a":2,"e":"A workshop is a stakeholder meeting that allows open discussion of the document.","s":"booklet","k":39,"w":["A meeting of experts is a technical review.","A one-to-one discussion is an interview.","","That describes a focus group."]},{"id":"k75","u":5,"q":"Which of these is part of the external documentation for a new piece of software?","o":["Requirements specification","Pseudocode","User guide","Test results"],"a":2,"e":"The user guide is external documentation; specs, pseudocode and test results are internal.","s":"booklet","k":35,"w":["The requirements specification is internal documentation.","Pseudocode is internal documentation.","","Test results are internal documentation."]},{"id":"k76","u":5,"q":"What feature makes technical documentation for a software product accessible to users?","o":["It is saved in memo format","It is stored centrally on a network","It is written in clear language","It is frequently updated"],"a":2,"e":"Clear language makes documentation accessible to users.","s":"booklet","k":37,"w":["Memo format does not make documentation accessible.","Central storage helps access to the file, not understanding.","","Updates help accuracy, not accessibility."]},{"id":"k77","u":5,"q":"What is the purpose of technical documentation for an IT system?","o":["To inform the user how to use the system","To recover lost data when the system fails","To maintain records of system performance","To report on complex system problems"],"a":0,"e":"Technical documentation tells users how to use the system.","s":"booklet","w":["","Data recovery uses backups.","Performance records are logs.","Problem reports are incident reports."]},{"id":"k78","u":5,"q":"What is best used to help test the readability of a completed technical document?","o":["External review","Quality review","Technical review","User review"],"a":3,"e":"Real users reviewing the document is the best test of readability.","s":"booklet","k":37,"w":["External reviewers may be experts, not typical readers.","A quality review checks standards.","A technical review checks accuracy.",""]},{"id":"k79","u":5,"q":"Which statement describes the use of a focus group to gather feedback about the documentation for a new IT system?","o":["The people involved share the same point of view","Data can be gathered quickly from large numbers of people","Data gathered from structured discussion with a small number of key people","Baseline data is gathered for quantitative analysis"],"a":2,"e":"A focus group is a structured discussion with a small number of key people.","s":"booklet","k":39,"w":["Members may hold different views.","Large numbers is a survey.","","Baseline quantitative data comes from surveys."]},{"id":"k80","u":9,"q":"What is a clickable area that takes a visitor to other Web pages?","o":["Mindmap","Image","Mindview","Hotspot"],"a":3,"e":"A hotspot is a clickable area that links to another page.","s":"booklet","k":70,"w":["A mind map is a planning diagram.","An image is not clickable by itself.","Mindview is a software product.",""]},{"id":"k81","u":9,"q":"Where is data stored and maintained?","o":["Intranets","Online applications","Information repositories","Training"],"a":2,"e":"Information repositories are where an organisation's data and documents are stored and maintained.","s":"booklet","k":63,"w":["Intranets share information but are not the store itself.","Online applications use data.","","Training is an activity."]},{"id":"k84","u":6,"q":"Which is the standard for usability in user interface design?","o":["WAB","IAS","ISO 9000","ISO 9241"],"a":3,"e":"ISO 9241 is the standard for usability and human-computer interaction.","s":"booklet","k":40,"w":["WAB is not a usability standard.","IAS is not a usability standard.","ISO 9000 is quality management.",""]},{"id":"k86","u":6,"q":"What is used to document user interface designs?","o":["Mainframes","Wireframes","Use-case diagrams","Dataflow diagrams"],"a":1,"e":"Wireframes document user interface designs.","s":"booklet","k":48,"w":["Mainframes are large computers.","","Use-case diagrams show actors and goals.","DFDs show data flow."]},{"id":"k87","u":6,"q":"Why is cross platform development important?","o":["To gain an understanding of the learnability responses","To run the same software on multiple platforms","To gain an understanding of the system responses","To run multiple programs on a single platform"],"a":1,"e":"Cross-platform development lets the same software run on several platforms.","s":"booklet","k":47,"w":["Learnability is a usability measure.","","System responses are performance.","Running many programs is multitasking."]},{"id":"k88","u":6,"q":"Why do designers use wireframes?","o":["To use a consistent method of design","To improve the user interface process","To make sure testing can be done","To improve the testing standards"],"a":1,"e":"Wireframes improve the UI design process by fixing layout before visual design and coding.","s":"booklet","k":48,"w":["Consistency is a benefit, but the main purpose is to improve the UI process.","","Testing is not the purpose.","Testing standards are separate."]},{"id":"k89","u":6,"q":"What best describes measures of success in design?","o":["Retention","Mapping","Learnability","Accuracy"],"a":2,"e":"Learnability (how fast users learn the interface) is a measure of design success.","s":"booklet","k":46,"w":["Retention is not the design measure here.","Mapping is a design concept.","","Accuracy is not the measure here."]},{"id":"k90","u":6,"q":"Which is a set of standards for usability in user interfaces?","o":["iOS","WAI","WAB","UCD"],"a":1,"e":"WAI publishes the W3C guidelines (WCAG) that interfaces are measured against.","s":"booklet","k":43,"w":["iOS is an operating system.","","WAB is not a standard.","UCD is a design approach, not a set of standards."]},{"id":"k91","u":6,"q":"What is the benefit of a Graphical User Interface (GUI)?","o":["Better design guidelines","Increased accessibility","Greater design complexity","Improved system support"],"a":1,"e":"A GUI increases accessibility: users point and click instead of memorising commands.","s":"booklet","w":["Guidelines are separate.","","Complexity is not a benefit.","Support is separate."]},{"id":"k92","u":6,"q":"What is essential for user interface design?","o":["Validation not verification","Mapping not orientation","Editing not manipulation","Guidance not control"],"a":3,"e":"Good UI design gives users guidance and keeps them in control, rather than controlling them.","s":"booklet","w":["Validation and verification are testing.","Mapping and orientation are not the principle.","Editing and manipulation are not the principle.",""]},{"id":"k93","u":6,"q":"What is important in user interface design?","o":["Cross platform development","Understanding system responses","Internal program development","Understanding testing responses"],"a":0,"e":"Cross-platform development is important: the UI must work on different platforms.","s":"booklet","k":47,"w":["","System responses are performance.","Internal development is not UI-specific.","Testing responses are testing."]},{"id":"k94","u":6,"q":"What is an example of a graphic user interface?","o":["Toolbar","Command line","Screen reader","
