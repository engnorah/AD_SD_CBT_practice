 page structure?","o":["CSS","HTML","API","DOM"],"a":1,"e":"HTML builds the structure of a web page.","s":"booklet","k":79,"w":["CSS handles style.","","An API is an interface.","The DOM represents the page; it does not build it."]},{"id":"k165","u":10,"q":"Which of these defines how HTML elements are displayed?","o":["XML","XHTML","XLST","CSS"],"a":3,"e":"CSS defines how HTML elements are displayed.","s":"booklet","k":75,"w":["XML stores data.","XHTML is markup.","XSLT transforms XML; it is not for display styling.",""]},{"id":"k166","u":10,"q":"What will be the font color when the following html code is run? \u003cp>\u003cfont color='blue' size='3'>Color for text! is\u003c/font>\u003c/p>","o":["Blue","Green","Yellow","Red"],"a":0,"e":"The \u003cfont color='blue'> tag makes the text blue.","s":"booklet","k":72,"w":["","The font tag sets color='blue', not green.","The font tag sets color='blue', not yellow.","The font tag sets color='blue', not red."]},{"id":"k167","u":10,"q":"What best determines the quality of an image on a web page display?","o":["Aspect ratio","Screen size","Screen resolution","Operating system"],"a":2,"e":"Screen resolution determines how sharp an image looks.","s":"booklet","k":78,"w":["Aspect ratio is shape.","Size is not sharpness.","","The OS does not set sharpness."]},{"id":"k168","u":10,"q":"When jumping to a defined section of a web page, which tag is used for the destination link?","o":["\u003ca href=\"...\">","\u003cNAV>","\u003cCL>","\u003cLINK>"],"a":0,"e":"\u003ca href=\"#id\"> links to a defined section of the page.","s":"booklet","k":72,"w":["","\u003cnav> holds menus.","\u003cCL> is not a tag.","\u003clink> loads resources such as CSS."]},{"id":"k169","u":10,"q":"What does CSS stand for?","o":["Compatible Style Sheets","Catalog Style Sheets","Comprehensive Style Sheets","Cascading Style Sheets"],"a":3,"e":"CSS = Cascading Style Sheets.","s":"booklet","k":75,"w":["C stands for Cascading: styles cascade by priority.","C stands for Cascading, not Catalog.","C stands for Cascading, not Comprehensive.",""]},{"id":"k170","u":10,"q":"Which programming language runs on servers?","o":["Java","Silverlight","JavaScript","Disk drivers"],"a":0,"e":"Java (e.g. servlets) runs on servers; JavaScript traditionally runs in the browser.","s":"booklet","k":76,"w":["","Silverlight was a browser plug-in.","JavaScript traditionally runs in the browser.","Drivers are not a programming language."]},{"id":"k171","u":10,"q":"What specialized software application is used to edit and store content information?","o":["EPSS","CAD","CMS","ERP"],"a":2,"e":"A CMS (content management system) edits and stores content.","s":"booklet","w":["EPSS gives performance support.","CAD is for drawings.","","ERP manages business processes."]},{"id":"k173","u":10,"q":"Which of these is used to describe XML data?","o":["XHTML","HTML","XSL","DTD"],"a":3,"e":"A DTD describes the structure of XML data.","s":"booklet","k":74,"w":["XHTML is web markup.","HTML is web markup.","XSL transforms or styles XML.",""]},{"id":"k174","u":10,"q":"Which of these is a valid comment in XML?","o":["\u003c!-- This is a comment -->","\u003c-- This is a comment -->","\u003cThis is a comment/>","\u003c!>This is a comment \u003c/!>"],"a":0,"e":"XML comments use \u003c!-- ... -->.","s":"booklet","k":74,"w":["","Missing the !; XML comments start with \u003c!--.","This is an empty element tag, not a comment.","\u003c!> is not valid XML syntax."]},{"id":"k175","u":12,"q":"Which Facebook tool allows users to interact in real time?","o":["Facepile","Like button","Send button","Live stream"],"a":3,"e":"Live streaming allows real-time interaction on Facebook.","s":"booklet","k":82,"w":["Facepile shows friends' faces.","Like shows approval.","Send shares a link.",""]},{"id":"k176","u":12,"q":"What process is used to handle comments on a blog?","o":["Standardization","Moderation","Replication","Integration"],"a":1,"e":"Blog comments are handled by moderation.","s":"booklet","k":83,"w":["Standardisation is not for comments.","","Replication copies data.","Integration connects systems."]},{"id":"k177","u":12,"q":"Why should privacy settings be used on social networking websites?","o":["To have control of what is displayed to the public","To make sure personal details are stored","To be able to send and receive images","To create useful videos and audios for friends"],"a":0,"e":"Privacy settings control what the public can see.","s":"booklet","k":83,"w":["","Settings control visibility, not storage.","Images work regardless.","Videos are unrelated."]},{"id":"k178","u":12,"q":"Which is the first guideline needed to set up a podcast?","o":["Create the podcast","Prepare the site for the content","Decide what the content will be","Choose the devices to use"],"a":2,"e":"First decide what the podcast content will be.","s":"booklet","k":83,"w":["Creating comes after deciding.","Preparing the site comes later.","","Devices come later."]},{"id":"k179","u":12,"q":"How are recent Facebook comments displayed on a linked webpage?","o":["RSS feed","Like button","Activity feed","Follow button"],"a":2,"e":"The activity feed plugin shows recent Facebook activity on a webpage.","s":"booklet","k":82,"w":["RSS is a feed format.","Like is a button.","","Follow is a button."]},{"id":"k181","u":12,"q":"LikeAlyzer evaluates the likes on a Facebook Page. What is this an example of?","o":["A network analysis tool","A network mapping tool","A social media directory","A social networking site"],"a":0,"e":"LikeAlyzer analyses a Facebook page: a network analysis tool.","s":"booklet","k":84,"w":["","Mapping tools draw networks.","A directory lists sites.","A social site is a platform."]},{"id":"k182","u":12,"q":"What is needed to integrate a networking analysis tool into a website?","o":["JavaScript code","Evaluation software","Interface","Hyperlink"],"a":0,"e":"Analysis tools are integrated by adding their JavaScript code to the page.","s":"booklet","w":["","Evaluation software is the tool itself.","\"Interface\" is too general.","A hyperlink only links."]},{"id":"k184","u":13,"q":"Which programming language runs in browsers?","o":["Perl Script","JavaScript","ASP","CGI"],"a":1,"e":"JavaScript runs in the browser.","s":"booklet","k":88,"w":["Perl runs on servers.","","ASP runs on servers.","CGI runs on servers."]},{"id":"k185","u":13,"q":"Which type of cookie would be used to store a username and password?","o":["HTTP cookies","Tracking cookies","Authentication cookies","Web cookies"],"a":2,"e":"Of these, authentication cookies are the ones used for logging in. Good practice: the cookie holds a session token, never the actual password.","s":"booklet","k":90,"w":["\"HTTP cookies\" describes all cookies.","Tracking cookies follow browsing.","","\"Web cookies\" is general."]},{"id":"k186","u":13,"q":"What is the purpose of Javascript in web browsers?","o":["To create static effects","To create a data store","To create interactive effects","To create web pages that run faster"],"a":2,"e":"JavaScript creates interactive effects in the browser.","s":"booklet","k":88,"w":["JavaScript makes pages interactive, not static.","Data stores are databases.","","Speed is not its purpose."]},{"id":"k187","u":13,"q":"Where are http cookies found?","o":["On a web page","On a web browser","On the internet","On the navigation bar"],"a":1,"e":"HTTP cookies are stored by the web browser.","s":"booklet","k":89,"w":["Pages do not store cookies.","","\"The internet\" is too vague; cookies live in the browser.","The navigation bar does not store cookies."]},{"id":"k188","u":13,"q":"Which type of programming keeps a record of previous session of events?","o":["Connectionless","Connection-oriented","Stateless programming","Stateful programming"],"a":3,"e":"Stateful programming keeps a record of previous events.","s":"booklet","k":91,"w":["Connectionless is networking.","Connection-oriented is networking.","Stateless keeps no record.",""]},{"id":"k189","u":13,"q":"Which scripting interface allows programs and scripts to dynamically access and update the content, structure and style of documents?","o":["DOM","XBL","XML","API"],"a":0,"e":"The DOM lets scripts access and update content, structure and style.","s":"booklet","k":88,"w":["","XBL is an obsolete binding language.","XML is a data format.","API is too general."]},{"id":"k190","u":13,"q":"What describes stateless programming?","o":["Keeping records of previous events or transactions","Not establishing a session before useful data is transferred","Keeping no record of previous events or transactions","Establishing a session before useful data is transferred"],"a":2,"e":"Stateless programming keeps no record of previous events.","s":"booklet","k":91,"w":["Keeping records is stateful.","That describes connectionless.","","That describes connection-oriented."]},{"id":"k191","u":13,"q":"Which is a traditional scripting language?","o":["Smalltalk","PHP","COBOL","Fortran"],"a":1,"e":"PHP is a traditional scripting language.","s":"booklet","k":87,"w":["Smalltalk is object-oriented.","","COBOL is a business language.","Fortran is scientific."]},{"id":"k192","u":13,"q":"What is PHP?","o":["An assembly language","A server-side scripting language","A client-side scripting language","A machine code language"],"a":1,"e":"PHP is a server-side scripting language.","s":"booklet","k":87,"w":["PHP is high-level, not assembly.","","PHP runs on the server, not the client.","PHP is interpreted, not machine code."]},{"id":"k193","u":14,"q":"What term describes when an email should only be read by authorized people?","o":["Integrity","Accessibility","Confidentiality","Availability"],"a":2,"e":"Confidentiality = only authorised people can read it.","s":"booklet","k":95,"w":["Integrity means unchanged.","Accessibility is about access for disabled users.","","Availability means it can be reached."]},{"id":"k194","u":14,"q":"What type of virus might infect a word processing or spreadsheet package?","o":["A stealth virus","A boot sector virus","A macro virus","A program virus"],"a":2,"e":"Macro viruses infect word-processing and spreadsheet files.","s":"booklet","k":96,"w":["Stealth viruses hide from detection.","Boot sector viruses infect start-up areas.","","Program viruses infect executable files."]},{"id":"k195","u":14,"q":"What is the purpose of domain name system security extensions (DNSSEC)?","o":["To ensure confidentiality of data","To authenticate URLs","To protect IP addresses from virus attack","To ensure lookup data is correct"],"a":3,"e":"DNSSEC makes sure DNS lookup data is authentic and unchanged.","s":"booklet","k":99,"w":["DNSSEC does not encrypt for confidentiality.","It signs DNS data, not URLs.","It does not stop viruses.",""]},{"id":"k196","u":14,"q":"What is the purpose of email authentication?","o":["Only the intended recipient can read the message","The recipient can trust the identity of the sender","The sender can trust the identity of the recipient","The sender can prevent unauthorized access to the message"],"a":1,"e":"Email authentication lets the recipient trust the sender's identity.","s":"booklet","k":95,"w":["Reading only by the recipient is confidentiality.","","The sender trusting the recipient is not the point.","Preventing access is confidentiality."]},{"id":"k197","u":14,"q":"What is a type of denial of service?","o":["To flood a network in an attempt to prevent legitimate traffic","To share files with other computers on the network","To allow a particular person to use the service","To develop network or hardware components"],"a":0,"e":"A denial-of-service attack floods a network so legitimate traffic cannot get through.","s":"booklet","k":97,"w":["","File sharing is normal network use.","Allowing a person is authorisation.","Development is unrelated."]},{"id":"k198","u":14,"q":"What email security feature is provided by the transport layer?","o":["Encryption of communications between servers","Symmetric encryption keys between sender and recipient","Prevention of multiple forwarding of emails","Confirmation of the target router’s identity"],"a":0,"e":"Transport-layer security (TLS) encrypts email traffic between servers.","s":"booklet","k":95,"w":["","End-to-end keys are S/MIME or PGP.","Forwarding control is not TLS.","Routers are not confirmed by TLS."]},{"id":"k200","u":14,"q":"What is the most important configuration management activity?","o":["Development management","Programming management","Performance management","Version management"],"a":3,"e":"Version management is the most important configuration management activity.","s":"booklet","w":["Development management is broader.","Programming management is not CM.","Performance management is separate.",""]},{"id":"k201","u":14,"q":"What type of malware is triggered when certain conditions are met?","o":["A worm","A logic bomb","A trojan horse","Spyware"],"a":1,"e":"A logic bomb triggers when certain conditions are met.","s":"booklet","k":96,"w":["Worms spread on their own.","","Trojans pretend to be legitimate.","Spyware spies."]},{"id":"k202","u":14,"q":"What prevents unauthorized access to or from a private network?","o":["The perimeter","The bridge","The gateway","The firewall"],"a":3,"e":"A firewall prevents unauthorised access to or from a private network.","s":"booklet","k":92,"w":["The perimeter is the boundary itself.","A bridge connects segments.","A gateway connects networks.",""]},{"id":"k203","u":14,"q":"What does a padlock icon in the address bar of a website indicate?","o":["Transactions and information on the site are secure","The site meets AAA standards for accessibility","The site uses W3C functionality","It is the home page of a multi-page site"],"a":0,"e":"The padlock means the connection uses HTTPS (TLS), so data is secure in transit.","s":"booklet","k":94,"w":["","The padlock is not about accessibility.","W3C is unrelated.","Page type is unrelated."]},{"id":"k204","u":14,"q":"What is used to exchange authentication and authorization information between different security domains?","o":["JSON encryption","Single sign-on","Virtual private network","Cross-site scripting"],"a":1,"e":"Single sign-on (e.g. SAML) exchanges authentication data between security domains.","s":"booklet","w":["JSON encryption is not the method.","","A VPN creates secure tunnels.","XSS is an attack."]},{"id":"k205","u":14,"q":"Which protocol uses public key cryptography to secure communication over the internet?","o":["SSL","IDL","NIL","DAL"],"a":0,"e":"SSL (now TLS) uses public-key cryptography to secure internet traffic.","s":"booklet","k":94,"w":["","IDL is a description language.","NIL is not a protocol.","DAL is not a protocol."]},{"id":"k206","u":15,"q":"What term describes the completeness and accuracy of data in a database?","o":["Redundancy","Independence","Integrity","Constraint"],"a":2,"e":"Integrity = completeness and accuracy of data.","s":"booklet","w":["Redundancy is duplication.","Independence separates levels.","","A constraint is a rule."]},{"id":"k210","u":15,"q":"What is used to access objects in an object-oriented database?","o":["Lists","Stacks","Trees","Pointers"],"a":3,"e":"Object-oriented databases use pointers (object references) to access objects.","s":"booklet","k":103,"w":["Lists are structures.","Stacks are structures.","Trees are structures.",""]},{"id":"k211","u":15,"q":"What is used to describe a database entity in UML?","o":["An object","A relation","An attribute","A class"],"a":3,"e":"In UML, a database entity is drawn as a class.","s":"booklet","k":104,"w":["An object is an instance.","A relation is a table.","An attribute is a field.",""]},{"id":"k212","u":15,"q":"What shape is used in an Entity Relationship diagram to represent a database table?","o":["Triangle","Rectangle","Circle","Oval"],"a":1,"e":"Entities (tables) are drawn as rectangles in an ERD.","s":"booklet","k":104,"w":["Triangles are not used.","","Circles are not used for entities.","Ovals show attributes."]},{"id":"k213","u":15,"q":"Which command is used in SQL to take away the privilege from a user?","o":["REMOVE UPDATE ON staff FROM user","REVOKE UPDATE ON staff FROM user","DELETE user FROM UPDATE ON staff","REMOVE user FROM UPDATE ON staff"],"a":1,"e":"REVOKE removes a privilege: REVOKE UPDATE ON staff FROM user.","s":"booklet","k":105,"w":["REMOVE is not SQL.","","DELETE removes rows, not privileges.","REMOVE is not SQL."]},{"id":"k214","u":15,"q":"Which command is used to delete a table from an SQL database?","o":["Truncate","Purge","Drop","Remove"],"a":2,"e":"DROP TABLE deletes the whole table.","s":"booklet","k":106,"w":["TRUNCATE empties the table.","PURGE is not standard SQL.","","REMOVE is not SQL."]},{"id":"k215","u":15,"q":"A relational database has two tables, 'student' and 'course'. Each student can enroll on more than one course. Which statement describes the relationship STUDENT TO COURSE?","o":["1:n","m:n","1:1","n:1"],"a":1,"e":"Students take many courses and each course has many students: many-to-many (m:n).","s":"booklet","k":103,"w":["1:n is one-to-many.","","1:1 is one-to-one.","n:1 is many-to-one."]},{"id":"k216","u":15,"q":"How can a network database model be identified?","o":["Relationships are of the type many-to-many","The database structure looks like an inverted tree","Relationships are of the type one-to-many","Each table contains information related to a single subject only"],"a":0,"e":"Network database models allow many-to-many relationships.","s":"booklet","k":103,"w":["","An inverted tree is hierarchical.","One-to-many is hierarchical.","Single-subject tables are relational."]},{"id":"k217","u":15,"q":"What does UML use to represent the relationship between two entities in a database?","o":["A pattern","An association","A class","A junction"],"a":1,"e":"UML shows a relationship between entities as an association.","s":"booklet","k":104,"w":["A pattern is a design solution.","","A class is the entity.","A junction is not the UML term."]},{"id":"k218","u":15,"q":"What name is given to a piece of data in a database at a given time?","o":["Snapshot","Relation","Schema","Set"],"a":0,"e":"A snapshot is the state of the data at a given moment.","s":"booklet","w":["","A relation is a table.","A schema is the structure.","A set is a collection."]},{"id":"k219","u":15,"q":"What happens during the backup process for a database?","o":["Old data records are deleted from the primary site","New data is sent from the primary site to the backup site","Data from the primary site is replicated on the backup site","Data records are encrypted on the backup site"],"a":2,"e":"A backup replicates data from the primary site onto the backup site.","s":"booklet","k":105,"w":["Backup does not delete data.","It copies existing data too.","","Encryption is optional."]},{"id":"k220","u":15,"q":"Which command is used in SQL to return ALL rows when there is a match in ONE of the tables?","o":["Full Join","Right Join","Left Join","Join"],"a":0,"e":"A FULL JOIN returns all rows when there is a match in either table.","s":"booklet","k":106,"w":["","RIGHT JOIN keeps all right rows.","LEFT JOIN keeps all left rows.","JOIN keeps only matches."]},{"id":"k222","u":16,"q":"Which three layers make up a multi-layer database architecture?","o":["Presentation; Business/Logic; Data","Business/Logic; Data Access; Storage","Data Access; Presentation; Storage","Presentation; Business/Logic; User interface"],"a":0,"e":"Multi-layer architecture: Presentation, Business/Logic and Data.","s":"booklet","k":107,"w":["","Storage is not one of the three.","Storage is not one of the three.","User interface is the same as presentation."]},{"id":"k223","u":15,"q":"What term is used to describe the reference set of tables and views of a database?","o":["Database dictionary","Data dictionary","Dictionary table","Dictionary"],"a":1,"e":"The data dictionary is the reference set of tables and views describing the database.","s":"booklet","w":["\"Database dictionary\" is not the standard term.","","\"Dictionary table\" is not the standard term.","\"Dictionary\" alone is too vague; the term is data dictionary."]},{"id":"k224","u":15,"q":"Which of these lists the attributes of a database source?","o":["String; User ID; Password","User ID; Password; Platform","Location; Driver; String","Name; Location; Driver"],"a":3,"e":"A data source is defined by its name, location and driver.","s":"booklet","w":["String is not an attribute here.","Platform is not an attribute here.","String is not an attribute here.",""]},{"id":"k225","u":15,"q":"What term is used to identify each row in a flat-file database?","o":["Field","Attribute","Key","Tuple"],"a":2,"e":"A key identifies each row (record).","s":"booklet","k":103,"w":["A field is a column.","An attribute is a column.","","A tuple is the row itself, not its identifier."]},{"id":"k226","u":15,"q":"Which command is used to remove the data from an SQL database table?","o":["Purge","Remove","Delete","Drop table"],"a":2,"e":"DELETE removes data (rows) from a table; DROP removes the table itself.","s":"booklet","k":106,"w":["PURGE is not standard.","REMOVE is not SQL.","","DROP removes the table."]},{"id":"k227","u":15,"q":"A college uses a relational database to store student and course records. They now want to include the name of the Tutor for each of the Courses. Each Tutor is responsible for a single course. Which is the simplest way to do this?","o":["Add a field Tutor to the STUDENT table","Add a field Tutor to the CLASS table","Create a table TUTORS related to CourseID","Add a field Tutor to the COURSE table"],"a":3,"e":"Each tutor teaches one course, so add a Tutor field to the COURSE table.","s":"booklet","k":103,"w":["Students are not linked to tutors.","CLASS is not the right table.","A new table is more than needed.",""]},{"id":"k228","u":15,"q":"Which type of database is illustrated in the example of a structure resembling an interconnected web with many-to-many relationships?","o":["Flat file","Relational","Hierarchical","Network"],"a":3,"e":"A web of many-to-many links is the network model.","s":"booklet","k":103,"w":["Flat files have no links.","Relational uses tables.","Hierarchical uses trees.",""]},{"id":"k229","u":15,"q":"A flowchart is used in which type of modeling?","o":["SQL","UML","SDLC","RAD"],"a":1,"e":"UML activity diagrams are flowchart-style models.","s":"booklet","k":104,"w":["SQL is a language.","","SDLC is a lifecycle.","RAD is a method."]},{"id":"k230","u":15,"q":"What is a data structure?","o":["A way to edit and manipulate data","A way to store and organize data","A way to combine and insert data","A way to record and view data"],"a":1,"e":"A data structure is a way to store and organise data.","s":"booklet","w":["Editing is manipulation.","","Combining is processing.","Viewing is presentation."]},{"id":"k233","u":16,"q":"Which layer will hold the SQL code for a database?","o":["Business logic layer","Presentation layer","Data access layer","User interface layer"],"a":2,"e":"SQL code belongs in the data access layer.","s":"booklet","k":107,"w":["Logic calls data access.","Presentation shows data.","","The UI shows data."]},{"id":"k235","u":16,"q":"What is the term gender an example of in the XML shown below?\n\u003cperson gender=\"male\">\n  \u003cfirstname>Faisal\u003c/firstname>\n  \u003clastname>Ahmed\u003c/lastname>\n\u003c/person>","o":["Attribute","Sub-child element","Child element","Namespace"],"a":0,"e":"gender=\"male\" sits inside the start tag, so it is an attribute.","s":"booklet","k":110,"w":["","\"Sub-child element\" is not the right term; gender is inside the tag.","A child element would be a separate tag inside \u003cperson>.","A namespace qualifies names with a prefix."]},{"id":"k236","u":16,"q":"What do the letters XSD stand for?","o":["eXtensible Schema Definition","eXtensible Stylesheet Descriptor","XML Schema Definition","XML Stylesheet Descriptor"],"a":2,"e":"XSD = XML Schema Definition.","s":"booklet","k":112,"w":["X stands for XML, not eXtensible.","XSD is a schema, not a stylesheet.","","XSD is a schema, not a stylesheet."]},{"id":"k237","u":16,"q":"What is the reason to use Open Database Connectivity (ODBC) technology?","o":["To import data from an SQL database into an Excel spreadsheet","To interpret data relationships in a wide range of data sources","To link to a dynamic SQL command processor","To provide the same driver for all database management systems"],"a":0,"e":"ODBC lets applications such as Excel import data from SQL databases.","s":"booklet","k":109,"w":["","ODBC connects; it does not interpret relationships.","ODBC is a connection standard, not a link to a command processor.","Each DBMS needs its own driver."]},{"id":"k238","u":16,"q":"Which is a correct expression in XML?","o":["\u003cmessage>if age &lt 30 then\u003c/message>","\u003cmessage>if age “\u003c30” then\u003c/message>","\u003cmessage>if age \u003c30 then\u003c/message>","\u003cmessage>if age &lt; 30 then\u003c/message>"],"a":3,"e":"\u003c must be escaped as &lt; (with the semicolon) inside XML text.","s":"booklet","k":111,"w":["Missing the semicolon.","Quotes do not escape \u003c.","A raw \u003c breaks XML.",""]},{"id":"k242","u":16,"q":"An XML schema provides the definition of an XML document. Which is included in the schema?","o":["Default values for elements","The attributes of data types","The size of child elements","The properties of elements"],"a":0,"e":"An XML Schema can set default (and fixed) values for elements.","s":"booklet","k":112,"w":["","Data types have no attributes of this kind.","Schemas do not set the size of child elements.","\"Properties\" is too vague to be the answer."]},{"id":"k243","u":16,"q":"Which is an example of a self-closing element in XML?","o":["\u003cbook>","\u003cbook/>","\u003c/book />","\u003cbook>\u003c/book>"],"a":1,"e":"\u003cbook/> is a self-closing (empty) element.","s":"booklet","k":111,"w":["This is an opening tag only.","","A slash at both ends is invalid syntax.","Two tags, not self-closing."]},{"id":"k244","u":16,"q":"What describes the use of XML for data storage?","o":["XML uses HTML tags for markup","Internet browsers can read XML files","Data style sheets are unique to each XML document","XHTML is used to convert XML to HTML"],"a":1,"e":"Browsers can open and read XML files.","s":"booklet","w":["XML uses its own tags.","","Stylesheets can be shared.","XSLT converts XML."]},{"id":"k245","u":16,"q":"Which layer is responsible for the delivery and formatting of information to the application layer?","o":["Business logic layer","Session layer","Data access layer","Presentation layer"],"a":3,"e":"In the OSI model, the presentation layer formats data for the application layer.","s":"booklet","k":107,"w":["Logic layer is application architecture.","Session manages sessions.","Data access is app architecture.",""]},{"id":"k253","u":16,"q":"Which of the following strings is a correct XML name?","o":["xmlExtension","xslNewElement","XMLElement#123","XMLName"],"a":1,"e":"XML names may not contain # or spaces, and names starting with 'xml' (in any case) are reserved. xslNewElement is a valid name.","s":"booklet","k":111,"w":["Names starting with 'xml' are reserved, so avoid them.","","# is not allowed.","Names starting with 'XML' (any case) are reserved, so avoid them."]},{"id":"k254","u":17,"q":"When using a system, where is the first place to go to find the cause of a print failure?","o":["Help file","On-screen information icon","Call to helpdesk","Printer manual"],"a":1,"e":"Check the on-screen error/information message first; it usually states the cause.","s":"booklet","k":117,"w":["Help files are a later step.","","Call the helpdesk only after checking the message.","The manual is a later step."]},{"id":"k255","u":17,"q":"When is it best to use on-site instruction?","o":["When learners don't need to ask detailed questions","When practical hands-on instruction is needed","When large numbers of learners are involved","When the learning material is straightforward"],"a":1,"e":"On-site instruction suits practical, hands-on training.","s":"booklet","k":121,"w":["Detailed questions favour on-site.","","Large groups suit webinars or classes.","Simple material can be remote."]},{"id":"k256","u":17,"q":"What is the best source of technical information to restore lost network services?","o":["Help file","On-screen information icon","Call to helpdesk","Printer manual"],"a":2,"e":"Restoring lost network services needs the helpdesk.","s":"booklet","k":117,"w":["Help files cannot restore services.","The icon only shows status.","","A printer manual is unrelated."]},{"id":"k257","u":17,"q":"Which term describes how training can be tailored for each learner's needs?","o":["Refinement","Revision","Personalization","Presentation"],"a":2,"e":"Personalisation tailors training to each learner.","s":"booklet","k":120,"w":["Refinement improves something.","Revision reviews it.","","Presentation is delivery."]},{"id":"k258","u":17,"q":"What is a benefit of a webinar presentation for technical training?","o":["To give each learner a different view","To send assignments to the tutor","To enroll learners for the lesson","To record a lesson for viewing later"],"a":3,"e":"Webinars can be recorded for viewing later.","s":"booklet","k":118,"w":["All learners see the same view.","Assignments use an LMS.","Enrolment is admin.",""]},{"id":"k259","u":17,"q":"What is a benefit of personalizing technical instruction?","o":["Individuals can be tested annually","Individuals can learn at their own pace","Individuals have direct access to writers","Individuals need no human support"],"a":1,"e":"Personalised instruction lets learners go at their own pace.","s":"booklet","k":120,"w":["Annual tests are not the benefit.","","Writers are not involved.","Human support is still useful."]},{"id":"k260","u":17,"q":"What term is used to describe the hardware that connects peripheral devices to a computer motherboard?","o":["Slot","Disk","Card","Port"],"a":3,"e":"A port connects peripheral devices to the motherboard.","s":"booklet","k":114,"w":["A slot holds expansion cards.","A disk stores data.","A card adds functions.",""]},{"id":"g1","u":16,"q":"Which OSI layer provides end-to-end flow control and error recovery between the sending and receiving computers?","o":["Transport layer","Session layer","Network layer","Data link layer"],"a":0,"e":"The transport layer (layer 4) controls end-to-end delivery, flow control and error recovery between the two hosts. The data link layer only manages the link between two directly connected devices.","s":"draft","k":107,"w":["","The session layer manages sessions.","The network layer routes packets.","Data link controls only one direct link, not end-to-end."]},{"id":"g2","u":16,"q":"Which OSI layer formats, translates or encrypts data before it reaches the application layer?","o":["Presentation layer","Transport layer","Network layer","Physical layer"],"a":0,"e":"The presentation layer (layer 6) handles data format, translation and encryption.","s":"draft","k":107,"w":["","Transport delivers data end to end.","Network routes packets.","Physical sends bits."]},{"id":"g3","u":16,"q":"In XML, elements that share the same parent element are called:","o":["Siblings","Children","Roots","Attributes"],"a":0,"e":"Elements with the same parent are siblings.","s":"draft","k":110,"w":["","Children are inside an element.","The root is the top element.","Attributes are inside tags."]},{"id":"g4","u":17,"q":"Which network device regenerates a weak signal so it can travel further?","o":["Repeater","Router","Switch","Bridge"],"a":0,"e":"A repeater amplifies/regenerates signals. Routers join networks; switches join devices in one network.","s":"draft","k":114,"w":["","Routers join different networks.","Switches forward frames within a network.","Bridges connect two segments."]},{"id":"g5","u":17,"q":"Which device forwards packets between different networks using IP addresses?","o":["Router","Repeater","Hub","Bridge"],"a":0,"e":"Routers route traffic between networks by IP address.","s":"draft","k":114,"w":["","Repeaters only boost signals.","Hubs repeat to every port.","Bridges use MAC addresses, not IP."]},{"id":"g6","u":17,"q":"Which device connects devices in one network and sends each frame only to the port it is meant for?","o":["Switch","Hub","Repeater","Modem"],"a":0,"e":"A switch learns MAC addresses and forwards frames only to the right port; a hub sends to all ports.","s":"draft","k":114,"w":["","Hubs send to every port.","Repeaters only boost signals.","Modems connect to the ISP."]},{"id":"g7","u":6,"q":"Experts checking an interface against a list of recognised usability principles is called:","o":["Heuristic evaluation","Beta testing","Load testing","Regression testing"],"a":0,"e":"Heuristic evaluation is an expert review against usability heuristics.","s":"draft","k":42,"w":["","Beta testing uses real users, not experts.","Load testing tests many users.","Regression testing re-runs tests."]},{"id":"g8","u":5,"q":"Which document is mainly used by support staff to keep a system running and improve the service over time?","o":["System maintenance manual","Marketing brochure","Quick-start guide","Release poster"],"a":0,"e":"The system maintenance manual supports ongoing maintenance and continuous service improvement.","s":"draft","k":35,"w":["","Brochures are marketing.","A quick-start guide gets new users started.","A poster is promotion."]},{"id":"g9","u":3,"q":"A requirement stating that the system must run on Windows Server and support 500 users is a:","o":["Technical requirement","Marketing requirement","Social requirement","Training requirement"],"a":0,"e":"Platform and capacity conditions are technical requirements.","s":"draft","k":24,"w":["","Marketing requirements concern promotion and sales.","\"Social requirement\" is not a category here.","Training requirements concern teaching users."]},{"id":"g10","u":4,"q":"Which testing method do developers commonly apply to the code of a prototype?","o":["White-box testing","Beta testing","Acceptance testing","Load testing"],"a":0,"e":"White-box testing examines the internal logic and code paths, which developers can check on a prototype. Beta, acceptance and load testing need a release-ready system.","s":"draft","k":31,"w":["","Beta testing needs a release-ready product and external users.","Acceptance testing is done at the end by users.","Load testing needs a working system under many users."]},{"id":"p1","u":1,"q":"Which was one of the first high-level programming languages, designed for scientific calculation?","o":["FORTRAN","HTML","Java","SQL"],"a":0,"e":"FORTRAN (1957) was one of the first high-level languages. Earlier programs were written in machine code or assembly.","s":"draft","k":0,"w":["","HTML is a markup language from the early 1990s, not an early programming language.","Java appeared in 1995.","SQL is a database query language from the 1970s, not for scientific calculation."]},{"id":"p2","u":1,"q":"Early computers were programmed mainly in:","o":["Machine code","Java","Python","HTML"],"a":0,"e":"The first computers were programmed directly in binary machine code.","s":"draft","k":0,"w":["","Java appeared in 1995, long after the first computers.","Python appeared in 1991.","HTML is a markup language for web pages, not for programming early computers."]},{"id":"p3","u":1,"q":"Which language generation uses mnemonics such as ADD and MOV?","o":["Second generation (assembly)","First generation (machine code)","Third generation (high-level)","Fourth generation (query languages)"],"a":0,"e":"Assembly language, the second generation, replaced binary with short mnemonics.","s":"draft","k":0,"w":["","First-generation machine code is pure binary, with no mnemonics.","Third-generation languages use English-like statements such as print or if.","Fourth-generation languages are query languages such as SQL."]},{"id":"p4","u":1,"q":"What is the main difference between a compiler and an interpreter?","o":["A compiler translates the whole program before running; an interpreter translates line by line","A compiler runs code line by line, while an interpreter translates the whole program first","A compiler edits code; an interpreter stores it","There is no difference"],"a":0,"e":"Compiler: whole program first. Interpreter: one line at a time as it runs.","s":"draft","k":2,"w":["","This reverses the two: an interpreter goes line by line.","Editors edit code; neither tool simply stores it.","They differ in when and how translation happens."]},{"id":"p5","u":1,"q":"Which programming tool is used to type and change source code?","o":["Editor","Compiler","Interpreter","Loader"],"a":0,"e":"An editor is used to write and edit source code.","s":"draft","k":2,"w":["","A compiler translates code; it does not edit it.","An interpreter runs code; it does not edit it.","A loader places a program in memory to run it."]},{"id":"p6","u":1,"q":"In object-oriented programming, what is an object?","o":["An instance of a class","A type of loop","A database table","A compiler error"],"a":0,"e":"A class is the blueprint; an object is an instance created from it.","s":"draft","k":3,"w":["","A loop is a control structure, not an object.","A database table stores records; it is not an OOP object.","A compiler error is a message about faulty code."]},{"id":"p7","u":1,"q":"Which feature of OOP hides an object's data and allows access only through methods?","o":["Encapsulation","Inheritance","Iteration","Compilation"],"a":0,"e":"Encapsulation keeps data private and exposes methods.","s":"draft","k":3,"w":["","Inheritance lets one class reuse another's features.","Iteration means repeating code in a loop.","Compilation translates source code."]},{"id":"p8","u":1,"q":"Which OOP feature allows one method name to behave differently for different objects?","o":["Polymorphism","Encapsulation","Abstraction","Sequencing"],"a":0,"e":"Polymorphism = many forms of the same method.","s":"draft","k":3,"w":["","Encapsulation hides data behind methods.","Abstraction hides complexity and shows only essential features.","Sequencing is running statements in order."]},{"id":"p9","u":1,"q":"What does database programming involve?","o":["Writing programs that store, retrieve and update data","Designing printed brochures for software products","Drawing the network cables that link servers","Creating animated slides for presentations"],"a":0,"e":"Database programming uses languages such as SQL to work with stored data.","s":"draft","k":4,"w":["","Brochures are marketing documents.","Cabling is network installation work.","Slides are presentation work."]},{"id":"p10","u":1,"q":"Which language is most associated with database programming?","o":["SQL","HTML","CSS","Assembly"],"a":0,"e":"SQL (Structured Query Language) is used to query and manage relational databases.","s":"draft","k":4,"w":["","HTML structures web pages.","CSS styles web pages.","Assembly is a low-level language for hardware instructions."]},{"id":"p11","u":1,"q":"A program that saves customer orders and retrieves them later is an example of:","o":["Database programming","Spaghetti programming","Event tree analysis","Slideshow design"],"a":0,"e":"Storing and retrieving records is database programming.","s":"draft","k":4,"w":["","Spaghetti programming means tangled, unstructured code.","Event tree analysis is a risk-analysis method.","Slideshow design is presentation work."]},{"id":"p12","u":1,"q":"What is the main problem with spaghetti code?","o":["Its tangled flow makes it hard to read and maintain","It always runs more slowly than the same structured code","It cannot be compiled by modern compilers","It needs more memory than other programs"],"a":0,"e":"Spaghetti code has no clear structure, so it is hard to follow and maintain.","s":"draft","k":7,"w":["","Speed is not the main problem; readability and maintenance are.","Spaghetti code can still compile.","Memory use is not the main problem."]},{"id":"p13","u":1,"q":"Structured programming replaced GOTO jumps with:","o":["Sequence, selection and iteration","Global variables and shared memory","Subroutines called by line number","Direct jumps to labelled lines"],"a":0,"e":"Structured programming builds programs from sequence, selection and iteration.","s":"draft","k":7,"w":["","Global variables do not replace GOTO and make code harder to follow.","Calling subroutines by line number is an old unstructured technique.","Direct jumps to labels are GOTO itself."]},{"id":"p14","u":1,"q":"An IF...ELSE statement is an example of which control structure?","o":["Branch (selection)","Loop (iteration)","Sequence","Variable"],"a":0,"e":"IF/ELSE chooses between paths: a branch.","s":"draft","k":8,"w":["","A loop repeats code; IF...ELSE chooses a path.","Sequence runs statements one after another without choice.","A variable stores data; it is not a control structure."]},{"id":"p15","u":1,"q":"Which structure repeats a block of code while a condition is true?","o":["Loop","Branch","Sequence","Expression"],"a":0,"e":"Loops repeat instructions.","s":"draft","k":8,"w":["","A branch chooses between paths once.","Sequence runs each statement once in order.","An expression calculates a value."]},{"id":"p16","u":1,"q":"Which data type stores true or false?","o":["Boolean","Integer","String","Char"],"a":0,"e":"Boolean values are true or false.","s":"draft","k":9,"w":["","Integer stores whole numbers.","String stores text.","Char stores a single character."]},{"id":"p17","u":1,"q":"What is an array?","o":["A collection of same-type values accessed by index","A single variable that stores true or false","A loop that repeats a block of code a fixed number of times","A named block of code that returns a value"],"a":0,"e":"Arrays hold many values of one type under one name, indexed by position.","s":"draft","k":9,"w":["","That describes a Boolean variable.","That describes a for loop.","That describes a function."]},{"id":"p18","u":1,"q":"In the statement total = price * 2; what is price * 2?","o":["An expression","A data type","A loop","A class"],"a":0,"e":"An expression combines values and operators to produce a result.","s":"draft","k":9,"w":["","A data type, such as int, is the kind of value, not the calculation.","A loop repeats code.","A class is a blueprint for objects."]},{"id":"p19","u":1,"q":"What does sorting do to data?","o":["Arranges it in ascending or descending order","Removes duplicate records so each value appears once","Encrypts it so only users can read it","Compresses it to take up less storage"],"a":0,"e":"Sorting arranges data in order.","s":"draft","k":10,"w":["","Removing duplicates is de-duplication, not sorting.","That is encryption.","That is compression."]},{"id":"p20","u":1,"q":"Which is a well-known sorting algorithm?","o":["Bubble sort","Fault tree","Use case","Waterfall"],"a":0,"e":"Bubble sort repeatedly swaps adjacent items that are in the wrong order.","s":"draft","k":10,"w":["","A fault tree is a risk-analysis diagram.","A use case describes how a user interacts with a system.","Waterfall is an SDLC model."]},{"id":"p21","u":1,"q":"Sorting the list 9, 2, 7 in ascending order gives:","o":["2, 7, 9","9, 7, 2","7, 2, 9","2, 9, 7"],"a":0,"e":"Ascending = smallest to largest.","s":"draft","k":10,"w":["","9, 7, 2 is descending order.","7, 2, 9 is not in order.","2, 9, 7 is not in order."]},{"id":"p23","u":2,"q":"In a requirements flowchart, which symbol marks the start or end?","o":["Oval (terminator)","Diamond","Rectangle","Arrow"],"a":0,"e":"The terminator (oval) shows start and end.","s":"draft","k":13,"w":["","A diamond is a decision.","A rectangle is a process.","An arrow shows flow direction."]},{"id":"p24","u":2,"q":"Why are flowcharts useful when modelling requirements?","o":["They show a process's steps and decisions visually","They store the requirements in a database","They convert the requirements directly into program code","They encrypt the requirements for security"],"a":0,"e":"Flowcharts make a process easy to see and discuss.","s":"draft","k":13,"w":["","Flowcharts are diagrams, not databases.","They help plan code but do not convert into code.","Diagrams do not encrypt anything."]},{"id":"p25","u":2,"q":"Which feature improves the usability of a requirements document?","o":["Clear headings, consistent layout and plain language","Long paragraphs that explain everything in detail","Many different fonts to make sections stand out","Technical jargon so experts take it seriously"],"a":0,"e":"Good document design makes requirements easy to read and find.","s":"draft","k":15,"w":["","Long paragraphs make documents harder to scan.","Many fonts look inconsistent and confuse readers.","Jargon makes documents harder for stakeholders."]},{"id":"p26","u":2,"q":"Why should requirements documents follow a standard template?","o":["So all documents are consistent and easy to review","So documents are longer and more detailed","So each author can choose the layout that suits them best","So documents can skip the approval step"],"a":0,"e":"A template keeps structure and style consistent.","s":"draft","k":15,"w":["","Templates aim for consistency, not extra length.","Templates remove individual layouts.","Templates do not replace approval."]},{"id":"p27","u":2,"q":"Which element helps readers find sections quickly in a long specification?","o":["A table of contents","Background images","Coloured text everywhere","A cover photo"],"a":0,"e":"A table of contents improves navigation in long documents.","s":"draft","k":15,"w":["","Background images reduce readability.","Coloured text everywhere distracts.","A cover photo does not help navigation."]},{"id":"p28","u":2,"q":"In risk analysis, 'magnitude' refers to:","o":["How severe the impact of the risk would be","How likely it is that the risk will actually happen","Who reported the risk","When the project ends"],"a":0,"e":"Magnitude = impact or severity. Likelihood = probability.","s":"draft","k":17,"w":["","That is likelihood (probability).","Who reported it is not part of risk magnitude.","Project end date is not magnitude."]},{"id":"p29","u":2,"q":"How is a risk commonly quantified?","o":["Likelihood × magnitude (impact)","Cost + time","Number of users ÷ number of servers","Lines of code × testers"],"a":0,"e":"Risk exposure = probability × impact.","s":"draft","k":17,"w":["","Cost plus time is not how risk is measured.","This is a capacity ratio, not risk.","This is not a risk measure."]},{"id":"p30","u":2,"q":"A risk that is very likely but has very small impact should be rated:","o":["Low to medium, because the impact is small","Critical, because it is likely","Ignored completely","High, because every likely risk must be treated as high"],"a":0,"e":"Both likelihood and magnitude decide the risk level.","s":"draft","k":17,"w":["","Likelihood alone does not make a risk critical.","Even small risks are recorded and monitored.","Impact matters as much as likelihood."]},{"id":"p31","u":2,"q":"What is the difference between a fault tree and an event tree?","o":["A fault tree traces causes; an event tree traces outcomes","They are two names for the same diagram","A fault tree traces outcomes; an event tree traces causes","Only the event tree is used in risk analysis"],"a":0,"e":"Fault tree: top-down causes. Event tree: forward outcomes.","s":"draft","k":18,"w":["","They are different diagrams.","This reverses the two.","Both are used in risk analysis."]},{"id":"p32","u":2,"q":"Fault tree analysis starts from:","o":["An undesired top event (failure)","The list of system users","The approved project budget","The first screen of the interface"],"a":0,"e":"FTA begins with the failure and traces causes downward.","s":"draft","k":18,"w":["","Users are not the starting point.","The budget is not the starting point.","The interface is not the starting point."]},{"id":"p33","u":3,"q":"Which model estimates development effort from lines of code or function points?","o":["COCOMO","CMMI","ISO 9001","Six Sigma"],"a":0,"e":"COCOMO (Constructive Cost Model) is an algorithmic estimation model.","s":"draft","k":21,"w":["","CMMI rates process maturity, not effort.","ISO 9001 is a quality management standard.","Six Sigma is a quality-improvement method."]},{"id":"p34","u":3,"q":"Estimating a new project by comparing it with similar past projects is called:","o":["Analogy estimation","Black-box testing","Static analysis","Regression testing"],"a":0,"e":"Analogy estimation uses data from similar completed projects.","s":"draft","k":21,"w":["","Black-box testing tests behaviour, not estimates.","Static analysis examines code.","Regression testing re-runs tests after changes."]},{"id":"p35","u":3,"q":"Why do software teams estimate effort before development?","o":["To plan time, cost and resources","To test the code","To write the user manual before coding","To design the logo"],"a":0,"e":"Estimates support planning and budgeting.","s":"draft","k":21,"w":["","Testing comes later.","Manuals are not the purpose of estimating.","Logo design is unrelated."]},{"id":"p36","u":3,"q":"Which activity is the core of software configuration management?","o":["Version control","Graphic design","Marketing","User training"],"a":0,"e":"SCM tracks and controls versions and changes.","s":"draft","k":22,"w":["","Graphic design is unrelated to SCM.","Marketing is unrelated to SCM.","Training is unrelated to SCM."]},{"id":"p37","u":3,"q":"Which group reviews and approves changes in configuration management?","o":["Change control board (CCB)","The end users only","The marketing team","The help desk staff who log user problems"],"a":0,"e":"A change (configuration) control board approves changes.","s":"draft","k":22,"w":["","End users request changes but do not approve them alone.","Marketing does not approve technical changes.","The help desk logs problems but does not approve changes."]},{"id":"p38","u":3,"q":"Industry-accepted software is chosen mainly because it is:","o":["Reliable, well supported and standard","The newest product released on the market","The cheapest product available","Free of any licence conditions"],"a":0,"e":"Organisations trust products with proven reliability and support.","s":"draft","k":23,"w":["","Newest is not the main reason.","Cheapest is not the main reason.","Industry software usually has licence terms."]},{"id":"p39","u":3,"q":"Which is an example of an industry-standard relational DBMS?","o":["Oracle Database","Microsoft Paint","Notepad","WinZip"],"a":0,"e":"Oracle, SQL Server and MySQL are industry-standard DBMSs.","s":"draft","k":23,"w":["","Paint is a graphics program.","Notepad is a text editor.","WinZip compresses files."]},{"id":"p40","u":3,"q":"Which statement is a business requirement?","o":["The system must cut order processing time by 20%","The Save button must be blue and 40 pixels wide","The code must use four spaces for indentation","The server must run Windows Server 2022"],"a":0,"e":"Business requirements state what the business needs to achieve.","s":"draft","k":24,"w":["","That is a UI design detail.","That is a coding standard.","That is a technical requirement."]},{"id":"p41","u":3,"q":"What does an input/output driver do?","o":["Lets the OS communicate with a hardware device","Stores the user's files on the hard disk","Manages the memory used by each program","Protects the computer from malicious software"],"a":0,"e":"Drivers translate between the OS and hardware such as printers and keyboards.","s":"draft","k":25,"w":["","Storing files is the file system's job.","Memory management is the OS's job.","Protection is antivirus software's job."]},{"id":"p42","u":3,"q":"A new printer does not work until software is installed. What is missing?","o":["The printer driver","The compiler","The firewall","The database"],"a":0,"e":"The printer (output) driver lets the OS send data to the printer.","s":"draft","k":25,"w":["","A compiler translates code; it does not run printers.","A firewall controls network traffic.","A database stores data."]},{"id":"p43","u":3,"q":"Which is an input device whose driver must be installed?","o":["Scanner","Monitor","Speaker","Printer"],"a":0,"e":"Scanners send data into the computer: input. Monitors, speakers and printers are output.","s":"draft","k":25,"w":["","A monitor is an output device.","A speaker is an output device.","A printer is an output device."]},{"id":"p44","u":4,"q":"What does a logging framework do?","o":["Records program events and errors to a log","Compiles the program into machine code","Encrypts the database to protect the data","Designs the interface from a set of templates"],"a":0,"e":"Logging frameworks (e.g. Log4j) write messages to files or consoles.","s":"draft","k":27,"w":["","Compiling is the compiler's job.","Encryption is a security tool's job.","Interface design is a design tool's job."]},{"id":"p45","u":4,"q":"Which log level indicates the most serious problem?","o":["FATAL","DEBUG","INFO","WARN"],"a":0,"e":"Levels from least to most serious: DEBUG, INFO, WARN, ERROR, FATAL.","s":"draft","k":27,"w":["","DEBUG is the least serious level.","INFO is for normal information.","WARN is a warning, less than ERROR and FATAL."]},{"id":"p46","u":4,"q":"Why are logs useful after software is released?","o":["They show what happened just before an error","They make the program run faster for users","They replace the need for any testing","They hide error messages from the users"],"a":0,"e":"Logs give evidence of runtime behaviour in production.","s":"draft","k":27,"w":["","Logs do not speed programs up.","Logs do not replace testing.","Logs record errors; they do not hide them."]},{"id":"p47","u":4,"q":"A tracing tool is used to:","o":["Follow the path of execution through the code","Design the layout of the graphical interface","Write the user documentation automatically","Encrypt files before they are sent"],"a":0,"e":"Tracing shows which lines and functions run, and in what order.","s":"draft","k":28,"w":["","GUI design is a design tool's job.","Documentation is written by people or doc tools.","Encryption is a security tool's job."]},{"id":"p48","u":4,"q":"Which tool checks how a system behaves with many simultaneous users?","o":["A load testing tool","A static analysis tool","A text editor","A compiler"],"a":0,"e":"Load and performance tools (e.g. JMeter) simulate many users.","s":"draft","k":32,"w":["","Static analysis does not run the program.","A text editor edits files.","A compiler translates code."]},{"id":"p49","u":4,"q":"Test coverage measures:","o":["How much of the code the tests have exercised","How many users like the software after release","How large the database is after testing","How fast the network is during the test run"],"a":0,"e":"Coverage is usually shown as a percentage of code tested.","s":"draft","k":32,"w":["","User satisfaction is measured by surveys.","Database size is storage.","Network speed is performance."]},{"id":"p50","u":4,"q":"A static analysis tool:","o":["Scans source code for problems without running it","Runs the program with many simulated users","Records the screen while the user works","Creates test user accounts in the database before testing"],"a":0,"e":"Static analysis examines code without execution.","s":"draft","k":32,"w":["","That is a load testing tool.","That is screen recording.","That is test data set-up."]},{"id":"p51","u":5,"q":"Which document format is easiest to edit collaboratively?","o":["Word (DOCX)","PDF","Printed","Image (JPG)"],"a":0,"e":"Word documents are editable; PDF is fixed for distribution.","s":"draft","k":36,"w":["","PDF is fixed for distribution.","Printed copies cannot be edited digitally.","Images cannot be edited as text."]},{"id":"p52","u":5,"q":"Which format suits documentation that must be updated often and include videos and links?","o":["Web pages (online help)","Printed manual","PDF","Fax"],"a":0,"e":"Online help is easy to update and supports multimedia.","s":"draft","k":36,"w":["","Printed manuals are hard to update and cannot play video.","PDF is fixed and limited for video.","Fax is outdated and text only."]},{"id":"p53","u":5,"q":"Documentation explaining IP addresses, cabling and switch settings covers which domain?","o":["Networks","Applications","Hardware only","Marketing"],"a":0,"e":"Network documentation covers diagrams, IP plans and settings.","s":"draft","k":38,"w":["","Applications documentation covers software use.","Hardware documentation covers devices, not IP settings.","Marketing is unrelated."]},{"id":"p54","u":5,"q":"A guide to installing and configuring an operating system documents which domain?","o":["Systems","Networks","Brochures","Social media"],"a":0,"e":"System documentation covers OS installation, configuration and maintenance.","s":"draft","k":38,"w":["","Network documentation covers IP addresses and cabling.","Brochures are marketing.","Social media is unrelated."]},{"id":"p55","u":7,"q":"What is a Java class library?","o":["A collection of ready-made, reusable classes","A list of programming books for Java","A database that stores Java user accounts","A type of loop for reading files"],"a":0,"e":"Class libraries (e.g. java.util) provide reusable classes.","s":"draft","k":50,"w":["","Book lists are not a library in this sense.","Accounts are stored in databases.","Loops are control structures."]},{"id":"p56","u":7,"q":"Which Java package contains classes for input and output such as reading files?","o":["java.io","java.net","java.awt","java.sql"],"a":0,"e":"java.io handles input/output; java.net networking; java.sql databases.","s":"draft","k":50,"w":["","java.net is for networking.","java.awt is for graphics and GUI.","java.sql is for databases."]},{"id":"p57","u":7,"q":"What is a Java servlet?","o":["A Java program on a web server that builds pages","A small Java program that runs inside a browser","A standalone Java program with a main() method","A Java tool that compiles code into bytecode"],"a":0,"e":"Servlets run on the server; applets ran in the browser; applications run standalone.","s":"draft","k":52,"w":["","That is an applet.","That is an application.","That is the javac compiler."]},{"id":"p58","u":7,"q":"Which type of Java program has a main() method and runs on its own?","o":["Application","Applet","Servlet","Library"],"a":0,"e":"A Java application is standalone and starts at main().","s":"draft","k":52,"w":["","Applets ran inside browsers.","Servlets run on web servers.","A library is used by programs; it does not run alone."]},{"id":"p59","u":7,"q":"Which Java program type was designed to run inside a web browser?","o":["Applet","Servlet","Application","Compiler"],"a":0,"e":"Applets ran inside browsers (now obsolete).","s":"draft","k":52,"w":["","Servlets run on servers.","Applications run on their own.","A compiler translates code."]},{"id":"p60","u":7,"q":"In Java, which statement is a branch?","o":["if (age > 18) { ... }","for (int i = 0; i \u003c 5; i++)","int x = 5;","System.out.println(x);"],"a":0,"e":"if creates a branch (selection); for creates a loop.","s":"draft","k":53,"w":["","for is a loop.","This is a declaration.","This is an output statement."]},{"id":"p61","u":7,"q":"Which Java loop always runs its body at least once?","o":["do-while","for","while","if"],"a":0,"e":"do-while tests the condition after the body.","s":"draft","k":53,"w":["","for may run zero times.","while may run zero times.","if is not a loop."]},{"id":"p62","u":7,"q":"In Java GUI programming, which interface responds to a button click?","o":["ActionListener","Comparable","Serializable","Runnable"],"a":0,"e":"Buttons notify an ActionListener when clicked.","s":"draft","k":55,"w":["","Comparable is for sorting objects.","Serializable is for saving objects.","Runnable is for threads."]},{"id":"p63","u":7,"q":"A method that runs when the user clicks a button is called:","o":["An event handler","A constructor","A compiler","A variable"],"a":0,"e":"Event handlers respond to user events.","s":"draft","k":55,"w":["","A constructor initialises objects.","A compiler translates code.","A variable stores data."]},{"id":"p64","u":7,"q":"Connecting a button to the code that runs when it is clicked is called:","o":["Event handling","Compiling the user interface into code","Sorting the event queue","Debugging the button's code"],"a":0,"e":"Event handling links UI elements to program logic.","s":"draft","k":55,"w":["","Compiling translates code.","Sorting orders items.","Debugging fixes errors."]},{"id":"p65","u":8,"q":"Which methodology delivers working software in short iterations called sprints?","o":["Agile (Scrum)","Waterfall","V-model","Big Bang"],"a":0,"e":"Agile works in short iterations with customer feedback.","s":"draft","k":58,"w":["","Waterfall is linear, with no sprints.","The V-model is linear.","Big Bang has little planning."]},{"id":"p66","u":8,"q":"Which methodology builds prototypes quickly with heavy user involvement?","o":["RAD (Rapid Application Development)","Waterfall (linear phases)","Spiral model (risk-driven cycles)","V-model (paired testing)"],"a":0,"e":"RAD focuses on fast prototyping and user feedback.","s":"draft","k":58,"w":["","Waterfall has no early prototypes.","Spiral is risk-driven.","The V-model pairs development with testing."]},{"id":"p67","u":8,"q":"What is a design pattern?","o":["A reusable solution to a common design problem","A colour scheme reused across an application","A type of database used for storing objects","A testing tool that checks code structure"],"a":0,"e":"Patterns describe proven solutions: problem, context, solution, consequences.","s":"draft","k":60,"w":["","A colour scheme is visual design.","It is not a database.","It is not a testing tool."]},{"id":"p68","u":8,"q":"What is a software framework?","o":["A reusable structure for building applications","A single variable shared by every class","A hardware device that runs applications","A user manual that explains a programming language"],"a":0,"e":"Frameworks provide structure and reusable components.","s":"draft","k":60,"w":["","A variable is not a framework.","Frameworks are software.","A manual is documentation."]},{"id":"p69","u":8,"q":"A coding idiom is:","o":["A coding habit natural to one specific language","A security threat hidden inside program code","A model for storing data in a database","A network device that connects programs"],"a":0,"e":"Idioms are language-specific coding habits.","s":"draft","k":60,"w":["","Threats are malware.","Data models are database design.","Network devices are hardware."]},{"id":"p70","u":8,"q":"What is a software repository tool such as GitHub used for?","o":["Storing, sharing and versioning code","Designing logos and graphics","Testing the network's speed","Writing and sending invoices to clients"],"a":0,"e":"Repositories store code and track versions for teams.","s":"draft","k":61,"w":["","Logos use graphics software.","Network speed tests use network tools.","Invoices use accounting software."]},{"id":"p71","u":8,"q":"Which is a repository tool?","o":["Git","Excel","Paint","Notepad"],"a":0,"e":"Git is a distributed version control and repository tool.","s":"draft","k":61,"w":["","Excel is a spreadsheet.","Paint is a graphics program.","Notepad is a text editor."]},{"id":"p72","u":8,"q":"Why do teams store components in a central repository?","o":["To share, reuse and control code versions","To keep each developer's work separate","To hide the code from other team members","To avoid having to test the components"],"a":0,"e":"Repositories support reuse, collaboration and version control.","s":"draft","k":61,"w":["","Repositories bring work together.","Repositories share code.","Components still need testing."]},{"id":"p73","u":14,"q":"What is the main job of an HTTP server?","o":["Receive browser requests and send back pages","Encrypt email sent between users","Store users' passwords on their computers","Block all traffic from unknown addresses"],"a":0,"e":"HTTP servers (e.g. Apache, IIS) answer browser requests.","s":"draft","k":93,"w":["","Email encryption is S/MIME or PGP.","Passwords are not stored on users' PCs.","Blocking traffic is a firewall."]},{"id":"p74","u":14,"q":"Why must a web-server operating system be kept patched?","o":["Unpatched holes can be exploited by attackers","Patches make the website load faster","Patches update the website's content","Patches are required every year to renew the domain name"],"a":0,"e":"Updates close known security holes.","s":"draft","k":93,"w":["","Patches do not mainly speed sites.","Content is updated separately.","Domains are renewed with registrars."]},{"id":"p75","u":14,"q":"Which is an example of HTTP server software?","o":["Apache","Excel","Photoshop","Outlook"],"a":0,"e":"Apache and Microsoft IIS are HTTP servers.","s":"draft","k":93,"w":["","Excel is a spreadsheet.","Photoshop edits images.","Outlook is an email client."]},{"id":"p76","u":14,"q":"What is a distributed denial-of-service (DDoS) attack?","o":["Many computers flood a target so users can't reach it","One user repeatedly guessing an account password","A virus hidden in a shared spreadsheet","An email that appears to come from a trusted sender"],"a":0,"e":"DDoS uses many machines (a botnet) to overwhelm a service.","s":"draft","k":97,"w":["","Repeated guessing is brute force.","A hidden virus is malware.","A fake email is phishing."]},{"id":"p77","u":14,"q":"Which security principle does a denial-of-service attack mainly affect?","o":["Availability","Confidentiality","Integrity","Authentication"],"a":0,"e":"DoS stops the service being available.","s":"draft","k":97,"w":["","Confidentiality is secrecy.","Integrity is correctness.","Authentication is identity."]},{"id":"p78","u":14,"q":"DOCSIS is a standard used for:","o":["Internet access over cable TV networks","Encrypting email between mail servers","Securing wireless local networks","Protecting online card payments"],"a":0,"e":"DOCSIS = Data Over Cable Service Interface Specification.","s":"draft","k":98,"w":["","Email encryption is S/MIME.","Wi-Fi security is 802.11 and WPA.","Card payments use SET or PCI DSS."]},{"id":"p79","u":14,"q":"Which device uses DOCSIS to connect a home to the internet?","o":["A cable modem","A Wi-Fi printer","A USB drive","A projector"],"a":0,"e":"Cable modems use DOCSIS.","s":"draft","k":98,"w":["","Printers do not use DOCSIS.","USB drives do not use DOCSIS.","Projectors do not use DOCSIS."]},{"id":"p80","u":14,"q":"What does DNSSEC protect against?","o":["Forged or altered DNS lookup data","Weak or reused account passwords","Viruses hidden in email attachments","Unencrypted web traffic over HTTP"],"a":0,"e":"DNSSEC uses digital signatures so DNS answers can be trusted.","s":"draft","k":99,"w":["","Passwords are a different area.","Email viruses are antivirus.","HTTP encryption is TLS."]},{"id":"p81","u":14,"q":"DNSSEC adds which feature to DNS responses?","o":["Digital signatures","Video streaming","Compression","Spell checking"],"a":0,"e":"Signed records let resolvers verify authenticity.","s":"draft","k":99,"w":["","DNS does not stream video.","DNSSEC does not compress.","DNSSEC signs records; it does not check spelling."]},{"id":"p82","u":14,"q":"IEEE 802.11 is the family of standards for:","o":["Wireless local area networks (Wi-Fi)","Internet access over cable TV networks","Encryption of email messages","Secure online card payments"],"a":0,"e":"802.11 defines Wi-Fi.","s":"draft","k":100,"w":["","Cable internet is DOCSIS.","Email encryption is S/MIME.","Card payments use SET."]},{"id":"p83","u":14,"q":"Which is the most secure option for protecting a Wi-Fi network?","o":["WPA2 or WPA3 encryption","WEP encryption","An open network","Hiding the router under a desk"],"a":0,"e":"WEP is broken; use WPA2/WPA3.","s":"draft","k":100,"w":["","WEP is broken.","Open networks have no protection.","Physical hiding is not encryption."]},{"id":"p84","u":14,"q":"Which IEEE 802.11 security amendment introduced strong WPA2 encryption?","o":["802.11i","802.11b","802.3","802.15"],"a":0,"e":"802.11i defined the security behind WPA2.","s":"draft","k":100,"w":["","802.11b is an older speed standard.","802.3 is Ethernet.","802.15 is personal networks such as Bluetooth."]},{"id":"p85","u":14,"q":"Secure Electronic Transaction (SET) was designed to protect:","o":["Credit card payments online","Wireless home networks","Email attachments","Cable modem connections at home"],"a":0,"e":"SET was a protocol by Visa and MasterCard for card payments online.","s":"draft","k":101,"w":["","Wi-Fi uses WPA.","Email uses S/MIME.","Cable uses DOCSIS."]},{"id":"p86","u":14,"q":"Which organisations developed the SET protocol?","o":["Visa and MasterCard","W3C and IEEE","Microsoft and Apple","Google and Facebook"],"a":0,"e":"SET was created by Visa and MasterCard with technology partners.","s":"draft","k":101,"w":["","W3C and IEEE set web and engineering standards.","Visa and MasterCard led SET; Microsoft was only one of the technology partners, and Apple was not involved.","Google and Facebook did not create SET."]},{"id":"p87","u":14,"q":"SET protects online card payments mainly by using:","o":["Certificates and encryption","Colour-coded payment pages","Strong passwords only","Printed paper receipts"],"a":0,"e":"SET relies on certificates, digital signatures and encryption.","s":"draft","k":101,"w":["","Colours do not secure payments.","Passwords alone are not SET.","Paper receipts are not digital security."]},{"id":"p88","u":14,"q":"What does S/MIME provide for email?","o":["Encryption and digital signatures","Faster delivery of messages to recipients","Larger mailbox storage","Automatic spam filtering"],"a":0,"e":"S/MIME encrypts messages and signs them to prove the sender.","s":"draft","k":95,"w":["","Speed is unrelated.","Storage is unrelated.","Spam filtering is separate."]},{"id":"p89","u":17,"q":"Why should trainers teach only hardware and software supported by the organisation?","o":["IT can maintain, license and secure it","It is always the newest version","Users can then install any software they like","It needs no training at all"],"a":0,"e":"Supported products are approved, licensed and maintained by IT.","s":"draft","k":115,"w":["","Supported is not always newest.","Users cannot install anything.","Training is still needed."]},{"id":"p90","u":17,"q":"Where should a trainer check which software versions the organisation supports?","o":["IT's approved software list","A social media post","An online advert","A colleague's personal laptop settings"],"a":0,"e":"Organisations keep an approved (standard) software list.","s":"draft","k":115,"w":["","Social media is unreliable.","Adverts are biased.","Personal settings are not official."]},{"id":"sb1","u":1,"q":"What is used to translate assembly language instructions into machine language instructions?","o":["Compiler","Interpreter","Translator","Assembler"],"a":3,"e":"An assembler converts assembly mnemonics into machine code.","s":"book","k":1,"w":["A compiler translates high-level code, not assembly.","An interpreter runs high-level code line by line.","\"Translator\" is a general word; the specific tool for assembly is the assembler.",""]},{"id":"sb2","u":1,"q":"What is one of the main advantages of using a compiler over an interpreter?","o":["Compiled programs run faster","Compilers can run code immediately","Compilers support interactive programming","Compilers are easier for beginners"],"a":0,"e":"The whole program is translated in advance, so the compiled program executes faster.","s":"book","k":2,"w":["","An interpreter runs code immediately; a compiler must translate first.","Interactive programming suits interpreters.","Interpreters are usually easier for beginners because of instant feedback."]},{"id":"sb3","u":1,"q":"What is the primary concept of Object Oriented Programming (OOP)?","o":["A programming style based on network protocols","A programming paradigm based on objects","A method of writing step-by-step procedures","A framework for writing low-level code"],"a":1,"e":"OOP is built around objects that combine data and behaviour.","s":"book","k":3,"w":["Network protocols are not the basis of OOP.","","Step-by-step procedures describe procedural programming.","OOP is high-level, not about low-level code."]},{"id":"sb4","u":1,"q":"What software is used to manage databases?","o":["Text editor","Database Management System (DBMS)","Spreadsheet software","Content Management System (CMS)"],"a":1,"e":"A DBMS creates, manages and secures databases.","s":"book","w":["A text editor edits plain text files.","","Spreadsheets handle tables of numbers, not full databases.","A CMS manages website content."]},{"id":"sb5","u":1,"q":"What is one of the key features of databases?","o":["Data access limited to one user at a time","Efficient data retrieval through searching","Simple formats that cannot hold relationships","Data stored with no system or structure"],"a":1,"e":"Databases organise data so it can be searched and retrieved efficiently.","s":"book","w":["Databases support many users at once.","","Relational databases are designed to hold relationships.","Databases store data in an organised structure."]},{"id":"sb6","u":1,"q":"What does SDLC stand for?","o":["Systematic Development Life Cycle","Software Deployment Life Cycle","System Development Lifecycle Process","Software Development Life Cycle"],"a":3,"e":"SDLC = Software Development Life Cycle.","s":"book","k":5,"w":["\"Systematic\" is not part of the name.","Deployment is only one stage; the D stands for Development.","The name is Software, not System, and has no \"Process\".",""]},{"id":"sb7","u":1,"q":"In which SDLC stage is the actual programming code produced?","o":["Testing the finished product for errors","Defining the requirements","Building (developing) the product","Deploying it to the market"],"a":2,"e":"Code is written in the build (implementation) stage.","s":"book","k":5,"w":["Testing checks the code after it is built.","Requirements are defined before any code is written.","","Deployment releases code that already exists."]},{"id":"sb8","u":1,"q":"Which of the following is NOT a feature of a Java editor?","o":["Integrated debugging features","Syntax highlighting","Graphic design tools","Content/code assist"],"a":2,"e":"Java editors/IDEs offer highlighting, code assist and debugging, not graphic design.","s":"book","k":2,"w":["Debugging is a common feature of Java editors and IDEs.","Syntax highlighting is a standard editor feature.","","Code assist (auto-complete) is a standard IDE feature."]},{"id":"sb9","u":1,"q":"Which flowchart symbol is used for input/output of data?","o":["Parallelogram","Rectangle","Oval","Diamond"],"a":0,"e":"Parallelogram = input/output; rectangle = process; oval = start/end; diamond = decision.","s":"book","k":6,"w":["","A rectangle is a process step.","An oval is start or end.","A diamond is a decision."]},{"id":"sb10","u":1,"q":"What is the main advantage of using structured programming?","o":["It allows faster execution","It makes programs easier to test, debug and maintain","It removes the need for a runtime environment on the computer","It needs less memory"],"a":1,"e":"Clear structures make code easier to test, debug and maintain.","s":"book","k":7,"w":["Structured code is not necessarily faster.","","A runtime environment is still needed.","Memory use is not the main advantage."]},{"id":"sb11","u":1,"q":"Which term is related to machine language?","o":["Mnemonics","Binary digits","English-style statements","Keywords"],"a":1,"e":"Machine language is binary (0s and 1s). Mnemonics belong to assembly language.","s":"book","k":1,"w":["Mnemonics belong to assembly language.","","English-style statements belong to high-level languages.","Keywords belong to high-level languages."]},{"id":"sb12","u":1,"q":"Which of these is performed in the analysis phase of the SDLC?","o":["Approve all project requests","Build a prototype","Perform a detailed analysis of the old system","Review and allocate resources to the project"],"a":2,"e":"Analysis studies the existing system and gathers requirements.","s":"book","k":5,"w":["Approving requests happens in planning.","Prototypes are built in design.","","Allocating resources happens in planning."]},{"id":"sb13","u":1,"q":"What does scalability in databases refer to?","o":["The speed of data retrieval","The number of users accessing the database","The complexity of data structures","The ability to increase data storage capacity"],"a":3,"e":"A scalable database can grow to hold more data and load.","s":"book","w":["Speed is performance, not scalability.","The number of users is load; scalability is the ability to grow.","Complexity of structures is a design issue.",""]},{"id":"sb14","u":1,"q":"When incorporating a user interface into code, which is an important consideration?","o":["Every UI element must be written into the program's main algorithm","The UI should be intuitive and responsive to user actions","The UI should not include any interactivity","The UI must be coded manually without libraries"],"a":1,"e":"A good UI is intuitive and responds to user actions.","s":"book","w":["UI elements are usually built in separate classes or files, not in the main algorithm.","","A UI must be interactive.","UI libraries and frameworks are widely used."]},{"id":"sb15","u":1,"q":"Which construct would you most likely use to handle user inputs like button clicks in an event-driven program?","o":["Loops","Functions","Event handlers","Conditional statements"],"a":2,"e":"Event handlers respond to events such as clicks.","s":"book","k":11,"w":["Loops repeat code; they do not react to clicks.","Functions are general code blocks; an event handler is the specific construct.","","Conditionals choose paths, but handlers react to events."]},{"id":"sb16","u":1,"q":"What is the role of an event handler in an event-driven program?","o":["To calculate results from the user's input","To define where controls appear on the screen","To respond to events like clicks or key presses","To declare the global variables a program uses"],"a":2,"e":"Handlers run when their event happens.","s":"book","k":11,"w":["Calculations are done by the program's logic.","Layout is set by the UI design.","","Global variables are declared by the programmer."]},{"id":"sb17","u":1,"q":"In third-generation languages, what does 'interpretation' refer to?","o":["Creating machine code directly from binary","Translating and running code statement by statement","Compiling all the code first for faster running","Examining the finished code for syntax errors"],"a":1,"e":"An interpreter translates and runs source code one statement at a time.","s":"book","k":0,"w":["Machine code is not created from binary.","","Compiling everything first is compilation.","Checking syntax is part of translation, not the meaning of interpretation."]},{"id":"sb18","u":1,"q":"What is the purpose of control structures in structured programming?","o":["To reduce code complexity","To improve program flow and clarity","To decrease the total development time of a project","To increase runtime"],"a":1,"e":"Sequence, selection and iteration give clear program flow.","s":"book","k":7,"w":["Reducing complexity is a side effect; the purpose is clear program flow.","","Development time is not their purpose.","They do not aim to increase run time."]},{"id":"sb19","u":1,"q":"Which control structure allows statements to be repeated multiple times?","o":["Sequence","Selection","Control","Loop"],"a":3,"e":"Loops (iteration) repeat statements.","s":"book","k":8,"w":["Sequence runs statements once in order.","Selection chooses a path.","\"Control\" is not one of the control structures.",""]},{"id":"sb20","u":1,"q":"What is a graphical way to represent an algori
