tten in SQL.","Formatting is not UML's job."]},{"id":"b15-47","u":15,"q":"What does an ERD represent?","o":["A web page","A SQL script","Entity relationships","Data backups"],"a":2,"e":"An ERD shows entities and their relationships.","s":"bank","k":104,"w":["A web page is HTML.","A SQL script is code.","","Backups are copies."]},{"id":"b15-48","u":15,"q":"What is the primary purpose of a database user interface?","o":["To define the logical structure of the data and its tables","To allow users to interact with the database easily","To manage database security settings","To perform data backup operations"],"a":1,"e":"A UI lets users work with the database easily.","s":"bank","k":102,"w":["Logical structure is the schema.","","Security is the DBA's job.","Backup is a separate tool."]},{"id":"b15-49","u":15,"q":"Which of the following best describes a Database Management System (DBMS)?","o":["A collection of unorganized data files","A software tool that stores, retrieves, and manages data","A graphical tool for creating animations","A software tool that manages the computer's operating system"],"a":1,"e":"A DBMS is software that stores, retrieves and manages data.","s":"bank","k":102,"w":["Unorganised files are not a DBMS.","","Animation tools are unrelated.","That is an operating system."]},{"id":"b15-50","u":15,"q":"In a database, “information” refers to:","o":["Raw facts and figures","Data processed into a meaningful form","A list of the database's file names","Values stored without any relationship"],"a":1,"e":"Information = processed data with meaning; raw facts are data.","s":"bank","k":102,"w":["Raw facts are data.","","File names are not information.","Unrelated values are data."]},{"id":"b15-51","u":15,"q":"Which statement best describes a flat-file database?","o":["It stores data in multiple linked tables","It stores all data in a single table or file","It organizes data in a tree-like structure","It stores objects as records"],"a":1,"e":"Flat file = one table/file.","s":"bank","k":103,"w":["Linked tables are relational.","","Trees are hierarchical.","Objects are OO."]},{"id":"b15-52","u":15,"q":"What is the structure used by a hierarchical database model?","o":["A single flat list","A parent-child tree","A web of linked nodes","Tables joined by keys"],"a":1,"e":"Hierarchical = tree of parent-child records.","s":"bank","k":103,"w":["A flat list is a flat file.","","A web is the network model.","Tables with keys are relational."]},{"id":"b15-53","u":15,"q":"In a relational database, data is organized into:","o":["Arrays","Tables of rows and columns","Linked lists","Parent-child trees of records"],"a":1,"e":"Relational = tables of rows and columns.","s":"bank","k":103,"w":["Arrays are programming structures.","","Linked lists are programming structures.","Trees are hierarchical."]},{"id":"b15-54","u":15,"q":"An object-oriented database stores data as:","o":["Tables","Files","Objects with data and methods","Flat records in a single file"],"a":2,"e":"OO databases store objects: data plus methods.","s":"bank","k":103,"w":["Tables are relational.","Files are flat.","","Flat records are flat-file."]},{"id":"b15-55","u":15,"q":"What is a key feature of a network database model?","o":["Each child record has only one parent","Records linked by pointers, many-to-many","It always uses SQL to manage the data","All the data is stored in one flat file"],"a":1,"e":"Network models use pointers and allow many-to-many.","s":"bank","k":103,"w":["One parent is hierarchical.","","SQL is relational.","One file is flat-file."]},{"id":"b15-56","u":15,"q":"Which SQL command is used to retrieve data from a database?","o":["INSERT","DELETE","SELECT","UPDATE"],"a":2,"e":"SELECT retrieves data.","s":"bank","k":106,"w":["INSERT adds rows.","DELETE removes rows.","","UPDATE changes rows."]},{"id":"b15-57","u":15,"q":"Which of the following best improves usability in a database user interface?","o":["Using technical table names only","Providing consistent layouts and data validation controls","Removing all form labels so the screens look simpler and cleaner","Allowing direct access to raw tables"],"a":1,"e":"Consistent layouts and validation controls improve usability.","s":"bank","k":102,"w":["Technical names confuse users.","","Labels help users.","Raw tables are risky."]},{"id":"b15-58","u":15,"q":"Which component of a DBMS ensures that multiple users can access the database simultaneously without conflict?","o":["Data Definition Language","Concurrency control","Schema mapping","Data redundancy"],"a":1,"e":"Concurrency control lets many users work without conflicts.","s":"bank","k":102,"w":["DDL defines structure.","","Schema mapping links levels.","Redundancy is duplication."]},{"id":"b15-59","u":15,"q":"In a database, which process ensures that stored information is accurate, complete, and consistent?","o":["Data migration","Data normalization","Data validation","Data encryption"],"a":2,"e":"Validation checks data is accurate, complete and consistent.","s":"bank","k":102,"w":["Migration moves data.","Normalisation reduces redundancy.","","Encryption hides data."]},{"id":"b15-60","u":15,"q":"What is a major disadvantage of using a flat-file database?","o":["It is too complex to design","It supports only object storage","It causes data redundancy and inconsistency","It supports too many relationships between its tables"],"a":2,"e":"Flat files cause redundancy and inconsistency.","s":"bank","k":103,"w":["Flat files are simple.","Flat files store records, not objects.","","Flat files have no relationships."]},{"id":"b15-61","u":15,"q":"In a hierarchical database, how can a child record be accessed?","o":["Only through its parent record","Independently of any parent record","Through SQL queries","Through relational joins"],"a":0,"e":"In a tree you reach a child only through its parent.","s":"bank","k":103,"w":["","Children depend on parents.","SQL is relational.","Joins are relational."]},{"id":"b15-62","u":15,"q":"In object-oriented databases, inheritance allows:","o":["Tables to be linked through foreign keys","Objects to reuse another object's properties","Data to be stored as a parent-child tree","The database to remove redundant indexes"],"a":1,"e":"Inheritance lets objects reuse properties and methods of others.","s":"bank","k":103,"w":["Foreign keys are relational.","","Trees are hierarchical.","Indexes are unrelated."]},{"id":"b16-1","u":16,"q":"Which layer in a multi-layer application contains the rules and calculations that define how data can be created, stored, and changed?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Database Layer"],"a":1,"e":"The business logic layer holds the rules and calculations.","s":"bank","k":107,"w":["The UI layer displays data and collects input.","","The data-access layer reads and writes the database.","The database stores data; the rules live in the logic layer."]},{"id":"b16-2","u":16,"q":"What is the main function of the Data-Access Layer in a multi-layer application?","o":["Displaying data to the user","Collecting and checking user input","Reading and writing database data","Applying the business rules"],"a":2,"e":"The data-access layer reads from and writes to the database.","s":"bank","k":107,"w":["Displaying data is the UI layer.","Collecting input is the UI layer.","","Business rules are the logic layer."]},{"id":"b16-3","u":16,"q":"In a three-tier architecture, which layer is responsible for presenting information and collecting user input?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Network Layer"],"a":2,"e":"The UI (presentation) layer shows information and collects input.","s":"bank","k":107,"w":["The logic layer applies rules.","The data-access layer talks to the database.","","The network layer is part of OSI, not app tiers."]},{"id":"b16-4","u":16,"q":"A company updates its discount calculation rules in the system. Which layer should the developer modify?","o":["User Interface Layer","Data-Access Layer","Business Logic Layer","Database Layer"],"a":2,"e":"Discount rules are business rules, so the business logic layer changes.","s":"bank","k":107,"w":["The UI only displays results.","Data access only reads and writes.","","The database stores data; rules are in logic."]},{"id":"b16-5","u":16,"q":"If two users enter the same product code but get different price results due to location-based tax rules, which layer ensures this rule is applied correctly?","o":["User Interface Layer","Business Logic Layer","Database Layer","Network Layer"],"a":1,"e":"Location-based tax rules live in the business logic layer.","s":"bank","k":107,"w":["The UI only displays results.","","The database stores data.","The network layer moves packets."]},{"id":"b16-6","u":16,"q":"A developer wants to reduce direct SQL queries in the application code. Which layer should handle the database read and write operations?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Application Layer"],"a":2,"e":"SQL reads/writes belong in the data-access layer.","s":"bank","k":107,"w":["The UI should not contain SQL.","Logic should call data access, not run SQL.","","\"Application layer\" is not one of the three tiers."]},{"id":"b16-7","u":16,"q":"If the database structure changes (e.g., column renamed), which layer’s code is most likely to require modification?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Web Server Layer"],"a":1,"e":"A renamed column affects the code that queries the database: the data-access layer.","s":"bank","k":107,"w":["Logic works with objects, not column names.","","The UI shows data, not SQL.","The web server is infrastructure."]},{"id":"b16-8","u":16,"q":"A new dashboard screen is added to display student attendance. Which layer of the multi-layer application is primarily affected?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Server Layer"],"a":2,"e":"A new screen is a presentation change, so the user interface layer is affected.","s":"bank","k":107,"w":["Logic is unchanged by a new screen.","Data access is unchanged by a new screen.","","\"Server layer\" is not one of the tiers."]},{"id":"b16-9","u":16,"q":"Which of the following best describes a database?","o":["A software used to create web pages","A structured collection of related data stored electronically","A document that lists all of a business's transactions for the year","A file used to design application interfaces"],"a":1,"e":"A database is a structured, electronically stored collection of related data.","s":"bank","k":108,"w":["Web page software is an editor.","","A transaction list is a document.","Interface design files are not databases."]},{"id":"b16-10","u":16,"q":"A school management system stores student details, courses, and attendance records. Which database concept ensures relationships among these entities?","o":["File structure","Relational model","Object hierarchy","Flat-file storage"],"a":1,"e":"The relational model links entities through keys.","s":"bank","k":108,"w":["File structure is too general.","","Object hierarchy is OO.","Flat files have no relationships."]},{"id":"b16-11","u":16,"q":"What makes an XML database different from a traditional relational database?","o":["It stores data only in tables of rows and columns","It stores data as hierarchical XML elements","It can only be queried with SQL","It cannot be used by web applications"],"a":1,"e":"XML databases store hierarchical elements and attributes.","s":"bank","k":108,"w":["Rows and columns are relational.","","XML databases use XQuery or XPath.","XML suits web applications."]},{"id":"b16-12","u":16,"q":"You are exporting student records in XML format for web use. Which feature of XML databases ensures that data can be easily shared between different systems?","o":["Binary format","Platform independence","SQL-only compatibility","Visual table design"],"a":1,"e":"XML is plain text and platform-independent, so any system can read it.","s":"bank","k":108,"w":["XML is text, not binary.","","XML is not SQL-only.","XML is not about visual design."]},{"id":"b16-13","u":16,"q":"An XML database is ideal for:","o":["Data in fixed columns of numbers only","Large image and video files","Nested data such as organisation charts","Transaction logs and nothing else"],"a":2,"e":"XML's tree structure suits nested data such as org charts.","s":"bank","k":108,"w":["Fixed numeric columns suit relational tables.","Large media suits file storage.","","Logs are only one use."]},{"id":"b16-14","u":16,"q":"What is the main purpose of ODBC in application development?","o":["To define the visual layout of a web page","To give one standard way to connect to many DBMSs","To design the XML schema files for an app","To encrypt the passwords stored in a database"],"a":1,"e":"ODBC is a standard interface for connecting apps to many DBMSs.","s":"bank","k":108,"w":["Layout is HTML and CSS.","","Schemas are XSD.","Encryption is security."]},{"id":"b16-15","u":16,"q":"A developer connects a Java application to both MySQL and SQL Server without rewriting database logic. This is possible because of:","o":["XML Schema","JDBC","ODBC","SQL Syntax"],"a":1,"e":"Java applications use JDBC (Java Database Connectivity) to switch between databases through drivers.","s":"bank","k":109,"w":["XML Schema validates XML.","","ODBC is the general standard; Java uses JDBC.","SQL syntax differs between DBMSs."]},{"id":"b16-16","u":16,"q":"Which scenario best demonstrates the advantage of ODBC?","o":["The application works only with one type of database.","The same application connects to multiple database systems through a common driver","The database connection is limited to local networks only.","The application bypasses the database completely and keeps all data in memory instead."],"a":1,"e":"ODBC: one app, many databases, through a common driver.","s":"bank","k":109,"w":["One database only is the opposite.","","Network scope is unrelated.","Bypassing the database is not ODBC."]},{"id":"b16-17","u":16,"q":"In a multi-layer application, which layer handles business rules, validations, and decision-making processes?","o":["User Interface Layer","Data Access Layer","Business Logic Layer","Presentation Layer"],"a":2,"e":"Business rules, validation and decisions = business logic layer.","s":"bank","k":107,"w":["The UI shows and collects data.","Data access reads and writes.","","Presentation is the UI."]},{"id":"b16-18","u":16,"q":"You are developing an online bookstore app. Which layer would include forms and buttons for customer interaction?","o":["Data Access Layer","Business Logic Layer","User Interface Layer","Middleware Layer"],"a":2,"e":"Forms and buttons are in the UI layer.","s":"bank","k":107,"w":["Data access reads the database.","Logic applies rules.","","Middleware connects systems."]},{"id":"b16-19","u":16,"q":"An XML Database is most useful when:","o":["Data is highly structured and tabular","Data is hierarchical or document-based","Only numeric data must be stored","A flat file format is required"],"a":1,"e":"XML databases suit hierarchical, flexible, document-style data.","s":"bank","k":108,"w":["Tabular data suits relational.","","Numeric-only data suits tables.","Flat files are simpler."]},{"id":"b16-20","u":16,"q":"Which query language is commonly used to retrieve data from XML databases?","o":["SQL","XQuery","C#","HTML"],"a":1,"e":"XQuery queries XML databases.","s":"bank","k":108,"w":["SQL is for relational databases.","","C# is a programming language.","HTML is markup."]},{"id":"b16-21","u":16,"q":"Identify the child element in the XML snippet: \u003cstudent>\u003cname>Ali\u003c/name>\u003cid>1001\u003c/id>\u003c/student>","o":["\u003cstudent>","\u003cname> and \u003cid>","\u003cid> only","The entire document"],"a":1,"e":"\u003cname> and \u003cid> are children of \u003cstudent>.","s":"bank","k":110,"w":["\u003cstudent> is the parent.","","\u003cname> is also a child.","The document is the whole file."]},{"id":"b16-22","u":16,"q":"Which rule below is required for well-formed XML syntax?","o":["All tags must be uppercase","Tags must have matching open and close","Attributes don’t need quotes","Multiple root elements are allowed in a document"],"a":1,"e":"Every opening tag needs a matching closing tag.","s":"bank","k":111,"w":["XML is case-sensitive, not uppercase-only.","","Attributes must be quoted.","Only one root is allowed."]},{"id":"b16-23","u":16,"q":"Which XML validation method supports data types and namespaces?","o":["DTD","JSON","XSD (XML Schema)","TXT"],"a":2,"e":"XSD supports data types and namespaces; DTD does not.","s":"bank","k":112,"w":["DTD has no data types.","JSON is a different format.","","TXT is plain text."]},{"id":"b16-24","u":16,"q":"In XSLT, which tag is used to loop through XML elements during transformation?","o":["\u003cxsl:value-of>","\u003cxsl:for-each>","\u003cxsl:apply-templates>","\u003cxsl:select>"],"a":1,"e":"\u003cxsl:for-each> loops over selected nodes.","s":"bank","k":113,"w":["value-of outputs a value.","","apply-templates applies templates.","xsl:select is not an element."]},{"id":"b16-25","u":16,"q":"A company uses an XML-based product catalog and wants to display it on their website. Which technology should they use to transform XML data into an HTML page?","o":["XSD Schema","ODBC","XSLT","PHP"],"a":2,"e":"XSLT transforms XML into HTML.","s":"bank","k":113,"w":["XSD validates.","ODBC connects to databases.","","PHP is server scripting."]},{"id":"b16-26","u":16,"q":"You are building an XSLT stylesheet that converts XML data into an HTML table. What is the first step?","o":["Write the SQL schema for the data","Create the XML and link it to the XSLT file","Add the CSS rules directly inside the XML document","Save the XML document as a PDF file"],"a":1,"e":"Create the XML document and link it to the XSLT stylesheet.","s":"bank","k":113,"w":["SQL is not needed.","","CSS does not go inside XML here.","PDF is unrelated."]},{"id":"b16-27","u":16,"q":"A trainee is developing a hospital management app. The system must check that a patient cannot be registered twice using the same ID. Which layer should enforce this rule?","o":["User Interface Layer","Data-Access Layer","Business Logic Layer","Network Layer"],"a":2,"e":"Checking for duplicate patient IDs is a business rule.","s":"bank","k":107,"w":["The UI only collects input.","Data access only stores.","","The network layer moves packets."]},{"id":"b16-28","u":16,"q":"What is a key advantage of using multi-layer architecture in application design?","o":["It merges logic and data access into one layer.","It reduces modularity.","It separates concerns for easier maintenance.","It hides user input from the database."],"a":2,"e":"Layers separate concerns, making maintenance easier.","s":"bank","k":107,"w":["Merging layers is the opposite.","Layers increase modularity.","","Layers do not hide input."]},{"id":"b16-29","u":16,"q":"In a multi-layer system, which layer communicates directly with the database to perform CRUD operations?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Presentation Layer"],"a":2,"e":"The data-access layer runs CRUD against the database.","s":"bank","k":107,"w":["The UI should not run SQL.","Logic calls data access.","","Presentation is the UI."]},{"id":"b16-30","u":16,"q":"A company needs to store nested data such as \u003cdepartment>\u003cemployee>\u003cname>Ali\u003c/name>\u003c/employee>\u003c/department>. Which data format is most suitable?","o":["CSV","XML","JSON only","Flat-file"],"a":1,"e":"XML represents nested data naturally.","s":"bank","w":["CSV is flat.","","JSON can nest, but the question shows XML.","Flat files cannot nest."]},{"id":"b16-31","u":16,"q":"Which XSLT tag is used to extract values from XML elements?","o":["\u003cxsl:for-each>","\u003cxsl:value-of>","\u003cxsl:apply-templates>","\u003cxsl:output>"],"a":1,"e":"\u003cxsl:value-of> outputs the value of a selected node.","s":"bank","k":113,"w":["for-each loops.","","apply-templates applies templates.","output sets the format."]},{"id":"b16-32","u":16,"q":"The college needs a portable format to store teacher and student data and later display it on the web. Which is most suitable?","o":["JSON","XML","HTML","CSV"],"a":1,"e":"XML is portable and can be transformed for the web.","s":"bank","w":["JSON is possible, but XML is the course answer.","","HTML is for display.","CSV is flat."]},{"id":"b16-33","u":16,"q":"You’re drafting the data file for the site. Which element must appear only once in each XML file?","o":["Child element","Root element","Attribute","Processing instruction"],"a":1,"e":"An XML document has exactly one root element.","s":"bank","k":110,"w":["Children can repeat.","","Attributes can repeat across elements.","Processing instructions can repeat."]},{"id":"b16-34","u":16,"q":"During testing, an XML file fails to load because a closing tag is missing. What is the issue?","o":["The XML is not well-formed","The XML is invalid but well-formed","The schema is incorrect","The namespace is missing"],"a":0,"e":"A missing closing tag means the XML is not well-formed.","s":"bank","k":111,"w":["","Invalid means it breaks the schema, not a missing tag.","The schema is not the issue.","Namespaces are optional."]},{"id":"b16-35","u":16,"q":"Management wants to enforce a strict structure for \u003cTeacher> and \u003cStudent> entries before publishing. What should you use?","o":["CSS file","XML Schema (XSD) or DTD","MySQL trigger","JavaScript validator"],"a":1,"e":"An XSD or DTD enforces structure.","s":"bank","k":112,"w":["CSS styles.","","Triggers run in the database.","JavaScript is not the standard enforcement."]},{"id":"b16-36","u":16,"q":"You add this line to College.xml: \u003c?xml-stylesheet type=\"text/xsl\" href=\"style.xsl\"?>. What is the purpose?","o":["Minify the XML","Apply an XSLT transformation","Validate with XSD","Declare the XML version used by the file"],"a":1,"e":"This processing instruction links an XSLT stylesheet to the XML.","s":"bank","k":113,"w":["It does not minify.","","XSD is linked differently.","The \u003c?xml version?> line declares the version."]},{"id":"b16-37","u":16,"q":"To render XML teacher data as an HTML table on the Information page, which file do you create?","o":["XSLT file","JSON file","CSV file","PHP include only"],"a":0,"e":"An XSLT file turns XML into an HTML table.","s":"bank","k":113,"w":["","JSON is a data format.","CSV is flat data.","PHP alone does not transform XML."]},{"id":"b16-38","u":16,"q":"Your XML has \u003cTeachers> containing many \u003cTeacher> entries. What is \u003cTeachers>?","o":["An attribute","A parent element","A rootless node","A namespace"],"a":1,"e":"\u003cTeachers> contains \u003cTeacher> elements, so it is their parent.","s":"bank","k":110,"w":["Attributes are inside tags.","","\"Rootless node\" is not an XML term.","Namespaces qualify names."]},{"id":"b16-39","u":16,"q":"The Information page must fetch teacher rows from the database and present them in HTML. Which connector helps apps talk to DBs regardless of vendor?","o":["XSLT","ODBC","CSS","XPath"],"a":1,"e":"ODBC connects apps to databases regardless of vendor.","s":"bank","k":108,"w":["XSLT transforms XML.","","CSS styles.","XPath selects XML nodes."]},{"id":"b16-40","u":16,"q":"On dropdown change (Teacher/Student), you load the matching XML fragment and display it. Which technique handles selection and DOM update?","o":["CSS only","JavaScript + XML DOM","W3C HTML validator","SQL VIEW"],"a":1,"e":"JavaScript reads the XML DOM and updates the page.","s":"bank","k":112,"w":["CSS cannot load data.","","A validator checks code.","A SQL view is in the database."]},{"id":"b16-41","u":16,"q":"The validator reports 'type mismatch: student_id should be integer'. What does this indicate?","o":["Parsing warning only","Schema validation error","CSS cascade issue","Successful validation"],"a":1,"e":"A data-type mismatch is a schema validation error.","s":"bank","k":112,"w":["It is an error, not a warning.","","CSS is unrelated.","It failed."]},{"id":"b16-42","u":16,"q":"Which XSLT element declares you want HTML output in the transformation?","o":["\u003cxsl:template match=\"/\">","\u003cxsl:for-each select=\"*\">","\u003cxsl:output method=\"html\"/>","\u003cxsl:value-of select=\".\"/>"],"a":2,"e":"\u003cxsl:output method=\"html\"/> declares HTML output.","s":"bank","k":113,"w":["template match=\"/\" starts the transform.","for-each loops.","","value-of outputs a value."]},{"id":"b16-43","u":16,"q":"A teammate opens an element with \u003cStudent> and closes it with \u003c/student>. What is the result?","o":["XML merges them automatically","Still valid because names are similar","Not well-formed due to case sensitivity","Becomes JSON"],"a":2,"e":"XML is case-sensitive, so \u003cStudent> and \u003c/student> do not match and the document is not well-formed.","s":"bank","k":111,"w":["XML never merges tags.","Names must match exactly.","","XML does not become JSON."]},{"id":"b16-44","u":16,"q":"You need to iterate through all \u003cTeacher> nodes to print names in XSLT. Which construct is correct?","o":["\u003cxsl:if test=\"Teacher\">","\u003cxsl:choose select=\"Teacher\">","\u003cxsl:for-each select=\"Teacher\">","\u003cxsl:when test=\"Teacher\">"],"a":2,"e":"\u003cxsl:for-each select=\"Teacher\"> loops through each Teacher.","s":"bank","k":113,"w":["xsl:if tests once.","xsl:choose has no select.","","xsl:when is inside choose."]},{"id":"b16-45","u":16,"q":"The web form should not only read data but also add and edit rows in the DB. Which operation set is required?","o":["SELECT only","DELETE only","CRUD operations","No DB writes allowed"],"a":2,"e":"Read, add and edit = CRUD (Create, Read, Update, Delete).","s":"bank","w":["SELECT only reads.","DELETE only removes.","","Writes are needed."]},{"id":"b16-46","u":16,"q":"You run an XML validator to ensure the document follows the schema rules. What process is this?","o":["Parsing","Styling","Validation","Compilation"],"a":2,"e":"Checking against schema rules is validation.","s":"bank","k":112,"w":["Parsing reads the file.","Styling is presentation.","","Compilation is for code."]},{"id":"b16-47","u":16,"q":"To consume XML data in a JavaScript widget on the Home page, you first convert it to a JS-friendly representation. Which format?","o":["CSV","JSON","TXT","XSD"],"a":1,"e":"JSON is native to JavaScript.","s":"bank","k":112,"w":["CSV is flat.","","TXT has no structure.","XSD is a schema."]},{"id":"b16-48","u":16,"q":"In \u003cTeacher email=\"t.salem@college.edu\">, what is 'email'?","o":["Element","Attribute","Namespace","Text node only"],"a":1,"e":"email=\"...\" inside the tag is an attribute.","s":"bank","w":["An element is a tag.","","A namespace qualifies names.","Text nodes are content."]},{"id":"b16-49","u":16,"q":"You want to present the same XML data as a list on mobile and a table on desktop without changing the XML. Which tech enables this?","o":["XSD","XSLT","DTD","SQL"],"a":1,"e":"Different XSLT stylesheets can present the same XML in different ways.","s":"bank","k":112,"w":["XSD validates.","","DTD validates.","SQL queries databases."]},{"id":"b16-50","u":16,"q":"The browser fails to transform XML because there is no \u003cxsl:template match=\"/\"> in the XSLT. Why does this break?","o":["The XML file can no longer be validated by the browser","The transform has no starting template","The XSD overrides the XSL file","CSS rendering is disabled"],"a":1,"e":"Without a root-matching template, the transform has nowhere to start.","s":"bank","k":112,"w":["Validation is separate.","","XSD does not override XSL.","CSS is unrelated."]},{"id":"b16-51","u":16,"q":"Your app needs to connect to the college DB, run a SELECT, and display results in an HTML table. What must be configured first?","o":["A connection string and driver (e.g. ODBC)","CSS variables for the results table","An external JSON schema that describes the results data","A DTD DOCTYPE declaration"],"a":0,"e":"Configure the connection string/driver (e.g. ODBC) before querying.","s":"bank","k":109,"w":["","CSS is styling.","A JSON schema is unrelated.","DTD is for XML."]},{"id":"b16-52","u":16,"q":"You are developing a banking application. When a user transfers money, the system must check if they have sufficient funds before deducting the amount and updating both account balances. In a multi-layer architecture, where should the \"sufficient funds\" check be implemented?","o":["User Interface (UI) Layer","Data-Access Layer","Business Logic Layer","Database Layer"],"a":2,"e":"'Sufficient funds' is a business rule for the business logic layer.","s":"bank","k":107,"w":["The UI only displays.","Data access only reads and writes.","","The database stores data."]},{"id":"b16-53","u":16,"q":"In a multi-layer application for a hospital, patient records are fetched from a central database and displayed on a screen. Which layer is responsible for executing the SQL SELECT query to retrieve this data?","o":["Presentation Layer","Business Logic Layer","Data-Access Layer","User Interface Layer"],"a":2,"e":"The data-access layer runs the SQL SELECT.","s":"bank","k":107,"w":["Presentation displays.","Logic applies rules.","","The UI displays."]},{"id":"b16-54","u":16,"q":"Your team is designing a food delivery app. The \"Apply Discount\" function uses a complex rule: \"If the user is a premium member AND the order is over $30, apply a 15% discount.\" A junior developer places this rule in the script for the checkout button on the webpage. What is the main architectural problem with this?","o":["It makes the app run faster for premium users","It keeps the interface separate from the rules","It ties the business rule to the interface","It guarantees the discount is always applied"],"a":2,"e":"Putting rules in UI code couples them to the interface; they can't be reused or changed easily.","s":"bank","w":["Speed is not the problem.","It mixes them, not separates them.","","Client code can be bypassed."]},{"id":"b16-55","u":16,"q":"You are designing a system for a logistics company that must integrate with several partners. These partners exchange data using standardized, but complex, XML message formats (e.g., for shipping manifests). The system needs to store and query these entire message structures efficiently. Which technology is the best fit?","o":["A relational database, the most common choice","An XML database, which stores XML natively","A plain file system, because XML is text","An ODBC connection, to standardise access"],"a":1,"e":"Native XML databases store and query hierarchical XML efficiently.","s":"bank","k":108,"w":["Relational needs complex mapping for XML.","","A file system is hard to query.","ODBC is a connection, not storage."]},{"id":"b16-56","u":16,"q":"An analyst needs to create a weekly sales report by pulling data from both a MySQL database and a separate Microsoft Access database into a single Excel spreadsheet. What technology allows Excel to uniformly access data from these two different database systems?","o":["SQL","XML","ODBC","XQuery"],"a":2,"e":"ODBC lets Excel reach both MySQL and Access uniformly.","s":"bank","k":108,"w":["SQL is the query language, not the connector.","XML is a format.","","XQuery is for XML."]},{"id":"b16-57","u":16,"q":"A developer is using a Native XML Database to store customer records. They need to write a query to find all customers named \"John\" who live in \"London\". The data is stored in a hierarchical format. Which query language is most appropriate for this task?","o":["SQL","XPath or XQuery","ODBC","CRUD"],"a":1,"e":"XPath/XQuery query hierarchical XML data.","s":"bank","k":108,"w":["SQL is relational.","","ODBC is a connector.","CRUD is a set of operations."]},{"id":"b16-58","u":16,"q":"You are given an XML file that fails to open in a web browser. The error message says \"invalid markup.\" What is the most likely cause of this error?","o":["The data stored inside the XML is factually wrong or out of date","The XML is not well-formed (e.g. a missing tag)","The XML has no DTD or XSD linked to it","The file is too large for the browser"],"a":1,"e":"'Invalid markup' usually means the XML is not well-formed.","s":"bank","k":111,"w":["Wrong data does not cause markup errors.","","A missing schema does not stop opening.","Size is not the usual cause."]},{"id":"b16-59","u":16,"q":"In an XML document representing a company's departments, which of the following snippets correctly shows the structure where a \u003cdepartment> contains an \u003cemployee> who has a \u003cname>?","o":["\u003cdepartment>\u003cname>John\u003c/name>\u003cemployee>\u003c/employee>\u003c/department>","\u003cdepartment>\u003cemployee>\u003cname>John\u003c/name>\u003c/employee>\u003c/department>","\u003cemployee>\u003cdepartment>\u003cname>John\u003c/name>\u003c/department>\u003c/employee>","\u003cname>John\u003c/name>\u003cemployee>\u003c/employee>\u003cdepartment>\u003c/department>"],"a":1,"e":"department → employee → name, each properly nested.","s":"bank","w":["Name should be inside employee.","","Employee and department are reversed.","These elements are side by side, not nested."]},{"id":"b16-60","u":16,"q":"An XML document is being used to exchange invoice data between two business systems. System B requires that every \u003cinvoice> element must contain a \u003cdate> and a \u003ctotal> element, and that \u003ctotal> must be a positive number. How can System B automatically enforce these rules when it receives the XML data?","o":["View the XML in a browser with a CSS file","Validate it against an XSD with these rules","Transform the XML using an XSLT stylesheet","Store the XML in a relational database"],"a":1,"e":"An XSD defines required elements and data rules for automatic validation.","s":"bank","k":112,"w":["CSS only styles.","","XSLT transforms; it does not enforce rules.","Storing is not validation."]},{"id":"b16-61","u":16,"q":"You have an XML file containing raw book data (\u003ctitle>, \u003cauthor>, \u003cisbn>). You need to convert this XML into a clean HTML table for a website. Which technology is specifically designed for this kind of transformation?","o":["CSS","ODBC","XSLT","DTD"],"a":2,"e":"XSLT is designed to transform XML into HTML.","s":"bank","k":113,"w":["CSS styles.","ODBC connects.","","DTD validates."]},{"id":"b16-62","u":16,"q":"A developer creates an XML Schema (XSD) that defines an \u003cage> element as being of type xs:integer with a minimum value of 0. They then validate an XML file against this schema. The file contains the value \"twenty\" for the \u003cage> element. What is the outcome of the validation?","o":["It passes because \"twenty\" is a valid representation of an integer.","It fails because \"twenty\" is a string, not an integer, violating the data type defined in the XSD.","It passes, because an XSD only checks that the element exists, not the type of its content.","It fails because the value is not greater than 0."],"a":1,"e":"'twenty' is not an xs:integer, so validation fails.","s":"bank","k":112,"w":["Words are not integers.","","XSD checks types.","The type error comes first; it is not about the minimum."]},{"id":"b17-1","u":17,"q":"What does features and capabilities of hardware and software mainly refer to?","o":["The brand name of the product","What it can do and how well","The price of the product","Its colour and visual design"],"a":1,"e":"Features and capabilities = what the product can do and how well it performs.","s":"bank","k":114,"w":["The brand is a name, not a capability.","","Price is cost, not capability.","Colour is appearance, not capability."]},{"id":"b17-2","u":17,"q":"Which is an example of a software capability?","o":["Keyboard layout","File processing speed","Monitor size","Cable type"],"a":1,"e":"Processing speed is something software does; the others are physical hardware traits.","s":"bank","k":114,"w":["Keyboard layout is a hardware feature.","","Monitor size is a hardware feature.","Cable type is a hardware feature."]},{"id":"b17-3","u":17,"q":"What does “supported by an organization” mean?","o":["Approved and maintained by IT","Personally owned tools brought from home","Free online software","Outdated systems"],"a":0,"e":"Supported = approved, licensed and maintained by the organisation's IT team.","s":"bank","k":115,"w":["","Personal tools are not supported by IT.","Free online software may not be approved.","Outdated systems are usually unsupported."]},{"id":"b17-4","u":17,"q":"What is information technology terminology?","o":["Informal everyday language","Words used in marketing","Technical terms used in IT","Legal contract vocabulary"],"a":2,"e":"IT terminology is the technical vocabulary of the field.","s":"bank","k":116,"w":["Everyday language is not technical.","Marketing language is not technical terminology.","","Legal vocabulary is a different field."]},{"id":"b17-5","u":17,"q":"Which is the most reliable source of technical information?","o":["Online advertisements","Comments posted on social media","Official vendor documentation","Personal opinions"],"a":2,"e":"Official vendor documentation is the most authoritative source.","s":"bank","k":117,"w":["Adverts are biased.","Social media comments are unverified.","","Opinions are unreliable."]},{"id":"b17-6","u":17,"q":"What is the main purpose of a slideshow?","o":["Storing data","Presenting information visually","Managing files","Controlling and monitoring a network"],"a":1,"e":"A slideshow presents information visually.","s":"bank","k":118,"w":["Storing data is a database's job.","","File management is the OS's job.","Network control is a network tool's job."]},{"id":"b17-7","u":17,"q":"What is the main role of documentation?","o":["User guidance","Marketing","System monitoring","Data storage"],"a":0,"e":"Documentation guides users in using the system.","s":"bank","k":117,"w":["","Marketing uses brochures.","Monitoring uses tools.","Storage is a database's job."]},{"id":"b17-8","u":17,"q":"What does personalization allow users to change?","o":["Hardware structure","Security policies","User settings","System architecture"],"a":2,"e":"Personalisation lets users change their own settings.","s":"bank","k":120,"w":["Hardware is not changed by personalising.","Security policies are set by IT.","","Architecture is designed by IT."]},{"id":"b17-9","u":17,"q":"What is on-site instruction?","o":["Remote support given by a voice phone call","Support through online chat","Face-to-face help at the user's location","Support by email"],"a":2,"e":"On-site = face-to-face at the user's location.","s":"bank","k":121,"w":["Phone help is telephone instruction.","Chat is remote support.","","Email is remote support."]},{"id":"b17-10","u":17,"q":"What is telephone instruction?","o":["Written support","Face-to-face training","Remote support by phone","On-site assistance"],"a":2,"e":"Telephone instruction = remote support by phone.","s":"bank","k":121,"w":["Written support is documentation.","Face-to-face is on-site.","","On-site is in person."]},{"id":"b17-11","u":17,"q":"Which tool is primarily used to design and present slides in one-to-one instruction sessions?","o":["Google Docs","Microsoft PowerPoint","Excel","Paint"],"a":1,"e":"PowerPoint is presentation (slide) software.","s":"bank","k":118,"w":["Google Docs is for documents.","","Excel is for spreadsheets.","Paint is for images."]},{"id":"b17-12","u":17,"q":"Which term refers to a step-by-step guide or live demonstration used to explain a process during training?","o":["Knowledge Base","Walkthrough","User Account","Release Notes"],"a":1,"e":"A walkthrough is a step-by-step guide or live demonstration.","s":"bank","k":119,"w":["A knowledge base is searchable articles.","","A user account is a login.","Release notes describe changes."]},{"id":"b17-13","u":17,"q":"What is a Learning Management System (LMS) used for in training?","o":["Designing new hardware components for the company","Delivering and tracking training","Recording audio lessons only","Creating operating systems"],"a":1,"e":"An LMS delivers, tracks and manages training.","s":"bank","k":116,"w":["Hardware design is engineering.","","An LMS does much more than audio.","Operating systems are system software."]},{"id":"b17-14","u":17,"q":"Which term describes a searchable collection of help articles or guides used during instruction?","o":["Job Aid","Knowledge Base","Hotline","Transition"],"a":1,"e":"A knowledge base is a searchable collection of help articles.","s":"bank","k":119,"w":["A job aid is a quick reference sheet.","","A hotline is phone support.","A transition is a slide effect."]},{"id":"b17-15","u":17,"q":"What is the main purpose of a Job Aid in one-to-one training?","o":["To replace user manuals completely","To give quick-reference help during tasks","To record every training session","To manage users' accounts and passwords"],"a":1,"e":"A job aid is a quick-reference tool (cheat sheet, checklist) used while doing the task.","s":"bank","k":119,"w":["Job aids support manuals; they do not replace them.","","Recording is session recording.","Account management is IT admin."]},{"id":"b17-16","u":17,"q":"Which source of technical information is best for step-by-step guidance and explaining button functions and menus?","o":["Online forums and user communities on the web","User manuals and product documentation","Release notes","Telephone support"],"a":1,"e":"User manuals explain menus, buttons and procedures step by step.","s":"bank","k":117,"w":["Forums vary in accuracy.","","Release notes describe changes.","Phone support is not step-by-step reference."]},{"id":"b17-17","u":17,"q":"Which source is best for quick answers to common user problems and up-to-date information on software changes?","o":["Online knowledge bases","Printed manuals only","Internal HR forms","Mind maps"],"a":0,"e":"Online knowledge bases are quick to search and kept up to date.","s":"bank","k":117,"w":["","Printed manuals can be out of date.","HR forms are unrelated.","Mind maps are planning tools."]},{"id":"b17-18","u":17,"q":"Training videos and tutorials are especially useful for which type of learners?","o":["Learners who prefer to read printed content only, with no visuals","learners who benefit from step-by-step demonstrations","Learners who avoid multimedia","Learners who never repeat content"],"a":1,"e":"Videos suit learners who benefit from seeing each step demonstrated.","s":"bank","w":["Videos are visual.","","Videos are multimedia.","Videos can be replayed."]},{"id":"b17-19","u":17,"q":"Which source of technical information is created by IT staff to cover company-specific processes and policies?","o":["Online user forums","Standard operating procedures (SOPs)","The vendor's public frequently asked questions page","Posts on social media"],"a":1,"e":"SOPs document company-specific processes and policies.","s":"bank","k":117,"w":["Forums are public.","","Vendor FAQs are generic.","Social media is informal."]},{"id":"b17-20","u":17,"q":"What does the term “Access Rights / Permissions” refer to in IT instruction?","o":["The layout of the training slides","What a user can see or do on a system","The speed of the network connection","The order of topics in the course"],"a":1,"e":"Access rights control what a user can see or do.","s":"bank","k":118,"w":["Slide layout is design.","","Speed is the network.","Topic order is the course plan."]},{"id":"b17-21","u":17,"q":"What is a key capability of presentation software?","o":["Managing servers","Installing drivers","Creating slides","Controlling networks"],"a":2,"e":"Presentation software creates and displays slides.","s":"bank","k":118,"w":["Managing servers is admin work.","Drivers are installed by the OS.","","Network control is admin work."]},{"id":"b17-22","u":17,"q":"Why is using correct IT terminology important?","o":["To sound more professional","To shorten the training","For clear communication","To replace written guides"],"a":2,"e":"Correct terminology makes technical communication clear.","s":"bank","k":114,"w":["Sounding professional is secondary.","Training length is unrelated.","","Guides are still needed."]},{"id":"b17-23","u":17,"q":"What is the purpose of a user manual?","o":["To advertise the product","To explain how to use it","To store the system's data","To install the hardware"],"a":1,"e":"A user manual explains how to use a system.","s":"bank","k":117,"w":["Advertising is marketing.","","Storing data is a database.","Installation has its own guide."]},{"id":"b17-24","u":17,"q":"Which feature improves clarity in slideshows?","o":["Long text paragraphs","Small fonts","Visuals and bullet points","Hidden content"],"a":2,"e":"Visuals and bullet points make slides clear.","s":"bank","k":114,"w":["Long paragraphs are hard to read.","Small fonts are hard to read.","","Hidden content confuses."]},{"id":"b17-25","u":17,"q":"Which document helps users fix common problems?","o":["User manual","Contract","Invoice","Advertisement"],"a":0,"e":"User manuals usually include troubleshooting sections.","s":"bank","k":117,"w":["","A contract is legal.","An invoice is financial.","An advert is marketing."]},{"id":"b17-26","u":17,"q":"Which is an example of personalization?","o":["Installing more RAM","Changing language settings","Replacing a faulty hard drive","Formatting a disk"],"a":1,"e":"Changing language settings is personalisation.","s":"bank","k":120,"w":["Adding RAM is a hardware upgrade.","","Replacing a drive is repair.","Formatting is maintenance."]},{"id":"b17-27","u":17,"q":"When is on-site instruction most appropriate?","o":["Simple questions","Complex hardware issues","Password resets","Software updates"],"a":1,"e":"Complex hardware problems need someone physically present.","s":"bank","k":116,"w":["Simple questions suit phone or chat.","","Password resets suit phone or self-service.","Updates can be done remotely."]},{"id":"b17-28","u":17,"q":"What is a disadvantage of on-site instruction?","o":["Immediate support","Higher cost and time","Clear communication","Personal assistance"],"a":1,"e":"On-site visits cost more time and money (travel).","s":"bank","k":121,"w":["Immediate support is an advantage.","","Clear communication is an advantage.","Personal help is an advantage."]},{"id":"b17-29","u":17,"q":"Which skill is important for telephone support staff?","o":["Physical strength","Clear communication","Graphic design","Programming only"],"a":1,"e":"Phone support depends on clear verbal communication.","s":"bank","k":121,"w":["Strength is not needed.","","Design is unrelated.","Programming is not the key skill."]},{"id":"b17-30","u":17,"q":"What is an advantage of telephone instruction?","o":["Requires travel","Fast remote help","High cost","Physical setup"],"a":1,"e":"Phone help is fast and needs no travel.","s":"bank","k":121,"w":["Phone help needs no travel.","","Phone help is cheaper.","No physical set-up is needed."]},{"id":"b17-31","u":17,"q":"Which item is considered hardware?","o":["Antivirus program","Operating system","Word processor","Printer"],"a":3,"e":"A printer is physical hardware; the others are software.","s":"bank","k":116,"w":["Antivirus is software.","An OS is software.","A word processor is software.",""]},{"id":"b17-32","u":17,"q":"Where can users find updated software instructions?","o":["Posters","Old textbooks","Vendor websites","Email signatures"],"a":2,"e":"Vendor websites carry the latest instructions.","s":"bank","w":["Posters are not updated.","Old textbooks are out of date.","","Signatures hold contact details."]},{"id":"b17-33","u":17,"q":"Which element is commonly used in slideshows?","o":["Databases","Firewalls","Slides","Servers"],"a":2,"e":"Slideshows are made of slides.","s":"bank","k":118,"w":["Databases store data.","Firewalls protect networks.","","Servers host services."]},{"id":"b17-34","u":17,"q":"Why are manuals important for new users?","o":["They replace hardware","They explain system use","They slow learning","They increase cost"],"a":1,"e":"Manuals explain how to use the system.","s":"bank","k":114,"w":["Manuals do not replace hardware.","","Manuals speed learning.","Manuals are not about cost."]},{"id":"b17-35","u":17,"q":"Who usually provides on-site instruction?","o":["End users","IT technicians","Customers","Managers"],"a":1,"e":"IT technicians usually provide on-site instruction.","s":"bank","k":121,"w":["End users receive help.","","Customers receive help.","Managers rarely give instruction."]},{"id":"b17-37","u":17,"q":"What is the primary purpose of a walkthrough in an instructional context?","o":["To track user progress and completion rates.","To provide a step-by-step guide or live demonstration of a process.","To create a personalized user profile with specific permissions.","To capture and document errors in a software system."],"a":1,"e":"A walkthrough demonstrates a process step by step.","s":"bank","k":119,"w":["Tracking is an LMS's job.","","Profiles are account management.","Capturing errors is logging."]},{"id":"b17-38","u":17,"q":"The action of adjusting software settings to better suit a specific user's preferences or requirements is called?","o":["Troubleshooting","Customization","Session Recording","Walkthrough"],"a":1,"e":"Adjusting settings for a user is customisation.","s":"bank","w":["Troubleshooting fixes problems.","","Recording captures sessions.","A walkthrough demonstrates."]},{"id":"b17-39","u":17,"q":"Moodle and Google Classroom are common examples of what?","o":["Knowledge base platforms for help articles","Help Desk Systems","Remote Support tools","Learning Management Systems (LMS)"],"a":3,"e":"Moodle and Google Classroom are LMSs.","s":"bank","k":114,"w":["Knowledge bases hold articles.","Help desks handle tickets.","Remote tools control PCs.",""]},{"id":"b17-40","u":17,"q":"Which tool allows an IT trainer to take control of a learner's computer to assist them from another location?","o":["Knowledge Base","Learning Management System (LMS)","Remote Support","Session Recording"],"a":2,"e":"Remote support tools let the trainer control the learner's PC from elsewhere.","s":"bank","k":114,"w":["A knowledge base holds articles.","An LMS delivers courses.","","Recording captures sessions."]},{"id":"b17-41","u":17,"q":"Which software is most likely supported by an organization?","o":["IT-approved office software","Trial versions of games and media apps","Users' personal apps","Unlicensed tools"],"a":0,"e":"IT-approved office software is supported by the organisation.","s":"bank","k":115,"w":["","Trial games are not supported.","Personal apps are not supported.","Unlicensed tools are not allowed."]},{"id":"b17-42","u":17,"q":"Why do organizations limit supported software?","o":["To reduce users' skills","For security and compatibility","To increase licence costs","To make the computers run more slowly"],"a":1,"e":"Limiting software improves security and compatibility.","s":"bank","k":114,"w":["Limiting software does not aim to reduce skills.","","Limiting software usually lowers licence costs.","Limiting software does not slow computers."]},{"id":"b17-43","u":17,"q":"Which term refers to physical computer components?","o":["Software","Firmware","Data","Hardware"],"a":3,"e":"Hardware = physical components.","s":"bank","k":116,"w":["Software is programs.","Firmware is low-level software.","Data is information.",""]},{"id":"b17-44","u":17,"q":"What does the term “operating system” mean?","o":["A type of hardware component","A type of security threat","Software that manages resources","A manual for using a computer"],"a":2,"e":"An operating system manages hardware and software resources.","s":"bank","k":116,"w":["The OS is software, not hardware.","The OS is not a threat.","","A manual is documentation."]},{"id":"b17-45","u":17,"q":"Why is access to technical information important?","o":["To increase system errors","To delay work","To support problem solving","To remove training"],"a":2,"e":"Technical information helps solve problems.","s":"bank","k":114,"w":["It reduces errors.","It speeds work.","","Training is still needed."]},{"id":"b17-46","u":17,"q":"Which software type is used to create slideshows?","o":["Antivirus software","Presentation software","Accounting software","Database software"],"a":1,"e":"Presentation software creates slideshows.","s":"bank","k":118,"w":["Antivirus protects systems.","","Accounting software handles finances.","Database software stores data."]},{"id":"b17-47","u":17,"q":"When should documentation be provided?","o":["Only after errors have been reported","Only to experts","With the product or system","At the end of the year"],"a":2,"e":"Documentation should come with the product or system.","s":"bank","k":117,"w":["After errors is too late; users need it from the start.","All users need it.","","The end of the year is too late."]},{"id":"b17-48","u":17,"q":"Why is personalization useful?","o":["It improves user experience","It reduces the system's performance","It limits access","It removes features"],"a":0,"e":"Personalisation improves the user experience.","s":"bank","k":120,"w":["","It does not reduce performance.","It does not limit access.","It does not remove features."]},{"id":"b17-49","u":17,"q":"Personalization mainly focuses on:","o":["Network speed","Organizational rules","User preferences","Hardware limits"],"a":2,"e":"Personalisation is about user preferences.","s":"bank","k":120,"w":["Network speed is infrastructure.","Rules are policy.","","Hardware limits are physical."]},{"id":"b17-50","u":17,"q":"Telephone instruction is most suitable for:","o":["Physical repairs","Simple troubleshooting","Hardware installation","Network wiring"],"a":1,"e":"Phone instruction suits simple troubleshooting.","s":"bank","k":121,"w":["Repairs need hands-on work.","","Installation needs hands-on work.","Wiring needs hands-on work."]},{"id":"b17-51","u":17,"q":"Why should animations be used sparingly in instructional presentations?","o":["They increase file size only","They are incompatible with most hardware","They can distract from learning objectives","They reduce collaboration features"],"a":2,"e":"Too many animations distract from the learning objective.","s":"bank","k":118,"w":["File size is not the main issue.","Most hardware supports animation.","","Collaboration is unrelated."]},{"id":"b17-52","u":17,"q":"Which option BEST differentiates documentation from training delivery?","o":["Documentation is always given verbally","Documentation supports learning before, during and after","Training removes the need for any manuals or written guides","Documentation is only for advanced users"],"a":1,"e":"Documentation supports learners before, during and after training.","s":"bank","k":117,"w":["Documentation is usually written.","","Manuals are still needed.","Documentation is for all users."]},{"id":"b17-53","u":17,"q":"Which feature of a slideshow helps guide the audience through key points clearly?","o":["Long paragraphs","Visual hierarchy","Small font size","Excessive animations"],"a":1,"e":"Visual hierarchy guides the audience through key points.","s":"bank","k":118,"w":["Long paragraphs lose the audience.","","Small fonts are hard to read.","Too many animations distract."]},{"id":"b17-54","u":17,"q":"What is the main purpose of using large fonts and clear titles in slides?","o":["To fill the slide","To improve readability","To add decoration","To save preparation time"],"a":1,"e":"Large fonts and clear titles improve readability.","s":"bank","k":118,"w":["Filling slides is not the aim.","","Decoration is not the aim.","Time saving is not the aim."]},{"id":"b17-55","u":17,"q":"Which document is MOST useful for quickly learning basic software functions?","o":["Release notes","Licensing agreement","Quick-start guide","Marketing brochure"],"a":2,"e":"Quick-start guides cover the basics fast.","s":"bank","k":119,"w":["Release notes list changes.","Licences are legal terms.","","Brochures sell."]},{"id":"b17-56","u":17,"q":"What does personalization in instruction mainly involve?","o":["Using the same content for everyone","Adapting content to learner needs","Reducing interaction","Avoiding learner feedback"],"a":1,"e":"Personalised instruction adapts content to the learner.","s":"bank","k":120,"w":["Same content for all is not personal.","","Interaction should increase.","Feedback is essential."]},{"id":"b17-57","u":17,"q":"Which approach BEST supports personalized instruction?","o":["Following a fixed script","Ignoring learner background","Asking learners about their goals","Delivering content as fast as possible"],"a":2,"e":"Ask learners about their goals, then tailor the session.","s":"bank","k":114,"w":["A fixed script cannot adapt.","Background matters.","","Speed does not personalise."]},{"id":"b17-58","u":17,"q":"What is a key advantage of on-site instruction?","o":["No preparation required","Ability to provide hands-on guidance","It works without any equipment or software","Suitable only for experts"],"a":1,"e":"On-site instruction allows hands-on guidance.","s":"bank","k":121,"w":["Preparation is still needed.","","Equipment is still needed.","It suits beginners too."]},{"id":"s1","u":1,"q":"What is an example of a Software Development Life Cycle model?","o":["Sequence.","Spiral.","Capability maturity.","SD model."],"a":1,"e":"Spiral is an SDLC model (others: Waterfall, V-model, Agile, Iterative). Capability Maturity is a process-maturity framework, not an SDLC model.","s":"sample","n":1,"k":5,"w":["Sequence is a control structure in programming, not a lifecycle model.","","Capability Maturity (CMM/CMMI) rates how mature a process is; it is not an SDLC model.","\"SD model\" is not a recognised SDLC model."]},{"id":"s2","u":1,"q":"Which one of the following is a way of expressing algorithms in software development?","o":["Flowcharts.","HTML.","Interpreter charts.","Control charts."],"a":0,"e":"Algorithms are expressed with flowcharts or pseudocode. HTML is markup.","s":"sample","n":2,"k":6,"w":["","HTML is a markup language for web pages; it does not express algorithms.","\"Interpreter charts\" are not a recognised way to show algorithms.","Control charts are a quality-control tool for monitoring a process."]},{"id":"s3","u":1,"q":"What is a feature of Structured Programming?","o":["Write code.","Sequence.","Basic code.","Basic loops."],"a":1,"e":"Structured programming is built on three control structures: sequence, selection and iteration.","s":"sample","n":3,"k":8,"w":["Writing code happens in every style of programming; it is not a feature of structured programming.","","\"Basic code\" is not a structured-programming concept.","Loops (iteration) are one structure, but \"basic loops\" is not the recognised feature; sequence is."]},{"id":"s4","u":1,"q":"What is the main purpose of a user interface?","o":["To interact with a system.","To gather software requirements.","To populate a database.","To test a software programme."],"a":0,"e":"A UI is how people interact with a system.","s":"sample","n":4,"w":["","Requirements are gathered by analysts, through interviews and questionnaires, not through the UI.","Databases are filled by programs or imports; that is not the UI's main purpose.","Testing is done by testers and tools; the UI is what users interact with."]},{"id":"s5","u":1,"q":"What best describes a principle of event driven programming?","o":["Events allow separate tasks to communicate.","An event class is a model of a user interface event.","Events do not allow separate tasks to communicate.","A mechanism that decides what should happen if an event occurs."],"a":3,"e":"Event-driven programs use handlers/listeners: a mechanism that decides what happens when an event occurs.","s":"sample","n":5,"k":11,"w":["This is about inter-task messaging, not the core principle of event-driven programming.","An event class models data about an event; it is not the principle of how events are handled.","This is simply false and not a principle of event-driven programming.",""]},{"id":"s6","u":2,"q":"What is the most important reason for modeling of requirements?","o":["To ensure consistency of process.","To communicate development needs.","To give a diagrammatic representation.","To identify how software functions."],"a":1,"e":"Models exist mainly to communicate needs clearly between stakeholders and developers.","s":"sample","n":6,"w":["Consistency of process comes from standards, not the main reason for modelling.","","Diagrams are the means, not the reason; the reason is communication.","How software functions is detailed later in design; models first communicate needs."]},{"id":"s7","u":2,"q":"Which one of the following is a type of modeling?","o":["UML.","W3C.","PCP.","HCI."],"a":0,"e":"UML (Unified Modeling Language) is a modelling notation. W3C is a standards body; HCI is a discipline.","s":"sample","n":7,"k":12,"w":["","W3C is the body that sets web standards, not a modelling notation.","PCP is not a software modelling type.","HCI (human–computer interaction) is a field of study, not a modelling language."]},{"id":"s8","u":2,"q":"What ensures that a software development product is fit for purpose?","o":["Return on investment (ROI).","Quality assurance practices.","Cost-benefit analysis.","Benchmarking across the industry."],"a":1,"e":"Quality assurance practices check the product meets requirements, i.e. is fit for purpose.","s":"sample","n":8,"k":14,"w":["ROI measures financial return, not fitness for purpose.","","Cost-benefit analysis decides whether a project is worth doing.","Benchmarking compares performance with others; it does not ensure fitness for purpose."]},{"id":"s9","u":2,"q":"What is an example of a change management practice?","o":["Verifying that the code meets the user requirements.","Submitting a control assessment form to management.","Submitting a request to meet new user requirements.","Verifying that management have signed off the budget."],"a":2,"e":"Change management starts with a formal change request for new requirements.","s":"sample","n":9,"k":16,"w":["Verifying code against requirements is testing (QA).","\"Control assessment form\" is not the change management practice.","","Budget sign-off is financial approval, not change management."]},{"id":"s10","u":2,"q":"Which one of the following shows hardware and software events in the software development process?","o":["FTA.","ERD.","DFD.","UML."],"a":0,"e":"Fault Tree Analysis (FTA) models combinations of hardware and software events that lead to failures.","s":"sample","n":10,"k":18,"w":["","An ERD shows database entities and relationships.","A DFD shows how data flows between processes.","UML models software design; FTA is the method for hardware and software failure events."]},{"id":"s11","u":3,"q":"What is an example of Software Metrics in software development?","o":["Performance metrics.","Function point analysis.","Risk factor analysis.","Routing."],"a":1,"e":"Function point analysis measures software size by functionality, a classic software metric.","s":"sample","n":11,"k":20,"w":["\"Performance metrics\" is a general category; the named software-metric technique here is function point analysis.","","Risk factor analysis assesses project risks, not software size or quality.","Routing is how network traffic is directed."]},{"id":"s12","u":3,"q":"Which one of the following is a standard business requirement?","o":["Non-functional requirements.","Technical requirements.","Transitional requirements.","Definitive requirements."],"a":1,"e":"The Unit 3 book lists several types of business requirement: functional, non-functional, technical, business process, user and regulatory. The official sample paper's answer is technical requirements, so choose that in the exam.","s":"sample","n":12,"k":24,"w":["The Unit 3 book lists non-functional requirements as a type too, but the official sample paper's answer is technical requirements.","","Transitional requirements cover moving from the old system to the new one.","\"Definitive requirements\" is not a recognised category."]},{"id":"s13","u":4,"q":"What is the main purpose of debugging a program?","o":["To design a test plan.","To remove errors.","To evaluate test results.","To document the code."],"a":1,"e":"Debugging finds and removes errors (bugs).","s":"sample","n":13,"k":29,"w":["Designing a test plan is test planning, done before debugging.","","Evaluating results is part of testing; debugging fixes what testing finds.","Documenting code is documentation, not debugging."]},{"id":"s14","u":4,"q":"Which of the following test methods is used in prototyping?","o":["Static.","White box.","Alpha.","Dynamic."],"a":1,"e":"The official sample paper links prototyping with white-box testing: developers test the prototype's internal code and logic as they build it.","s":"sample","n":14,"k":31,"w":["Static testing reviews code without running it; this course links prototyping with white-box testing.","","Alpha testing is done in-house on a near-complete product.","Dynamic testing is a broad category; the course answer is white-box."]},{"id":"s15","u":4,"q":"Which of the following tests the functionality of a Graphical User Interface?","o":["Verification.","Application.","Validation.","Usability."],"a":3,"e":"Usability testing checks how well users can operate the GUI.","s":"sample","n":15,"k":33,"w":["Verification checks the product is built to its specification.","\"Application\" is not a type of test.","Validation checks overall requirements; usability testing is the GUI-specific test.",""]},{"id":"s16","u":4,"q":"What is the correct term for testing applications?","o":["Validation.","Accountability.","Usability.","Performance."],"a":0,"e":"Validation confirms the application does what users need.","s":"sample","n":16,"k":33,"w":["","Accountability is not a testing term.","Usability is one aspect; validation is the general term for testing applications.","Performance testing checks speed only."]},{"id":"s17","u":5,"q":"Which of the following improves the usability of technical documentation?","o":["Templates.","Indexes.","Styles.","Forms."],"a":1,"e":"An index helps readers find information quickly.","s":"sample","n":17,"k":34,"w":["Templates give a consistent layout to the writer, but do not help readers find information.","","Styles keep formatting consistent; they do not help readers find topics.","Forms collect information; they do not improve navigation."]},{"id":"s18","u":5,"q":"Which of the following improves readability of technical documentation?","o":["Clear and concise language.","Problems and their solutions included.","Tested and worked instructions.","Accurately defined technical terms."],"a":0,"e":"Readability depends on clear, concise language.","s":"sample","n":18,"k":37,"w":["","Problems and solutions add content, but readability depends on how clearly it is written.","Tested instructions improve accuracy, not readability.","Defined terms help accuracy; clear, concise language is what makes text readable."]},{"id":"s19","u":5,"q":"Which of the following documents form part of continuous service improvement?","o":["Requirements specification.","User manual.","System maintenance manual.","Quality assurance policy."],"a":2,"e":"The system maintenance manual supports ongoing service improvement.","s":"sample","n":19,"k":35,"w":["The requirements specification is written at the start of a project.","The user manual explains everyday use, not service improvement.","","A QA policy states quality aims; it is not a maintenance document."]},{"id":"s20","u":5,"q":"Which is the best way to get user feedback on technical documentation?","o":["Online satisfaction survey.","Structured interviews.","Design workshop.","Accessibility testing."],"a":1,"e":"Structured interviews give detailed, comparable feedback.","s":"sample","n":20,"k":39,"w":["Online surveys reach many people but give less detail.","","A design workshop plans new work rather than reviewing a document.","Accessibility testing checks access for people with disabilities, not general feedback."]},{"id":"s21","u":6,"q":"Which of the following is an internal quality metric for user interfaces?","o":["Integrity.","Accuracy.","Usability.","Reusability."],"a":2,"e":"Usability is the key internal quality metric for a UI.","s":"sample","n":21,"k":46,"w":["Integrity is a data or security quality.","Accuracy is a data quality.","","Reusability is a code quality."]},{"id":"s22","u":6,"q":"What is the main purpose of the World Wide Web Consortium's WAI initiative?","o":["To improve web accessibility for people with disabilities.","To improve web content accessibility guidelines.","To improve authoring tools accessibility guidelines.","To improve web protocols and formats."],"a":0,"e":"WAI's overall goal is accessibility for people with disabilities; WCAG and ATAG are its outputs.","s":"sample","n":22,"k":43,"w":["","WCAG is one output of WAI; the aim is accessibility overall.","ATAG is one output of WAI.","Protocols and formats are a narrower area."]},{"id":"s23","u":6,"q":"Which of the following best describes usability testing for user interfaces?","o":["Market research evaluation.","Qualitative evaluation.","Heuristic evaluation.","Cognitive evaluation."],"a":2,"e":"Heuristic evaluation checks the UI against usability principles.","s":"sample","n":23,"k":42,"w":["Market research studies customers, not the UI.","Qualitative evaluation is a general category.","","Cognitive evaluation is a different method."]},{"id":"s24","u":6,"q":"What is the purpose of using text equivalent for non-text elements on a web page?","o":["To improve design.","To improve accessibility.","To improve testability.","To improve consistency."],"a":1,"e":"Text equivalents (alt text) make non-text content accessible.","s":"sample","n":24,"k":44,"w":["Design is not the main aim.","","Testability is not the aim.","Consistency is not the aim."]},{"id":"s25","u":6,"q":"Which of the following is a basic principle of user interface design?","o":["Consistency.","Mapping.","Verification.","Editing."],"a":0,"e":"Consistency is a core UI design principle.","s":"sample","n":25,"k":40,"w":["","Mapping is a concept, but consistency is the basic principle here.","Verification is testing.","Editing is a task."]},{"id":"s26","u":6,"q":"Which of the following is the most practical way to design and develop graphical user interfaces?","o":["Using modeling techniques.","Using user experience testing.","Using textual description.","Using prototyping."],"a":3,"e":"Prototyping lets you build, test and refine a GUI quickly.","s":"sample","n":26,"k":48,"w":["Modelling is part of design, but prototyping is most practical.","UX testing evaluates, it does not build.","Text descriptions are hard to judge.",""]},{"id":"s27","u":7,"q":"Java is an example of which type of programming language?","o":["Machine code.","Event driven.","Object-oriented.","Procedural."],"a":2,"e":"Java is object-oriented: classes, objects, inheritance, polymorphism.","s":"sample","n":27,"k":49,"w":["Java is compiled to bytecode, not written in machine code.","Java can handle events, but its language type is object-oriented.","","Procedural languages, like C, are built on procedures, not classes and objects."]},{"id":"s28","u":7,"q":"Which of the following can be used to describe the Java programming language?","o":["It is a scripting language.","It is a natural language.","It uses dynamic typing.","It is Class-based."],"a":3,"e":"Java is class-based and statically typed.","s":"sample","n":28,"k":49,"w":["Java is a compiled, general-purpose language, not a scripting language.","Natural languages are human languages such as English.","Java is statically typed: types are fixed when you declare variables.",""]},{"id":"s29","u":8,"q":"Which one of the following is a Java programming tool?","o":["Spreadsheet.","Compiler.","Website.","Database."],"a":1,"e":"The Java compiler (javac) turns source code into bytecode.","s":"sample","n":29,"k":56,"w":["A spreadsheet is an office application, not a Java programming tool.","","A website is something you build, not a programming tool.","A database stores data; it is not a Java programming tool."]},{"id":"s30","u":8,"q":"Which one of the following is usually included in standard libraries of software programs?","o":["Class definitions.","Interpreter definitions.","Book definitions.","Query definitions."],"a":0,"e":"Standard libraries provide ready-made class definitions (e.g. java.util).","s":"sample","n":30,"k":57,"w":["","Interpreters are tools, not library contents.","Books are not part of software libraries.","Queries are written by programmers; they are not standard library contents."]},{"id":"s31","u":9,"q":"Which one of the following types of websites is open to the general public?","o":["Intranet.","Online catalogue.","Extranet.","Virtual Learning Environment."],"a":1,"e":"Online catalogues are public; intranets/extranets/VLEs need login.","s":"sample","n":31,"k":62,"w":["An intranet is for staff only.","","An extranet is for invited partners only.","A VLE needs a learner login."]},{"id":"s32","u":9,"q":"Which one of the following types of websites is mainly used for internal business communications?","o":["Intranets.","Libraries.","Online banking.","Online shopping."],"a":0,"e":"Intranets serve internal communication.","s":"sample","n":32,"k":63,"w":["","Libraries hold resources for many users, not internal business communication.","Online banking serves customers.","Online shopping serves customers."]},{"id":"s33","u":9,"q":"Which one of the following gives access to the Internet?","o":["ISP.","URL.","W3C.","WWW."],"a":0,"e":"An Internet Service Provider gives access to the Internet.","s":"sample","n":33,"k":65,"w":["","A URL is an address.","W3C sets web standards.","The WWW is content on the internet, not access to it."]},{"id":"s34","u":9,"q":"Which one of the following is not a type of server?","o":["Blog.","Mail.","Proxy.","Web."],"a":0,"e":"A blog is a type of website, not a server.","s":"sample","n":34,"k":68,"w":["","A mail server is a server type.","A proxy server is a server type.","A web server is a server type."]},{"id":"s35","u":9,"q":"Which one of the following is used to design webpages on a website?","o":["Action buttons.","Tables.","Hyperlinks.","Wireframes."],"a":3,"e":"Wireframes are the design blueprint of a page.","s":"sample","n":35,"k":70,"w":["Action buttons are page elements.","Tables are page elements.","Hyperlinks are page elements.",""]},{"id":"s36","u":9,"q":"Which one of the following is used to create webpages on a website?","o":["Action buttons.","HTML.","Hyperlinks.","Tables."],"a":1,"e":"HTML is the language used to create web pages.","s":"sample","n":36,"k":70,"w":["Buttons are elements created with HTML.","","Hyperlinks are elements created with HTML.","Tables are elements created with HTML."]},{"id":"s37","u":9,"q":"Which one of the following is most important for website usability?","o":["Colors and fonts.","Navigation.","Download speeds.","Static images."],"a":1,"e":"Clear navigation is the most important usability factor.","s":"sample","n":37,"k":71,"w":["Colours help, but navigation matters more.","","Speed helps, but navigation matters more.","Static images do not drive usability."]},{"id":"s38","u":10,"q":"Which HTML and HTML 5 tags are used when creating tables?","o":["\u003cH1> \u003c/H1>","\u003cOL> \u003c/OL>","\u003cP> \u003c/P>","\u003cTR> \u003c/TR>"],"a":3,"e":"\u003ctr> defines a table row.","s":"sample","n":38,"k":72,"w":["\u003cH1> is a heading.","\u003cOL> is an ordered list.","\u003cP> is a paragraph.",""]},{"id":"s39","u":10,"q":"Which one of the following is used to transport and store data?","o":["CSS.","HTML.","XML.","XHTML."],"a":2,"e":"XML is designed to transport and store data; HTML displays it.","s":"sample","n":39,"k":74,"w":["CSS styles pages.","HTML displays content.","","XHTML is for web pages."]},{"id":"s40","u":10,"q":"What is the main function of a browser?","o":["To design web pages.","To set standards.","To display web pages.","To classify documents."],"a":2,"e":"Browsers retrieve and display web pages.","s":"sample","n":40,"k":77,"w":["Pages are designed in editors.","Standards are set by W3C.","","Browsers do not classify documents."]},{"id":"s41","u":10,"q":"Which of the following is a W3C standard?","o":["RTF.","DOC.","HTML.","PDF."],"a":2,"e":"HTML is a W3C standard.","s":"sample","n":41,"k":79,"w":["RTF is a Microsoft document format.","DOC is a Word format.","","PDF is an Adobe (ISO) format."]},{"id":"s42","u":12,"q":"Which social networking site allows its users to write and send text messages with a limit of 140 characters?","o":["Facebook.","LinkedIn.","Pinterest.","Twitter."],"a":3,"e":"Twitter's original limit was 140 characters (now 280).","s":"sample","n":42,"k":82,"w":["Facebook has no 140-character limit.","LinkedIn has no 140-character limit.","Pinterest is for images.",""]},{"id":"s43","u":12,"q":"Which of the following is an important guideline when using social networks?","o":["Keep personal data secure.","Share all information freely.","Upload large images separately.","Follow all suggested links."],"a":0,"e":"Protect personal data on social networks.","s":"sample","n":43,"k":83,"w":["","Sharing everything risks privacy.","Image size is not a guideline.","Clicking all links is risky."]},{"id":"s44","u":13,"q":"What is JavaScript used for?","o":["To control the pages on a website.","To make the website more static.","To make web pages more dynamic.","To send web pages to the server."],"a":2,"e":"JavaScript makes pages dynamic and interactive.","s":"sample","n":44,"k":88,"w":["Pages are controlled by HTML and the server.","JavaScript makes pages less static.","","Browsers request pages from servers."]},{"id":"s45","u":13,"q":"Which session type needs to save information about the session history in order to communicate?","o":["Cookies.","Stateful.","Stateless.","Telnet."],"a":1,"e":"Stateful sessions keep history/state between requests.","s":"sample","n":45,"k":91,"w":["Cookies are a mechanism, not a session type.","","Stateless keeps no history.","Telnet is a remote-access protocol."]},{"id":"s46","u":14,"q":"Which of the following is a function of the firewall?","o":["Prevents the computer from over-heating.","Protects information from being misused.","Protects from viruses attached to email messages.","Prevents hackers accessing a computer."],"a":3,"e":"Firewalls block unauthorised network access (hackers). Email viruses are antivirus territory.","s":"sample","n":46,"k":92,"w":["Firewalls do not control temperature.","Misuse is a policy matter.","Email viruses are handled by antivirus.",""]},{"id":"s47","u":14,"q":"Which one of the following is designed to damage or disrupt a system?","o":["Malware.","Cookies.","Anti-virus.","Spyware."],"a":0,"e":"Malware is any software designed to damage or disrupt; spyware specifically spies.","s":"sample","n":47,"k":96,"w":["","Cookies store data.","Antivirus protects.","Spyware spies; malware is the general damaging type."]},{"id":"s48","u":14,"q":"Which of the following standards allows cable television operators to offer secure access to the internet?","o":["PCIDSS.","DOCSIS.","DNSSEC.","IEE 802.11."],"a":1,"e":"DOCSIS (Data Over Cable Service Interface Specification) is the cable-broadband standard. PCI DSS = card payments; DNSSEC = DNS; 802.11 = Wi-Fi.","s":"sample","n":48,"k":98,"w":["PCI DSS is for card payments.","","DNSSEC secures DNS.","802.11 is Wi-Fi."]},{"id":"s49","u":15,"q":"Which of the following is a part of a database management system?","o":["XML.","SQL.","UML.","CSS."],"a":1,"e":"SQL is the language a DBMS uses to define and manipulate data.","s":"sample","n":49,"k":102,"
