const FACTS = [["Generation 1: machine code, binary 0s and 1s, run directly by the CPU.","Generation 2: assembly language, mnemonics such as ADD and MOV, converted by an assembler.","Generation 3: high-level languages (FORTRAN 1957, COBOL, C, Java 1995) that need a compiler or interpreter.","Generation 4: problem-oriented languages such as SQL that say what to do, not how."],["Machine language: binary the processor runs directly. Fastest, hardest for people.","Assembly language: low-level mnemonics; one instruction per machine operation; needs an assembler.","High-level language: human-readable (Java, Python, C#); portable; needs a compiler or interpreter.","Lower level = closer to the hardware; higher level = closer to human language."],["Editor: where you write and change source code (Notepad, or the editor inside an IDE).","Compiler: translates the whole program before it runs (javac makes bytecode).","Interpreter: translates and runs one line at a time.","An IDE (Eclipse, NetBeans) combines editor, compiler and debugger."],["Class = blueprint; object = instance of a class.","Encapsulation: data kept private, reached through methods.","Inheritance: a new class reuses an existing one (class Dog extends Animal).","Polymorphism: one method name behaves differently for different objects.","Abstraction: show only the essential features, hide the complexity."],["Database programming = writing programs that store, retrieve and manage data.","Main language: SQL (SELECT, INSERT, UPDATE, DELETE).","Applications connect to databases through drivers such as ODBC or JDBC."],["SDLC phases: planning, requirements (analysis), design, implementation (coding), testing, deployment, maintenance.","Waterfall: one phase after another; suits fixed requirements.","Spiral: repeated cycles of planning, risk analysis, engineering, evaluation.","V-model: each development stage has a matching test stage.","Agile: short iterations (sprints) with frequent customer feedback."],["Algorithm = step-by-step instructions to solve a problem.","Flowchart: a diagram of an algorithm. Oval = start/end, rectangle = process, diamond = decision, parallelogram = input/output.","Pseudocode: an informal, plain-English description of an algorithm, not tied to any language.","UML: a standard modelling language for designing and visualising systems."],["Spaghetti code: tangled, unstructured code (often many GOTOs); hard to read and maintain.","Structured programming uses clear structures: sequence, selection (branches), iteration (loops).","Modular programming splits code into subroutines (modules); it is a type of structured programming."],["Sequence: statements run one after another, in order.","Branch (selection): IF/ELSE or switch chooses a path.","Loop (iteration): for, while and do-while repeat code. do-while always runs at least once."],["Variable: a named storage location whose value can change.","Expression: values and operators that give a result (a + b, x > 10).","Java types: int (whole numbers), double/float (decimals), char (one character), boolean (true/false), String (text), byte/short/long.","Data structures: array (fixed, same type, indexed), list, record, set (unordered, no duplicates)."],["Sorting arranges data in order: ascending (A→Z, 1→9) or descending.","Bubble sort repeatedly swaps neighbouring items that are in the wrong order.","Other sorts: selection, insertion, merge, quick sort.","Sorted data is faster to search (e.g. binary search)."],["User interface (UI): the part users interact with (buttons, forms, menus).","Event: a user action such as a click, key press or mouse move.","Event handler (listener / trigger function): the code that runs when its event occurs.","Event-driven programs wait for events instead of running top to bottom."],["Activity diagram: workflow of a process; UML's equivalent of a flowchart or DFD.","Class diagram: classes, attributes, methods and relationships.","Use-case diagram: actors (stick figures) and their goals with the system.","Sequence diagram: messages between objects in time order.","Use-case narrative: written step-by-step description of one use case. Associations are drawn as solid lines."],["Flowcharts show the steps and decisions in a process visually.","Symbols: oval = start/end, rectangle = process, diamond = decision, parallelogram = input/output, arrows = flow.","Used to model requirements and to express algorithms."],["Quality assurance (QA) prevents defects by following good processes and standards.","Key quality characteristic: usability. Others: reliability, efficiency, maintainability, portability.","Process standards define how the software process should be carried out.","Standards: ISO 9000/9001 (quality management), ISO 12207 (software life cycle), CMMI (process maturity)."],["Requirements documents should use a standard template, clear headings and plain language.","A table of contents, numbering and consistent styles help readers find information.","Usable documents are written for their target audience."],["A change request form documents a requested change to the requirements; it usually starts with the customer.","Process: request → impact analysis (cost, time, scope) → approval by a change control board → implement → update documents → review.","Configuration/version control tracks every change.","A configuration management plan protects the quality of the delivered system."],["Magnitude = how severe the impact would be.","Likelihood = how probable the risk is.","Risk level = likelihood × magnitude.","Plan responses for high-likelihood, high-impact risks first."],["Fault tree analysis (FTA): top-down, starts from a failure and shows the combinations of hardware and software events that cause it. It is a risk-factor analysis technique.","Event tree: starts from one initiating event and branches forward; each branch is a possible outcome or pathway (success or failure)."],["QA aims to make sure the system meets its intended aim (is fit for purpose).","Software quality management ensures quality standards and procedures are followed.","ISO 12207 = software life-cycle processes; ISO 9001 = quality management system; ISO/IEC 25010 = software quality model; CMMI = maturity levels."],["Metrics are numbers used to measure software.","Product metrics: lines of code (LOC), cyclomatic complexity (independent paths), code coverage, defect density (defects per KLOC).","Process metrics: lead time, effort variance. Project metrics: cost and schedule variance.","Function point analysis measures size from inputs, outputs, enquiries, files and interfaces."],["Measurement: size or complexity (function points, LOC). Estimation: predicts effort, time and cost.","COCOMO: algorithmic model using LOC or function points.","Analogy estimation compares with similar past projects; expert judgement uses experience.","Estimates support planning and budgeting."],["Software configuration management (SCM) controls versions and changes.","Version management is the most important SCM activity (tools: Git, SVN).","Activities: identification, change control (via a change control board), status accounting, auditing, build and release.","CASE = Computer-Aided Software Engineering tools."],["Industry-accepted software is reliable, supported, secure and meets standards.","Examples: Oracle/SQL Server/MySQL (databases), Eclipse/Visual Studio (IDEs), Microsoft Office."],["Business requirements state what the system must achieve for the business.","Types (Unit 3 book): functional (what it does), non-functional (speed, security, usability), technical (platform, capacity), business process, user and regulatory/compliance requirements."],["A driver lets the operating system communicate with a hardware device.","Input devices: keyboard, mouse, scanner, sensors. Output devices: monitor, printer, speakers.","If a new device does not work, the driver is usually missing."],["The OS manages hardware, memory, processes, files, devices and security.","Network OS: UNIX, Linux (natively network-aware), Windows Server.","Real-time OS: VxWorks (embedded systems).","Types: multitasking, multiprocessor, multiprogramming, time-sharing, batch."],["A logging framework (e.g. Log4j) writes program messages to a file or console.","Log levels from least to most serious: DEBUG, INFO, WARN, ERROR, FATAL.","Logs show what happened before an error, even in production."],["Tracing tools follow the program's path of execution line by line.","Trace tables are used in dry runs to track variable values and locate logic errors."],["Debuggers pause a program so you can inspect variables.","Breakpoint = stop at a line. Step over = next line. Step into = enter a method. Step out = leave the method.","Debugging = finding and removing errors (bugs)."],["Alpha testing: done in-house (developers/internal users) when the software is first able to run. It comes first in a linear project.","Beta testing: real end users in the real environment, just before commercial release."],["Static testing: check without running the code (reviews, walkthroughs, inspections, static analysis); reviews code against specifications.","Dynamic testing: run the code and check outputs.","White-box: tests internal logic and code paths. The official sample paper links it with prototyping.","Black-box: tests inputs and outputs against requirements without seeing the code; system testing is black-box."],["GUI testing tools check screens, buttons and messages; GUIs are tested mainly for usability.","Load/performance tools (e.g. JMeter) test speed with many users.","Static analysis tools scan source code for problems without running it.","Test coverage = how much of the code the tests exercise (%). Test design = creating test cases from requirements."],["Defect (bug): a mistake in code or design.","Failure: the software does not behave as expected when run; the system is not fit for purpose.","Verification: are we building the product right? (matches the specification)","Validation: are we building the right product? (meets the customer's needs and expectations)"],["Styles (Title, Heading 1) keep formatting consistent.","Templates give new documents consistent styles and layout.","Index: important words with page numbers at the end of the document; improves usability.","Contents, hyperlinks and images help readers navigate and understand."],["Brochure: short promotional document.","Manual: step-by-step guide to use or maintain a product.","Tutorial: a lesson teaching a task step by step.","User guide: helps users install, use and troubleshoot software. It is external documentation (specs and test logs are internal)."],["Printed: paper manuals and guides.","Word (DOC/DOCX): editable, good for writing and collaboration.","PDF: fixed layout on every device; the usual format for distributing user manuals.","Web pages (online help): easy to update; support links and video."],["Readability: clear, concise language, short sentences, headings and white space.","Accessibility: plain language, alt text, good contrast, meaningful links.","Target audience: the main consideration for a technical writer.","User review is the best test of readability."],["Technical documentation covers domains such as systems, networks, hardware and applications.","Developers describe functions, variables and constants in comments within the source code.","A system maintenance manual supports ongoing maintenance and continuous service improvement."],["Surveys: feedback from large numbers of people quickly.","Interviews (structured): detailed feedback.","Workshops: stakeholder meetings that allow discussion.","Focus groups: structured discussion with a small number of key people."],["QA in UI design aims at usability.","ISO 9241 is the standard for usability and human-computer interaction.","Consistency is a key QA standard: familiar patterns increase recognition.","Usability testing is a QA practice for user interfaces."],["Access and equity legislation requires fair access for everyone, including people with disabilities (e.g. the US ADA).","Equity examples: multiple languages, captions, alternative input methods."],["User testing: real, representative users try real tasks.","Heuristic evaluation: experts check the UI against usability principles.","A/B testing compares two versions; iterate until requirements are met."],["W3C (World Wide Web Consortium) sets web standards: HTML, CSS, XML, DOM, SVG, WCAG.","WAI (Web Accessibility Initiative) is the W3C programme for accessibility.","WCAG principles: Perceivable, Operable, Understandable, Robust (POUR)."],["Text equivalents (alt text, captions) for non-text elements so screen readers can read them.","Text must work with text-to-speech for visually impaired users.","Transcripts and captions help people who cannot hear audio."],["Never convey information with colour alone; add text or icons.","Documents must still be readable when style sheets (CSS) are turned off."],["User-centred design: users' needs, testing and feedback drive the design.","Principles: consistency, simplicity, visual hierarchy, guidance not control, clear feedback.","Measures of success: learnability, efficiency, error rate, satisfaction."],["Screen size, resolution, operating system and browser all affect a UI.","Cross-platform development runs the same software on several platforms; GUIs must display correctly on each."],["Wireframe: basic layout of a page (no final graphics).","Storyboard: user journey across screens.","Prototype/mock-up: an interactive or visual model for feedback; prototyping is the most practical way to develop a GUI."],["Java is class-based and object-oriented (Sun Microsystems 1995, now Oracle).","Class = blueprint; object = instance created with new; constructor initialises the object.","Inheritance: class B extends A. Encapsulation: private fields + getters/setters. Polymorphism: overriding/overloading."],["Class libraries (packages) hold reusable classes: java.util (collections), java.io (input/output), java.net (networking), java.sql (databases), java.awt/javax.swing (GUI).","Bring them in with import, e.g. import java.util.ArrayList;"],["javac compiles .java source into machine-independent bytecode (.class).","The Java Virtual Machine (JVM) interprets the bytecode: Write Once, Run Anywhere.","Java must be compiled; JavaScript runs directly in the browser and is a different language.","A source file may hold many classes but only one public class."],["Application: standalone program with a main() method.","Applet: small program that ran inside a browser (obsolete); compiles to bytecode.","Servlet: Java program on a web server that makes dynamic pages; the Java equivalent of PHP or ASP.NET."],["Java branches: if/else, switch. Loops: for, while, do-while (runs at least once).","Algorithms are planned with flowcharts, pseudocode and UML before coding."],["int, double, char, boolean, String. 7 / 2 in Java = 3 (integer division).","Variables must be declared with a type: int age = 20;","Arrays: int[] marks = new int[5]; indexes start at 0."],["GUI components (buttons, text fields) generate events.","Listeners such as ActionListener run code when an event happens.","Connecting UI components to listeners incorporates the UI into code."],["Editor writes the code; compiler (javac) converts it into bytecode; the JVM interprets and runs it.","An IDE (Eclipse, NetBeans) puts all the tools in one application."],["Classes and objects are the building blocks of reusable components.","SDLC: feasibility, requirements, design, implementation, testing, evaluation/maintenance."],["Waterfall: sequential phases.","Agile: iterative sprints with feedback.","RAD: fast prototyping with heavy user involvement.","DevOps: continuous integration and deployment."],["A library is an organised collection of reusable code (classes, functions).","An API (application programming interface) states how components interact.","Components are reused through their defined interfaces; JAR files package Java classes."],["Pattern: reusable solution to a common problem (problem, context, solution, consequences). Families: creational, structural, behavioural.","Framework: a reusable structure for building applications.","Idiom: a coding habit natural to one specific language."],["Repositories (GitHub, GitLab) store, share and version code.","They support version control, collaboration and code reuse."],["Customer-facing sites serve the public: marketing (advertising, benefits most from SEO), online catalogues (e-commerce product browsing), business information (address, contacts, policies)."],["Intranet: private website for an organisation's staff, using Internet Protocol technology.","Information repository: central place where data and documents are stored and maintained.","Training sites: online courses for staff."],["Social sites let users connect, share media and interact from different locations.","Online applications run in the browser (Gmail, Google Docs, e-banking)."],["Internet = the network. World Wide Web = a system of interlinked hypertext documents on it.","HTTP = HyperText Transfer Protocol; HTTPS adds encryption.","URL = Uniform Resource Locator. DNS turns domain names into IP addresses.","A registrar is an accredited company that sells and manages domain names."],["ISP (Internet Service Provider) gives users access to the internet.","Web hosting providers supply server space so sites are reachable online (shared, VPS, cloud, dedicated).","Access speed depends on the connection and server response; faster downloads improve user satisfaction."],["Web 2.0: dynamic sites where users create content and collaborate.","Blogs (a Web 2.0 technology) are online journals of regular posts.","Social media enables sharing and interaction."],["Web server: sends web pages to browsers.","Mail server: sends, receives and stores email (SMTP, IMAP, POP3).","Proxy server: sits between the browser and the internet for security, filtering, caching and privacy."],["Storyboard: user journey across pages.","Wireframe: basic layout/structure of a page.","Styles (CSS) apply consistent fonts, colours and branding.","Logo: the organisation's brand identity."],["HTML/HTML5 builds structure; \u003cnav> holds menu links; \u003c!DOCTYPE html> tells the browser the HTML version.","CSS controls presentation. Frames are now avoided (break bookmarks, SEO, accessibility).","Tables show data; templates give consistent layouts.","Hotspot = clickable area on an image; visited links change colour; action buttons and forms add interaction."],["Know the target audience first.","Usability: clear navigation, fast downloads, appropriate language, optimised images, readable colours and fonts.","Accessibility: alt text, good contrast, keyboard navigation, don't rely on colour alone."],["Headings \u003ch1>–\u003ch6> (\u003ch1> most important). Lists: \u003cul> bullets, \u003col> numbers, \u003cdl> descriptions.","Paragraph \u003cp>. Table: \u003ctable>, \u003ctr> row, \u003cth> header, \u003ctd> data.","Hyperlink: \u003ca href=\"...\">; an in-page jump targets an element id.","Fonts are now set with CSS (font-family, font-size)."],["XHTML = eXtensible HyperText Markup Language: HTML written with XML rules.","Lowercase tags, every tag closed (\u003cbr />), attributes quoted, correctly nested, one root element."],["XML = eXtensible Markup Language: stores and transports data; custom tags.","Case-sensitive; one root element; must be well-formed.","XML data is stored in plain text files."],["CSS = Cascading Style Sheets: controls style and layout.","Inline (style attribute), internal (\u003cstyle>), external (.css file, best for many pages).","Media queries make layouts responsive; inline styles override external ones."],["Separate structure (HTML), presentation (CSS) and behaviour (JavaScript).","JavaScript runs in the browser for interactivity; server-side code (PHP, Java servlets) runs on the server.","Design for usability, accessibility and responsiveness."],["Browsers display web content; features differ between browsers, so test in each.","Polyfills add missing features to older browsers."],["Screen resolution = number of pixels (e.g. 1366 × 768); it determines image quality on screen.","The viewport meta tag makes pages fit mobile screens."],["W3C standards: HTML (structure), CSS (style and layout), DOM, XML, SVG.","Validate pages with the W3C validator for cross-browser compatibility."],["WCAG accessibility guidelines: alt text, contrast, keyboard access.","Information must not be conveyed through colour alone."],["JPEG: photos. PNG: transparency. GIF: simple animation. SVG: vector graphics that scale and support animation.","WOFF/WOFF2: web fonts. PDF: documents."],["Twitter/X: short real-time posts (originally 140 characters), hashtags, retweets.","Facebook: groups, pages, events, live stream, activity feed.","LinkedIn: professional networking, endorsements, jobs.","Pinterest: visual pins on boards. Keep personal data secure; use privacy settings."],["Blogs: regular written posts; comments are handled by moderation.","Podcasts: audio episodes (RSS); first decide the content.","Images and videos raise engagement."],["Network analysis studies connections: nodes (people) and edges (links).","Centrality measures influence; betweenness finds bridges between communities.","Tools: NodeXL, Gephi, LikeAlyzer (Facebook page analysis); added to sites with JavaScript code."],["Social APIs post information from a website to a social network (Share/Tweet buttons, auto-posting) and pull information onto a website (feeds, embedded posts).","OAuth 2.0 secures access; GET reads, POST sends; rate limits cap requests; keep tokens on the server."],["HTML5 structures social widgets with semantic elements; XHTML is strict HTML; XML exchanges data; CSS styles the widgets."],["Server-side scripts run on the web server: PHP (\u003c?php ... ?>), Java servlets (javax.servlet).","They process forms, talk to databases and generate dynamic pages."],["JavaScript is a client-side language that runs in the browser to create interactive effects.","The DOM lets scripts access and change a page's content, structure and style.","AJAX updates part of a page without reloading."],["Cookies are small text files stored by the web browser.","Authentication cookies store login/session tokens; tracking cookies record browsing for ads.","Secure and HttpOnly flags protect cookies."],["Authentication verifies a user's identity (username + password, two-factor codes).","Authorisation decides what the user may access.","Store passwords as hashes, never in plain text."],["Stateless: each request is independent; no record of previous events (HTTP is stateless).","Stateful: the server keeps a record of previous interactions (shopping cart, sessions).","Cookies and sessions add state to stateless HTTP."],["A firewall prevents unauthorised access to or from a private network by filtering traffic.","Types: packet-filtering, stateful inspection, proxy firewalls."],["HTTP servers (Apache, IIS, Nginx) receive browser requests and return pages.","The main job of a web-server OS is to present web content to clients.","Keep the server OS patched and remove unused services."],["SSL (now replaced by TLS) uses public-key cryptography to secure internet traffic.","The handshake agrees on encryption and checks the server's certificate.","HTTPS = HTTP over TLS; the padlock icon means the connection is secure."],["Email authentication lets the recipient trust the sender's identity.","TLS between mail servers encrypts messages in transit (transport layer).","S/MIME encrypts and digitally signs email. Confidentiality = only authorised people can read it."],["Malware damages, disrupts or steals.","Macro virus: infects Word and Excel files. Logic bomb: triggers when conditions are met.","Worm spreads by itself; Trojan pretends to be useful; spyware spies; ransomware encrypts files for payment."],["Denial of service (DoS): flooding a network or server so legitimate users can't get through.","DDoS uses many computers (a botnet). It attacks availability."],["DOCSIS (Data Over Cable Service Interface Specification) lets cable TV operators provide (secure) internet access through cable modems."],["DNSSEC (DNS Security Extensions) adds digital signatures so DNS lookup data can be trusted as correct and unaltered."],["IEEE 802.11 is the Wi-Fi standard family.","Security: WEP (broken) → WPA → WPA2 (802.11i) → WPA3. Use WPA2/WPA3."],["SET (Secure Electronic Transaction): protocol by Visa and MasterCard to protect credit-card payments online.","It uses digital certificates, digital signatures and encryption."],["Database parts: user interface (forms for users), DBMS (software that manages the data), and the information stored.","The DBMS provides multi-user access control. Information = processed, meaningful data."],["Flat-file: one table, no relationships, redundancy.","Hierarchical: tree; each child has one parent; reach children through the parent.","Relational: linked tables using keys.","Network: web of many-to-many links using pointers.","Object-oriented: objects (data + methods), accessed with pointers."],["In UML a database entity is a class; relationships are associations.","In an ERD, entities (tables) are rectangles.","Relationships: 1:1, 1:n, m:n (e.g. students ↔ courses)."],["DBMS functions: data definition, querying, updating, administration, security.","Data dictionary = reference set of tables and views describing the database.","Integrity = completeness and accuracy of data. Backup replicates data to a backup site."],["Primary key: unique, never NULL. Foreign key: points to another table's primary key.","DDL: CREATE, ALTER, DROP (removes the table). DML: INSERT, UPDATE, DELETE (removes rows). DCL: GRANT, REVOKE. TRUNCATE empties the table.","SELECT ... WHERE name LIKE 'C%' = starts with C (% any characters, _ one).","Joins: INNER (matches only), LEFT/RIGHT (all of one table + matches), FULL (all rows when there is a match in either)."],["Presentation/UI layer: shows data and collects input.","Business logic layer: rules, calculations, validation.","Data access layer: holds the SQL code and does create/read/update/delete (CRUD).","Three tiers: Presentation, Business/Logic, Data."],["Data sources include relational databases and XML databases.","XML databases store hierarchical, document-style data; queried with XQuery/XPath."],["ODBC (Open Database Connectivity) gives applications one standard way to reach many DBMSs, e.g. importing SQL data into Excel.","A data source is defined by name, location and driver (connection string). Java uses JDBC."],["Root element: the single top-level element.","Child element: nested inside another; sub-child: nested inside a child.","Elements with the same parent are siblings. gender=\"male\" inside a tag is an attribute."],["Well-formed XML: one root, every tag closed, correct nesting, quoted attributes, case-sensitive.","Escape \u003c as &lt; and & as &amp;. Comments: \u003c!-- ... -->. Self-closing: \u003cbook/>.","Names can't contain spaces or #; names starting with 'xml' (any case) are reserved."],["DTD (Document Type Definition) describes the allowed structure of XML.","XML Schema (XSD, XML Schema Definition) is the XML-based alternative to DTD; adds data types, namespaces and default values.","Validating parsers check against a DTD/XSD; non-validating parsers check only well-formedness."],["XSLT transforms XML into HTML or other formats (\u003cxsl:for-each>, \u003cxsl:value-of>, \u003cxsl:template match=\"/\">).","CSS can also style XML.","Linked with \u003c?xml-stylesheet type=\"text/xsl\" href=\"style.xsl\"?>."],["Know what each product does and how it performs (speed, storage, compatibility).","A port connects peripheral devices to the motherboard.","Network devices: repeater (amplifies signal), switch (within a network), router (between networks), bridge (joins segments)."],["Supported products are approved, licensed and maintained by the organisation's IT department.","Train users on the approved software list for security and compatibility."],["Use correct IT terminology for clear communication; explain jargon in plain language for beginners.","Hardware = physical parts; software = programs; the operating system manages resources."],["Sources: help files and on-screen messages (first place to look), vendor manuals and websites, knowledge bases, the helpdesk (e.g. for lost network services)."],["Slides: clear titles, large fonts, visuals and bullet points; visual hierarchy guides the audience.","Use animations sparingly; they distract.","Webinars can be recorded for viewing later."],["Provide manuals, quick-start guides and job aids with the product.","Documentation supports learning before, during and after training."],["Personalisation tailors training to each learner's needs, level and goals.","Benefit: learners go at their own pace. Ask learners about their goals first."],["On-site: face-to-face, best for practical hands-on instruction; costs more time and travel.","Telephone: fast remote help for simple problems; needs clear verbal communication.","Best way to train on new software: demonstrate the features, then let the user practise."]];

function unitStats(u){const qs=pool(u);let seen=0,ok=0;qs.forEach(q=>{const r=S.items[q.id];if(r&&r.n){seen++;if(r.last)ok++}});return{total:qs.length,seen,ok,acc:seen?ok/seen:null}}

// pick n items from unit, preferring unseen, then missed, then the rest
function pickUnit(u,n,examFirst){const qs=shuffle(pool(u));const score=q=>{const r=S.items[q.id];if(!r||!r.n)return 0;return r.last?2:1};const srt=qs.sort((a,b)=>score(a)-score(b));if(!examFirst)return srt.slice(0,n);const ex=srt.filter(EXAM),k=Math.min(ex.length,Math.ceil(n/2));const pick=ex.slice(0,k);return pick.concat(srt.filter(q=>!pick.includes(q)).slice(0,n-k))}
function weightedMix(n){const res=[];const w={};Object.keys(SPEC).forEach(u=>{u=+u;if(!SPEC[u])return;const st=unitStats(u);w[u]=SPEC[u]*(1.25-(st.acc==null?0.5:st.acc))});
  const tot=Object.values(w).reduce((a,b)=>a+b,0);const counts={};Object.keys(w).forEach(u=>counts[u]=Math.round(n*w[u]/tot));
  Object.keys(counts).forEach(u=>res.push(...pickUnit(+u,counts[u])));return shuffle(res).slice(0,n)}

  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='full')startExam('Full mock',60);if(g==='quick')startExam('Quick mock',20);if(g==='weak')startPractice('Weak-spot drill',weightedMix(15));if(g==='vocab')vocabHome();if(g==='syllabus')syllabus();if(g==='plan')studyPlan();if(g==='deck'&&deck().length)startPractice('Review deck',shuffle(deck()).slice(0,20),true)});
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unitPick(+b.dataset.unit));
  $('#set-date').onchange=e=>{if(e.target.value){S.settings.examDate=e.target.value;save();home()}};

  $('#exp').onclick=exportCode;$('#imp').onclick=importCode;$('#reset').onclick=resetAll;
  window.scrollTo(0,0)}
function srcChip(u){const all=BANK.filter(q=>q.u===u),ex=all.filter(EXAM).length;return `<span style="font-family:var(--f-mono);font-size:.85rem">${all.length}</span>${ex?` <span class="chip booklet">${ex} exam-style</span>`:''}`}

function unitPick(u){const qs=pool(u);const st=unitStats(u);
  modal(`<span class="eyebrow">Unit ${u}</span><h2>${esc(UNITS[u])}</h2><p class="muted">${qs.length} questions available · ${st.seen} seen.</p>
  <label class="row" for="pick-n"><span>Questions</span><select id="pick-n">${[10,20,30].filter(n=>n<qs.length).map(n=>`<option>${n}</option>`).join('')}<option value="${qs.length}">All ${qs.length}</option></select></label>

/* ---------- exam mode ---------- */
function blueprint(n){const units=Object.keys(SPEC).map(Number).filter(u=>SPEC[u]);
  if(n===60)return units.flatMap(u=>pickUnit(u,SPEC[u],true));
  // scale blueprint by largest remainder
  const raw=units.map(u=>({u,x:SPEC[u]*n/60}));raw.forEach(r=>r.k=Math.floor(r.x));let left=n-raw.reduce((a,r)=>a+r.k,0);
  raw.slice().sort((a,b)=>(b.x-b.k)-(a.x-a.k)).slice(0,left).forEach(r=>r.k++);return raw.flatMap(r=>pickUnit(r.u,r.k,true))}
function startExam(mode,n){const qs=blueprint(n);
  T={mode,exam:true,qs:qs.map(q=>({id:q.id,ord:optOrder(q),ans:null,flag:false})),i:0,end:Date.now()+n*2*60*1000,done:false};
  startTimer();renderExam()}
let timerId=null;
function startTimer(){stopTimer();timerId=setInterval(tick,1000);tick()}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
function tick(){if(!T||!T.exam||T.done)return;const ms=T.end-Date.now();const el=$('#timer');
  if(ms<=0){stopTimer();finishExam(true);return}
  const s=Math.ceil(ms/1000);if(el){el.textContent=`${String(s/3600|0)}:${String((s%3600)/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('low',s<=300)}}
function renderExam(){const t=T,item=t.qs[t.i],q=byId[item.id];
  setBar(`<span class="timer" id="timer" role="timer" aria-label="Time remaining">--:--</span><button class="btn" id="to-review" style="padding:5px 12px">Review &amp; submit</button>`);tick();
  $('#to-review').onclick=reviewScreen;
  const answered=t.qs.filter(x=>x.ans!=null).length;
  app.innerHTML=`<div class="exam"><section class="panel">
    <div class="qhead"><span class="qnum">Question ${t.i+1} <span class="muted" style="font-weight:500">of ${t.qs.length}</span></span>
      <button class="btn flag ${item.flag?'on':''}" id="flag" aria-pressed="${item.flag}">${item.flag?'Flagged':'Flag for review'}</button></div>
    ${q.img?`<div class="svgbox">${XMLTREE}</div>`:''}
    <div class="qtext">${stem(q.q)}</div>
    <div class="opts">${item.ord.map((oi,k)=>`<button class="opt ${item.ans===oi?'sel':''}" data-o="${oi}" aria-pressed="${item.ans===oi}"><span class="l">${'abcd'[k]}</span><span class="x">${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn" id="prev" ${t.i?'':'disabled'}>Previous</button><button class="btn pri" id="next">${t.i<t.qs.length-1?'Next':'Review answers'}</button></div>
    <p class="hint keys" style="margin-top:12px">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> answer · <span class="kbd">F</span> flag · <span class="kbd">←</span><span class="kbd">→</span> move</p>
  </section>
  <aside class="panel" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>Navigator</h3><span class="hint">${answered}/${t.qs.length} answered</span></div>
    <div class="nav">${t.qs.map((x,k)=>`<button class="${x.ans!=null?'a':''} ${x.flag?'f':''} ${k===t.i?'cur':''}" data-j="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i style="background:var(--flag)"></i>Flagged</span><span><i></i>Not answered</span></div>
  </aside></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{item.ans=+b.dataset.o;renderExam()});
  app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{t.i=+b.dataset.j;renderExam()});
  $('#flag').onclick=()=>{item.flag=!item.flag;renderExam()};
  $('#prev').onclick=()=>{t.i--;renderExam()};
  $('#next').onclick=()=>{if(t.i<t.qs.length-1){t.i++;renderExam()}else reviewScreen()}}
function reviewScreen(){const t=T;const un=t.qs.map((x,k)=>x.ans==null?k:-1).filter(k=>k>=0),fl=t.qs.map((x,k)=>x.flag?k:-1).filter(k=>k>=0);
  app.innerHTML=`<section class="panel" style="display:grid;gap:16px"><h2>Review before you submit</h2>
  <div class="kv"><div><span class="eyebrow">Answered</span><b>${t.qs.length-un.length}</b></div><div><span class="eyebrow">Not answered</span><b style="color:${un.length?'var(--bad)':'inherit'}">${un.length}</b></div><div><span class="eyebrow">Flagged</span><b style="color:${fl.length?'var(--flag)':'inherit'}">${fl.length}</b></div></div>
  ${un.length?`<div><h3>Not answered</h3><div class="nav" style="margin-top:8px">${un.map(k=>`<button data-j="${k}">${k+1}</button>`).join('')}</div><p class="hint" style="margin-top:6px">There is no penalty for a wrong answer, so never leave a question blank.</p></div>`:''}
  ${fl.length?`<div><h3>Flagged</h3><div class="nav" style="margin-top:8px">${fl.map(k=>`<button class="f a" data-j="${k}">${k+1}</button>`).join('')}</div></div>`:''}

  $('#submit').onclick=()=>modal(`<h2>Submit now?</h2><p>${un.length?`You still have <b>${un.length}</b> unanswered question${un.length>1?'s':''}. `:''}You can't change answers after submitting.</p><div class="row"><button class="btn pri" id="yes">Submit</button><button class="btn" id="no">Keep working</button></div>`,()=>{$('#yes').onclick=()=>{closeModal();finishExam(false)};$('#no').onclick=closeModal})}
function finishExam(timeout){const t=T;t.done=true;stopTimer();
  const res=t.qs.map(x=>{const q=byId[x.id];const ok=x.ans===q.a;record(x.id,ok,x.flag?false:undefined);return{...x,ok}});
  saveAttempt(t.mode,res);results(t.mode,res,timeout)}
function saveAttempt(mode,res){const units={};res.forEach(r=>{const u=byId[r.id].u;units[u]=units[u]||[0,0];units[u][1]++;if(r.ok)units[u][0]++});
  const score=res.filter(r=>r.ok).length;S.attempts.push({mode,date:Date.now(),score,total:res.length,pct:Math.round(100*score/res.length),units});S.attempts=S.attempts.slice(-50);save()}

  app.innerHTML=`<section class="panel" style="display:grid;gap:18px">

   <div class="tw"><table><thead><tr><th>Unit</th><th class="n">Score</th><th style="width:40%">Result</th></tr></thead><tbody>${Object.entries(units).map(([u,v])=>{const p=v.ok/v.n;return `<tr><td>${u}. ${esc(UNITS[u])}</td><td class="n">${v.ok}/${v.n}</td><td><div class="meter"><i class="${p>=.8?'g':p>=.6?'w':'b'}" style="width:${Math.round(p*100)}%"></i></div></td></tr>`}).join('')}</tbody></table></div></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>Answer review</h2><label class="ck"><input type="checkbox" id="only-wrong" checked><span>Show wrong only</span></label></div><div id="rv"></div></section>`;
  const draw=()=>{const ow=$('#only-wrong').checked;$('#rv').innerHTML=res.map((r,k)=>({r,k})).filter(({r})=>!ow||!r.ok).map(({r,k})=>reviewItem(r,k)).join('')||'<p class="muted" style="padding-top:12px">Every answer was correct.</p>'};
  $('#only-wrong').onchange=draw;draw();
  $('#hm').onclick=home;
  $('#redo').onclick=()=>{const wrong=res.filter(r=>!r.ok).map(r=>byId[r.id]);if(wrong.length)startPractice('Mistakes from '+mode,wrong,true);else home()};window.scrollTo(0,0)}
function reviewItem(r,k){const q=byId[r.id];return `<div class="review-item"><div class="row" style="justify-content:space-between"><span class="qnum" style="font-size:.95rem">Q${k+1} · Unit ${q.u}</span><span>${tags(q)}${r.ans==null?' <span class="chip warn">not answered</span>':''}</span></div>

function whyHTML(q,ord,ans){return `<ul class="why">${ord.map((oi,j)=>{const ok=oi===q.a,note=ok?q.e:((q.w&&q.w[oi])||'');return `<li class="${ok?'ok':oi===ans?'no':''}"><span class="l">${'abcd'[j]}</span><span>${ok?'<b>Correct.</b> ':oi===ans?'<b>Your answer.</b> ':''}${esc(note)}</span></li>`}).join('')}</ul>`}

/* ---------- practice mode ---------- */
function startPractice(mode,qs,isDeck){if(!qs.length){home();return}

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(item.shown)return;item.ans=+b.dataset.o;renderPractice()});

  const ch=$('#check');if(ch)ch.onclick=checkPractice;
  const nx=$('#nx');if(nx)nx.onclick=()=>{if(t.i<t.qs.length-1){t.i++;renderPractice();window.scrollTo(0,0)}else finishPractice()}}
function checkPractice(){const item=T.qs[T.i],q=byId[item.id];if(item.ans==null)return;item.shown=true;record(item.id,item.ans===q.a,item.sure===false?false:undefined);save();renderPractice()}

  if(!res.length){home();return}saveAttempt(t.mode,res);results(t.mode,res,false)}

/* ---------- study plan ---------- */
function daysLeft(){const e=new Date((S.settings.examDate||'2027-01-03')+'T08:00:00');return Math.ceil((e-new Date())/86400000)}
function weekIdx(){const now=new Date();let idx=0;PLAN.forEach((w,i)=>{if(now>=new Date(w.d+'T00:00:00'))idx=i});return idx}

function taskLabel(t){if(t.l)return t.l;if(t.t==='unit'){const st=unitStats(t.u);return `Unit ${t.u}: ${UNITS[t.u]} (${SPEC[t.u]} exam Q). Read the key facts, then practise 20+ questions. Now ${st.acc==null?'not started':Math.round(st.acc*100)+'% on '+st.seen+' seen'}.`}return ''}

   ${PLAN.map((w,wi)=>{const end=new Date(new Date(w.d+'T00:00:00').getTime()+6*86400000);const cls=(wi===ci?'now':(wi<ci?'past':''))+(w.brk?' brk':'');const wn=PLAN.slice(0,wi+1).filter(x=>!x.brk).length;

/* ---------- syllabus ---------- */
function topicStats(i){const qs=BANK.filter(q=>q.k===i&&(!S.settings.examOnly||EXAM(q)));let seen=0,ok=0;qs.forEach(q=>{const r=S.items[q.id];if(r&&r.n){seen++;if(r.last)ok++}});return{qs,seen,ok,acc:seen?ok/seen:null}}
function syllabus(openU){stopTimer();T=null;setBar('');
  const units=[...new Set(SCOPE.map(x=>x[0]))];
  const rows=SCOPE.map((x,i)=>({i,u:x[0],klo:x[1],item:x[2],...topicStats(i)}));
  const notStarted=rows.filter(r=>!r.seen&&r.qs.length).length,weak=rows.filter(r=>r.acc!=null&&r.acc<.6).length;
  app.innerHTML=`<section class="panel" style="display:grid;gap:14px">
   <div class="row" style="justify-content:space-between;align-items:flex-end"><div style="display:grid;gap:4px;max-width:62ch"><span class="eyebrow">Official syllabus · ITUSD-1-1-3</span><h2>Syllabus checklist</h2><p class="muted">The CBT is written from these topics. Aim for a green bar on every one. Grey means you haven't tried it yet.</p></div>
   <div class="kv"><div><span class="eyebrow">Not started</span><b>${notStarted}</b></div><div><span class="eyebrow">Below 60%</span><b style="color:${weak?'var(--bad)':'inherit'}">${weak}</b></div></div></div>
   <div class="row"><button class="btn" id="sy-weak">Practise my weakest topics</button><button class="btn" id="sy-new">Practise topics not started</button></div>
   ${units.map(u=>{const ur=rows.filter(r=>r.u===u);const kl=[...new Set(ur.map(r=>r.klo))];const done=ur.filter(r=>r.acc!=null&&r.acc>=.8).length;
     return `<details ${openU===u?'open':''} style="border-top:1px solid var(--line);padding-top:10px"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b style="font-family:var(--f-mono)">${String(u).padStart(2,'0')}</b>&nbsp; ${esc(UNITS[u])} <span class="muted" style="font-size:.85rem">· ${SPEC[u]} exam Q</span></span><span class="hint">${done}/${ur.length} topics mastered</span></summary>
     ${kl.map(k=>`<div style="margin:10px 0 4px"><span class="eyebrow">${esc(k)}</span></div><div class="tw"><table><tbody>${ur.filter(r=>r.klo===k).map(r=>{const cls=r.acc==null?'':r.acc>=.8?'g':r.acc>=.6?'w':'b';return `<tr><td style="min-width:150px">${esc(r.item)}${factsHTML(r.i)}</td><td style="width:30%;min-width:110px"><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="meter" style="flex:1"><i class="${cls}" style="width:${r.acc==null?0:Math.round(r.acc*100)}%"></i></div><span style="font-family:var(--f-mono);font-size:.8rem;width:36px;text-align:right">${r.acc==null?'—':Math.round(r.acc*100)+'%'}</span></div></td><td class="n" style="font-size:.8rem">${r.seen}/${r.qs.length}</td><td style="text-align:right"><button class="btn" style="padding:4px 10px" data-ti="${r.i}" ${r.qs.length?'':'disabled'}>Practise</button></td></tr>`}).join('')}</tbody></table></div>`).join('')}</details>`}).join('')}
  </section>`;
  app.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.ti];startPractice('Topic: '+r.item,shuffle(r.qs).sort((a,c)=>(S.items[a.id]?.last?1:0)-(S.items[c.id]?.last?1:0)).slice(0,10))});
  $('#sy-weak').onclick=()=>{const w=rows.filter(r=>r.acc!=null).sort((a,b)=>a.acc-b.acc).slice(0,5);if(!w.length)return;startPractice('Weakest topics',shuffle(w.flatMap(r=>shuffle(r.qs).slice(0,3))))};
  $('#sy-new').onclick=()=>{const w=shuffle(rows.filter(r=>!r.seen&&r.qs.length)).slice(0,8);if(!w.length)return;startPractice('New topics',w.flatMap(r=>shuffle(r.qs).slice(0,2)))};
  window.scrollTo(0,0)}

/* ---------- vocabulary ---------- */
let V=null;
function vocabStat(t){return (S.vocab||{})[t]}
function vocabHome(){stopTimer();T=null;V=null;setBar('');S.vocab=S.vocab||{};
  const units=[...new Set(GLOSS.map(g=>g.u))].sort((a,b)=>a-b);
  const known=GLOSS.filter(g=>{const r=vocabStat(g.t);return r&&r.last}).length;
  app.innerHTML=`<section class="panel" style="display:grid;gap:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div style="display:grid;gap:4px"><span class="eyebrow">Vocabulary</span><h2>Learn the terms the exam uses</h2><p class="muted">Many exam questions are lost on words, not ideas. Each term has its Arabic equivalent and a short definition in English and Arabic.</p></div>
    <div class="kv"><div><span class="eyebrow">Known</span><b>${known}/${GLOSS.length}</b></div></div></div>
    <div class="row" style="flex-wrap:nowrap"><label for="v-unit">Unit</label><select id="v-unit" style="flex:1"><option value="0">All units</option><option value="-1">Terms I got wrong</option>${units.map(u=>`<option value="${u}">Unit ${u} · ${esc(UNITS[u])}</option>`).join('')}</select></div>
    <div class="grid2">
      <button class="mode" id="v-def"><span class="t">Definition → term <span>15 Q</span></span><span>Read the definition, pick the English term.</span></button>
      <button class="mode" id="v-ar"><span class="t">Arabic → English <span>15 Q</span></span><span>See the Arabic term, pick the English one the exam will use.</span></button>
    </div>
    <div class="row"><input id="v-q" type="search" placeholder="Search terms, Arabic or definitions" style="flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)"></div>
    <div class="tw"><table><thead><tr><th>Term</th><th style="text-align:right">العربية</th><th>Definition · التعريف</th><th class="n">Unit</th></tr></thead><tbody id="v-list"></tbody></table></div>
  </section>`;
  const list=()=>{const f=($('#v-q').value||'').toLowerCase(),u=+$('#v-unit').value;
    $('#v-list').innerHTML=vset(u).filter(g=>!f||(g.t+' '+g.ar+' '+g.d+' '+(g.da||'')).toLowerCase().includes(f)).map(g=>{const r=vocabStat(g.t);return `<tr><td><b>${esc(g.t)}</b>${r?(r.last?' <span class="chip booklet">known</span>':' <span class="chip warn">review</span>'):''}</td><td dir="rtl" lang="ar" style="text-align:right;font-size:1.05rem">${esc(g.ar)}</td><td style="min-width:240px">${esc(g.d)}${g.da?`<div class="ar" dir="rtl" lang="ar" style="margin-top:4px">${esc(g.da)}</div>`:''}</td><td class="n">${g.u}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">No terms match.</td></tr>'};
  $('#v-q').oninput=list;$('#v-unit').onchange=list;list();
  $('#v-def').onclick=()=>startVocab(+$('#v-unit').value,'def');$('#v-ar').onclick=()=>startVocab(+$('#v-unit').value,'ar');window.scrollTo(0,0)}
function vset(u){if(u===-1)return GLOSS.filter(g=>{const r=vocabStat(g.t);return r&&!r.last});return u?GLOSS.filter(g=>g.u===u):GLOSS}
function startVocab(u,mode){let set=vset(u);if(set.length<4)set=GLOSS;
  const items=shuffle(set).slice(0,15).map(g=>{const near=shuffle(GLOSS.filter(x=>x.t!==g.t&&x.u===g.u));const far=shuffle(GLOSS.filter(x=>x.t!==g.t&&x.u!==g.u));const d=near.concat(far).slice(0,3);return{g,opts:shuffle([g,...d]),ans:null}});
  V={mode,items,i:0};renderVocab()}
function renderVocab(){const v=V,it=v.items[v.i],g=it.g;const done=it.ans!=null;const ok=done&&it.ans===g.t;
  setBar(`<span class="timer" style="font-size:.9rem">${v.items.filter(x=>x.ans!=null&&x.ans===x.g.t).length}/${v.items.filter(x=>x.ans!=null).length} correct</span><button class="btn" id="vq" style="padding:5px 12px">Finish</button>`);$('#vq').onclick=vocabDone;
  app.innerHTML=`<section class="panel" style="max-width:780px;width:100%;justify-self:center">
   <div class="qhead"><span class="qnum">Vocabulary · ${v.i+1} <span class="muted" style="font-weight:500">of ${v.items.length}</span></span><span class="chip none">Unit ${g.u}</span></div>
   ${v.mode==='def'?`<span class="eyebrow">Which term matches this definition?</span><div class="qtext" style="margin-top:6px">${esc(g.d)}</div>${g.da?`<div class="ar" dir="rtl" lang="ar" style="margin-top:6px;color:var(--muted)">${esc(g.da)}</div>`:''}`:`<span class="eyebrow">Which English term is this?</span><div class="qtext" dir="rtl" lang="ar" style="font-size:1.6rem;margin-top:6px">${esc(g.ar)}</div>`}
   <div class="opts">${it.opts.map((o,k)=>{let c='';if(done){c=o.t===g.t?'ok':o.t===it.ans?'no':''}return `<button class="opt ${c}" data-t="${esc(o.t)}" ${done?'disabled':''}><span class="l">${'abcd'[k]}</span><span class="x">${esc(o.t)}</span></button>`}).join('')}</div>
   ${done?`<div class="feedback ${ok?'ok':'no'}"><b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Correct':'The answer is '+esc(g.t)}</b><p style="margin-top:6px"><b style="font-size:1rem">${esc(g.t)}</b> · <span dir="rtl" lang="ar" style="font-size:1.1rem">${esc(g.ar)}</span></p><p style="margin-top:4px">${esc(g.d)}</p>${g.da?`<p class="ar" dir="rtl" lang="ar" style="margin-top:4px">${esc(g.da)}</p>`:''}</div>
   <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn pri" id="vn">${v.i<v.items.length-1?'Next':'See summary'}</button></div>`:''}
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(it.ans!=null)return;it.ans=b.dataset.t;const r=S.vocab[g.t]||(S.vocab[g.t]={n:0,c:0});r.n++;r.last=it.ans===g.t?1:0;if(r.last)r.c++;save();renderVocab()});
  const n=$('#vn');if(n){n.onclick=()=>{if(v.i<v.items.length-1){v.i++;renderVocab()}else vocabDone()};n.focus()}}
function vocabDone(){const v=V;if(!v)return home();const a=v.items.filter(x=>x.ans!=null),ok=a.filter(x=>x.ans===x.g.t);setBar('');
  app.innerHTML=`<section class="panel" style="display:grid;gap:14px"><span class="eyebrow">Vocabulary result</span><span class="score">${a.length?Math.round(100*ok.length/a.length):0}%</span><span class="muted">${ok.length} of ${a.length} correct</span>
   ${a.length-ok.length?`<div class="tw"><table><thead><tr><th>Term to review</th><th style="text-align:right">العربية</th><th>Definition</th></tr></thead><tbody>${a.filter(x=>x.ans!==x.g.t).map(x=>`<tr><td><b>${esc(x.g.t)}</b></td><td dir="rtl" lang="ar" style="text-align:right">${esc(x.g.ar)}</td><td>${esc(x.g.d)}${x.g.da?`<div class="ar" dir="rtl" lang="ar" style="margin-top:4px">${esc(x.g.da)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
   <div class="row"><button class="btn pri" id="va">Another round</button><button class="btn" id="vh">Vocabulary list</button><button class="btn" id="vd">Dashboard</button></div></section>`;
  $('#va').onclick=()=>startVocab(0,v.mode);$('#vh').onclick=vocabHome;$('#vd').onclick=home;V=null}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(!T||T.done||$('#modal-root').innerHTML||/input|textarea|select/i.test(e.target.tagName))return;
  const item=T.qs[T.i];const k=e.key.toLowerCase();const idx='abcd'.indexOf(k);
  if(idx>=0&&!item.shown){item.ans=item.ord[idx];T.exam?renderExam():renderPractice();return}
  if(T.exam){if(k==='f'){item.flag=!item.flag;renderExam()}if(e.key==='ArrowRight'&&T.i<T.qs.length-1){T.i++;renderExam()}if(e.key==='ArrowLeft'&&T.i>0){T.i--;renderExam()}}
  else{if(k==='g'&&!item.shown){item.sure=item.sure===false?null:false;renderPractice()}
    if(e.key==='Enter'){e.preventDefault();item.shown?($('#nx')&&$('#nx').click()):checkPractice()}}});

/* ---------- modal & progress code ---------- */
function modal(html,after){$('#modal-root').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="panel">${html}</div></div>`;after&&after()}
function closeModal(){$('#modal-root').innerHTML=''}
function exportCode(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  modal(`<h2>Your progress code</h2><p class="muted">Copy this and use “Load progress code” on another device or browser.</p><textarea id="code" readonly>${code}</textarea><div class="row"><button class="btn pri" id="cp">Copy</button><button class="btn" id="cl">Close</button><span id="msg" class="hint"></span></div>`,()=>{
  $('#cp').onclick=()=>{const ta=$('#code');navigator.clipboard?.writeText(code).then(()=>$('#msg').textContent='Copied',()=>{ta.select();$('#msg').textContent='Selected, press Ctrl+C'})||(ta.select())};$('#cl').onclick=closeModal})}
function importCode(){modal(`<h2>Load progress code</h2><p class="muted">This replaces the progress saved in this browser.</p><textarea id="code" placeholder="Paste your code here"></textarea><div class="row"><button class="btn pri" id="ld">Load</button><button class="btn" id="cl">Cancel</button><span id="msg" class="hint"></span></div>`,()=>{
  $('#ld').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));if(!d.items)throw 0;S={...load(),...d};save();closeModal();home()}catch(e){$('#msg').textContent='That code is not valid. Copy the whole code and try again.'}};$('#cl').onclick=closeModal})}
function resetAll(){modal(`<h2>Reset all progress?</h2><p>This clears every answer, attempt and your review deck in this browser.</p><div class="row"><button class="btn bad" id="yes">Reset</button><button class="btn" id="no">Cancel</button></div>`,()=>{$('#yes').onclick=()=>{S={items:{},attempts:[],settings:S.settings};save();closeModal();home()};$('#no').onclick=closeModal})}
$('#home-btn').onclick=()=>{if(T&&T.exam&&!T.done){modal(`<h2>Leave this exam?</h2><p>Your answers in this attempt will be lost.</p><div class="row"><button class="btn bad" id="yes">Leave</button><button class="btn" id="no">Stay</button></div>`,()=>{$('#yes').onclick=()=>{closeModal();home()};$('#no').onclick=closeModal})}else home()};
window.addEventListener('beforeunload',e=>{if(T&&T.exam&&!T.done){e.preventDefault();e.returnValue=''}});
home();
</script>
</body>
</html>
