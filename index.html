OFF2","BMP","TIFF","OTF only"],"a":0,"e":"WOFF/WOFF2 are compressed web-font formats built for fast loading.","s":"bank","k":72,"w":["","BMP is an uncompressed image format.","TIFF is a large image format.","OTF works but is not compressed for the web."]},{"id":"b10-8","u":10,"q":"The website must support users with disabilities. Which element improves accessibility for screen readers?","o":["alt attribute","style attribute","float:left;","overflow:hidden;"],"a":0,"e":"Screen readers read the alt attribute aloud in place of the image.","s":"bank","k":80,"w":["","style sets appearance.","float positions elements.","overflow controls clipping."]},{"id":"b10-9","u":10,"q":"To improve SEO and accessibility, each page should have one unique:","o":["\u003ch1> heading","\u003ctitle> and \u003ch3>","\u003cb> text","\u003cdiv>"],"a":0,"e":"Each page should have exactly one unique \u003ch1> describing its main topic.","s":"bank","k":72,"w":["","\u003ctitle> is in the head and \u003ch3> is a lower heading.","\u003cb> is bold text, not structure.","\u003cdiv> is a generic container."]},{"id":"b10-10","u":10,"q":"The developer uses a grid layout for aligning elements. Which CSS feature is this?","o":["display:grid;","display:block;","float:left;","align:center;"],"a":0,"e":"display:grid turns on CSS Grid layout.","s":"bank","k":75,"w":["","block is normal block layout.","float is an older layout technique.","align:center is not a valid CSS property."]},{"id":"b10-11","u":10,"q":"If the navigation bar overlaps on smaller screens, what technique can fix it?","o":["Media query for screen width","Inline styles on the nav bar","A different HTML version","Extra \u003cbr> tags between links"],"a":0,"e":"A media query can change the navigation layout below a certain screen width.","s":"bank","k":75,"w":["","Inline styles cannot target screen sizes.","Changing HTML version does not fix layout.","Extra line breaks are a poor hack."]},{"id":"b10-12","u":10,"q":"Which color contrast improves text readability?","o":["Dark text on light background","Bright text on bright background","Blue on blue","Light gray on white"],"a":0,"e":"High contrast, such as dark text on a light background, is easiest to read.","s":"bank","k":80,"w":["","Bright on bright has low contrast.","Blue on blue has low contrast.","Light grey on white has low contrast."]},{"id":"b10-13","u":10,"q":"A teacher’s profile image looks blurry on the new website. Which format should be used for best quality and smaller size?","o":["JPEG","BMP","TIFF","RAW"],"a":0,"e":"JPEG gives good photo quality at small file size. BMP, TIFF and RAW files are huge.","s":"bank","k":81,"w":["","BMP files are huge and uncompressed.","TIFF files are large.","RAW files are camera files, not web images."]},{"id":"b10-14","u":10,"q":"A student adds a YouTube video using \u003ciframe>. What is this media type?","o":["Embedded media","Linked script","Static text","External stylesheet"],"a":0,"e":"Content from another site shown via \u003ciframe> is embedded media.","s":"bank","k":75,"w":["","A script is code, not media.","Static text is plain text.","A style sheet is CSS."]},{"id":"b10-15","u":10,"q":"The website must display correctly on both phones and desktops. What is this feature called?","o":["Responsive design","Interactive scripting","Server validation","Static rendering"],"a":0,"e":"Adapting the layout to phones and desktops is responsive design.","s":"bank","k":76,"w":["","Scripting adds behaviour.","Server validation checks data.","Static rendering does not adapt."]},{"id":"b10-16","u":10,"q":"A web developer uses 'em' and 'rem' in CSS instead of 'px'. Why?","o":["They scale text relative to font size","They fix text to 16px","They lock layout size","They switch off responsiveness on small screens"],"a":0,"e":"em and rem are relative units that scale with font size, helping responsiveness.","s":"bank","k":72,"w":["","px fixes size; em/rem are relative.","They do not lock size.","They improve responsiveness."]},{"id":"b10-17","u":10,"q":"The footer text must remain centered regardless of screen width. Which CSS property ensures this?","o":["text-align:center;","float:center;","position:fixed;","margin-top:0;"],"a":0,"e":"text-align:center centres inline content such as text at any width. There is no float:center.","s":"bank","k":75,"w":["","float:center does not exist.","position:fixed pins the element; it does not centre text.","margin-top only sets top spacing."]},{"id":"b10-18","u":10,"q":"To ensure proper character display in Arabic and English, which meta tag should be used?","o":["\u003cmeta charset='UTF-8'>","\u003cmeta name='viewport'>","\u003cmeta language='en'>","\u003cscript charset='UTF-16'>"],"a":0,"e":"UTF-8 encodes both Arabic and English characters correctly.","s":"bank","k":76,"w":["","viewport sets the display width.","language is not a valid meta attribute.","Charset is set with a meta tag, not on a script."]},{"id":"b10-19","u":10,"q":"Which file format is best for vector-based icons and logos on the college site?","o":["SVG","JPEG","GIF","BMP"],"a":0,"e":"SVG is a vector format, so icons and logos stay sharp at any size.","s":"bank","k":81,"w":["","JPEG is a raster photo format.","GIF is a raster format.","BMP is a large raster format."]},{"id":"b10-20","u":10,"q":"A student’s website loads slowly because of large images. What can improve performance?","o":["Compress images","Use BMP format","Increase resolution","Add extra CSS"],"a":0,"e":"Compressing images shrinks file size and speeds up loading.","s":"bank","k":75,"w":["","BMP files are larger.","Higher resolution makes files bigger.","CSS does not shrink images."]},{"id":"b10-21","u":10,"q":"If the college wants the layout to automatically adjust to tablets, what should the CSS include?","o":["@media screen and (min-width:768px)","@keyframes fade { from {opacity:0} }","@font-face { font-family: Tablet; }","@import url(\"tablet-layout.css\")"],"a":0,"e":"@media screen and (min-width:768px) targets tablet-sized screens and up.","s":"bank","k":72,"w":["","@keyframes defines animations.","@font-face loads fonts.","@import loads CSS but does not target screen sizes."]},{"id":"b10-22","u":10,"q":"Which file format is ideal for transparent images like the college logo?","o":["PNG","JPG","TIFF","BMP"],"a":0,"e":"PNG supports transparency; JPG and BMP do not.","s":"bank","k":81,"w":["","JPG has no transparency.","TIFF is not a web format.","BMP has no web transparency."]},{"id":"b10-23","u":10,"q":"The webpage must validate under W3C standards. What tool checks HTML code correctness?","o":["HTML Validator","CSS Linter","ODBC Checker","API Tester"],"a":0,"e":"The W3C HTML Validator checks HTML against the standard. A CSS linter checks CSS.","s":"bank","k":79,"w":["","A CSS linter checks CSS.","ODBC is for databases.","API testers test APIs."]},{"id":"b10-24","u":10,"q":"What happens if CSS is embedded in each HTML file instead of external stylesheet?","o":["Harder maintenance and no shared caching","Better performance on every page","Faster debugging of problems in the styles","Automatic validation of the CSS"],"a":0,"e":"Repeating CSS in every page means many places to edit and no shared browser caching.","s":"bank","k":75,"w":["","Repeated CSS adds size to every page.","Debugging is harder with many copies.","Nothing is validated automatically."]},{"id":"b10-25","u":10,"q":"Which CSS property ensures equal spacing between grid items?","o":["gap","float","padding-left","border-radius"],"a":0,"e":"gap sets equal spacing between grid (and flex) items.","s":"bank","k":75,"w":["","float is a layout technique, not spacing.","padding-left adds space inside one side of an element.","border-radius rounds corners."]},{"id":"b10-26","u":10,"q":"Which tag structure ensures a properly nested HTML document?","o":["\u003chtml>\u003chead>\u003c/head>\u003cbody>\u003c/body>\u003c/html>","\u003cbody>\u003chtml>\u003c/html>\u003c/body>","\u003chead>\u003cbody>\u003c/body>\u003c/head>","\u003chtml>\u003cbody>\u003chead>\u003c/head>\u003c/body>\u003c/html>"],"a":0,"e":"\u003chtml> wraps everything; \u003chead> comes before \u003cbody> inside it.","s":"bank","w":["","\u003chtml> must be the outer tag.","\u003chead> and \u003cbody> are siblings inside \u003chtml>.","\u003chead> must come before \u003cbody>, not inside it."]},{"id":"b10-27","u":10,"q":"The IT manager asks to ensure color contrast for visually impaired users. Which guideline does this follow?","o":["Accessibility (WCAG)","Performance","SEO","Cross-browser design"],"a":0,"e":"Colour contrast for visually impaired users is a WCAG accessibility requirement.","s":"bank","k":80,"w":["","Performance is speed.","SEO is search ranking.","Cross-browser is about browsers."]},{"id":"b10-28","u":10,"q":"If a developer sets fixed width of 960px for the content, how will it affect mobile users?","o":["They must scroll horizontally","It improves readability","It auto-fits smaller screens","It increases speed"],"a":0,"e":"A fixed 960px width is wider than a phone, so mobile users must scroll sideways.","s":"bank","k":78,"w":["","Fixed wide layouts are harder to read on phones.","Fixed widths do not fit small screens.","Width does not change speed."]},{"id":"b10-29","u":10,"q":"The header’s logo must always appear proportionally scaled. Which CSS ensures this?","o":["max-width:100%; height:auto;","width:500px; height:200px;","overflow:hidden; height:auto;","padding:0; margin:0 auto;"],"a":0,"e":"max-width:100% with height:auto scales the logo while keeping its proportions.","s":"bank","k":75,"w":["","Fixed sizes can distort and overflow.","overflow:hidden crops the image.","Padding and margin do not scale images."]},{"id":"b10-30","u":10,"q":"A student mistakenly uses \u003cfont> tags to style text. What’s the correct modern alternative?","o":["CSS rules (color, font-family)","HTML attributes","JavaScript that sets the style inline","Using \u003cb> tags"],"a":0,"e":"\u003cfont> is obsolete. Use CSS properties such as color and font-family.","s":"bank","k":72,"w":["","Presentational attributes are also outdated.","Styling with JavaScript is not the standard approach.","\u003cb> only makes text bold."]},{"id":"b10-31","u":10,"q":"A developer is creating a blog post layout. They want to semantically define a self-contained composition that is independently distributable, such as a forum post or magazine article. Which HTML5 element should they use?","o":["\u003csection>","\u003cdiv>","\u003carticle>","\u003caside"],"a":2,"e":"\u003carticle> marks self-contained content that could be distributed on its own, like a blog post.","s":"bank","k":72,"w":["\u003csection> groups related content; it is not necessarily self-contained.","\u003cdiv> has no meaning.","","\u003caside> holds side content."]},{"id":"b10-32","u":10,"q":"You are tasked with creating an accessible data table. The table has a header, \"Monthly Sales,\" and two columns: \"Product\" and \"Revenue.\" To programmatically associate the \"Monthly Sales\" text with the entire table for screen readers, what is the best practice?","o":["Use a \u003ccaption> element inside the \u003ctable>.","Use a \u003cth colspan=\"2\"> in the first row.","Use the title attribute on the \u003ctable> tag.","Use a \u003cp> element immediately before the table."],"a":0,"e":"\u003ccaption> is the semantic title for a table and is announced by screen readers.","s":"bank","k":80,"w":["","A colspan header is not linked as the table's title.","title is not reliably read by screen readers.","A paragraph before the table is not linked to it."]},{"id":"b10-33","u":10,"q":"You are implementing a drag-and-drop interface to reorder items in a list. You have used the draggable=\"true\" attribute and the dragstart event to set the data. During the drag, you need to prevent the default handling over a drop zone to allow a drop. Which event must you cancel by calling event.preventDefault()?","o":["The drag event on the draggable element.","The dragover event on the target drop zone.","The dragenter event on the target drop zone.","The drop event on the target drop zone"],"a":1,"e":"A drop zone only accepts a drop if the dragover event's default is prevented.","s":"bank","k":72,"w":["The drag event fires on the dragged item; cancelling it does not allow a drop.","","Cancelling dragenter alone is not enough to allow a drop.","drop only fires if dragover was cancelled."]},{"id":"b10-34","u":10,"q":"You are writing an XHTML 1.0 Strict document that includes a link to an external CSS file. According to the standard, where should the \u003clink> tag be placed, and what attributes are required for it to be valid?","o":["In the \u003cbody>, with href and type attributes.","In the \u003chead>, with href and rel attributes.","In the \u003chead>, with href, rel, and type attributes.","Anywhere in the document, with src and rel attributes"],"a":2,"e":"In XHTML Strict, \u003clink> goes in \u003chead> with href, rel and type.","s":"bank","k":72,"w":["\u003clink> must be in the \u003chead>.","XHTML Strict also requires type.","","\u003clink> uses href, not src, and goes in \u003chead>."]},{"id":"b10-35","u":10,"q":"During a website redesign, the team is debating layout strategies. A colleague argues for a \"Mobile First\" approach. What is the primary rationale for this?","o":["It makes the desktop version of the site load faster","It designs for small screens first, then adds layout for larger ones","It is always quicker to code than a desktop-first design approach","It makes the website look identical on every device"],"a":1,"e":"Mobile-first designs for the smallest screen first, then adds layout for bigger screens with min-width queries.","s":"bank","k":75,"w":["Mobile-first is not mainly about desktop speed.","","It is not always quicker to code.","Pages adapt; they do not look identical."]},{"id":"b10-36","u":10,"q":"You set max-width: 100% on all images. An author uploads a 2000px-wide photo. How does it appear on a high-DPI (Retina) phone whose viewport is 375px wide?","o":["At 2000px wide, causing horizontal scrolling","Scaled to fit the 375px viewport and still sharp","At 375px but blurry, because quality is reduced","Not shown at all, because the file is too large"],"a":1,"e":"max-width: 100% limits the image to its container (375 CSS pixels). A 2x screen uses 750 device pixels, and the 2000px source has more than enough, so it stays sharp.","s":"bank","k":78,"w":["max-width:100% stops it overflowing.","","The source has enough pixels to stay sharp.","Large files still display."]},{"id":"b10-37","u":10,"q":"A user reports that your website's layout is broken in Internet Explorer 11, but it works perfectly in Chrome and Firefox. Your CSS uses modern features like CSS Grid. What is the best long-term strategy for handling this?","o":["Use a CSS reset to remove all default browser styles","Give older browsers a simpler layout and modern ones an enhanced one","Detect IE11 and block those users from the website","Rewrite every layout using HTML tables for maximum compatibility"],"a":1,"e":"Progressive enhancement: a basic working layout for old browsers, richer layouts for modern ones.","s":"bank","k":75,"w":["A reset does not add Grid support.","","Blocking users is unacceptable.","Table layouts are outdated and inaccessible."]},{"id":"b10-38","u":10,"q":"Your web application uses a JavaScript feature, the fetch() API, which is not supported in Internet Explorer. To make the application work without changing the code, what tool or technique can you use?","o":["A CSS preprocessor such as Sass","A polyfill that adds fetch() to older browsers","A JavaScript linter such as ESLint","Rewriting the back end in a different programming language"],"a":1,"e":"A polyfill adds a missing browser feature (fetch) using older technology (XMLHttpRequest).","s":"bank","k":76,"w":["Sass is for CSS, not JavaScript features.","","A linter finds code problems; it does not add features.","The back end is not the problem."]},{"id":"b10-39","u":10,"q":"You are performing an accessibility audit. You find that all form \u003cinput> elements use a \u003cp> tag for their labels. What is the most accessible and semantically correct way to associate a label with an input?","o":["Use a \u003cdiv> with a for attribute that matches the input's id value.","Use a \u003clabel> element with a for attribute matching the input's id.","Use the title attribute on the \u003cinput>.","Use a \u003cspan> with a class=\"label\"."],"a":1,"e":"\u003clabel for=\"id\"> programmatically links the label to its input.","s":"bank","k":72,"w":["\u003cdiv> has no for attribute.","","title is not a proper label.","A span with a class is not linked to the input."]},{"id":"b10-40","u":10,"q":"A screen reader user is navigating a data table via its headers. The table has a structure where the first column contains row headers (e.g., \"Name,\" \"Email\") and the top row contains column headers (e.g., \"Q1 Sales,\" \"Q2 Sales\"). For a data cell at the intersection of \"Email\" and \"Q2 Sales,\" which technique best ensures the screen reader announces both relevant headers?","o":["Use scope=\"row\" on the row header and scope=\"col\" on the column headers.","Use scope=\"rowgroup\" and scope=\"colgroup\".","Use id and headers attributes on every cell.","Use ARIA roles role=\"rowheader\" and role=\"columnheader\" on every cell."],"a":0,"e":"For a simple table with one row-header column and one column-header row, scope=\"row\" and scope=\"col\" is the recommended technique; id/headers is for complex tables.","s":"bank","k":72,"w":["","rowgroup and colgroup are for groups of rows or columns.","id/headers is for complex tables; scope is simpler here.","ARIA roles alone do not link the headers to cells."]},{"id":"b10-41","u":10,"q":"You are implementing a complex custom dropdown menu that is built with \u003cdiv> and \u003cspan> elements for styling, not a native \u003cselect>. To make it fully accessible, you need to ensure it can be operated with a keyboard and that screen readers understand its state (expanded/collapsed). Which combination of ARIA attributes is most critical?","o":["role=\"list\" and aria-sort on the items","role=\"menu\", aria-haspopup, aria-expanded and focus handling","role=\"navigation\" and aria-label on the wrapper","aria-live=\"polite\" and aria-required=\"true\" on the list wrapper"],"a":1,"e":"A custom dropdown needs a role, aria-haspopup, aria-expanded (open/closed state) and keyboard focus handling.","s":"bank","k":76,"w":["List roles do not describe a dropdown.","","Navigation role and a label do not show open or closed state.","aria-live and aria-required do not describe a dropdown."]},{"id":"b10-42","u":10,"q":"Which of the following best describes usability in web design?","o":["Making the website load faster","Ensuring the website can be used easily and intuitively by visitors","Adding animations and graphics to improve how the site looks","Writing clean HTML code"],"a":1,"e":"Usability = easy and intuitive to use.","s":"bank","k":76,"w":["Speed is performance.","","Animations are decoration.","Clean code is maintainability."]},{"id":"b10-43","u":10,"q":"Accessibility in web design refers to:","o":["Designing websites that only work on desktop computers with a mouse","Making websites more colorful and engaging","Ensuring websites can be accessed and used by people with disabilities","Reducing the number of images for faster loading"],"a":2,"e":"Accessibility = people with disabilities can use the site.","s":"bank","k":80,"w":["Mouse-only design excludes users.","Colour is not accessibility.","","Fewer images is about speed."]},{"id":"b10-44","u":10,"q":"Responsiveness in web design ensures that:","o":["The website changes its colours based on how the user interacts","The website adapts and looks good on all screen sizes and devices","The website contains responsive customer support","The website automatically updates its content daily"],"a":1,"e":"Responsive = adapts to every screen size.","s":"bank","k":76,"w":["Colour changes are not responsiveness.","","Customer support is unrelated.","Content updates are unrelated."]},{"id":"b10-45","u":10,"q":"Which language is most commonly used for client-side scripting to enhance interactivity?","o":["PHP","JavaScript","Python","SQL"],"a":1,"e":"JavaScript runs in the browser (client-side). PHP runs on the server.","s":"bank","k":76,"w":["PHP runs on the server.","","Python is not used in browsers.","SQL queries databases."]},{"id":"b10-46","u":10,"q":"Which of the following is a main purpose of web scripting?","o":["Storing data in a physical file","Adding interactivity and dynamic behavior to web pages","Designing the structure and order of the page's HTML elements","Changing website hosting servers"],"a":1,"e":"Scripting adds interactivity and dynamic behaviour.","s":"bank","k":76,"w":["File storage is the server's job.","","Structure is HTML's job.","Hosting is a service."]},{"id":"b10-47","u":10,"q":"Which approach helps create user-friendly and visually appealing web pages?","o":["Bright colours and many different fonts","Consistent layout, clear navigation, readable text","Long text blocks so everything fits on one single page","A fixed desktop layout for every device"],"a":1,"e":"Consistent layout, clear navigation and readable text make pages user-friendly.","s":"bank","k":72,"w":["Many fonts and bright colours distract.","","Long blocks are hard to read.","Fixed layouts break on mobile."]},{"id":"b10-48","u":10,"q":"Which factor best measures a website’s performance?","o":["How attractive its design is","The number of pages it contains","How fast it loads and responds","The file size of its logo image"],"a":2,"e":"Performance is measured by load and response times.","s":"bank","w":["Looks are not performance.","Page count is not performance.","","Logo size is a small factor."]},{"id":"b10-49","u":10,"q":"Which criterion is most related to maintainability of a website?","o":["It can be updated without breaking features","It uses advanced animations on every page","It is hosted on a secure, fast server","It shows several advertisements on each page"],"a":0,"e":"Maintainable = easy to update without breaking things.","s":"bank","w":["","Animations do not help maintenance.","Hosting is infrastructure.","Ads do not help maintenance."]},{"id":"b10-50","u":10,"q":"Which of the following is not a key principle of effective web design?","o":["Usability","Accessibility","Responsiveness","Complexity"],"a":3,"e":"Complexity works against good design; usability, accessibility and responsiveness are principles.","s":"bank","k":76,"w":["Usability is a key principle.","Accessibility is a key principle.","Responsiveness is a key principle.",""]},{"id":"b10-51","u":10,"q":"Why is usability important in web design?","o":["It makes the website more colorful","It helps users navigate and complete tasks easily","It reduces the number of web pages","It increases the file size so images look better quality"],"a":1,"e":"Usability helps users navigate and finish tasks easily.","s":"bank","k":76,"w":["Colour is not usability.","","Page count is not the point.","Bigger files slow sites."]},{"id":"b10-52","u":10,"q":"Which statement best describes accessibility in web design?","o":["Letting users edit the website's source code","Designing for all users, including disabled users","Limiting the website to a desktop view only","Showing every image at its full original size"],"a":1,"e":"Accessibility means designing for all users, including those with disabilities.","s":"bank","k":80,"w":["Users should not edit source code.","","Desktop-only excludes users.","Full-size images slow sites."]},{"id":"b10-53","u":10,"q":"Responsive web design means:","o":["The site responds with a pop-up message whenever you click","The layout adjusts to different screen sizes and devices","The background color changes based on time","The site n sizes is responsiveness.","s":"bank","w":["","Robustness is about lasting through change.","Simplicity is about clarity.","Consistency is about sameness."]},{"id":"b11-26","u":11,"q":"A new university website must be easy for first-year students to navigate. Which design principle is most important?","o":["Ease of use","Browser compatibility","Robustness","Security"],"a":0,"e":"First-year students need a site that is easy to use.","s":"bank","w":["","Compatibility is about browsers.","Robustness is about change.","Security is about protection."]},{"id":"b11-27","u":11,"q":"A government portal must protect personal data during login. Which factor is essential?","o":["Accessibility","Security","Robustness","Simplicity"],"a":1,"e":"Protecting personal data at login is security.","s":"bank","w":["Accessibility is about access.","","Robustness is about change.","Simplicity is about clarity."]},{"id":"b11-28","u":11,"q":"A museum site hides navigation behind unusual icons. Which principle is being violated?","o":["Simplicity","Robustness","Consistency","Accessibility"],"a":0,"e":"Confusing, unusual icons break simplicity (keep it obvious).","s":"bank","w":["","Robustness is about change.","Consistency is about sameness.","Accessibility may suffer too, but the main issue is simplicity."]},{"id":"b11-29","u":11,"q":"A shopping site is tested on Chrome, Firefox, and Safari to ensure it works the same. This reflects:","o":["Browser compatibility","Robustness","Security","Accessibility"],"a":0,"e":"Testing in several browsers checks browser compatibility.","s":"bank","w":["","Robustness is about change.","Security is about protection.","Accessibility is about disabled users."]},{"id":"b11-30","u":11,"q":"A job portal doesn’t show up in Google search results. Which design factor is missing?","o":["Findability","Responsiveness","Accessibility","Robustness"],"a":0,"e":"Not appearing in search results is a findability problem.","s":"bank","w":["","Responsiveness is about screens.","Accessibility is about access.","Robustness is about change."]},{"id":"b11-31","u":11,"q":"An online art gallery adds large background images and videos. Which principle must be checked to avoid slow loading?","o":["Performance","Security","Simplicity","Accessibility"],"a":0,"e":"Large images and videos slow loading, so performance must be checked (compress media, lazy-load).","s":"bank","w":["","Security is protection.","Simplicity is clarity.","Accessibility is access."]},{"id":"b11-32","u":11,"q":"A developer ensures the 'Sign Up' button looks the same on every page. Which principle is followed?","o":["Consistency","Simplicity","Robustness","Findability"],"a":0,"e":"The same button look on every page is consistency.","s":"bank","w":["","Simplicity is clarity.","Robustness is about change.","Findability is locating content."]},{"id":"b11-33","u":11,"q":"Why should user requirements be collected before starting web design?","o":["To reduce testing","To ensure the site meets users’ needs","To replace the need for security standards","To shorten coding time"],"a":1,"e":"Requirements first, so the site meets real user needs.","s":"bank","w":["Testing is still needed.","","Security standards still apply.","Requirements do not shorten coding."]},{"id":"b11-34","u":11,"q":"Which element is MOST likely to reduce accessibility for disabled users?","o":["Missing alt text for images","Using a plain sans-serif font throughout","Using blue for links","Adding a site map"],"a":0,"e":"Missing alt text blocks screen-reader users.","s":"bank","w":["","Plain fonts are readable.","Blue links are expected.","A site map helps."]},{"id":"b11-35","u":11,"q":"A developer checks their site with W3C’s online validator. Why?","o":["To check markup follows web standards","To make the server respond faster","To add animations to the pages","To compress the site's media files"],"a":0,"e":"The W3C validator checks markup against web standards.","s":"bank","w":["","Validation does not affect in approach.","\u003cembed> is for plugin content.","","\u003cmarquee> is obsolete scrolling text."]},{"id":"b11-41","u":11,"q":"How does the introduction of semantic tags in HTML5, such as \u003carticle> and \u003csection>, improve accessibility and SEO compared to older HTML versions?","o":["By reducing the file size of each page","By giving clearer structure to screen readers and crawlers","By allowing CSS animations on the page","By removing the need for \u003cdiv> elements entirely from pages"],"a":1,"e":"Semantic tags give a clear structure that screen readers and search crawlers understand.","s":"bank","w":["Semantics do not reduce file size.","","Animations are CSS.","\u003cdiv> is still used."]},{"id":"b11-42","u":11,"q":"What is the primary difference between HTML and XHTML in terms of syntax enforcement?","o":["XHTML allows unclosed tags","XHTML enforces well-formed XML rules","HTML requires strict nesting of tags","XHTML ignores case sensitivity"],"a":1,"e":"XHTML must be well-formed XML.","s":"bank","w":["XHTML requires closed tags.","","HTML is forgiving about nesting.","XHTML is case-sensitive."]},{"id":"b11-43","u":11,"q":"Why would a developer choose XHTML over HTML5 for a project requiring data interchange between web applications and XML-based services?","o":["XHTML allows the use of Flash content","XHTML supports a looser syntax than HTML5","XHTML works better with XML parsers","XHTML needs fewer closing tags"],"a":2,"e":"XHTML is XML, so XML parsers and services can read it.","s":"bank","w":["Flash is unrelated and obsolete.","XHTML is stricter, not looser.","","XHTML needs more closing tags."]},{"id":"b11-44","u":11,"q":"Which CSS property ensures that a webpage layout adapts to different screen sizes across devices?","o":["float","z-index","flex-wrap","media queries"],"a":3,"e":"Media queries apply different layouts per screen size.","s":"bank","w":["float positions elements.","z-index controls stacking order.","flex-wrap wraps items but does not target screen sizes.",""]},{"id":"b11-45","u":11,"q":"How does CSS specificity influence the rendering of styles when multiple rules target the same element?","o":["The shortest rule is applied","The last rule in the file always wins","Inline styles beat external styles","The browser picks a rule at random"],"a":2,"e":"More specific rules win; inline styles beat external styles.","s":"bank","w":["Rule length does not matter.","Order only decides between rules of equal specificity.","","Browsers never choose at random."]},{"id":"b11-46","u":11,"q":"Which design principle ensures that the same navigation bar and colour scheme are maintained across all pages of a website?","o":["Flexibility","Simplicity","Consistency","Robustness"],"a":2,"e":"Same navigation and colours on every page = consistency.","s":"bank","w":["Flexibility is adapting.","Simplicity is clarity.","","Robustness is lasting."]},{"id":"b11-47","u":11,"q":"How does prioritising accessibility in website design directly contribute to robustness and findability?","o":["By making every page load faster","By letting all users and crawlers reach the content","By removing the need for CSS","By using better-quality background images on every page"],"a":1,"e":"Accessible content is readable by all users and by search crawlers.","s":"bank","w":["Accessibility is not mainly about speed.","","CSS is still needed.","Background images are decoration."]},{"id":"b11-48","u":11,"q":"Which factor is most important when gathering user requirements for an e-commerce website?","o":["Preferred colour of navigation bar","Payment methods and checkout security","Number of background images","Size of banner ads"],"a":1,"e":"For e-commerce, payment options and checkout security matter most.","s":"bank","w":["Colour preference is minor.","","Backgrounds are minor.","Banner size is minor."]},{"id":"b11-49","u":11,"q":"How should a designer reconcile conflicting user requirements such as high visual appeal versus fast load time?","o":["Always prioritise the visuals","Remove all images from the site","Optimise media to balance both","Ignore load time on fast networks"],"a":2,"e":"Optimise media to balance looks and speed.","s":"bank","w":["Speed matters too.","Removing images loses appeal.","","Load time always matters."]},{"id":"b11-50","u":11,"q":"Which security measure best prevents cross-site scripting (XSS) in website forms?","o":["Using inline CSS on the form","Validating and sanitising input","Disabling autocomplete on fields","Adding a CAPTCHA image only"],"a":1,"e":"Validate and sanitise input to stop XSS.","s":"bank","w":["CSS does not stop scripts.","","Autocomplete is unrelated.","A CAPTCHA blocks bots, not XSS."]},{"id":"b11-51","u":11,"q":"How does implementing HTTPS with SSL/TLS contribute to both security and user trust in website design?","o":["By speeding up CSS rendering in the browser","By encrypting data and showing a padlock","By allowing larger video files to stream","By enforcing XHTML rules on every page"],"a":1,"e":"TLS encrypts data and the padlock reassures users.","s":"bank","w":["TLS does not affect CSS.","","Video size is unrelated.","XHTML rules are unrelated."]},{"id":"b11-52","u":11,"q":"Which technique best improves a website’s findability on search engines?","o":["Adding \u003cmarquee> text","Using semantic HTML tags and metadata","Increasing the number of decorative elements","Embedding large banners"],"a":1,"e":"Semantic HTML and metadata help search engines index the site.","s":"bank","w":["\u003cmarquee> is obsolete.","","Decoration does not help SEO.","Large banners slow pages."]},{"id":"b11-53","u":11,"q":"Why is structuring content with headings and landmarks crucial for both findability and accessibility?","o":["They make the site look more colourful and modern to users","They help crawlers and screen readers follow structure","They prevent browser compatibility problems","They remove the need for any CSS"],"a":1,"e":"Headings and landmarks show hierarchy to crawlers and screen readers.","s":"bank","w":["Structure is not about colour.","","Compatibility is separate.","CSS is still needed."]},{"id":"b11-54","u":11,"q":"Which media type is most effective for conveying dynamic product demonstrations on a website?","o":["Clip art","Video","Backgrounds","Banners"],"a":1,"e":"Video best shows a product working.","s":"bank","w":["Clip art is static.","","Backgrounds are decoration.","Banners are static ads."]},{"id":"b11-55","u":11,"q":"How should designers balance the use of high-resolution images with website performance requirements?","o":["Always upload the original full-size files","Compress images without visible quality loss","Replace every image with a text description","Use only small clip art instead of photos"],"a":1,"e":"Compress images without visible quality loss.","s":"bank","w":["Full-size originals slow pages.","","Text cannot replace product photos.","Clip art lowers quality."]},{"id":"b11-56","u":11,"q":"Which feature of modern browsers improves offline accessibility of web applications?","o":["CSS animations","Local storage and service workers","Background banners and pop-up adverts","Browser plug-ins"],"a":1,"e":"Local storage plus service workers let web apps work offline.","s":"bank","w":["CSS animations do not work offline by themselves.","","Ads do not help offline use.","Plug-ins are outdated and not for offline use."]},{"id":"b11-57","u":11,"q":"How does understanding different browser rendering engines help developers ensure compatibility?","o":["It reduces the amount of testing needed","It lets developers add fallbacks and polyfills","It allows developers to skip HTML validation","It makes debugging the site unnecessary"],"a":1,"e":"Knowing engine differences lets developers add fallbacks and polyfills.","s":"bank","w":["It does not reduce testing.","","Validation is still needed.","Debugging is still needed."]},{"id":"b11-58","u":11,"q":"Which design approach ensures websites display correctly across desktops, tablets, and smartphones?","o":["Responsive design","XHTML design","Static design","Clip art integration"],"a":0,"e":"Responsive design works on desktops, tablets and phones.","s":"bank","w":["","XHTML is a syntax, not a layout approach.","Static design does not adapt.","Clip art is decoration."]},{"id":"b11-59","u":11,"q":"Why is testing on multiple mobile devices essential for ensuring a positive user experience?","o":["All devices use the same screen size","Devices differ in resolution, speed and OS","Testing removes the need for CSS","Testing on devices is only needed for animations"],"a":1,"e":"Devices differ in resolution, power and OS behaviour.","s":"bank","w":["Screen sizes differ.","","CSS is still needed.","Testing covers everything, not only animations."]},{"id":"b11-60","u":11,"q":"Which organisation is responsible for developing and maintaining HTML, CSS, and other web standards?","o":["IEEE","ISO","W3C","ITU"],"a":2,"e":"W3C maintains HTML, CSS and other web standards.","s":"bank","w":["IEEE sets engineering standards such as Wi-Fi.","ISO sets general international standards.","","ITU sets telecoms standards."]},{"id":"b11-61","u":11,"q":"How do W3C standards support interoperability in website development?","o":["By allowing proprietary coding methods","By ensuring consistent behaviour across browsers and platforms","By reducing file sizes only","By removing the need for any accessibility testing of pages"],"a":1,"e":"Standards make behaviour consistent across browsers and platforms.","s":"bank","w":["Standards discourage proprietary methods.","","Standards are not only about size.","Accessibility testing is still needed."]},{"id":"b11-62","u":11,"q":"According to WCAG 2.1 guidelines, which principle ensures that all content is perceivable by users with disabilities?","o":["Robustness","Flexibility","Perceivability","Compatibility"],"a":2,"e":"The 'Perceivable' principle covers content users must be able to perceive.","s":"bank","w":["Robust is a different WCAG principle.","Flexibility is not a WCAG principle.","","Compatibility is not a WCAG principle."]},{"id":"b11-63","u":11,"q":"How does implementing ARIA (Accessible Rich Internet Applications) roles enhance accessibility compliance on dynamic websites?","o":["By adding extra SEO keywords to the dynamic content","By helping assistive technology interpret controls","By reducing the size of the CSS files","By speeding up animations on the page"],"a":1,"e":"ARIA roles tell assistive technology what custom interactive elements are.","s":"bank","w":["ARIA is not for SEO.","","ARIA does not shrink CSS.","ARIA does not affect speed."]},{"id":"b11-64","u":11,"q":"A university website is receiving complaints that visually impaired users cannot access course schedules properly, and the site looks broken on tablets. Which combination of design improvements would most effectively address these issues?","o":["Add decorative clip art and animations","Semantic HTML, alt text and responsive media queries","Replace all tables with images of the text","Add more video banners that explain the course schedules"],"a":1,"e":"Semantic HTML + alt text fixes access; media queries fix tablet layout.","s":"bank","w":["Decoration does not fix access or layout.","","Images of text are inaccessible.","Videos do not fix the schedules."]},{"id":"b11-65","u":11,"q":"You are tasked with designing a secure e-commerce website that will mainly be accessed on mobile devices. During testing, users report that login details can be seen in the URL bar after submission. Which best practice should be implemented to solve this problem?","o":["Use GET requests for login forms and apply animations to mask URLs","Use POST requests with input validation and ensure HTTPS is enabled","Use XHTML instead of HTML5 for the login page","Save login details in cookies for faster re-authentication"],"a":1,"e":"POST keeps data out of the URL; HTTPS encrypts it; validation adds safety.","s":"bank","w":["GET puts data in the URL.","","XHTML does not hide data.","Cookies storing passwords are unsafe."]},{"id":"b11-66","u":11,"q":"A government portal must comply with WCAG 2.1 AA standards. During evaluation, it was found that buttons created with \u003cdiv> tags are not being recognised by screen readers. What should the developer do to fix this issue while meeting accessibility requirements?","o":["Keep using \u003cdiv> but add bold styling for visibility","Replace \u003cdiv> with semantic \u003cbutton> elements or apply ARIA roles","Use only images as clickable elements","Disable screen reader support since compliance is already achieved"],"a":1,"e":"Use real \u003cbutton> elements (or ARIA roles) so screen readers recognise them.","s":"bank","w":["Bold styling does not help screen readers.","","Image-only controls are inaccessible.","Disabling support breaks compliance."]},{"id":"b11-67","u":11,"q":"Which of the following statements about HTML5 is true?","o":["HTML5 replaces CSS for styling web pages.","HTML5 allows embedding of multimedia without plugins.","HTML5 requires XHTML syntax for validation.","HTML5 cannot be used for offline web applications."],"a":1,"e":"HTML5 embeds audio and video without plugins.","s":"bank","w":["CSS still styles pages.","","HTML5 does not require XHTML syntax.","HTML5 supports offline apps."]},{"id":"b11-68","u":11,"q":"In XHTML, which rule must always be followed that is not mandatory in HTML5?","o":["Attribute values must be in quotes","All tags must be written in uppercase","Inline styles are not allowed at all","Comments must end with //"],"a":0,"e":"XHTML requires quoted attribute values.","s":"bank","w":["","XHTML requires lowercase.","Inline styles are allowed.","XML comments use \u003c!-- -->."]},{"id":"b11-69","u":11,"q":"Which of the following tags is obsolete and should not be used in HTML5?","o":["\u003cmarquee>","\u003cvideo>","\u003csection>","\u003carticle>"],"a":0,"e":"\u003cmarquee> is obsolete and non-standard; use CSS animation instead. \u003cvideo>, \u003csection> and \u003carticle> are HTML5 elements.","s":"bank","w":["","\u003cvideo> is HTML5.","\u003csection> is HTML5.","\u003carticle> is HTML5."]},{"id":"b11-70","u":11,"q":"Which CSS selector targets all \u003cp> elements inside a \u003cdiv> element?","o":["div + p","div > p","div p","p div"],"a":2,"e":"'div p' (space) is a descendant selector: any \u003cp> inside a \u003cdiv>.","s":"bank","w":["div + p selects a \u003cp> right after a \u003cdiv>.","div > p selects only direct children.","","p div selects divs inside paragraphs."]},{"id":"b11-71","u":11,"q":"The principle of consistency in web design mainly ensures that:","o":["Every page has a unique layout.","All elements appear and behave similarly across pages.","Users can freely customise the interface on every page.","The design automatically resizes images."],"a":1,"e":"Consistency means elements look and behave the same across pages.","s":"bank","w":["Unique layouts break consistency.","","Customisation is a different feature.","Resizing is responsiveness."]},{"id":"b11-72","u":11,"q":"“Ease of use” primarily relates to:","o":["Visual aesthetics","Friendly navigation and interaction","Database management and storage","Code readability"],"a":1,"e":"Ease of use is about friendly navigation and interaction.","s":"bank","w":["Looks are aesthetics.","","Databases are back-end.","Code readability is for developers."]},{"id":"b11-73","u":11,"q":"A responsive website:","o":["Detects the user's mood and changes colour","Adapts its layout to different screen sizes","Loads only in desktop browsers","Uses HTML only, without any CSS"],"a":1,"e":"Responsive layouts adapt to screen size and device.","s":"bank","w":["Sites cannot detect mood.","","Responsive sites work on all devices.","CSS is needed."]},{"id":"b11-74","u":11,"q":"Which of the following improves accessibility the most?","o":["Using bright, detailed background images","Using inline JavaScript for
