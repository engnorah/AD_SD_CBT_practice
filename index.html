thm?","o":["Flowchart","Pseudocode","UML","Data model"],"a":0,"e":"A flowchart draws an algorithm with symbols and arrows.","s":"book","k":6,"w":["","Pseudocode is text, not graphical.","UML is a modelling language for software design, not mainly for algorithms.","A data model shows data structure, not algorithm steps."]},{"id":"sb21","u":3,"q":"What is the main goal of Quality Assurance (QA)?","o":["To produce more products in less time","To improve the speed of the software","To ensure products meet specified requirements","To reduce the cost of the company's marketing campaigns"],"a":2,"e":"QA ensures products meet specified requirements.","s":"book","k":19,"w":["Productivity is not QA's main goal.","Speed is one aspect; QA ensures all requirements are met.","","Marketing cost is unrelated."]},{"id":"sb22","u":3,"q":"What does ISO stand for?","o":["International Standards Organisation for Industry","Internal Software Operations","Institute of Safety Operations","International Organization for Standardization"],"a":3,"e":"ISO = International Organization for Standardization.","s":"book","k":19,"w":["The official name has no \"for Industry\".","ISO is not about software operations.","ISO is not a safety institute.",""]},{"id":"sb23","u":3,"q":"Which standard is most commonly used for quality management systems?","o":["ISO 9001","ISO 14000","ISO 27001","ISO 50001"],"a":0,"e":"ISO 9001 = quality management; 14000 = environment; 27001 = information security.","s":"book","k":19,"w":["","ISO 14000 is environmental management.","ISO 27001 is information security.","ISO 50001 is energy management."]},{"id":"sb24","u":3,"q":"What does a QA process typically involve?","o":["Coding and testing only","Planning, assurance and improvement","Advertising and branding","Only an evaluation of the final product"],"a":1,"e":"QA covers planning, assurance and continuous improvement.","s":"book","w":["QA is broader than coding and testing.","","Advertising is marketing.","QA runs throughout, not only at the end."]},{"id":"sb25","u":3,"q":"In quality assurance, what is a 'standard'?","o":["A company policy","A coding method","A documented technical agreement","A strategy for marketing the product"],"a":2,"e":"A standard is a documented agreement of technical specifications.","s":"book","k":19,"w":["A policy is internal; a standard is an agreed documented specification.","A coding method is a practice, not a standard in QA terms.","","Marketing strategy is unrelated."]},{"id":"sb26","u":3,"q":"Which activity is part of quality control, not QA?","o":["Process definition","Process auditing","Product testing","Staff training"],"a":2,"e":"QC checks the product (testing); QA improves the process.","s":"book","w":["Defining processes is QA.","Auditing processes is QA.","","Training staff is QA."]},{"id":"sb27","u":3,"q":"What is the difference between QA and QC?","o":["QA fixes bugs, QC prevents them","QA is process-oriented, QC is product-oriented","QA happens after production, while QC happens before it","QA is optional, QC is mandatory"],"a":1,"e":"QA = process; QC = product.","s":"book","w":["This reverses them: QA prevents, QC finds and fixes.","","QA runs throughout; QC checks the product.","Both are important parts of quality."]},{"id":"sb28","u":3,"q":"What is the benefit of following international standards like ISO?","o":["Faster production time","Better slogans for marketing the product","Recognised, consistent quality","Lower staff wages"],"a":2,"e":"Standards give recognised, consistent quality.","s":"book","k":19,"w":["Speed is not the main benefit.","Slogans are marketing.","","Wages are unrelated."]},{"id":"sb29","u":3,"q":"Which best describes the purpose of Quality Assurance (QA)?","o":["Fixing bugs after the release","Ensuring the processes used work correctly","Testing the final product for defects","Maintaining the security of the finished system"],"a":1,"e":"QA focuses on the processes.","s":"book","k":19,"w":["Fixing bugs after release is maintenance.","","Testing the product is QC.","Security is a separate concern."]},{"id":"sb30","u":3,"q":"What is the main goal of Quality Control (QC) in software development?","o":["Writing code that meets requirements","Ensuring the whole team follows the same coding standards","Identifying and fixing defects in the actual product","Reviewing budget and timelines"],"a":2,"e":"QC finds and fixes defects in the product.","s":"book","w":["Writing code is development.","Following coding standards is a QA process.","","Budgets are project management."]},{"id":"sb31","u":3,"q":"What is the main role of an operating system?","o":["To increase the size of the RAM","To manage hardware and software resources","To write and format documents","To design, build and publish the company's web pages"],"a":1,"e":"The OS manages hardware and software resources.","s":"book","k":26,"w":["The OS cannot increase physical RAM.","","Writing documents is an application's job.","Web design is an application's job."]},{"id":"sb32","u":3,"q":"What are device drivers?","o":["Software that makes the computer run faster","Applications that organise and manage files","Programs that let the OS talk to hardware","Games that test the hardware's performance"],"a":2,"e":"Drivers let the OS talk to hardware.","s":"book","k":25,"w":["Drivers do not mainly speed the computer up.","File managers organise files.","","Drivers are not games."]},{"id":"sb33","u":3,"q":"Which is an example of an input device?","o":["Printer","Monitor","Keyboard","Speaker"],"a":2,"e":"Keyboards send data into the computer.","s":"book","w":["A printer is output.","A monitor is output.","","A speaker is output."]},{"id":"sb34","u":3,"q":"Which is an example of an output device?","o":["Scanner","Mouse","Microphone","Monitor"],"a":3,"e":"Monitors display output.","s":"book","w":["A scanner is input.","A mouse is input.","A microphone is input.",""]},{"id":"sb35","u":3,"q":"What happens if a device driver is missing or corrupted?","o":["The device works faster","The device stops working properly","The operating system repairs the driver automatically","Nothing"],"a":1,"e":"Without a working driver the device can't communicate with the OS.","s":"book","k":25,"w":["A missing driver does not make devices faster.","","The OS does not usually repair drivers automatically; it must be reinstalled.","The device will not work properly."]},{"id":"sb36","u":3,"q":"What type of software is a device driver?","o":["Utility software","Application software","System software","Antivirus software"],"a":2,"e":"Drivers are system software.","s":"book","k":25,"w":["Utility software maintains the computer, for example disk clean-up.","Application software does user tasks.","","Antivirus is a security utility."]},{"id":"sb37","u":3,"q":"What is the purpose of an input/output system in an OS?","o":["To control the resolution and brightness of the display","To manage the power supply","To coordinate data exchange with devices","To run games and media software"],"a":2,"e":"The I/O system coordinates data exchange with devices.","s":"book","w":["Display settings are a control-panel task.","Power is managed by power management.","","Games are applications."]},{"id":"sb38","u":3,"q":"Which part of the OS handles I/O management?","o":["Task manager","I/O subsystem","File explorer","Control panel"],"a":1,"e":"The I/O subsystem manages input and output.","s":"book","w":["Task Manager shows running programs.","","File Explorer manages files.","Control Panel holds settings."]},{"id":"sb39","u":3,"q":"What is Plug and Play?","o":["A music streaming feature","Automatic recognition of new devices","A utility that boosts the computer's performance","A platform for online games"],"a":1,"e":"Plug and Play detects and configures new devices automatically.","s":"book","w":["Plug and Play is not about music.","","It does not boost performance.","It is not a gaming platform."]},{"id":"sb40","u":3,"q":"Why do different devices need different drivers?","o":["All devices are made by the same company","Each device needs specific instructions","The OS cannot support any devices itself","Drivers are needed to raise device prices"],"a":1,"e":"Each device needs instructions specific to its hardware.","s":"book","k":25,"w":["Devices come from many makers.","","The OS supports devices through drivers.","Drivers are not about price."]},{"id":"sb41","u":14,"q":"Which type of firewall filters traffic based on IP addresses and port numbers?","o":["Proxy firewall","Packet-filtering firewall","Circuit-level gateway","Stateful firewall"],"a":1,"e":"Packet-filtering firewalls check addresses and ports on each packet.","s":"book","k":92,"w":["Proxy firewalls relay traffic.","","Circuit-level gateways check sessions.","Stateful firewalls track connections."]},{"id":"sb42","u":14,"q":"What does an SSL certificate ensure?","o":["Faster website speed","Authentication and encryption","Free access to all of the content","Open-source licensing"],"a":1,"e":"Certificates authenticate the server and enable encryption.","s":"book","k":94,"w":["Speed is unrelated.","","Access is unrelated.","Licensing is unrelated."]},{"id":"sb43","u":14,"q":"Which of these is commonly used for encrypting emails?","o":["SMTP","IMAP","PGP","FTP"],"a":2,"e":"PGP (and S/MIME) encrypt email; SMTP/IMAP only transfer it.","s":"book","k":95,"w":["SMTP sends email.","IMAP retrieves email.","","FTP transfers files."]},{"id":"sb44","u":14,"q":"Which malware spreads without user interaction?","o":["Virus","Worm","Adware","Rootkit"],"a":1,"e":"Worms self-replicate across networks; viruses need a host and user action.","s":"book","k":96,"w":["Viruses need user action.","","Adware shows ads.","Rootkits hide in a system."]},{"id":"sb45","u":14,"q":"What is the primary goal of a Denial-of-Service (DoS) attack?","o":["To steal user data","To slow down or crash a system","To spread malware","To install backdoors on the server"],"a":1,"e":"DoS attacks availability.","s":"book","k":97,"w":["Stealing data is a breach.","","Spreading malware is a worm.","Backdoors are a different attack."]},{"id":"sb46","u":14,"q":"Why is Linux a preferred OS for web servers?","o":["High licensing costs","Its open-source nature and security features","Its incompatibility with most web applications","Lack of community support"],"a":1,"e":"Linux is open source, stable and secure.","s":"book","k":93,"w":["Linux is free.","","Linux is widely compatible.","Linux has strong community support."]},{"id":"sb47","u":14,"q":"What is the primary function of a Trojan horse?","o":["It copies itself across a network","It pretends to be legitimate software","It encrypts files and demands payment","It attacks weaknesses in web forms"],"a":1,"e":"A Trojan pretends to be legitimate.","s":"book","k":96,"w":["Self-copying is a worm.","","Encrypting for payment is ransomware.","Form attacks are injection."]},{"id":"sb48","u":14,"q":"What is a common email-based cyber threat?","o":["Phishing","IP spoofing","ARP poisoning","Man-in-the-middle attack"],"a":0,"e":"Phishing emails trick users into giving information.","s":"book","k":95,"w":["","IP spoofing fakes addresses.","ARP poisoning attacks local networks.","MITM intercepts traffic."]},{"id":"sb49","u":14,"q":"An IT administrator needs to prevent malware infections on company systems. What is the best solution?","o":["Keep using the old antivirus software unchanged","Disable system updates","Implement endpoint security solutions","Open all email attachments"],"a":2,"e":"Endpoint security (up-to-date antivirus, patching) protects each device.","s":"book","k":96,"w":["Old antivirus misses new threats.","Updates are essential.","","Opening attachments spreads malware."]},{"id":"sb50","u":14,"q":"An organisation needs to secure HTTP transactions. What should it implement?","o":["Plain HTTP","SSL/TLS encryption","Telnet","FTP"],"a":1,"e":"HTTPS = HTTP over SSL/TLS.","s":"book","k":94,"w":["Plain HTTP is not secure.","","Telnet is plain text.","FTP is plain text."]},{"id":"sb51","u":14,"q":"Which DOCSIS feature helps protect against unauthorised access?","o":["Content encryption using symmetric keys","Baseline Privacy Interface for secure transmission","Multi-user VPN tunnelling at modem level","Cloud-based authentication for home Wi-Fi modems"],"a":1,"e":"DOCSIS Baseline Privacy Interface (BPI/BPI+) encrypts cable-modem traffic.","s":"book","k":98,"w":["This describes encryption in general; the named DOCSIS feature is Baseline Privacy Interface.","","DOCSIS does not provide VPN tunnelling at the modem.","DOCSIS secures the cable link, not home Wi-Fi log-ins."]},{"id":"sb52","u":14,"q":"Which WPA3 feature helps prevent password-guessing attacks?","o":["Static IP address assignment","SAE (Simultaneous Authentication of Equals)","A session timeout after several failed login attempts","Firewall integration with DNS"],"a":1,"e":"SAE resists offline dictionary attacks.","s":"book","k":100,"w":["Static IPs do not stop password guessing.","","A lock-out timeout is not the WPA3 mechanism; SAE is.","DNS integration is not a WPA3 feature."]},{"id":"sb53","u":14,"q":"What is the main focus of the Secure Electronic Transaction (SET) protocol?","o":["Protecting users' passwords on video streaming platforms","Securing online credit card transactions and identity","Monitoring social media","Blocking phishing emails"],"a":1,"e":"SET secures online card payments.","s":"book","k":101,"w":["SET protects card payments, not streaming passwords.","","Social media monitoring is unrelated.","Phishing filters are separate tools."]},{"id":"sb54","u":14,"q":"What does a digital signature in S/MIME confirm?","o":["The sender is genuine and content unchanged","The email was forwarded by another user","The message was sent from the official app","The message was sent from a secure computer"],"a":0,"e":"Signatures prove the sender and integrity.","s":"book","k":95,"w":["","Forwarding is unrelated.","The app is unrelated.","The computer is unrelated."]},{"id":"sb55","u":14,"q":"TLS is mainly used to:","o":["Encrypt traffic between browser and server","Redirect users from expired domains","Identify unused ports on a server","Prevent users from sharing their screen"],"a":0,"e":"TLS encrypts traffic between client and server.","s":"book","k":94,"w":["","Redirects are unrelated.","Port scanning is unrelated.","Screen sharing is unrelated."]},{"id":"sb56","u":14,"q":"A company wants to reduce the impact of DDoS attacks on its web servers. What should it do?","o":["Use a Content Delivery Network (CDN)","Disable firewalls","Use weak passwords","Allow all incoming traffic through the firewall"],"a":0,"e":"CDNs spread and absorb traffic across many servers.","s":"book","k":93,"w":["","Disabling firewalls is unsafe.","Weak passwords are unsafe.","Allowing all traffic is unsafe."]},{"id":"sb57","u":14,"q":"Which step negotiates the cipher suite and establishes encryption keys in TLS?","o":["SSL cache","TCP handshake","TLS handshake","Session logging"],"a":2,"e":"The TLS handshake agrees the cipher suite and keys.","s":"book","k":94,"w":["A cache stores data.","TCP handshake opens the connection, not encryption.","","Logging records events."]},{"id":"sb58","u":14,"q":"Which pair of protocols secures both website data and email content?","o":["WEP and SSL","DOCSIS and WPA3","TLS and S/MIME","VPN and MAC filtering"],"a":2,"e":"TLS secures web traffic; S/MIME secures email content.","s":"book","k":95,"w":["WEP is broken.","DOCSIS and WPA3 are network access.","","VPN and MAC filtering are network access."]},{"id":"sb59","u":14,"q":"A university wants to secure its domain names and student email. Which pair should it implement?","o":["HTTP and TLS","DNSSEC and S/MIME","VPN and SET","SMTP and DOCSIS"],"a":1,"e":"DNSSEC protects DNS; S/MIME protects email.","s":"book","k":95,"w":["HTTP is not secure.","","VPN and SET are unrelated.","SMTP and DOCSIS are unrelated."]},{"id":"sc1","u":5,"q":"What is the primary purpose of formatting a document?","o":["To correct spelling errors","To make it appealing and readable","To create hyperlinks between pages","To add footnotes to each page"],"a":1,"e":"Formatting makes a document attractive and easy to read.","s":"book","k":37,"w":["Spell-check corrects spelling.","","Hyperlinks are inserted, not formatting.","Footnotes add notes, not formatting."]},{"id":"sc2","u":5,"q":"What is the difference between a user guide and a manual?","o":["There is no real difference between them","Manuals are short and user guides are long","User guides focus on users; manuals are more technical","Manuals are promotional, while user guides teach the product"],"a":2,"e":"User guides focus on everyday use; manuals can go deeper into operation and maintenance.","s":"book","k":35,"w":["They differ in focus and depth.","Length is not the difference.","","Manuals are not promotional; brochures are."]},{"id":"sc3","u":5,"q":"What are styles in a document used for?","o":["Setting the page margins","Applying consistent formatting","Saving the file automatically","Inserting images and tables"],"a":1,"e":"Styles apply the same formatting everywhere.","s":"book","k":34,"w":["Margins are page setup.","","Auto-save is a file setting.","Images and tables are inserted objects."]},{"id":"sc4","u":5,"q":"Which document format is best for final distribution of non-editable content?","o":["DOC","PDF","TXT","RTF"],"a":1,"e":"PDF keeps a fixed layout and discourages editing.","s":"book","k":36,"w":["DOC can be edited.","","TXT has no formatting.","RTF can be edited."]},{"id":"sc5","u":5,"q":"A .DOCX file is associated with which software?","o":["Adobe Reader","Microsoft Word","Excel","Notepad"],"a":1,"e":"DOCX is the Word format.","s":"book","k":36,"w":["Adobe Reader opens PDFs.","","Excel uses XLSX.","Notepad uses TXT."]},{"id":"sc6","u":5,"q":"How do you change the appearance of all headings in a document at once?","o":["Edit each heading manually","Change the theme","Modify the Heading style","Use Find and Replace"],"a":2,"e":"Changing the style updates every heading that uses it.","s":"book","k":34,"w":["Editing each heading by hand is slow and inconsistent.","A theme changes colours and fonts everywhere, not only headings.","","Find and Replace changes text, not formatting."]},{"id":"sc7","u":5,"q":"What is the main purpose of a document template?","o":["To remove all formatting","To add citations and references","To provide a predefined layout","To check grammar and spelling"],"a":2,"e":"Templates give new documents a ready-made layout.","s":"book","k":34,"w":["Templates add formatting.","References are added with a citation tool.","","Grammar is checked by a spell checker."]},{"id":"sc8","u":5,"q":"What must a document use so a table of contents can be created automatically?","o":["Images","Page breaks","Heading styles","Templates"],"a":2,"e":"The table of contents is built from heading styles.","s":"book","k":34,"w":["Images are not used to build a contents list.","Page breaks start new pages.","","Templates may include headings, but the TOC needs heading styles."]},{"id":"sc9","u":5,"q":"What is the purpose of an index in a document?","o":["To display the authors' names","To list terms with page numbers","To show all the hyperlinks","To list the references used"],"a":1,"e":"An index lists key terms with page numbers.","s":"book","k":34,"w":["Authors are on the title page.","","Hyperlinks are not listed in an index.","References are listed in a bibliography."]},{"id":"sc10","u":5,"q":"What does blue, underlined text in a document usually indicate?","o":["A font","A comment","A hyperlink","A footnote"],"a":2,"e":"Hyperlinks are shown blue and underlined by default.","s":"book","w":["A font is a typeface.","Comments appear in the margin.","","Footnotes are small numbered notes."]},{"id":"sc11","u":5,"q":"Which format is commonly used for images inserted in documents?","o":[".DOCX",".JPG",".TXT",".XLSX"],"a":1,"e":"JPG is an image format.","s":"book","w":["DOCX is a Word document.","","TXT is plain text.","XLSX is a spreadsheet."]},{"id":"sc12","u":5,"q":"What is the main goal of a brochure?","o":["To troubleshoot errors","To promote products or services","To teach programming","To log customer support calls"],"a":1,"e":"Brochures promote.","s":"book","k":35,"w":["Troubleshooting is in manuals.","","Programming is taught in tutorials.","Call logs are support records."]},{"id":"sc13","u":5,"q":"Who commonly uses manuals?","o":["Marketing staff","Support engineers and operators","Graphic designers","Journalists and reporters writing product reviews"],"a":1,"e":"Manuals guide the people who operate and support a system.","s":"book","k":35,"w":["Marketing staff use brochures.","","Designers use style guides.","Journalists use press releases."]},{"id":"sc14","u":5,"q":"What do tutorials often include?","o":["Interactive examples","Price lists","Index pages","Executive bios"],"a":0,"e":"Tutorials teach through step-by-step examples.","s":"book","k":35,"w":["","Price lists are sales material.","Index pages are part of long documents.","Biographies are not tutorial content."]},{"id":"sc15","u":5,"q":"How does understanding the target audience help in documentation?","o":["Makes documents longer","Lets you use more technical jargon in the text","Lets you tailor content to user needs","Increases file size"],"a":2,"e":"Know the audience, then match content and language to them.","s":"book","k":37,"w":["Length is not the goal.","Jargon should match the audience, not be increased.","","File size is irrelevant."]},{"id":"sc16","u":5,"q":"What type of questions are typical in document review surveys?","o":["Opinion-based and rating scales","Riddles and puzzles","Coding challenges","Only yes/no answers with no comments"],"a":0,"e":"Surveys use rating scales and opinion questions.","s":"book","k":39,"w":["","Riddles are not survey questions.","Coding challenges are not review questions.","Surveys usually allow comments as well."]},{"id":"sc17","u":5,"q":"Which element improves the readability of a document?","o":["Large blocks of unbroken text","Formal grammar with long sentences","Clear headings and bullet points","Complex vocabulary and jargon"],"a":2,"e":"Headings and bullets break text into readable parts.","s":"book","k":37,"w":["Large blocks are hard to read.","Long sentences reduce readability.","","Jargon reduces readability."]},{"id":"sc18","u":5,"q":"Which of the following improves accessibility?","o":["Using colour as the only way to convey information","Adding alternative text to images","Flashing animations","Long load times"],"a":1,"e":"Alt text lets screen readers describe images.","s":"book","w":["Colour alone excludes colour-blind users.","","Flashing can trigger seizures.","Slow loading hurts all users."]},{"id":"sc19","u":5,"q":"What does a document review workshop usually involve?","o":["Each reviewer reading alone","Group discussion and analysis","Promotion on social media","Automated grammar checking"],"a":1,"e":"Workshops are group discussions.","s":"book","k":39,"w":["Reading alone is an individual review.","","Social media is promotion.","Automated checking is a tool, not a workshop."]},{"id":"sc20","u":5,"q":"Which documentation is essential for software applications?","o":["Developer biographies","User manuals and API docs","Car repair guides","Real estate listings"],"a":1,"e":"Users need manuals; developers need API documentation.","s":"book","k":35,"w":["Biographies are not essential.","","Car repair guides are unrelated.","Property listings are unrelated."]},{"id":"sc21","u":10,"q":"What is an essential principle of good web design?","o":["Using bright colours","Ensuring easy navigation","Avoiding images","Making text very small"],"a":1,"e":"Easy navigation is central to usable design.","s":"book","w":["Bright colours can distract.","","Images are useful.","Small text hurts readability."]},{"id":"sc22","u":10,"q":"Which scripting language is commonly used to add interactivity to web pages?","o":["Java","C++","JavaScript","Python"],"a":2,"e":"JavaScript runs in the browser.","s":"book","k":76,"w":["Java runs on servers or desktops, not in pages.","C++ is not used in browsers.","","Python is not used in browsers."]},{"id":"sc23","u":10,"q":"Why should web developers test websites in different browsers?","o":["To ensure consistent performance","To increase website speed","To improve the site's search engine ranking","To reduce HTML tags"],"a":0,"e":"Browsers differ, so test that the site works the same in each.","s":"book","k":77,"w":["","Testing does not speed sites.","SEO is not the reason.","Testing does not reduce tags."]},{"id":"sc24","u":10,"q":"What does responsive web design achieve?","o":["It works well on different screen sizes","It loads faster on every connection","It shows more images on large screens","It needs less CSS than other designs"],"a":0,"e":"Responsive layouts adapt to the screen.","s":"book","k":76,"w":["","Speed is performance.","Image count is unrelated.","It may need more CSS."]},{"id":"sc25","u":10,"q":"What does screen resolution affect?","o":["The size of the browser window on the screen","How text is written in HTML","How images and layouts are displayed","Internet speed"],"a":2,"e":"Resolution changes how images and layouts appear.","s":"book","k":78,"w":["Window size is set by the user.","HTML is written the same way.","","Resolution does not affect speed."]},{"id":"sc26","u":10,"q":"What is the full form of W3C?","o":["Web 3.0 Community","World Wide Web Consortium","Website Coding Corporation","Wide Web Creative"],"a":1,"e":"W3C = World Wide Web Consortium.","s":"book","k":79,"w":["W3C has nothing to do with Web 3.0.","","W3C is a consortium of members, not a corporation.","Invented name; W3C means World Wide Web Consortium."]},{"id":"sc27","u":10,"q":"What does the W3C do in web development?","o":["Designs commercial websites","Sets web const GLOSS = [{"t":"High-Level Language","ar":"لغة عالية المستوى","d":"A language that is easy for people to read and write, such as Java or Python. It must be translated into machine code.","u":1,"da":"لغة برمجة سهلة القراءة والكتابة للإنسان مثل جافا وبايثون، ويجب ترجمتها إلى لغة الآلة."},{"t":"Assembly Language","ar":"لغة التجميع","d":"A low-level language that uses short codes (mnemonics) for machine instructions. An assembler translates it.","u":1,"da":"لغة منخفضة المستوى تستخدم رموزًا مختصرة لتعليمات الآلة، ويترجمها المُجمِّع (Assembler)."},{"t":"Machine Language","ar":"لغة الآلة","d":"The basic binary code (0s and 1s) that a computer's processor can execute directly.","u":1,"da":"الشيفرة الثنائية (0 و1) التي ينفذها المعالج مباشرة."},{"t":"Programming Tools","ar":"أدوات البرمجة","d":"Software utilities that assist in the development, debugging, and maintenance of programs.","u":1,"da":"برامج مساعدة تُستخدم في كتابة البرامج وتصحيح أخطائها وصيانتها."},{"t":"Editor","ar":"المحرِّر","d":"A text-based tool for writing and editing source code. May be standalone or part of an IDE.","u":1,"da":"أداة نصية لكتابة الشيفرة المصدرية وتعديلها، قد تكون مستقلة أو جزءًا من بيئة تطوير متكاملة."},{"t":"Compiler","ar":"المُترجِم","d":"A program that converts high-level code into machine code or low-level language for execution.","u":1,"da":"برنامج يترجم الشيفرة عالية المستوى بالكامل إلى شيفرة الآلة قبل التنفيذ."},{"t":"Interpreter","ar":"المفسِّر","d":"A tool that executes high-level code line by line without requiring prior compilation.","u":1,"da":"أداة تنفذ الشيفرة عالية المستوى سطرًا بسطر دون ترجمة مسبقة للبرنامج كاملًا."},{"t":"Object-Oriented Programming (OOP)","ar":"البرمجة كائنية التوجه","d":"A programming paradigm based on objects, which contain data and methods.","u":1,"da":"نمط برمجة يعتمد على الكائنات التي تجمع البيانات والدوال (الطرق) معًا."},{"t":"Database Programming","ar":"برمجة قواعد البيانات","d":"Designing and managing databases using programming languages to structure and manipulate data.","u":1,"da":"كتابة برامج تنشئ قواعد البيانات وتخزن البيانات وتسترجعها وتعدلها."},{"t":"Algorithm","ar":"الخوارزمية","d":"A sequence of steps or instructions to solve a problem or perform a task.","u":1,"da":"سلسلة من الخطوات المرتبة لحل مشكلة أو تنفيذ مهمة."},{"t":"Flowchart","ar":"المخطط الانسيابي","d":"A diagram that represents an algorithm or process using symbols and arrows.","u":1,"da":"مخطط يمثل الخوارزمية أو العملية باستخدام رموز وأسهم."},{"t":"Pseudocode","ar":"الشيفرة الزائفة (الكود الوصفي)","d":"A structured description of an algorithm written in plain language.","u":1,"da":"وصف منظم للخوارزمية بلغة بسيطة دون قواعد لغة برمجة حقيقية."},{"t":"Unified Modeling Language (UML)","ar":"لغة النمذجة الموحدة","d":"A standardized modeling language for visualizing software design and structure.","u":1,"da":"لغة نمذجة قياسية تُستخدم لرسم تصميم البرمجيات وبنيتها بالمخططات."},{"t":"Structured Programming","ar":"البرمجة الهيكلية","d":"A paradigm using sequences, loops, and conditional statements for clarity and reliability.","u":1,"da":"نمط برمجة يعتمد على التسلسل والتفرع والتكرار لجعل البرنامج واضحًا وموثوقًا."},{"t":"Spaghetti Code","ar":"الشيفرة المتشابكة (السباغيتي)","d":"Poorly organized source code, often resulting from excessive use of GOTO statements.","u":1,"da":"شيفرة سيئة التنظيم ومتشابكة، غالبًا بسبب الإفراط في استخدام أوامر GOTO."},{"t":"Variable","ar":"المتغيِّر","d":"A named storage location that holds data and can change during execution.","u":1,"da":"موقع تخزين له اسم يحمل قيمة يمكن أن تتغير أثناء تنفيذ البرنامج."},{"t":"Expression","ar":"التعبير","d":"A combination of variables, constants, and operators that produce a value.","u":1,"da":"مزيج من المتغيرات والثوابت والعوامل ينتج قيمة."},{"t":"Data Types","ar":"أنواع البيانات","d":"A classification specifying the type of value a variable can hold.","u":1,"da":"تصنيف يحدد نوع القيمة التي يمكن أن يحملها المتغير، مثل عدد صحيح أو نص."},{"t":"Loop","ar":"الحلقة التكرارية","d":"A control structure that repeats a block of code until a condition is met.","u":1,"da":"بنية تحكم تكرر مجموعة من التعليمات حتى يتحقق شرط معين."},{"t":"Branching","ar":"التفرُّع","d":"A control structure allowing different blocks of code based on conditions.","u":1,"da":"بنية تحكم تختار تنفيذ تعليمات مختلفة حسب شرط معين، مثل if/else."},{"t":"User Interface (UI)","ar":"واجهة المستخدم","d":"The point of interaction between a user and a software application.","u":1,"da":"نقطة التفاعل بين المستخدم والتطبيق البرمجي."},{"t":"Event Handling","ar":"معالجة الأحداث","d":"A mechanism where code responds to user actions like clicks or key presses.","u":1,"da":"آلية تجعل الشيفرة تستجيب لأفعال المستخدم مثل النقر أو الضغط على المفاتيح."},{"t":"Activity Diagram","ar":"مخطط النشاط","d":"A UML diagram that shows the flow of activities in a process, including decisions.","u":2,"da":"مخطط UML يوضح تسلسل الأنشطة في عملية ما، بما فيها نقاط القرار."},{"t":"Class Diagram","ar":"مخطط الفئات","d":"A UML diagram that shows a system's classes with their attributes, methods and relationships.","u":2,"da":"مخطط UML يوضح فئات النظام وخصائصها ودوالها والعلاقات بينها."},{"t":"Use Case Diagram","ar":"مخطط حالات الاستخدام","d":"A UML diagram that shows actors and the functions (use cases) they perform with the system.","u":2,"da":"مخطط UML يوضح الفاعلين والوظائف (حالات الاستخدام) التي يؤدونها مع النظام."},{"t":"Sequence Diagram","ar":"مخطط التسلسل","d":"A UML diagram that shows the order of messages passed between objects in a scenario.","u":2,"da":"مخطط UML يوضح ترتيب الرسائل المتبادلة بين الكائنات في سيناريو معين."},{"t":"Actor","ar":"الفاعل (المُمثِّل)","d":"An entity that interacts with the system, representing a user or another system that participates in a process.","u":2,"da":"مستخدم أو نظام خارجي يتفاعل مع النظام في مخطط حالات الاستخدام."},{"t":"Class","ar":"الفئة (الصنف)","d":"A blueprint for creating objects, providing initial values for state and implementations of behavior.","u":2,"da":"قالب أو مخطط لإنشاء الكائنات، يحدد خصائصها وسلوكها."},{"t":"Aggregation","ar":"التجميع","d":"A relationship where one class is a part of another class but can exist independently of the container class.","u":2,"da":"علاقة \"جزء من\" ضعيفة: يمكن للجزء أن يوجد مستقلًا عن الكل."},{"t":"Composition","ar":"التركيب","d":"A strong association where one class owns another class, and the owned class cannot exist independently.","u":2,"da":"علاقة \"جزء من\" قوية: لا يمكن للجزء أن يوجد إذا حُذف الكل."},{"t":"Generalization","ar":"التعميم","d":"A relationship in which one class inherits from another, representing an 'is-a' relationship.","u":2,"da":"علاقة وراثة \"هو نوع من\" (is-a) حيث ترث فئة من فئة أخرى."},{"t":"Dependency","ar":"الاعتمادية","d":"A relationship where one class depends on another, and changes in one may affect the other.","u":2,"da":"علاقة تعتمد فيها فئة على أخرى، فقد يؤثر تغيير إحداهما على الأخرى."},{"t":"Multiplicity","ar":"التعددية","d":"Specifies how many instances of one class can be associated with one instance of another class.","u":2,"da":"تحدد عدد الكائنات من فئة التي يمكن أن ترتبط بكائن واحد من فئة أخرى، مثل 1..*."},{"t":"Quality Assurance (QA)","ar":"ضمان الجودة","d":"A systematic process of ensuring a product or service meets specified requirements and standards.","u":2,"da":"عملية منهجية لضمان أن المنتج يلبي المتطلبات والمعايير المحددة، بالتركيز على منع العيوب."},{"t":"ISO 9000","ar":"آيزو 9000","d":"International standards for quality management that help organisations manage quality.","u":2,"da":"مجموعة معايير دولية لإدارة الجودة وضمانها في المؤسسات."},{"t":"Risk Analysis","ar":"تحليل المخاطر","d":"Identifying, assessing and prioritising risks to reduce their impact on a project.","u":2,"da":"تحديد المخاطر وتقييمها وترتيب أولوياتها لتقليل أثرها على المشروع."},{"t":"Quality Standards","ar":"معايير الجودة","d":"Guidelines or benchmarks to ensure software meets required performance and functionality.","u":3,"da":"إرشادات أو مقاييس مرجعية تضمن أن البرمجيات تحقق الأداء والوظائف المطلوبة."},{"t":"Software Development","ar":"تطوير البرمجيات","d":"The process of designing, coding, testing, and maintaining software systems.","u":3,"da":"عملية تصميم البرمجيات وكتابتها واختبارها وصيانتها."},{"t":"Validation","ar":"التحقق من الصلاحية","d":"Verifying that a software product fulfills its intended purpose and requirements.","u":3,"da":"التأكد من أن المنتج البرمجي يحقق الغرض المطلوب منه ويلبي احتياجات المستخدم."},{"t":"Industry-Specific Software","ar":"برمجيات خاصة بالقطاع","d":"Software tailored to the needs of a specific industry, such as healthcare or finance.","u":3,"da":"برمجيات مصممة لاحتياجات قطاع معين مثل الصحة أو المال."},{"t":"Benchmarking Tools","ar":"أدوات القياس المرجعي","d":"Tools used to measure and compare software performance against set standards.","u":3,"da":"أدوات لقياس أداء البرمجيات ومقارنته بمعايير محددة."},{"t":"Software Metrics","ar":"مقاييس البرمجيات","d":"Numerical data used to measure aspects of software, such as performance or error rates.","u":3,"da":"بيانات رقمية تقيس جوانب البرمجيات مثل الأداء أو معدل الأخطاء."},{"t":"Configuration Management","ar":"إدارة التهيئة (الإعدادات)","d":"Controlling and tracking versions and changes so software stays consistent.","u":3,"da":"التحكم في الإصدارات والتغييرات وتتبعها للحفاظ على اتساق البرمجيات."},{"t":"Usability","ar":"سهولة الاستخدام","d":"The ease and efficiency with which users can interact with the software.","u":3,"da":"مدى سهولة وكفاءة تفاعل المستخدمين مع البرنامج."},{"t":"Development Methods","ar":"منهجيات التطوير","d":"Strategies for building and maintaining software, such as Agile or Waterfall.","u":3,"da":"منهجيات لبناء البرمجيات وصيانتها مثل Agile أو Waterfall."},{"t":"Scalability","ar":"قابلية التوسع","d":"The ability of a system to handle a growing workload or be expanded easily.","u":3,"da":"قدرة النظام على تحمل زيادة حجم العمل أو التوسع بسهولة."},{"t":"Defect density","ar":"كثافة العيوب","d":"The number of defects relative to the size of the software, usually per 1,000 lines of code (KLOC).","u":3,"da":"عدد العيوب نسبةً إلى حجم البرنامج، وعادةً لكل ألف سطر من الشيفرة."},{"t":"effort variance","ar":"تباين الجهد","d":"The difference between the actual effort and the planned effort, in person-hours or person-days.","u":3,"da":"الفرق بين الجهد الفعلي والجهد المخطط له، ويُقاس بساعات أو أيام العمل."},{"t":"cyclomatic complexity","ar":"التعقيد الدوري","d":"A metric that counts the independent paths through a program's code; higher means harder to test.","u":3,"da":"مقياس يحسب عدد المسارات المستقلة في شيفرة البرنامج؛ كلما زاد كان الاختبار أصعب."},{"t":"Embedded system","ar":"النظام المضمَّن","d":"A computer system built into a larger device to perform one dedicated function, such as in a washing machine.","u":3,"da":"نظام حاسوبي مدمج داخل جهاز أكبر لأداء وظيفة محددة، مثل نظام الغسالة."},{"t":"Class coupling","ar":"الاقتران بين الفئات","d":"How much classes depend on each other. Low coupling makes code easier to maintain.","u":3,"da":"مدى اعتماد الفئات بعضها على بعض؛ الاقتران المنخفض يجعل الشيفرة أسهل في الصيانة."},{"t":"traceability","ar":"قابلية التتبع","d":"The ability to link each requirement to its design, code and tests throughout the lifecycle.","u":3,"da":"القدرة على ربط كل متطلب بتصميمه وشيفرته واختباراته طوال دورة الحياة."},{"t":"Integration","ar":"التكامل","d":"Combining separate components or systems so they work together as one.","u":3,"da":"دمج المكونات أو الأنظمة المنفصلة لتعمل معًا كوحدة واحدة."},{"t":"Performance degradation","ar":"تدهور الأداء","d":"A drop in a system's speed or responsiveness over time, for example under heavy load.","u":3,"da":"انخفاض سرعة النظام أو استجابته مع الوقت، مثلًا بسبب الحمل الكبير."},{"t":"Multitasking","ar":"تعدد المهام","d":"Running several tasks at once, or switching between them quickly.","u":3,"da":"تنفيذ عدة مهام في الوقت نفسه أو التبديل بينها بسرعة."},{"t":"Multiprocessor","ar":"متعدد المعالجات","d":"A computer that uses two or more processors (CPUs) to run tasks at the same time.","u":3,"da":"حاسوب يستخدم معالجين أو أكثر لتنفيذ المهام في الوقت نفسه."},{"t":"Logging Framework","ar":"إطار التسجيل (السجلات)","d":"A system or tool used to record application events, errors, and other information to help monitor and debug the application.","u":4,"da":"نظام أو أداة تسجل أحداث التطبيق وأخطاءه للمساعدة في المراقبة وتصحيح الأخطاء."},{"t":"Custom Event Log","ar":"سجل أحداث مخصص","d":"A user-defined log that records specific application events, usually for debugging or monitoring purposes.","u":4,"da":"سجل يحدده المطور لتسجيل أحداث معينة في التطبيق لأغراض التصحيح أو المراقبة."},{"t":"Testing Requirements","ar":"متطلبات الاختبار","d":"The specific conditions or features that need to be tested in a software project during the development process.","u":4,"da":"الشروط أو الخصائص المحددة التي يجب اختبارها في المشروع البرمجي."},{"t":"Testing Types","ar":"أنواع الاختبار","d":"Different kinds of testing, such as functional, performance and security testing.","u":4,"da":"أشكال الاختبار المختلفة مثل الاختبار الوظيفي واختبار الأداء واختبار الأمان."},{"t":"Testing Tools","ar":"أدوات الاختبار","d":"Software used to carry out testing, such as GUI testing tools and load testing tools.","u":4,"da":"برامج تُستخدم لإجراء الاختبار مثل أدوات اختبار الواجهة وأدوات اختبار الحمل."},{"t":"Debugging Techniques","ar":"تقنيات تصحيح الأخطاء","d":"Ways to find and fix errors, such as breakpoints and stepping through code.","u":4,"da":"طرق لاكتشاف الأخطاء وإصلاحها مثل نقاط التوقف والتنفيذ خطوة بخطوة."},{"t":"Breakpoints","ar":"نقاط التوقف","d":"A marker that pauses the program at a chosen line so you can inspect variables.","u":4,"da":"علامة توقف تنفيذ البرنامج عند سطر معين لفحص قيم المتغيرات ومسار التنفيذ."},{"t":"Stepping Through Code","ar":"التنفيذ خطوة بخطوة","d":"A debugging technique where the developer runs the code line by line to observe its execution and locate errors.","u":4,"da":"تشغيل الشيفرة سطرًا بسطر لمراقبة التنفيذ وتحديد موضع الخطأ."},{"t":"Unit Test Framework","ar":"إطار اختبار الوحدات","d":"A framework for writing and running tests on individual units of code, such as JUnit.","u":4,"da":"إطار عمل لكتابة وتشغيل اختبارات تفحص كل جزء (وحدة) من البرنامج على حدة، مثل JUnit."},{"t":"Test Progress Reports","ar":"تقارير تقدم الاختبار","d":"Documents that summarise testing so far: tests run, results and open issues.","u":4,"da":"مستند يلخص سير الاختبار: ما تم اختباره والنتائج والمشكلات."},{"t":"Debugging Tools","ar":"أدوات تصحيح الأخطاء","d":"Software tools designed to help developers locate and fix bugs in the code, such as debuggers and profilers.","u":4,"da":"برامج تساعد المطورين على تحديد الأخطاء وإصلاحها مثل المصححات (Debuggers)."},{"t":"Alpha Testing","ar":"اختبار ألفا","d":"Testing done in-house by the organisation before the product goes to external users.","u":4,"da":"اختبار يجريه فريق المؤسسة داخليًا قبل إصدار المنتج لمستخدمين خارجيين."},{"t":"Beta Testing","ar":"اختبار بيتا","d":"Testing by real external users in their own environment before the final release.","u":4,"da":"اختبار يجريه مستخدمون حقيقيون خارج المؤسسة قبل الإصدار النهائي."},{"t":"Test Methods","ar":"طرق الاختبار","d":"Approaches to testing, such as static, dynamic, white-box and black-box testing.","u":4,"da":"طرق الاختبار المختلفة مثل الاختبار الساكن والديناميكي والصندوق الأبيض والأسود."},{"t":"Static Testing","ar":"الاختبار الساكن (الثابت)","d":"Checking code or documents for errors without running the program, for example by review.","u":4,"da":"فحص الشيفرة أو المستندات بحثًا عن الأخطاء دون تشغيل البرنامج."},{"t":"Dynamic Testing","ar":"الاختبار الديناميكي","d":"A testing method that involves executing the program and checking its behavior under different conditions.","u":4,"da":"اختبار يتم بتشغيل البرنامج ومراقبة سلوكه في ظروف مختلفة."},{"t":"White-box Testing","ar":"اختبار الصندوق الأبيض","d":"Testing the internal logic and code paths, by testers who know the code.","u":4,"da":"اختبار المنطق الداخلي ومسارات الشيفرة، ويجريه من يعرف الشيفرة."},{"t":"Black-box Testing","ar":"اختبار الصندوق الأسود","d":"Testing what the software does from its inputs and outputs, without looking at the code.","u":4,"da":"اختبار وظائف البرنامج من خلال المدخلات والمخرجات دون الاطلاع على الشيفرة."},{"t":"Testing GUI","ar":"اختبار واجهة المستخدم الرسومية","d":"Testing that every visual element and interaction of the interface works as expected.","u":4,"da":"اختبار أن جميع عناصر الواجهة الرسومية وتفاعلاتها تعمل كما هو متوقع."},{"t":"Load Testing","ar":"اختبار الحمل","d":"Testing how an application performs under normal and heavy numbers of users.","u":4,"da":"اختبار أداء التطبيق تحت أعداد عادية وكبيرة من المستخدمين."},{"t":"Performance Testing","ar":"اختبار الأداء","d":"Testing the speed, responsiveness and stability of an application under different conditions.","u":4,"da":"اختبار سرعة التطبيق واستجابته واستقراره في ظروف مختلفة."},{"t":"Static Analysis","ar":"التحليل الساكن","d":"Reviewing source code for bugs or weaknesses without running the program.","u":4,"da":"فحص الشيفرة المصدرية بحثًا عن الأخطاء أو الثغرات دون تشغيل البرنامج."},{"t":"Test Coverage","ar":"تغطية الاختبار","d":"A measure of how much of the application’s code is tested during testing, typically expressed as a percentage.","u":4,"da":"مقياس لنسبة الشيفرة التي نفذتها الاختبارات، ويُعبَّر عنه بنسبة مئوية."},{"t":"Test Design","ar":"تصميم الاختبار","d":"Creating the test cases and procedures that check the software works correctly.","u":4,"da":"إعداد حالات الاختبار وإجراءاته لتقييم وظائف البرنامج وأدائه."},{"t":"Defect","ar":"العيب","d":"An error or bug in the software that causes it to behave unexpectedly or fail to meet its requirements.","u":4,"da":"خطأ في البرنامج يجعله يتصرف بشكل غير متوقع أو لا يلبي المتطلبات."},{"t":"Failure","ar":"الإخفاق (الفشل)","d":"The inability of a software application or system to perform as expected, often as a result of a defect or error.","u":4,"da":"عجز البرنامج عن أداء ما هو متوقع منه، وغالبًا ما يكون نتيجة عيب."},{"t":"Quality","ar":"الجودة","d":"How well software meets its requirements, is free of defects and performs as expected.","u":4,"da":"مدى تلبية البرنامج لمتطلباته وخلوه من العيوب وأدائه كما هو متوقع."},{"t":"Verification","ar":"التحقق (المطابقة للمواصفات)","d":"The process of evaluating whether a software product meets the specified requirements and design specifications.","u":4,"da":"التأكد من أن المنتج مبني وفق المتطلبات والمواصفات التصميمية المحددة."},{"t":"Rich Text","ar":"نص منسَّق","d":"Documents that contain text with formatting information, such as fonts, sizes, and images.","u":5,"da":"نص يحتوي على تنسيقات مثل الخطوط والأحجام والصور."},{"t":"Plain Text","ar":"نص عادي","d":"Unformatted text that contains no special formatting or embedded objects.","u":5,"da":"نص بلا أي تنسيق أو عناصر مضمَّنة."},{"t":"Template","ar":"القالب","d":"A pre-formatted document that serves as a starting point for creating new documents.","u":5,"da":"مستند جاهز التنسيق يُستخدم نقطة بداية لإنشاء مستندات جديدة."},{"t":"Font","ar":"الخط","d":"A design for a set of characters, determining how text appears in a document.","u":5,"da":"تصميم لمجموعة من الحروف يحدد شكل النص في المستند."},{"t":"Hyperlink","ar":"الرابط التشعبي","d":"An element in an electronic document that links to another location or document.","u":5,"da":"عنصر في مستند إلكتروني ينقل القارئ إلى موقع أو مستند آخر."},{"t":"Brochure","ar":"الكتيِّب الترويجي","d":"An informative paper document used for advertising or providing information about products or services.","u":5,"da":"مطبوعة تعريفية تُستخدم للإعلان عن منتج أو خدمة أو تقديم معلومات عنها."},{"t":"Manual","ar":"الدليل","d":"A book or pamphlet that contains information about using a product or system.","u":5,"da":"كتاب أو كتيب يشرح كيفية استخدام منتج أو نظام."},{"t":"Tutorial","ar":"الدرس التعليمي","d":"An instructional lesson guiding users through key features and functions.","u":5,"da":"درس يرشد المستخدم خطوة بخطوة إلى أهم الخصائص والوظائف."},{"t":"User Guide","ar":"دليل المستخدم","d":"A document intended to help users understand and operate a system or product.","u":5,"da":"مستند يساعد المستخدمين على فهم النظام أو المنتج وتشغيله."},{"t":"PDF (Portable Document Format)","ar":"صيغة المستند المحمولة","d":"A file format for presenting documents independent of software, hardware, or operating system.","u":5,"da":"صيغة ملف تعرض المستند بالشكل نفسه على أي جهاز أو نظام تشغيل."},{"t":"Readability","ar":"سهولة القراءة (المقروئية)","d":"The ease with which a reader can understand text, influenced by content and typography.","u":5,"da":"مدى سهولة فهم القارئ للنص، وتتأثر بالمحتوى وطريقة التنسيق."},{"t":"Accessibility","ar":"إمكانية الوصول","d":"The extent to which a product or service can be used by people with various abilities.","u":5,"da":"مدى إمكانية استخدام المنتج أو الخدمة من قِبل الأشخاص بمختلف قدراتهم، بمن فيهم ذوو الإعاقة."},{"t":"Target Audience","ar":"الجمهور المستهدف","d":"The intended group of people for whom a product or message is designed.","u":5,"da":"الفئة المقصودة من الناس التي صُمم لها المنتج أو الرسالة."},{"t":"Workshop","ar":"ورشة العمل","d":"A training session or seminar where participants engage in practical activities.","u":5,"da":"جلسة تدريبية يشارك فيها المتدربون في أنشطة عملية."},{"t":"Survey","ar":"الاستبيان","d":"A method of gathering information by asking individuals to respond to questions.","u":5,"da":"طريقة لجمع المعلومات بطرح أسئلة على الأفراد."},{"t":"Graphical User Interface (GUI)","ar":"واجهة المستخدم الرسومية","d":"A visual way of interacting with software using items like windows and icons.","u":6,"da":"طريقة مرئية للتفاعل مع البرنامج باستخدام النوافذ والأيقونات والقوائم."},{"t":"Command Line Interface (CLI)","ar":"واجهة سطر الأوامر","d":"A text-based interface where users type commands to interact with software.","u":6,"da":"واجهة نصية يكتب فيها المستخدم الأوامر للتعامل مع البرنامج."},{"t":"Voice User Interface (VUI)","ar":"واجهة المستخدم الصوتية","d":"Interaction with software through voice commands.","u":6,"da":"التعامل مع البرنامج باستخدام الأوامر الصوتية."},{"t":"Artificial Intelligence (AI)","ar":"الذكاء الاصطناعي","d":"The simulation of human intelligence in machines that perform tasks.","u":6,"da":"محاكاة الذكاء البشري في الآلات لتؤدي مهام تحتاج عادةً إلى تفكير بشري."},{"t":"Text-to-Speech (TTS)","ar":"تحويل النص إلى كلام","d":"Technology that converts written text into spoken words.","u":6,"da":"تقنية تحوّل النص المكتوب إلى كلام منطوق."},{"t":"Alt Text","ar":"النص البديل","d":"Descriptive text added to images to aid visually impaired users.","u":6,"da":"وصف نصي يُضاف إلى الصور لمساعدة المستخدمين ضعاف البصر وقارئات الشاشة."},{"t":"Multi-Factor Authentication (MFA)","ar":"المصادقة متعددة العوامل","d":"A security process that requires multiple methods to verify user identity.","u":6,"da":"إجراء أمني يتطلب أكثر من طريقة للتحقق من هوية المستخدم، مثل كلمة المرور ورمز على الهاتف."},{"t":"Usability Testing","ar":"اختبار سهولة الاستخدام","d":"The process of evaluating a product by testing it with real users.","u":6,"da":"تقييم المنتج بتجربته مع مستخدمين حقيقيين."},{"t":"Responsive Design","ar":"التصميم المتجاوب","d":"A design approach ensuring UIs adapt to various screen sizes and devices.","u":6,"da":"أسلوب تصميم يجعل الواجهة تتكيف مع أحجام الشاشات والأجهزة المختلفة."},{"t":"Biometric Authentication","ar":"المصادقة الحيوية (البيومترية)","d":"Verifying user identity through physical traits like fingerprints or face.","u":6,"da":"التحقق من هوية المستخدم عبر سماته الجسدية مثل البصمة أو الوجه."},{"t":"WCAG","ar":"إرشادات الوصول إلى محتوى الويب","d":"Web Content Accessibility Guidelines: W3C guidelines for making web content accessible to people with disabilities.","u":6,"da":"إرشادات W3C لجعل محتوى الويب متاحًا للأشخاص ذوي الإعاقة."},{"t":"A/B Testing","ar":"اختبار أ/ب","d":"Comparing two versions of a product to see which performs better.","u":6,"da":"مقارنة نسختين من المنتج لمعرفة أيهما يحقق نتائج أفضل."},{"t":"Object","ar":"الكائن","d":"An instance of a class that contains state and behavior.","u":7,"da":"نسخة (مثيل) من الفئة تحتوي على حالة (بيانات) وسلوك (دوال)."},{"t":"Inheritance","ar":"الوراثة","d":"A mechanism in Java where one class can acquire the properties and behaviors of another class.","u":7,"da":"آلية في جافا تتيح لفئة أن تكتسب خصائص وسلوك فئة أخرى باستخدام extends."},{"t":"Interface","ar":"الواجهة","d":"A contract in Java that specifies methods a class must implement.","u":7,"da":"عقد في جافا يحدد الدوال التي يجب على الفئة تنفيذها باستخدام implements."},{"t":"Package","ar":"الحزمة","d":"A namespace for organizing classes and interfaces in a logical manner.","u":7,"da":"مساحة أسماء لتنظيم الفئات والواجهات المترابطة، مثل java.util."},{"t":"Applet","ar":"البريمج (أبليت)","d":"A Java program that can be embedded in a web page and run in a browser.","u":7,"da":"برنامج جافا صغير يُضمَّن في صفحة ويب ويعمل داخل المتصفح (تقنية قديمة)."},{"t":"Event","ar":"الحدث","d":"An occurrence or interaction that the program can respond to, often triggered by the user.","u":7,"da":"فعل أو حدث يستجيب له البرنامج، غالبًا بسبب المستخدم مثل النقر."},{"t":"Method","ar":"الدالة (الطريقة)","d":"A block of code in Java that performs a specific task and is part of a class.","u":7,"da":"مجموعة تعليمات داخل الفئة تؤدي مهمة محددة."},{"t":"Encapsulation","ar":"التغليف","d":"The practice of keeping fields (variables) private and providing access through methods.","u":7,"da":"جعل الحقول خاصة (private) وإتاحة الوصول إليها عبر دوال فقط."},{"t":"Polymorphism","ar":"تعدد الأشكال","d":"The ability of one method call to behave differently depending on the object, for example through overriding.","u":7,"da":"قدرة استدعاء الدالة نفسها على التصرف بشكل مختلف حسب نوع الكائن، مثلًا عبر إعادة التعريف."},{"t":"Exception","ar":"الاستثناء","d":"An event that disrupts the normal flow of the program's instructions.","u":7,"da":"حدث غير متوقع يقطع التسلسل الطبيعي لتنفيذ البرنامج، ويُعالَج بـ try/catch."},{"t":"Reusable Components","ar":"مكونات قابلة لإعادة الاستخدام","d":"Pre-built software parts that can be integrated into projects to save time and effort.","u":8,"da":"أجزاء برمجية جاهزة يمكن دمجها في المشاريع لتوفير الوقت والجهد."},{"t":"Patterns","ar":"الأنماط","d":"Reusable solutions to commonly occurring problems in software design.","u":8,"da":"حلول مجربة وقابلة لإعادة الاستخدام لمشكلات شائعة في تصميم البرمجيات."},{"t":"Framework","ar":"إطار العمل","d":"A ready-made structure of reusable code, tools and components for building applications.","u":8,"da":"هيكل جاهز من الشيفرة والأدوات والمكونات القابلة لإعادة الاستخدام لبناء التطبيقات."},{"t":"Software Repository","ar":"مستودع البرمجيات","d":"A centralized location for storing, managing, and sharing software and code, such as GitHub.","u":8,"da":"مكان مركزي لتخزين الشيفرة وإدارتها ومشاركتها، مثل GitHub."},{"t":"Idioms","ar":"الأساليب الاصطلاحية","d":"Common ways of writing code that are natural to a particular programming language.","u":8,"da":"طرق شائعة لكتابة الشيفرة تناسب لغة برمجة معينة وتُعد الأسلوب الطبيعي فيها."},{"t":"Software Environment","ar":"البيئة البرمجية","d":"A platform or system required to write and execute programming code.","u":8,"da":"المنصة أو النظام اللازم لكتابة الشيفرة وتشغيلها."},{"t":"IDE (Integrated Development Environment)","ar":"بيئة التطوير المتكاملة","d":"A software application that provides tools for programmers, such as Eclipse, to develop and debug code efficiently.","u":8,"da":"تطبيق يجمع أدوات البرمجة مثل المحرر والمترجم والمصحح في مكان واحد، مثل Eclipse."},{"t":"Method Overriding","ar":"إعادة تعريف الدالة","d":"A feature in OOP where a subclass provides a specific implementation of a method already defined in its superclass.","u":8,"da":"أن تقدم الفئة الفرعية تنفيذًا خاصًا بها لدالة معرّفة مسبقًا في الفئة الأم."},{"t":"Waterfall Development Methodology","ar":"منهجية الشلال","d":"A sequential design process where each phase must be completed before the next begins.","u":8,"da":"منهجية متسلسلة يجب فيها إكمال كل مرحلة قبل بدء المرحلة التالية."},{"t":"Agile Development Methodology","ar":"المنهجية الرشيقة (أجايل)","d":"A flexible approach to software development that emphasizes iterative progress and collaboration.","u":8,"da":"منهجية مرنة تعتمد على التكرارات القصيرة والتعاون المستمر مع العميل."},{"t":"Rapid Application Development (RAD)","ar":"التطوير السريع للتطبيقات","d":"A methodology focused on quickly building prototypes with iterative user feedback.","u":8,"da":"منهجية تركز على بناء النماذج الأولية بسرعة مع ملاحظات المستخدمين المتكررة."},{"t":"Content Library","ar":"مكتبة المحتوى","d":"A storage area in applications like Kindle or iTunes for resources like e-books or music.","u":8,"da":"مساحة تخزين في تطبيقات مثل Kindle أو iTunes للكتب الإلكترونية أو الموسيقى."},{"t":"API (Application Programming Interface)","ar":"واجهة برمجة التطبيقات","d":"A set of rules and tools that lets different software systems communicate with each other.","u":9,"da":"مجموعة قواعد وأدوات تتيح للأنظمة البرمجية المختلفة التواصل فيما بينها."},{"t":"Breadcrumbs","ar":"مسار التنقل (فتات الخبز)","d":"A navigation aid showing a user’s location within a website’s hierarchy.","u":9,"da":"أداة تنقل توضح موقع المستخدم داخل هيكل الموقع، مثل: الرئيسية > المنتجات."},{"t":"Blog","ar":"المدونة","d":"An online platform for publishing written content, often informal or conversational.","u":9,"da":"منصة على الإنترنت لنشر المقالات، غالبًا بأسلوب غير رسمي."},{"t":"Caching","ar":"التخزين المؤقت","d":"Storing data temporarily to speed up future requests.","u":9,"da":"تخزين البيانات مؤقتًا لتسريع الطلبات اللاحقة."},{"t":"CDN (Content Delivery Network)","ar":"شبكة توصيل المحتوى","d":"A distributed network of servers that delivers web content to users based on their geographical location.","u":9,"da":"شبكة خوادم موزعة جغرافيًا تقدم محتوى الويب للمستخدم من أقرب خادم إليه."},{"t":"CMS (Content Management System)","ar":"نظام إدارة المحتوى","d":"Software for creating and managing digital content, such as WordPress or Joomla.","u":9,"da":"برنامج لإنشاء المحتوى الرقمي وإدارته دون برمجة، مثل WordPress."},{"t":"CSS (Cascading Style Sheets)","ar":"أوراق الأنماط المتتالية","d":"A style sheet language used to describe the look and formatting of a document written in HTML.","u":9,"da":"لغة تحدد شكل صفحات HTML وتنسيقها مثل الألوان والخطوط والتخطيط."},{"t":"Domain Name","ar":"اسم النطاق","d":"The unique address of a website, such as example.com.","u":9,"da":"العنوان الفريد للموقع على الإنترنت، مثل example.com."},{"t":"DNS (Domain Name System)","ar":"نظام أسماء النطاقات","d":"A system that translates domain names into IP addresses.","u":9,"da":"نظام يحوّل أسماء النطاقات إلى عناوين IP."},{"t":"E-Commerce","ar":"التجارة الإلكترونية","d":"Online buying and selling of goods and services.","u":9,"da":"بيع السلع والخدمات وشراؤها عبر الإنترنت."},{"t":"Markup Language","ar":"لغة الترميز","d":"A system of tags that marks up a document's structure, such as HTML.","u":10,"da":"نظام من الوسوم يحدد بنية المستند ومحتواه، مثل HTML."},{"t":"HTML (HyperText Markup Language)","ar":"لغة ترميز النص التشعبي","d":"The standard markup language for creating web pages and web applications.","u":10,"da":"لغة الترميز القياسية لإنشاء صفحات الويب."},{"t":"HTML5","ar":"الإصدار الخامس من HTML","d":"The current version of HTML, with new semantic elements and built-in audio and video.","u":10,"da":"الإصدار الحالي من HTML، ويضيف عناصر دلالية جديدة ودعمًا مدمجًا للصوت والفيديو."},{"t":"XHTML (eXtensible HyperText Markup Language)","ar":"لغة ترميز النص التشعبي الموسَّعة","d":"A stricter and cleaner version of HTML, based on XML syntax.","u":10,"da":"نسخة أكثر صرامة من HTML تتبع قواعد XML."},{"t":"XML (eXtensible Markup Language)","ar":"لغة الترميز الموسَّعة","d":"A markup language with user-defined tags for storing and exchanging data, readable by people and machines.","u":10,"da":"لغة ترميز بوسوم يحددها المستخدم لتخزين البيانات وتبادلها، ويقرؤها الإنسان والآلة."},{"t":"Web Page Design","ar":"تصميم صفحات الويب","d":"The process of planning, conceptualizing, and arranging content intended for the internet.","u":10,"da":"تخطيط محتوى صفحات الويب وترتيبه وتصميم مظهره."},{"t":"Web and Web Scripting Design Principles","ar":"مبادئ تصميم الويب والبرمجة النصية","d":"Best practices for creating and organizing web pages, ensuring usability, accessibility, and interactivity.","u":10,"da":"أفضل الممارسات لإنشاء صفحات الويب وتنظيمها بحيث تكون سهلة الاستخدام ومتاحة وتفاعلية."},{"t":"Browser Capabilities","ar":"إمكانات المتصفح","d":"Features and functionalities supported by web browsers, affecting how web content is rendered.","u":10,"da":"الخصائص التي يدعمها المتصفح، وتؤثر في طريقة عرض محتوى الويب."},{"t":"Screen Resolution","ar":"دقة الشاشة","d":"The number of pixels displayed on a screen, influencing how web pages appear on different devices.","u":10,"da":"عدد البكسلات المعروضة على الشاشة، ويؤثر في شكل الصفحة على الأجهزة المختلفة."},{"t":"Web Page Standards","ar":"معايير صفحات الويب","d":"Agreed rules and best practices that keep web pages consistent and compatible.","u":10,"da":"قواعد وممارسات متفق عليها تضمن اتساق صفحات الويب وتوافقها."},{"t":"World Wide Web Consortium (W3C)","ar":"اتحاد شبكة الويب العالمية","d":"An international community that develops open standards to ensure the long-term growth of the web.","u":10,"da":"منظمة دولية تضع المعايير المفتوحة للويب مثل HTML وCSS."},{"t":"Accessibility Guidelines","ar":"إرشادات إمكانية الوصول","d":"Principles and techniques used to make web content accessible to all users, including those with disabilities.","u":10,"da":"مبادئ وتقنيات تجعل محتوى الويب متاحًا لجميع المستخدمين، بمن فيهم ذوو الإعاقة."},{"t":"File Formats","ar":"صيغ الملفات","d":"Types of files (e.g., HTML, CSS, JPG, PNG) used to store and exchange data on the web.","u":10,"da":"أنواع الملفات المستخدمة على الويب مثل HTML وCSS وJPG وPNG."},{"t":"Social Networking","ar":"الشبكات الاجتماعية","d":"Online platforms that allow users to create profiles, connect, and communicate with others.","u":12,"da":"منصات على الإنترنت تتيح للمستخدمين إنشاء ملفات شخصية والتواصل مع الآخرين."},{"t":"Twitter (X)","ar":"تويتر (إكس)","d":"A social networking platform used for sharing short posts called tweets.","u":12,"da":"منصة تواصل اجتماعي لمشاركة منشورات قصيرة تسمى تغريدات."},{"t":"LinkedIn","ar":"لينكدإن","d":"A professional networking platform for career development and job opportunities.","u":12,"da":"منصة تواصل مهني للتطوير الوظيفي وفرص العمل."},{"t":"Pinterest","ar":"بنترست","d":"A visual platform for saving and organizing ideas using images called pins.","u":12,"da":"منصة مرئية لحفظ الأفكار وتنظيمها باستخدام صور تسمى pins."},{"t":"Podcast","ar":"البودكاست","d":"A digital audio program that users can listen to online or download.","u":12,"da":"برنامج صوتي رقمي يمكن الاستماع إليه عبر الإنترنت أو تنزيله."},{"t":"Node","ar":"العقدة","d":"A person or entity within a network.","u":12,"da":"شخص أو كيان داخل الشبكة الاجتماعية."},{"t":"Edge","ar":"الحافة (الرابط)","d":"A connection between two nodes in a network.","u":12,"da":"رابط أو علاقة بين عقدتين في الشبكة."},{"t":"Centrality","ar":"المركزية","d":"A measure of how important or influential a node is in a network.","u":12,"da":"مقياس لمدى أهمية العقدة أو تأثيرها في الشبكة."},{"t":"Community","ar":"المجتمع","d":"A group of connected users within a network.","u":12,"da":"مجموعة من المستخدمين المترابطين بقوة داخل الشبكة."},{"t":"Shortest Path","ar":"أقصر مسار","d":"The quickest route connecting two nodes in a network.","u":12,"da":"أقصر طريق يربط بين عقدتين في الشبكة."},{"t":"REST API","ar":"واجهة REST البرمجية","d":"A web-based API that uses HTTP requests to access and manage data.","u":12,"da":"واجهة برمجية على الويب تستخدم طلبات HTTP للوصول إلى البيانات وإدارتها."},{"t":"OAuth 2.0","ar":"بروتوكول التفويض OAuth 2.0","d":"An authorisation standard that gives an app limited access to a user's account without sharing the password.","u":12,"da":"معيار تفويض يمنح التطبيق وصولًا محدودًا إلى حساب المستخدم دون مشاركة كلمة المرور."},{"t":"JSON","ar":"صيغة JSON لتبادل البيانات","d":"A lightweight data format used for exchanging data between systems.","u":12,"da":"صيغة خفيفة لتبادل البيانات بين الأنظمة على شكل أزواج مفتاح وقيمة."},{"t":"GET","ar":"طلب الجلب GET","d":"A request method used to retrieve information from a server.","u":12,"da":"طريقة طلب HTTP تُستخدم لجلب البيانات من الخادم."},{"t":"POST","ar":"طلب الإرسال POST","d":"A request method used to send information to a server.","u":12,"da":"طريقة طلب HTTP تُستخدم لإرسال البيانات إلى الخادم."},{"t":"Rate Limiting","ar":"تحديد معدل الطلبات","d":"A control that limits the number of API requests in a period of time.","u":12,"da":"ضابط يحد من عدد طلبات الواجهة البرمجية خلال فترة زمنية معينة."},{"t":"Semantic Tags","ar":"الوسوم الدلالية","d":"HTML tags that describe the meaning of the content, such as header and footer.","u":12,"da":"وسوم HTML تصف معنى المحتوى مثل header وfooter وnav."},{"t":"Browser","ar":"المتصفح","d":"Software used to access and display websites on the internet.","u":12,"da":"برنامج يُستخدم لفتح مواقع الإنترنت وعرضها."},{"t":"Security Requirements","ar":"متطلبات الأمان","d":"Measures needed to protect systems, data, and networks from threats.","u":14,"da":"الإجراءات اللازمة لحماية الأنظمة والبيانات والشبكات من التهديدات."},{"t":"Password Protection","ar":"حماية كلمة المرور","d":"Methods used to secure passwords from unauthorized access.","u":14,"da":"أساليب تحمي كلمات المرور من الوصول غير المصرح به."},{"t":"Security Policy","ar":"سياسة الأمان","d":"Rules for protecting and managing sensitive information.","u":14,"da":"قواعد مكتوبة لحماية المعلومات الحساسة وإدارتها في المؤسسة."},{"t":"Desktop Computer Security","ar":"أمان الحاسوب المكتبي","d":"Protection of desktop computers from malware and unauthorized access.","u":14,"da":"حماية الحواسيب المكتبية من البرمجيات الخبيثة والوصول غير المصرح به."},{"t":"Password Obscurity","ar":"صعوبة تخمين كلمة المرور","d":"Making passwords hard to guess by using strong combinations.","u":14,"da":"جعل كلمات المرور صعبة التخمين باستخدام تركيبات قوية من الحروف والأرقام والرموز."},{"t":"Firewall","ar":"جدار الحماية","d":"A system that blocks unauthorized network access.","u":14,"da":"نظام يمنع الوصول غير المصرح به إلى الشبكة بتصفية حركة البيانات."},{"t":"Malware Protection","ar":"الحماية من البرمجيات الخبيثة","d":"Tools used to detect and remove harmful software.","u":14,"da":"أدوات لاكتشاف البرمجيات الضارة وإزالتها."},{"t":"Virus Protection","ar":"الحماية من الفيروسات","d":"Tools that protect systems from viruses.","u":14,"da":"أدوات تحمي الأنظمة من الفيروسات."},{"t":"Server Security","ar":"أمان الخوادم","d":"Protecting servers from attacks and unauthorized access.","u":14,"da":"حماية الخوادم من الهجمات والوصول غير المصرح به."},{"t":"Intrusion Detection System (IDS)","ar":"نظام كشف التسلل","d":"A tool that detects suspicious network activity.","u":14,"da":"أداة تكشف النشاط المشبوه في الشبكة وتنبه المسؤولين."},{"t":"User Account Permissions","ar":"صلاحيات حساب المستخدم","d":"Access rights assigned to users.","u":14,"da":"حقوق الوصول الممنوحة لكل مستخدم."},{"t":"Internet Protocol Security","ar":"أمن بروتوكول الإنترنت (IPsec)","d":"A set of protocols (IPsec) that authenticates and encrypts data sent over IP networks.","u":14,"da":"مجموعة بروتوكولات (IPsec) توثّق البيانات المرسلة عبر شبكات IP وتشفرها."},{"t":"Shared Network Resources Protection","ar":"حماية موارد الشبكة المشتركة","d":"Securing shared files, printers, and resources on a network.","u":14,"da":"تأمين الملفات والطابعات والموارد المشتركة على الشبكة."},{"t":"Protocol Security","ar":"أمان البروتوكولات","d":"Protecting communication protocols from attacks.","u":14,"da":"حماية بروتوكولات الاتصال من الهجمات."},{"t":"Servers","ar":"الخوادم","d":"Computers that provide services to other computers on a network.","u":14,"da":"حواسيب تقدم خدمات لأجهزة أخرى على الشبكة."},{"t":"Application Server","ar":"خادم التطبيقات","d":"A server that hosts applications for users.","u":14,"da":"خادم يستضيف التطبيقات ويشغلها للمستخدمين."},{"t":"Web Server","ar":"خادم الويب","d":"A server that delivers web pages to browsers.","u":14,"da":"خادم يرسل صفحات الويب إلى المتصفحات."},{"t":"Email Server","ar":"خادم البريد الإلكتروني","d":"A server that sends and stores emails.","u":14,"da":"خادم يرسل رسائل البريد الإلكتروني ويخزنها."},{"t":"File and Print Server","ar":"خادم الملفات والطباعة","d":"A server that manages shared files and printers.","u":14,"da":"خادم يدير الملفات والطابعات المشتركة."},{"t":"Firewall Server","ar":"خادم جدار الحماية","d":"A server that filters network traffic for security.","u":14,"da":"خادم يصفّي حركة الشبكة لأغراض الأمان."},{"t":"Proxy or Cache Server","ar":"الخادم الوكيل / خادم التخزين المؤقت","d":"A server that stores data temporarily and filters requests.","u":14,"da":"خادم وسيط يخزن البيانات مؤقتًا ويصفّي الطلبات بين المستخدمين والإنترنت."},{"t":"Denial of Service (DoS)","ar":"هجوم حجب الخدمة","d":"An attack that floods a service with traffic so real users cannot reach it.","u":14,"da":"هجوم يُغرق الخدمة بالطلبات حتى لا يتمكن المستخدمون الحقيقيون من الوصول إليها."},{"t":"HTTP","ar":"بروتوكول نقل النص التشعبي","d":"The protocol browsers and web servers use to transfer web pages.","u":14,"da":"البروتوكول الذي يستخدمه المتصفح وخادم الويب لنقل صفحات الويب."},{"t":"SSL","ar":"طبقة المقابس الآمنة","d":"An older protocol for encrypting internet communication, now replaced by TLS.","u":14,"da":"بروتوكول قديم لتشفير الاتصالات عبر الإنترنت، وحلّ محله TLS."},{"t":"TLS","ar":"أمان طبقة النقل","d":"The modern, more secure replacement for SSL that encrypts internet traffic, used by HTTPS.","u":14,"da":"البديل الحديث والأكثر أمانًا لـ SSL لتشفير حركة الإنترنت، ويستخدمه HTTPS."},{"t":"DOCSIS","ar":"مواصفة نقل البيانات عبر شبكات الكابل","d":"The standard for internet access over cable TV networks, used by cable modems.","u":14,"da":"معيار الاتصال بالإنترنت عبر شبكات التلفزيون الكبلي، وتستخدمه أجهزة مودم الكابل."},{"t":"DNSSEC","ar":"امتدادات أمان نظام أسماء النطاقات","d":"Security extensions that digitally sign DNS data so it cannot be forged or changed.","u":14,"da":"امتدادات أمنية توقّع بيانات DNS رقميًا لمنع تزويرها أو تغييرها."},{"t":"IEEE 802.11","ar":"معيار الشبكات اللاسلكية (Wi-Fi)","d":"The family of standards for wireless local networks (Wi-Fi).","u":14,"da":"مجموعة المعايير الخاصة بالشبكات المحلية اللاسلكية (Wi-Fi)."},{"t":"S/MIME","ar":"معيار تأمين البريد الإلكتروني S/MIME","d":"Standard for encrypting and signing emails.","u":14,"da":"معيار لتشفير رسائل البريد الإلكتروني وتوقيعها رقميًا."},{"t":"Encryption","ar":"التشفير","d":"Converting data into a coded form that only authorised people can read.","u":14,"da":"تحويل البيانات إلى صيغة مشفرة لا يقرؤها إلا المصرح لهم."},{"t":"Authentication","ar":"المصادقة","d":"Verifying the identity of a user or system.","u":14,"da":"التحقق من هوية المستخدم أو النظام."},{"t":"Digital Signature","ar":"التوقيع الرقمي","d":"Confirms that data is authentic and unchanged.","u":14,"da":"يؤكد أن البيانات أصلية وصادرة من مرسلها ولم تتغير."},{"t":"Certificate Authority (CA)","ar":"جهة إصدار الشهادات","d":"Issues digital certificates to verify identity.","u":14,"da":"جهة موثوقة تصدر الشهادات الرقمية لإثبات الهوية."},{"t":"HTTPS","ar":"بروتوكول نقل النص التشعبي الآمن","d":"Secure version of HTTP using encryption.","u":14,"da":"النسخة الآمنة من HTTP، وتشفر البيانات باستخدام TLS."},{"t":"Phishing","ar":"التصيُّد الاحتيالي","d":"Fake messages used to steal information.","u":14,"da":"رسائل مزيفة تنتحل جهة موثوقة لسرقة المعلومات مثل كلمات المرور."},{"t":"Spoofing","ar":"الانتحال","d":"Pretending to be another user or system.","u":14,"da":"التظاهر بأنك مستخدم أو نظام آخر لخداع الضحية."},{"t":"Public Key","ar":"المفتاح العام","d":"Used to encrypt data or verify signatures.","u":14,"da":"مفتاح يُشارك علنًا ويُستخدم لتشفير البيانات أو التحقق من التوقيع."},{"t":"Private Key","ar":"المفتاح الخاص","d":"Used to decrypt data or create signatures.","u":14,"da":"مفتاح سري يحتفظ به صاحبه ويُستخدم لفك التشفير أو إنشاء التوقيع."},{"t":"Cookies","ar":"ملفات تعريف الارتباط (الكوكيز)","d":"Small files that store user session data.","u":14,"da":"ملفات صغيرة يخزنها المتصفح لحفظ بيانات جلسة المستخدم وتفضيلاته."},{"t":"Stateless Programming","ar":"البرمجة عديمة الحالة","d":"Each request is handled on its own; the server keeps no memory of earlier requests.","u":14,"da":"يُعالَج كل طلب بشكل مستقل دون أن يتذكر الخادم الطلبات السابقة."},{"t":"Stateful Programming","ar":"البرمجة ذات الحالة","d":"The system remembers earlier interactions, for example in a session.","u":14,"da":"يتذكر النظام التفاعلات السابقة، مثلًا من خلال الجلسة."},{"t":"Data-driven application","ar":"تطبيق قائم على البيانات","d":"An app that relies on data for processing and decisions.","u":16,"da":"تطبيق يعتمد على البيانات في المعالجة واتخاذ القرارات."},{"t":"Well-formed XML","ar":"مستند XML سليم البنية","d":"An XML document that follows correct syntax rules.","u":16,"da":"مستند XML يتبع قواعد الصياغة الصحيحة، مثل وجود عنصر جذر واحد وإغلاق كل وسم."},{"t":"XML Schema (XSD)","ar":"مخطط XML","d":"A file that defines the structure and data types in XML.","u":16,"da":"ملف يحدد بنية مستند XML وأنواع بياناته."},{"t":"XML Validation","ar":"التحقق من صحة XML","d":"Checking if XML follows rules defined in a schema.","u":16,"da":"فحص ما إذا كان مستند XML يتبع القواعد المحددة في المخطط (XSD أو DTD)."},{"t":"XSLT","ar":"لغة تحويل XML","d":"A language used to transform XML documents into other formats.","u":16,"da":"لغة لتحويل مستندات XML إلى صيغ أخرى مثل HTML."},{"t":"Root element","ar":"العنصر الجذر","d":"The top-level element in an XML document.","u":16,"da":"العنصر الأعلى الذي يحتوي جميع العناصر الأخرى في مستند XML."},{"t":"Child element","ar":"العنصر الفرعي (الابن)","d":"An XML element nested inside another element.","u":16,"da":"عنصر XML موجود داخل عنصر آخر."},{"t":"Attribute","ar":"السمة","d":"A name-value pair within an XML element's tag.","u":16,"da":"زوج اسم وقيمة داخل وسم البداية لعنصر XML."},{"t":"Traverse","ar":"الاجتياز (التنقل بين العقد)","d":"To move through elements and attributes in XML.","u":16,"da":"التنقل عبر عناصر XML وسماتها."},{"t":"Serialization","ar":"التسلسل (السَّلسلة)","d":"Converting objects into a format (like XML) for storage.","u":16,"da":"تحويل الكائنات إلى صيغة مثل XML أو JSON لتخزينها أو إرسالها."},{"t":"Deserialization","ar":"إلغاء التسلسل","d":"Rebuilding objects from a stored data format.","u":16,"da":"إعادة بناء الكائنات من البيانات المخزنة بصيغة مثل XML أو JSON."},{"t":"Connection string","ar":"سلسلة الاتصال","d":"A string that contains information to connect to a database.","u":16,"da":"نص يحتوي على المعلومات اللازمة للاتصال بقاعدة البيانات مثل اسم الخادم وقاعدة البيانات."},{"t":"Data source","ar":"مصدر البيانات","d":"The origin or system from which data is retrieved.","u":16,"da":"المكان أو النظام الذي تُجلب منه البيانات."},{"t":"Insert/Update/Delete","ar":"إدراج / تحديث / حذف","d":"Common operations to modify data in a database.","u":16,"da":"العمليات الأساسية لتعديل البيانات في قاعدة البيانات: الإضافة والتحديث والحذف."},{"t":"Data-access layer","ar":"طبقة الوصول إلى البيانات","d":"Part of an app responsible for communication with data sources.","u":16,"da":"جزء التطبيق المسؤول عن التواصل مع مصادر البيانات."},{"t":"Business logic layer","ar":"طبقة منطق الأعمال","d":"Contains rules that control how data is processed.","u":16,"da":"الطبقة التي تحتوي القواعد التي تتحكم في معالجة البيانات."},{"t":"User interface layer","ar":"طبقة واجهة المستخدم","d":"The part of the app users interact with.","u":16,"da":"جزء التطبيق الذي يتعامل معه المستخدم."},{"t":"ODBC","ar":"الاتصال المفتوح بقواعد البيانات","d":"A standard API for accessing database systems.","u":16,"da":"واجهة برمجية قياسية للوصول إلى أنظمة قواعد البيانات المختلفة."},{"t":"Slideshow","ar":"عرض الشرائح","d":"A sequence of slides used to present information visually in a structured way.","u":17,"da":"سلسلة من الشرائح لعرض المعلومات بصريًا بطريقة منظمة."},{"t":"Slide Deck","ar":"مجموعة الشرائح","d":"A group of slides compiled together ts and create dynamic responses.","u":13,"da":"برامج جافا تعمل على خادم الويب، تعالج طلبات العميل وتنشئ استجابات ديناميكية."},{"t":"PHP","ar":"لغة PHP النصية","d":"A server-side scripting language for dynamic web pages, forms, sessions and database access.","u":13,"da":"لغة برمجة نصية تعمل على الخادم لإنشاء صفحات ديناميكية ومعالجة النماذج والجلسات والاتصال بقواعد البيانات."},{"t":"JavaScript","ar":"لغة جافاسكربت","d":"A client-side scripting language that adds interactivity to web pages and can change HTML and CSS.","u":13,"da":"لغة برمجة نصية تعمل في المتصفح، تضيف التفاعل إلى صفحات الويب ويمكنها تعديل HTML وCSS."},{"t":"Session Management","ar":"إدارة الجلسات","d":"Tracking a user's interaction with a web application across several requests.","u":13,"da":"تتبع تفاعل المستخدم مع تطبيق الويب عبر عدة طلبات."},{"t":"DOM (Document Object Model)","ar":"نموذج كائن المستند","d":"An interface that lets scripts read and change a web page's structure, content and style.","u":13,"da":"واجهة تتيح للبرامج النصية قراءة بنية صفحة الويب ومحتواها وتنسيقها وتغييرها."},{"t":"Web Browser","ar":"متصفح الويب","d":"Software used to open and display web pages, such as Chrome or Firefox.","u":13,"da":"برنامج يُستخدم لفتح صفحات الويب وعرضها مثل Chrome وFirefox."},{"t":"Server-side Scripting","ar":"البرمجة النصية في جهة الخادم","d":"Scripts that run on the web server to build dynamic content before it is sent to the browser.","u":13,"da":"برامج نصية تعمل على خادم الويب لإنشاء محتوى ديناميكي قبل إرساله إلى المتصفح."},{"t":"Client-side Scripting","ar":"البرمجة النصية في جهة العميل","d":"Scripts that run in the user's browser to make pages interactive.","u":13,"da":"برامج نصية تعمل في متصفح المستخدم لجعل الصفحات تفاعلية."},{"t":"Web Hosting","ar":"استضافة المواقع","d":"A service that provides server space so a website can be reached on the internet.","u":13,"da":"خدمة توفر مساحة على خادم لكي يكون الموقع متاحًا على الإنترنت."},{"t":"E-commerce Website","ar":"موقع التجارة الإلكترونية","d":"A website where users can browse products or services and buy them online.","u":13,"da":"موقع يتيح للمستخدمين تصفح المنتجات أو الخدمات وشرائها عبر الإنترنت."},{"t":"Interactive Effects","ar":"التأثيرات التفاعلية","d":"Dynamic features on a web page that respond to user actions, such as clicks or form submissions.","u":13,"da":"خصائص ديناميكية في صفحة الويب تستجيب لأفعال المستخدم مثل النقر أو إرسال النماذج."},{"t":"Authentication Cookies","ar":"ملفات تعريف الارتباط للمصادقة","d":"Cookies that keep a user logged in while they browse a website.","u":13,"da":"ملفات تعريف ارتباط تُبقي المستخدم مسجلًا للدخول أثناء تصفح الموقع."},{"t":"Traditional Scripting Language","ar":"لغة برمجة نصية تقليدية","d":"A language used to automate tasks or produce dynamic content, such as PHP.","u":13,"da":"لغة تُستخدم لأتمتة المهام أو إنشاء محتوى ديناميكي، مثل PHP."},{"t":"Primary Key","ar":"المفتاح الأساسي","d":"A field that uniquely identifies each record in a table. It cannot be NULL or repeat.","u":15,"x":1,"da":"حقل يميز كل سجل في الجدول تمييزًا فريدًا، ولا يمكن أن يكون فارغًا أو مكررًا."},{"t":"Foreign Key","ar":"المفتاح الأجنبي","d":"A field in one table that refers to the primary key of another table, linking the two tables.","u":15,"x":1,"da":"حقل في جدول يشير إلى المفتاح الأساسي في جدول آخر ليربط الجدولين."},{"t":"Entity Relationship Diagram (ERD)","ar":"مخطط الكيانات والعلاقات","d":"A diagram of database entities (rectangles), their attributes and the relationships between them.","u":15,"x":1,"da":"مخطط يوضح كيانات قاعدة البيانات (مستطيلات) وخصائصها والعلاقات بينها."},{"t":"Data Dictionary","ar":"قاموس البيانات","d":"The reference set of tables and views that describe the database's own structure (metadata).","u":15,"x":1,"da":"مجموعة جداول وطرق عرض مرجعية تصف بنية قاعدة البيانات نفسها (البيانات الوصفية)."},{"t":"DDL (Data Definition Language)","ar":"لغة تعريف البيانات","d":"SQL commands that define structure: CREATE, ALTER, DROP, TRUNCATE.","u":15,"x":1,"da":"أوامر SQL التي تعرّف البنية: CREATE وALTER وDROP وTRUNCATE."},{"t":"DML (Data Manipulation Language)","ar":"لغة معالجة البيانات","d":"SQL commands that change data: INSERT, UPDATE, DELETE.","u":15,"x":1,"da":"أوامر SQL التي تغير البيانات: INSERT وUPDATE وDELETE."},{"t":"DCL (Data Control Language)","ar":"لغة التحكم بالبيانات","d":"SQL commands that control access: GRANT and REVOKE.","u":15,"x":1,"da":"أوامر SQL التي تتحكم في الصلاحيات: GRANT وREVOKE."},{"t":"LIKE and wildcards","ar":"المعامل LIKE وأحرف البدل","d":"LIKE matches patterns: % = any number of characters, _ = exactly one. 'C%' means starts with C.","u":15,"x":1,"da":"يطابق LIKE الأنماط: % تعني أي عدد من الحروف، و_ تعني حرفًا واحدًا. 'C%' تعني يبدأ بالحرف C."},{"t":"RIGHT JOIN","ar":"الربط الأيمن","d":"Returns every row of the right table plus the matching rows of the left table (NULL where there is no match).","u":15,"x":1,"da":"يعيد جميع صفوف الجدول الأيمن مع الصفوف المطابقة من الجدول الأيسر (NULL عند عدم التطابق)."},{"t":"Data Integrity","ar":"سلامة البيانات","d":"The completeness and accuracy of data in a database.","u":15,"x":1,"da":"اكتمال البيانات ودقتها في قاعدة البيانات."},{"t":"Flat-file Database","ar":"قاعدة بيانات الملف المسطح","d":"All data in a single table or file with no relationships; simple but causes redundancy.","u":15,"x":1,"da":"كل البيانات في جدول أو ملف واحد دون علاقات؛ بسيطة لكنها تسبب تكرار البيانات."},{"t":"Network Database Model","ar":"نموذج قاعدة البيانات الشبكي","d":"Records linked by pointers in a web-like structure that allows many-to-many relationships.","u":15,"x":1,"da":"سجلات مرتبطة بمؤشرات في بنية تشبه الشبكة، وتسمح بعلاقات متعدد إلى متعدد."},{"t":"OSI Transport Layer","ar":"طبقة النقل في نموذج OSI","d":"Layer 4. Manages end-to-end delivery, including flow control (the rate of data transmission) and error recovery.","u":16,"x":1,"da":"الطبقة الرابعة: تدير التوصيل من طرف إلى طرف، بما في ذلك التحكم في التدفق واستعادة الأخطاء."},{"t":"OSI Presentation Layer","ar":"طبقة العرض في نموذج OSI","d":"Laye
