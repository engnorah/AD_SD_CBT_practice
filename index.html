<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITUSD Exam Trainer</title>
<meta name="description" content="CBT practice for the ITUSD-1-1-3 Associate Diploma in Software Development: mock exams, syllabus checklist, review deck and bilingual vocabulary.">
<meta name="theme-color" content="#1f3349">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3349'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%236ea8e8' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: test-centre console. Steel chrome bar on top, workspace card below; unit "blueprint" rail on the dashboard. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --chrome:#1f3349; --chrome-fg:#e8eef5;
  --fg:#18222e; --muted:#5b6878; --line:#d5dbe3; --soft:#f5f7fa;
  --accent:#2563a8; --accent-soft:#e3edf8; --flag:#c98a0b; --flag-soft:#fbf1dc;
  --good:#1d7a4c; --good-soft:#e2f3ea; --bad:#b93a32; --bad-soft:#fbe7e5; --draft:#7a4fb0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img,svg{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);color:var(--chrome-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand small{font-weight:500;opacity:.7;margin-left:8px;font-size:.85rem}
.bar .sp{flex:1}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);color:#fff}
main{max-width:1100px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;font-weight:600;color:var(--muted)}
.panel>*{min-width:0}
.kf{margin-top:6px;font-size:.9rem}
.kf summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.kf ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:4px}
.week{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;background:var(--panel)}
.week.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.week.past{opacity:.75}
.week.brk{background:var(--soft);border-style:dashed}
.task{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.task label{flex:1;min-width:180px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.task .task-done{text-decoration:line-through;color:var(--muted)}
.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px 18px}
details summary{list-style-position:outside}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mode{display:grid;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;color:var(--fg);font:inherit}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode .t{font-family:var(--f-display);font-size:1.15rem;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mode .t span{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.mode.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode.primary .t span,.mode.primary .muted{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .mode.primary,.dk .mode.primary{color:#0f151c}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.flag.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blueprint */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-mono);font-size:.88rem}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.g{background:var(--good)} .meter i.w{background:var(--flag)} .meter i.b{background:var(--bad)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;font-family:var(--f-body)}
.chip.draft{color:var(--draft)} .chip.booklet{color:var(--good)} .chip.sample{color:var(--accent)} .chip.fix{color:var(--good)} .chip.warn{color:var(--flag)} .chip.none{color:var(--muted)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
@media (max-width:820px){.exam{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.qnum{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
@media (hover:none){.keys{display:none}}
.neg{text-decoration:underline;text-underline-offset:3px}
.qtext{font-size:1.12rem;font-weight:500;white-space:pre-wrap;margin-bottom:18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.85rem}
.opt .x{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .l{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .l{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt:disabled{cursor:default}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.nav button{font-family:var(--f-mono);font-size:.8rem;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;position:relative;padding:0}
.nav button.a{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--fg);outline-offset:1px}
.nav button.f::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.nav button.ok{background:var(--good-soft);border-color:var(--good)} .nav button.no{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.feedback{margin-top:16px;border-radius:6px;padding:14px 16px;border:1px solid var(--line);background:var(--soft)}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.src{font-size:.86rem;color:var(--muted);margin-top:4px}
.src b{font-family:inherit;font-size:inherit;color:var(--fg)}
.why{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:.93rem;line-height:1.45;color:var(--muted)}
.why li b{font-family:inherit;font-size:inherit}
.why li .l{font-family:var(--f-mono);font-weight:700;text-transform:uppercase;padding-top:1px}
.why li.ok{color:var(--fg)} .why li.ok .l,.why li.ok b{color:var(--good)}
.why li.no{color:var(--fg)} .why li.no .l,.why li.no b{color:var(--bad)}
.ar{direction:rtl;text-align:right;font-size:1.02rem;line-height:1.6}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:.92rem}
.conf button{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.conf button.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.score{font-family:var(--f-display);font-weight:700;font-size:3.4rem;line-height:1}
.kv{display:flex;gap:28px;flex-wrap:wrap}
.kv div{display:grid}
.kv b{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.review-item{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
.review-item .opt{padding:7px 12px}
.svgbox{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:10px}
.modal{position:fixed;inset:0;background:rgba(10,16,23,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:440px;width:100%;display:grid;gap:14px}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.75rem;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
select{max-width:100%;min-width:0}
select,input[type=number]{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
label.ck{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--soft)}
.hint{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.6rem}.score{font-size:2.6rem}.panel{padding:16px}}
@media (prefers-reduced-motion:no-preference){.opt,.mode,.btn{transition:border-color .12s,background .12s}}
</style>
</head>

<script>
const BANK = [{"id":"b6-1","u":6,"q":"Which of the following is NOT a QA activity?","o":["Code reviews","Process audits","Regression testing","Standards compliance check"],"a":2,"e":"QA is about preventing defects through process (reviews, audits, standards checks). Regression testing finds defects in the product, so it is classed as QC/testing. Some textbooks place regression testing under QA; in this course it counts as testing (quality control).","s":"bank","w":["Code reviews prevent defects through process, so they are QA.","Process audits check the process is followed, so they are QA.","","Checking compliance with standards is a QA activity."]},{"id":"b6-2","u":6,"q":"The WAI is a part of which organization?","o":["ISO","W3C","IEEE","CMMI"],"a":1,"e":"The Web Accessibility Initiative (WAI) is run by the World Wide Web Consortium (W3C).","s":"bank","k":43,"w":["ISO sets general international standards; WAI is not part of it.","","IEEE sets engineering standards such as Wi-Fi.","CMMI is a process-maturity model, not an organisation running WAI."]},{"id":"b6-3","u":6,"q":"WCAG guidelines are organized under which four principles?","o":["Accurate, Reliable, Testable, Secure","Portable, Flexible, Usable, Interactive","Perceivable, Operable, Understandable, Robust (POUR)","Accessible, Navigable, Visible, Efficient (ANVE)"],"a":2,"e":"WCAG is built on four principles, remembered as POUR: Perceivable, Operable, Understandable, Robust.","s":"bank","k":43,"w":["These are general software qualities, not the WCAG principles.","These are not the WCAG principles.","","ANVE is invented; WCAG uses POUR."]},{"id":"b6-4","u":6,"q":"What is the main goal of user testing in software QA?","o":["To identify bugs in source code","To measure system performance under load","To evaluate usability and user satisfaction","To ensure software compiles correctly"],"a":2,"e":"User testing watches real users complete tasks to judge usability and satisfaction, not code correctness or load.","s":"bank","k":42,"w":["Finding code bugs is done by developers and testers, not user testing.","Load is measured by performance testing.","","Compiling is checked by the compiler."]},{"id":"b6-5","u":6,"q":"Which is an example of equity in digital systems?","o":["Offering multiple language support","Limiting system access to a single region","Removing screen reader support","Enforcing a single login method"],"a":0,"e":"Equity means everyone gets fair access. Supporting several languages removes a barrier for non-native speakers.","s":"bank","k":41,"w":["","Limiting access by region reduces fairness.","Removing screen reader support excludes blind users.","One login method may exclude some users."]},{"id":"b6-6","u":6,"q":"Why is it important to provide a text equivalent (alt text) for non-text elements such as images?","o":["To reduce the file size of the image","So screen readers can describe the image","To make the page load more quickly","To improve how the image looks on screen"],"a":1,"e":"Screen readers cannot 'see' images; alt text gives them words to read aloud, making the content accessible.","s":"bank","k":44,"w":["Alt text does not change the image file.","","Alt text does not speed up loading.","Alt text does not change how the image looks."]},{"id":"b6-7","u":6,"q":"Which of the following is an example of providing a text equivalent?","o":["Adding a watermark to an image","Using \u003calt> attribute for an image","Writing captions in bold text","Using animation instead of text"],"a":1,"e":"The alt attribute on \u003cimg> is the standard text equivalent for an image.","s":"bank","k":44,"w":["A watermark protects images; it is not a text equivalent.","","Bold captions are styling, not an equivalent for the image.","Animation replaces text with non-text, the opposite."]},{"id":"b6-8","u":6,"q":"Accessibility requires that text can operate with text-to-speech technology so that:","o":["Assistive technology can read content aloud","Documents load faster on slow connections","Content is automatically translated","Text appears in more readable colours"],"a":0,"e":"Text-to-speech compatibility means assistive technologies can read the content aloud.","s":"bank","k":44,"w":["","Speed is not the purpose of text-to-speech support.","Translation is a separate feature.","Colours are about contrast, not text-to-speech."]},{"id":"b6-9","u":6,"q":"Which user group benefits most from text-to-speech compatibility?","o":["Users with slow internet","Users with visual impairments","Users with old devices","Users with limited device storage"],"a":1,"e":"Text-to-speech mainly serves blind and visually impaired users.","s":"bank","k":44,"w":["Slow internet users are not the main group text-to-speech serves.","","Old devices are not the main group.","Storage is unrelated to text-to-speech."]},{"id":"b6-10","u":6,"q":"Why should documents be readable without style sheets (CSS)?","o":["To improve the colour contrast of the page","So content stays accessible if styles are disabled","To make the pages load faster on slow mobile connections","To hide content that only some users need"],"a":1,"e":"If CSS fails or is turned off, the content and its order must still make sense, especially for assistive tech.","s":"bank","k":45,"w":["Contrast is set with CSS, not by removing it.","","Speed is not the main reason.","Content should not be hidden."]},{"id":"b6-11","u":6,"q":"Which principle of user-centered design ensures that users can easily learn and operate the interface?","o":["Flexibility","Usability","Portability","Scalability"],"a":1,"e":"Usability = how easy the interface is to learn and use. Portability/scalability are technical qualities.","s":"bank","k":46,"w":["Flexibility is about adapting to needs, not ease of learning.","","Portability is moving to other platforms.","Scalability is handling growth."]},{"id":"b6-12","u":6,"q":"In visual design, “consistency” helps users by:","o":["Making the interface faster to load","Removing the need to relearn similar elements","Giving every screen its own colour scheme and layout","Increasing the security of the system"],"a":1,"e":"Consistent elements behave the same everywhere, so users learn once and reuse that knowledge.","s":"bank","k":40,"w":["Consistency does not affect loading speed.","","Different schemes on every screen is the opposite of consistency.","Consistency is not a security feature."]},{"id":"b6-13","u":6,"q":"Why is it important to consider technical parameters (e.g., screen size, resolution, operating system) in UI design?","o":["To make the interface look exactly the same on every platform","To optimize usability and accessibility for different devices","To increase the number of fonts available","To reduce testing requirements"],"a":1,"e":"Different screens, resolutions and operating systems change how a UI behaves, so design must adapt to each.","s":"bank","k":47,"w":["Platforms differ; the aim is good usability on each, not identical looks.","","Font choice is not the reason.","More platforms usually means more testing."]},{"id":"b6-14","u":6,"q":"Which of the following is a typical format for documenting a user interface design?","o":["Flowchart","Wireframe","Gantt chart","Use-case diagram"],"a":1,"e":"A wireframe is the standard skeleton layout used to document a UI design.","s":"bank","k":48,"w":["Flowcharts show process logic.","","Gantt charts show project schedules.","Use-case diagrams show actors and goals, not screen layout."]},{"id":"b6-15","u":6,"q":"A storyboard in UI design is mainly used to:","o":["Plan the budget for the design project","Measure the screen resolution of devices","Document the program code for developers","Show user interaction step by step"],"a":3,"e":"A storyboard shows the sequence of screens/steps a user goes through.","s":"bank","k":48,"w":["Budgets are in project plans.","Screen resolution is measured, not storyboarded.","Code documentation is technical documentation.",""]},{"id":"b6-16","u":6,"q":"A user says, “I prefer talking to my device instead of typing commands or navigating menus.”\nWhich type of interface best suits this preference?","o":["Menu-based Interface","Natural-Language Interface","Command-Line Interface","Graphical User Interface"],"a":1,"e":"Speaking to a device in everyday language is a natural-language (voice) interface.","s":"bank","w":["Menus need clicking or tapping.","","A CLI needs typed commands.","A GUI needs clicking on icons."]},{"id":"b6-17","u":6,"q":"You are testing a mobile app that has very small buttons, low contrast text, and slow navigation. What is the biggest issue in terms of UI design principles?","o":["Usability","Security","Visual attractiveness","Scalability"],"a":0,"e":"Small targets, poor contrast and slow navigation make the app hard to use: a usability problem.","s":"bank","k":46,"w":["","Security is about protection, not these issues.","Attractiveness is not the main problem.","Scalability is about growth."]},{"id":"b6-18","u":6,"q":"Your team needs to present an early interactive version of an app for stakeholder feedback. Which tool would be the best choice?","o":["Notepad","Adobe XD","Google Docs","Command Prompt"],"a":1,"e":"Adobe XD is a prototyping tool that produces clickable, interactive mock-ups for stakeholder feedback.","s":"bank","w":["Notepad is a text editor.","","Google Docs is for documents.","Command Prompt is a command line."]},{"id":"b6-19","u":6,"q":"A government website is being redesigned. During testing, you discover images are missing alt text, making it difficult for screen reader users. Which guideline is being violated?","o":["WCAG","ATAG","UAAG","ARIA"],"a":0,"e":"Missing alt text breaks WCAG (Web Content Accessibility Guidelines).","s":"bank","k":44,"w":["","ATAG covers authoring tools.","UAAG covers browsers and user agents.","ARIA is a set of attributes, not the guideline being broken."]},{"id":"b6-20","u":6,"q":"A web developer wants to make sure their website looks the same across Chrome, Firefox, and Safari. Which W3C goal supports this need?","o":["Encourage Innovation","Promote Interoperability","Ensure Legal Compliance","Increase Business Growth"],"a":1,"e":"Interoperability means web content works the same across different browsers and devices.","s":"bank","k":43,"w":["Innovation is not what makes sites consistent across browsers.","","Legal compliance is a different goal.","Business growth is not a W3C goal."]},{"id":"b6-21","u":6,"q":"You are creating a webpage and want to add a heading followed by a paragraph. Which HTML structure is correct?","o":["\u003ch1>Heading\u003cp>Paragraph\u003c/h1>\u003c/p>","\u003cp>Heading\u003c/p>\u003ch1>Paragraph\u003c/h1>","\u003ch1>Heading\u003c/h1>\u003cp>Paragraph\u003c/p>","\u003cheading>Heading\u003c/heading>\u003cpara>Paragraph\u003c/para>"],"a":2,"e":"Elements must open and close in the right order: \u003ch1>…\u003c/h1> then \u003cp>…\u003c/p>.","s":"bank","w":["Tags overlap and close in the wrong order.","The heading and paragraph are swapped.","","\u003cheading> and \u003cpara> are not HTML tags."]},{"id":"b6-22","u":6,"q":"A company has 100 web pages. The manager wants all pages to use the same font and color scheme. What is the best way to achieve this?","o":["Inline CSS","Internal CSS","External CSS","JavaScript"],"a":2,"e":"One external .css file linked by every page lets you change the whole site's look in one place.","s":"bank","k":45,"w":["Inline CSS must be repeated on every element.","Internal CSS must be repeated on every page.","","JavaScript adds behaviour, not the main way to set styles."]},{"id":"b6-23","u":6,"q":"You want to change the text of a \u003cp> element when a user clicks a button. Which JavaScript feature makes this possible?","o":["Loops","Events","Functions","Variables"],"a":1,"e":"An event (e.g. onclick) runs code when the user acts; that is what changes the text.","s":"bank","w":["Loops repeat code.","","Functions hold code; an event makes it run on click.","Variables store data."]},{"id":"b6-24","u":6,"q":"You are designing a travel booking site. On desktop, it shows a full navigation bar, but on mobile it collapses into a hamburger menu. Which responsive principle is applied?","o":["Fluid layouts","Breakpoints and media queries","Negative space","Progressive enhancement of the layout"],"a":1,"e":"Media queries switch the layout at set screen widths (breakpoints), e.g. collapsing to a hamburger menu.","s":"bank","w":["Fluid layouts stretch smoothly; switching menus needs breakpoints.","","Negative space is white space in design.","Progressive enhancement adds features for capable browsers."]},{"id":"b6-25","u":6,"q":"A food delivery app shows the restaurant name in large bold text, followed by the delivery time in smaller text, and then customer reviews in the smallest font. Which UI/UX principle is being applied?","o":["Alignment","Proximity","Hierarchy","Balance"],"a":2,"e":"Visual hierarchy uses size and weight to show what matters most first.","s":"bank","k":46,"w":["Alignment lines elements up.","Proximity groups related items.","","Balance distributes visual weight."]},{"id":"b6-26","u":6,"q":"Which of the following best demonstrates compliance with quality assurance practices in web development?","o":["Deploying without testing, then monitoring real-time errors in production","Performing unit testing, regression testing, and documenting defect resolutions","Using only manual testing methods without automation","Relying solely on client feedback after deployment"],"a":1,"e":"QA compliance means planned testing (unit + regression) and documenting how defects were fixed.","s":"bank","k":40,"w":["Skipping testing breaks QA.","","Manual-only testing is not the mark of QA compliance.","Relying only on feedback after release is too late."]},{"id":"b6-27","u":6,"q":"A web designer decides to follow international guidelines that ensure web content is perceivable, operable, understandable, and robust. Which framework is the designer applying?","o":["Six Sigma quality assurance","Web Content Accessibility Guidelines (WCAG)","ISO 27001 information security management","Agile Scrum standards"],"a":1,"e":"Perceivable, Operable, Understandable, Robust are the four WCAG principles.","s":"bank","k":43,"w":["Six Sigma is a quality-improvement method.","","ISO 27001 is information security.","Scrum is a project method."]},{"id":"b6-28","u":6,"q":"Which scenario best illustrates equity principles in digital design?","o":["Providing the website only in English to keep the brand consistent everywhere","Offering text captions, multiple language options, and alternative input methods","Designing an interface optimized only for high-end devices","Restricting access to content based on geographic region"],"a":1,"e":"Captions, multiple languages and alternative inputs give every user group fair access, which is equity.","s":"bank","k":44,"w":["English only excludes other speakers.","","High-end only excludes many users.","Restricting by region reduces access."]},{"id":"b6-29","u":6,"q":"Which testing method directly evaluates real users’ interaction to ensure usability?","o":["White-box testing of the code","Usability testing with real users","Automated regression testing","Penetration testing by experts"],"a":1,"e":"Usability testing puts real, representative users in front of the system.","s":"bank","k":42,"w":["White-box testing tests code.","","Regression testing checks for side effects.","Penetration testing checks security."]},{"id":"b6-30","u":6,"q":"The WAI initiative by W3C primarily aims to:","o":["Improve search engine rankings for websites","Make web content accessible to disabled people","Enforce copyright protection for web content","Standardise the programming languages of the web"],"a":1,"e":"WAI's aim is guidelines that make the web accessible to people with disabilities.","s":"bank","k":43,"w":["Search ranking is SEO.","","Copyright is legal protection.","WAI does not standardise programming languages."]},{"id":"b6-31","u":6,"q":"Which of the following reflects compliance with accessibility and equity legislation in an e-learning system?","o":["Locking resources to premium subscribers only","Meeting ADA (disability law) requirements","Enforcing strict password complexity rules","Requiring proprietary software to log in"],"a":1,"e":"Meeting disability law (e.g. ADA) is accessibility/equity compliance.","s":"bank","k":41,"w":["Paywalls do not support equity.","","Password rules are security.","Proprietary log-ins reduce access."]},{"id":"b6-32","u":6,"q":"Which of the following is not governed by W3C standards?","o":["HTML","CSS","XML","Python"],"a":3,"e":"W3C sets web standards such as HTML, CSS and XML. Python is a general programming language outside W3C.","s":"bank","k":43,"w":["HTML is a W3C standard.","CSS is a W3C standard.","XML is a W3C standard.",""]},{"id":"b6-33","u":6,"q":"Which practice aligns with accessibility standards for non-text content?","o":["Embedding high-resolution images without alt attributes","Using alt text for images to describe their purpose or content","Relying solely on video narration without captions","Using decorative fonts in graphical logos without description"],"a":1,"e":"Alt text describing an image's purpose is the core rule for non-text content.","s":"bank","k":44,"w":["Missing alt text breaks the rule.","","Videos need captions.","Logos need a text description."]},{"id":"b6-34","u":6,"q":"An e-book application ensures its content is machine-readable so that users with visual impairments can access it using screen readers. This is an example of:","o":["Accessibility compliance for text-to-speech support","Security feature for intellectual property protection","Cross-browser compatibility","Cloud deployment advantage"],"a":0,"e":"Machine-readable text lets screen readers speak it, which is text-to-speech accessibility.","s":"bank","k":44,"w":["","This is about access, not protection.","Cross-browser is about browsers.","Cloud is about hosting."]},{"id":"b6-35","u":6,"q":"Which design choice satisfies accessibility guidelines?","o":["Showing errors only with a red highlight","Red highlight plus a text message such as “Invalid input”","Marking required fields only in green","Separating the page sections using only colour gradients"],"a":1,"e":"Never rely on colour alone; add a text message too so colour-blind users understand.","s":"bank","k":45,"w":["Colour alone excludes colour-blind users.","","Green alone still relies on colour.","Gradients alone rely on colour."]},{"id":"b6-36","u":6,"q":"Why is it important that documents remain readable without CSS style sheets?","o":["To make pages more visually appealing","So assistive technologies and text-only browsers can read them","To reduce the page load time for users on mobile networks","To meet W3C rules for multimedia files"],"a":1,"e":"Without CSS, text-only browsers and assistive technologies must still get readable content.","s":"bank","k":45,"w":["Removing CSS makes pages plainer, not more appealing.","","Speed is not the main reason.","Multimedia rules are different."]},{"id":"b6-37","u":6,"q":"Which of the following best represents user-centered design?","o":["Designing around what developers prefer to build","Putting user needs, testing and feedback at the centre","Copying layouts that are popular on other websites","Choosing attractive themes over accessibility needs"],"a":1,"e":"User-centred design puts end-user needs, testing and feedback at the centre.","s":"bank","k":46,"w":["Developer preference is not user-centred.","","Copying others ignores your users.","Accessibility needs come first."]},{"id":"b6-38","u":6,"q":"Which technical parameter must developers consider when designing applications to ensure consistent user interface behavior across different platforms such as Android and iOS?","o":["Screen sizes, resolutions, and OS-specific guidelines","Only backend database performance","Aesthetic preferences of the designer","Colour choices that align with the company's brand identity"],"a":0,"e":"Screen sizes, resolutions and each platform's OS guidelines decide how a UI behaves on Android vs iOS.","s":"bank","k":47,"w":["","The database does not decide UI behaviour.","Personal taste is not a technical parameter.","Brand colours are not a technical parameter."]},{"id":"b6-39","u":6,"q":"Which format is most suitable for documenting user interface workflows for both stakeholders and developers?","o":["UML class diagrams and code","Site maps, wireframes and storyboards","Regression test cases and logs","Gantt charts and the project's budget plan"],"a":1,"e":"Site maps, wireframes and storyboards are understood by both stakeholders and developers.","s":"bank","k":48,"w":["Class diagrams and code are too technical for stakeholders.","","Test cases and logs record testing.","Gantt charts and budgets are project management."]},{"id":"b6-40","u":6,"q":"You are asked to evaluate a government services website. During testing, you find that the “Apply Now” button is visible but cannot be accessed through a screen reader. Which principle has been violated?","o":["Text-to-speech operability of interactive elements","W3C markup validation of the page's HTML","Equity requirements set out in disability legislation","Colour contrast between text and background"],"a":0,"e":"A button screen readers cannot reach fails text-to-speech operability of interactive elements.","s":"bank","k":44,"w":["","Markup validation checks HTML syntax.","Equity is broader; the failure is specific to screen-reader operability.","Contrast is about colour, not screen readers."]},{"id":"b6-41","u":6,"q":"A university is launching an e-learning portal. During pilot testing, students complain that the platform works well on desktops but key navigation buttons are hidden on mobile browsers. Which design issue is most likely the cause?","o":["Ignoring user-centred design and cross-platform needs","Failing to validate the CSS with the W3C checker","Missing a section of the accessibility legislation","Not translating the portal into more languages"],"a":0,"e":"Hidden buttons on mobile mean the design ignored cross-platform parameters and user-centred design.","s":"bank","k":47,"w":["","CSS validation checks syntax, not hidden buttons.","Legislation is broader than this problem.","Translation is unrelated."]},{"id":"b6-42","u":6,"q":"A new employee training system is being planned. Which standard ensures the user interface meets usability and accessibility requirements?","o":["TCP/IP","W3C WCAG","SQL","ISO 27001"],"a":1,"e":"W3C's WCAG is the standard for usable, accessible interfaces. ISO 27001 is security; TCP/IP is networking.","s":"bank","k":43,"w":["TCP/IP is networking.","","SQL is a database language.","ISO 27001 is security."]},{"id":"b6-43","u":6,"q":"During development, the designer wants to follow usability standards. Which aspect would directly support this?","o":["Increasing server bandwidth","Ensuring database normalization","Conducting user testing sessions","Encrypting passwords"],"a":2,"e":"User testing sessions check directly whether the design meets usability standards.","s":"bank","k":42,"w":["Bandwidth is infrastructure.","Normalisation is database design.","","Encryption is security."]},{"id":"b6-44","u":6,"q":"When considering accessibility legislation, which principle ensures people with vision impairment can access web content?","o":["Keyboard shortcuts","Text-to-speech support","Cloud storage","Responsive layout"],"a":1,"e":"Text-to-speech lets people with vision impairment hear the content.","s":"bank","k":41,"w":["Keyboard shortcuts help motor impairments.","","Cloud storage is unrelated.","Responsive layout is about screen sizes."]},{"id":"b6-45","u":6,"q":"A design team is preparing usability testing with real users. What is the purpose of this activity?","o":["To reduce the load on the server","To check users find the interface intuitive","To make the interface code run more efficiently","To find slow database queries"],"a":1,"e":"Testing with real users confirms the interface is intuitive.","s":"bank","k":42,"w":["Server load is performance testing.","","Code efficiency is not usability.","Slow queries are database testing."]},{"id":"b6-46","u":6,"q":"Which W3C initiative focuses specifically on making the web accessible to people with disabilities?","o":["XML","HTML5","CSS3","WAI"],"a":3,"e":"WAI (Web Accessibility Initiative) is W3C's accessibility programme.","s":"bank","k":43,"w":["XML is a markup language.","HTML5 is a markup language version.","CSS3 is a style sheet language.",""]},{"id":"b6-47","u":6,"q":"A developer is preparing the steps a user follows to book a ticket online. Which task is this?","o":["Formulating content flow","Writing source code","Encrypting payment details","Building server APIs"],"a":0,"e":"Planning the steps a user follows is formulating the content (task) flow.","s":"bank","w":["","Code comes later.","Encryption is security.","APIs are back-end development."]},{"id":"b6-48","u":6,"q":"In a shopping cart system, the 'Add to Cart' button, search bar, and dropdown menus are examples of:","o":["Accessibility guidelines","UI components","Database fields","Algorithms"],"a":1,"e":"Buttons, search bars and drop-downs are UI components (controls).","s":"bank","w":["Guidelines are rules, not on-screen elements.","","Database fields store data.","Algorithms are logic."]},{"id":"b6-49","u":6,"q":"When clicking the 'Submit' button in a registration form, what is the UI action?","o":["Form submission","Server backup","Database update","None of the above"],"a":0,"e":"Clicking Submit triggers the form-submission action.","s":"bank","w":["","Backups are server tasks.","A database update may follow, but the UI action is submitting the form.","\"None of the above\" is wrong, because clicking Submit is a form submission."]},{"id":"b6-50","u":6,"q":"If a website responds to hovering over a navigation link by changing color, this is an example of a:","o":["Usability test","UI event","Database query","Server event"],"a":1,"e":"Hover is a UI event that the page reacts to.","s":"bank","k":45,"w":["A usability test is an evaluation activity.","","A query fetches data.","A server event happens on the server."]},{"id":"b6-51","u":6,"q":"A team decides to build the user interface using JavaScript and React. This step aligns with which objective?","o":["Building backend APIs","Determining the appropriate language","Writing the accessibility report for the UI","Creating user personas"],"a":1,"e":"Picking JavaScript/React is the step of determining the appropriate language.","s":"bank","w":["APIs are back-end.","","Reports come later.","Personas come earlier in research."]},{"id":"b6-52","u":6,"q":"After selecting a language, the developer codes a login form with username and password fields. This represents:","o":["Performing a backup of the user database","Building the UI with required functions","Drafting test cases","Creating wireframes"],"a":1,"e":"Coding a working login form is building the UI with required functionality.","s":"bank","k":48,"w":["Backup is maintenance.","","Test cases are testing.","Wireframes come before coding."]},{"id":"b6-53","u":6,"q":"A student tests a newly developed mobile app to ensure each button works correctly. Which step is this?","o":["Writing HTML","Building UI","Conducting surveys","Testing for functionality"],"a":3,"e":"Checking every button works is functional testing.","s":"bank","w":["Writing HTML is building.","Building is coding, not checking.","Surveys collect opinions.",""]},{"id":"b6-54","u":6,"q":"After discovering that the navigation menu is confusing, the designer revises it until users find it easy to use. This is:","o":["Writing an accessibility report for the menu","Debugging server code","Creating wireframes","Iterating until requirements are met"],"a":3,"e":"Revise → test → revise again until users are satisfied is iteration.","s":"bank","k":48,"w":["A report documents; it does not revise.","Server code is back-end.","Wireframes come earlier.",""]},{"id":"b6-55","u":6,"q":"The final stage of UI development includes writing a help guide for end users and technical notes for developers. This is:","o":["Designing the database for the help system","Running unit tests","Coding in JavaScript","Producing user and technical documentation"],"a":3,"e":"A help guide (users) plus technical notes (developers) is the documentation stage.","s":"bank","w":["Database design is not documentation.","Unit tests are testing.","Coding is building.",""]},{"id":"b6-56","u":6,"q":"Before developing a student portal, the designer researches WCAG 2.1 guidelines. This step corresponds to:","o":["Choosing a CSS framework for the layout","Writing pseudocode for the login logic","Testing the APIs the portal will call","Identifying standards and requirements"],"a":3,"e":"Researching WCAG before building is identifying standards and requirements.","s":"bank","k":43,"w":["A CSS framework is a later build choice.","Pseudocode is design.","API testing comes later.",""]},{"id":"b6-57","u":6,"q":"To ensure accessibility, a team creates a checklist including 'Provide alt text for images' and 'Use sufficient color contrast.' This represents:","o":["Debugging HTML code","Creating an accessibility checklist","Writing JavaScript functions for each check","Conducting interviews"],"a":1,"e":"A list of accessibility items to tick off is an accessibility checklist.","s":"bank","k":44,"w":["Debugging fixes code.","","JavaScript is code.","Interviews collect feedback."]},{"id":"b6-58","u":6,"q":"A developer runs an automated tool such as WAVE to check accessibility compliance. This is:","o":["Applying automatic testing tools","Validating the database schema for errors","Encrypting user data","Writing wireframes"],"a":0,"e":"WAVE is an automatic accessibility-testing tool.","s":"bank","k":48,"w":["","Schema validation is database work.","Encryption is security.","Wireframes are design."]},{"id":"b6-59","u":6,"q":"An e-learning site ensures that every image includes descriptive 'alt text.' This satisfies which requirement?","o":["Designing clear navigation bars","Creating wireframes for each page","Text equivalents for non-text elements","Building a responsive layout for the pages"],"a":2,"e":"Alt text is the text equivalent for non-text elements.","s":"bank","k":44,"w":["Navigation is a different requirement.","Wireframes are design documents.","","Responsive layout is about screen sizes."]},{"id":"b6-60","u":6,"q":"A weather app uses both colors and icons to indicate temperature levels so that users with color blindness can understand. This aligns with:","o":["Optimising server speed","Conducting user surveys","Colour-independent information","Debugging the app's JavaScript code"],"a":2,"e":"Using icons as well as colour means information does not depend on colour alone.","s":"bank","k":45,"w":["Speed is performance.","Surveys collect opinions.","","Debugging fixes code."]},{"id":"b6-61","u":6,"q":"A website developer tests whether the content can be read correctly by screen readers. This ensures:","o":["Backend code quality","Database normalisation","Text-to-speech compatibility","Peer review of the visual design"],"a":2,"e":"Checking screen readers read content correctly verifies text-to-speech compatibility.","s":"bank","k":44,"w":["Code quality is reviewed separately.","Normalisation is database design.","","Peer review checks design, not screen readers."]},{"id":"b6-62","u":6,"q":"A tester disables CSS style sheets to confirm that the page content is still understandable. This step is:","o":["Checking pages without style sheets","Creating wireframes for the pages","Writing test cases for the forms","Encrypting the data on the page"],"a":0,"e":"Turning CSS off to see if content still makes sense is checking pages without style sheets.","s":"bank","k":45,"w":["","Wireframes are design.","Test cases are written earlier.","Encryption is security."]},{"id":"b6-63","u":6,"q":"Which of the following best illustrates the difference between usability and accessibility in a web application?","o":["Usability focuses on keyboard shortcuts, while accessibility focuses only on how the site looks on mobile devices","Usability ensures efficiency for all users, while accessibility ensures inclusivity for people with diverse abilities","Usability applies only to visual design, while accessibility applies only to screen readers","Usability prevents errors, while accessibility eliminates navigation menus"],"a":1,"e":"Usability = efficient and easy for everyone; accessibility = usable by people with diverse abilities.","s":"bank","k":46,"w":["Both definitions are wrong.","","Both are wider than this.","Accessibility does not remove menus."]},{"id":"b6-64","u":6,"q":"A banking website highlights missing fields in red and provides error messages like “Invalid email format.” This feature primarily addresses which usability principle?","o":["Efficiency","Error Management","Memorability","Consistency"],"a":1,"e":"Highlighting the error and explaining it helps users recover, which is error management.","s":"bank","k":46,"w":["Efficiency is speed of use.","","Memorability is ease of remembering.","Consistency is sameness across screens."]},{"id":"b6-65","u":6,"q":"According to compliance strategies, ensuring that all interactive elements can be reached via the Tab key addresses which accessibility requirement?","o":["Screen reader compatibility","Keyboard navigation","Robust content interpretation","Text-to-speech support"],"a":1,"e":"Reaching every control with Tab is keyboard navigation.","s":"bank","k":44,"w":["Screen reader compatibility is about speech output.","","Robustness is about compatibility with technologies.","Text-to-speech is about reading aloud."]},{"id":"b6-66","u":6,"q":"A developer designs an app where visually impaired users can give voice commands to perform tasks. This application demonstrates which type of user interface?","o":["Graphical User Interface (GUI)","Command Line Interface (CLI)","Voice User Interface (VUI)","Natural-Language Processing Interface"],"a":2,"e":"Controlling an app by spoken commands is a Voice User Interface (VUI).","s":"bank","w":["A GUI uses graphics and clicks.","A CLI uses typed commands.","","NLP understands language, but the interface type is VUI."]},{"id":"b6-67","u":6,"q":"Which of the following best describes iterative design in UI development?","o":["Building the entire UI once and releasing it to users","Continuously refining the UI based on feedback and repeated testing","Designing only prototypes without real implementation","Relying only on automated tools to finalise the design without users"],"a":1,"e":"Iterative design = refine, test, get feedback, repeat.","s":"bank","k":48,"w":["Building once is not iterative.","","Prototypes alone are not finished design.","Users must be involved."]},{"id":"b6-68","u":6,"q":"Which feature directly protects passwords during transmission from UI to server?","o":["Client-side validation","Event handling","HTTPS/SSL Encryption","Dynamic styling"],"a":2,"e":"HTTPS (SSL/TLS) encrypts data in transit, so passwords are protected between browser and server.","s":"bank","w":["Client-side validation checks input; it does not protect transmission.","Event handling reacts to actions.","","Styling is visual."]},{"id":"b6-69","u":6,"q":"Why integrate security into the design phase rather than after deployment?","o":["It removes the need for testing","It costs less and prevents flaws early","It removes the need for authentication","It makes the design more attractive"],"a":1,"e":"Fixing security at design time is cheaper and prevents vulnerabilities from being built in.","s":"bank","w":["Testing is still needed.","","Authentication is still needed.","Security is not about looks."]},{"id":"b6-70","u":6,"q":"Which AI-driven feature most directly assists a user with hearing impairments in online lectures?","o":["Predictive text","Automated captions","Keyboard shortcuts","Dynamic color contrast"],"a":1,"e":"Automatic captions turn speech into text for deaf or hard-of-hearing users.","s":"bank","k":44,"w":["Predictive text helps typing.","","Keyboard shortcuts help motor needs.","Contrast helps vision."]},{"id":"b6-71","u":6,"q":"During testing, users fail to find the checkout button in an e-commerce site. Which method revealed this issue?","o":["Heuristic Evaluation","User Testing","A/B Testing","Automated Testing"],"a":1,"e":"Watching real users fail a task is user testing.","s":"bank","k":42,"w":["Heuristic evaluation uses experts, not real users.","","A/B testing compares versions.","Automated testing does not watch users."]},{"id":"b6-72","u":6,"q":"Which of the following is a principle of visual design for user interfaces?","o":["Random placement of elements","Overloading users with information","Using as many colors as possible","Consistency and clarity"],"a":3,"e":"Consistency and clarity are core visual-design principles.","s":"bank","k":40,"w":["Random placement confuses users.","Overload confuses users.","Too many colours distract.",""]},{"id":"b9-1","u":9,"q":"Which type of online application is primarily used by employees within a company for internal processes?","o":["Customer facing","Social","Internal business use","Public forum"],"a":2,"e":"Applications used by staff for internal processes (HR, payroll, workflow) are internal business use.","s":"bank","k":64,"w":["Customer-facing apps serve outside users, not staff.","Social apps connect people publicly.","","Public forums are open discussion sites."]},{"id":"b9-2","u":9,"q":"What is the primary goal of customer-facing applications?","o":["Supporting internal employee collaboration","Broadcasting public news and announcements","Engaging external users and serving them","Managing the company's payroll systems"],"a":2,"e":"Customer-facing apps exist to serve and engage external users, e.g. shoppers or bank customers.","s":"bank","k":62,"w":["Supporting staff collaboration is internal business use.","Public news is information or social use.","","Payroll is internal business use."]},{"id":"b9-3","u":9,"q":"Which category of application does an online store like Amazon fall into?","o":["Social","Internal business use","Customer facing","Open source"],"a":2,"e":"An online store serves the public, so it is customer-facing.","s":"bank","k":62,"w":["Social sites are for networking, not selling.","Internal apps are for staff.","","Open source is a licence type, not an application category."]},{"id":"b9-4","u":9,"q":"Which of the following best describes the role of a database server in a web application architecture?","o":["It manages HTML content and user interface rendering","It handles DNS resolution and routing","It stores, retrieves, and manages structured data for dynamic websites","It encrypts all traffic between the client and the server using SSL"],"a":2,"e":"The database server stores and returns structured data that dynamic pages are built from.","s":"bank","k":68,"w":["HTML and rendering are handled by the web server and browser.","DNS servers and routers do this.","","Encryption is handled by TLS on the web server."]},{"id":"b9-5","u":9,"q":"Which protocol is primarily used to send data securely between a web server and a client?","o":["FTP","HTTP","HTTPS","SMTP"],"a":2,"e":"HTTPS = HTTP + TLS/SSL encryption, so data travels securely.","s":"bank","k":68,"w":["FTP transfers files, usually without encryption.","HTTP is not encrypted.","","SMTP sends email."]},{"id":"b9-6","u":9,"q":"In the client-server model, which component is responsible for initiating communication?","o":["Web server","DNS server","Client","Proxy"],"a":2,"e":"In the client-server model the client (browser) starts the conversation by sending a request; the server responds.","s":"bank","k":68,"w":["The web server responds; it does not start.","DNS answers lookups.","","A proxy passes requests on."]},{"id":"b9-7","u":9,"q":"Which of the following best explains how a reverse proxy server functions in a web application?","o":["It routes outgoing email traffic to users","It acts as a backup database for client requests","It forwards requests to hidden backend servers","It scans uploaded files for malware"],"a":2,"e":"A reverse proxy sits in front of back-end servers, forwards requests to them and hides them from clients.","s":"bank","k":68,"w":["Email is handled by mail servers.","It is not a database.","","Malware scanning is a security tool's job."]},{"id":"b9-8","u":9,"q":"In modern web architecture, what is the main advantage of using microservices on the server side?","o":["They reduce the size of client-side JavaScript","Each component can be built, deployed and scaled alone","They remove the need for any server infrastructure","They automatically generate the user interface"],"a":1,"e":"Microservices split the server side into small services that can each be built, deployed and scaled on their own.","s":"bank","k":68,"w":["Microservices are server-side; they do not shrink client JavaScript.","","Servers are still needed.","They do not generate the UI."]},{"id":"b9-9","u":9,"q":"A user enters a URL into their browser. Which is the first server their request typically contacts?","o":["Web server","Application server","DNS server","Load balancer"],"a":2,"e":"The domain name must first be turned into an IP address, so the DNS server is contacted first.","s":"bank","k":65,"w":["The web server is contacted after the IP address is known.","The application server comes later.","","A load balancer comes after DNS."]},{"id":"b9-10","u":9,"q":"Which of the following best reflects a user-centered design approach when developing a web application?","o":["Focusing only on technical specifications defined by stakeholders","Prioritizing system efficiency over usability","Conducting usability testing ion and collaboration.","s":"bank","k":63,"w":["Customers use public websites.","","Selling is e-commerce.","Social media campaigns are public."]},{"id":"b9-15","u":9,"q":"Which of the following represents the social use of websites?","o":["Social networking and community building","E-commerce platforms","Corporate information pages","Internal training portals for the company's staff"],"a":0,"e":"Social use = networking and building communities.","s":"bank","k":64,"w":["","E-commerce is selling.","Corporate pages give information.","Training portals are internal."]},{"id":"b9-16","u":9,"q":"Online applications provided through websites are mainly used for:","o":["Enabling interactive services like email, banking, or cloud tools","Publishing a company's address, opening hours and contact details","Hosting marketing videos only","Archiving printed documents"],"a":0,"e":"Online applications deliver interactive services such as e-mail, banking and cloud tools.","s":"bank","k":64,"w":["","Contact details are business information, not an online application.","Marketing videos are promotion.","Archiving is storage."]},{"id":"b9-17","u":9,"q":"What is the main function of HTTP in web communication?","o":["Encrypting data between servers","Routing packets between devices","Formatting messages between browser and server","Storing copies of web pages for offline reading"],"a":2,"e":"HTTP defines the request/response message format between browser and server.","s":"bank","k":65,"w":["Encryption is added by TLS in HTTPS.","Routing is done by IP and routers.","","Offline copies are caching."]},{"id":"b9-18","u":9,"q":"Which of the following statements about domains and registrars is correct?","o":["A registrar manages IP routing for ISPs.","A domain is bought directly from ICANN, without using a registrar.","A registrar is an authorized organization that sells and manages domain names.","A register is the URL used to access a website."],"a":2,"e":"A registrar is an accredited company that sells and manages domain names.","s":"bank","k":65,"w":["IP routing is done by ISPs and routers.","Domains are bought through accredited registrars.","","A URL is an address, not a register."]},{"id":"b9-19","u":9,"q":"What role does an Internet Service Provider (ISP) play in web architecture?","o":["Registers domain names","Provides end users with access to the internet","Stores websites on its own hosting servers","Develops web applications"],"a":1,"e":"The ISP connects end users to the Internet.","s":"bank","k":66,"w":["Registrars register domains.","","Hosting companies store websites.","Developers build applications."]},{"id":"b9-20","u":9,"q":"Which of the following best defines a web hosting service?","o":["A service that registers and renews domain names","A service providing server space to put sites online","A protocol that secures communication on the web","A service that gives users faster internet access"],"a":1,"e":"Hosting rents server space and resources so a website is reachable online.","s":"bank","k":66,"w":["That is a registrar.","","That is TLS/HTTPS.","That is an ISP."]},{"id":"b9-21","u":9,"q":"Which factor most directly influences access speeds for end users?","o":["The user's connection and the server's response","The number of characters in the site's URL","The registrar that sold the domain name","The number of cookies stored in the browser"],"a":0,"e":"Access speed depends mainly on the user's connection and how fast the server responds.","s":"bank","k":66,"w":["","URL length has almost no effect on speed.","The registrar does not affect speed.","Cookies have little effect on speed."]},{"id":"b9-22","u":9,"q":"Which feature distinguishes Web 2.0 from the early web?","o":["Static HTML pages only","Focus on user-generated content and interactivity","Absence of social media platforms","Exclusive reliance on email for communication"],"a":1,"e":"Web 2.0 = interactive, user-generated content (blogs, social media, wikis).","s":"bank","k":67,"w":["Static pages describe Web 1.0.","","Web 2.0 brought social media.","Web 2.0 added many communication tools."]},{"id":"b9-23","u":9,"q":"What is the primary difference between a web server and a proxy server?","o":["A web server hosts content, while a proxy server acts as an intermediary to manage requests.","A web server encrypts email traffic, while a proxy server only stores cached files.","A web server manages domains, while a proxy server registers IP addresses.","They perform the same functions but at different speeds."],"a":0,"e":"A web server hosts and delivers content; a proxy sits in the middle handling requests on behalf of others.","s":"bank","k":68,"w":["","Web servers do not handle email.","Domains are managed by registrars.","They do different jobs."]},{"id":"b9-24","u":9,"q":"Which of the following statements about a mail server is accurate?","o":["It stores static HTML pages for client access.","It manages the sending, receiving, and storage of email messages.","It caches frequently visited websites so browsing is faster for users.","It authenticates domain registrations."],"a":1,"e":"Mail servers send, receive and store e-mail.","s":"bank","k":68,"w":["That is a web server.","","That is a proxy or cache server.","That is a registrar."]},{"id":"b9-25","u":9,"q":"Which of the following best describes the role of a wireframe in web design?","o":["A high-fidelity prototype with interactive elements","A rough sketch used only for brainstorming ideas in early meetings","A low-fidelity blueprint focusing on layout and functionality, not style","A storyboard with user interaction sequences"],"a":2,"e":"Wireframes are low-fidelity: layout and function only, no colours or styling.","s":"bank","k":69,"w":["High-fidelity interactive prototypes come later.","Wireframes are used for layout, not only brainstorming.","","Interaction sequences are storyboards."]},{"id":"b9-26","u":9,"q":"A storyboard in web design differs from a wireframe because it:","o atter.","Navigation is not about colours.","","SEO is not the main reason."]},{"id":"b9-30","u":9,"q":"Which of the following is an interactive feature often used to simulate navigation between screens in wireframes or prototypes?","o":["Tables","Hotspots","Templates","Logos"],"a":1,"e":"Hotspots are clickable areas in a prototype that simulate moving between screens.","s":"bank","k":70,"w":["Tables arrange data.","","Templates give layout.","Logos show the brand."]},{"id":"b9-31","u":9,"q":"Which factor is most important when selecting colors and fonts for a website?","o":["They must follow the latest design trends, even when this reduces readability.","They should align with branding but also support readability and accessibility.","They should always be bright to attract users’ attention.","They must be chosen only based on the designer’s preference."],"a":1,"e":"Colours and fonts should reflect the brand but must stay readable and accessible.","s":"bank","k":71,"w":["Trends must not reduce readability.","","Bright colours can hurt readability.","Personal preference is not enough."]},{"id":"b9-32","u":9,"q":"A clothing store launches a website with a banner 'Summer Sale - 30% OFF'. What use of websites does this demonstrate?","o":["Internal training","Social networking","Customer-facing marketing","Information repository"],"a":2,"e":"A sale banner promotes products to customers, which is customer-facing marketing.","s":"bank","k":62,"w":["Training is internal.","Networking is social.","","A repository stores information."]},{"id":"b9-33","u":9,"q":"An electronics shop creates a website where customers can browse items with images, prices, and reviews before buying. Which website use is this?","o":["Online catalogue","Intranet","Proxy server","Training portal"],"a":0,"e":"Browsing items with images, prices and reviews is an online catalogue.","s":"bank","k":62,"w":["","An intranet is internal.","A proxy is a server.","A training portal teaches staff."]},{"id":"b9-
