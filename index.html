s","Use only one style sheet for the site"],"a":2,"e":"Robust sites perform well across environments and updates.","s":"bank","w":["Robustness needs testing.","Old browsers matter too.","","One style sheet is unrelated."]},{"id":"b11-80","u":11,"q":"Which design principle encourages reducing clutter and unnecessary elements?","o":["Flexibility","Robustness","Simplicity","Accessibility"],"a":2,"e":"Simplicity = less clutter.","s":"bank","w":["Flexibility is adapting.","Robustness is lasting.","","Accessibility is access."]},{"id":"b11-81","u":11,"q":"Which of the following is part of W3C’s accessibility guidelines?","o":["Using fixed-width page layouts","Content that is perceivable, operable, understandable and robust","Using non-standard HTML attributes","Limiting the colour contrast of text to reduce eye strain"],"a":1,"e":"WCAG's four principles: Perceivable, Operable, Understandable, Robust.","s":"bank","w":["Fixed widths hurt access.","","Non-standard attributes break standards.","Contrast should be high, not limited."]},{"id":"b11-82","u":11,"q":"The WCAG (Web Content Accessibility Guidelines) is mainly concerned with:","o":["Accessibility for disabled users","Security testing of public websites","Browser speed optimisation","Search engine ranking"],"a":0,"e":"WCAG is about accessibility for people with disabilities.","s":"bank","w":["","Security is a separate area.","Speed is performance.","Ranking is SEO."]},{"id":"b11-83","u":11,"q":"Which of the following is not a purpose of adhering to web standards?","o":["Enhancing compatibility","Improving accessibility","Preventing plagiarism","Maintaining consistency across platforms"],"a":2,"e":"Web standards don't deal with plagiarism.","s":"bank","w":["Compatibility is a purpose of standards.","Accessibility is a purpose of standards.","","Consistency is a purpose of standards."]},{"id":"b11-84","u":11,"q":"Your classmate created a table but didn’t add a title or explain what the headers mean. What should be added to make the table accessible for screen readers?","o":["A \u003ctbody> around the data rows","A \u003ctfoot> with a summary row","A \u003ccaption> and scope on \u003cth>","An \u003ch1> inside the first row"],"a":2,"e":"\u003ccaption> titles the table; scope on \u003cth> explains which cells each header covers.","s":"bank","w":["\u003ctbody> groups rows but gives no title.","\u003ctfoot> adds a footer row.","","A heading inside a row is invalid."]},{"id":"b11-85","u":11,"q":"You are styling a university homepage. The client wants the college name in red, bold, and 40px in Arial font. Which CSS properties will help you achieve that?","o":["font-style, color, text-shadow","font-family, font-size, color, font-weight","margin, text-align, position","text-decoration, line-height, border, padding"],"a":1,"e":"font-family (Arial), font-size (40px), color (red), font-weight (bold).","s":"bank","w":["font-style is italic, not bold, and no size or font is set.","","These are layout properties.","These are decoration and spacing."]},{"id":"b11-86","u":11,"q":"A peer creates an XHTML page but it won’t load in the browser. You notice the \u003cimg> tag is written as \u003cimg>. What should they do?","o":["Add a caption to the image","Use uppercase for the tag","Use \u003cimg src=\"...\" /> with a slash","Use the \u003cimage> tag instead of \u003cimg>"],"a":2,"e":"XHTML empty elements must self-close: \u003cimg ... />.","s":"bank","w":["A caption does not fix the syntax.","XHTML needs lowercase.","","\u003cimage> is not an HTML tag."]},{"id":"b11-87","u":11,"q":"Your instructor asks you to change the background color of all paragraphs on your website. Which CSS selector should you use?","o":[".p {}","p:hover {}","#p {}","p {}"],"a":3,"e":"The element selector p {} targets all paragraphs.","s":"bank","w":[".p is a class selector.","p:hover only applies on hover.","#p is an id selector.",""]},{"id":"b11-88","u":11,"q":"You want only the \u003cp> tags inside a specific \u003cdiv> with id=\"main\" to have red text. Which CSS selector should you use?","o":["div p { color: red; }","#main p { color: red; }",".main p { color: red; }","p#main { color: red; }"],"a":1,"e":"#main p = \u003cp> elements inside the element with id='main'.","s":"bank","w":["div p affects every div.","",".main is a class, not an id.","p#main is a paragraph with that id."]},{"id":"b11-89","u":11,"q":"Your manager asked for a layout that adapts to screen sizes automatically. Which of the following CSS layout techniques is most appropriate?","o":["Tables","Flexbox or Grid","Static positioning","Fixed divs only"],"a":1,"e":"Flexbox and Grid build flexible, adaptive layouts.","s":"bank","w":["Tables are not for layout.","","Static positioning does not adapt.","Fixed divs do not adapt."]},{"id":"b11-90","u":11,"q":"You are testing a new website on both desktop and mobile. You want the images to resize based on the screen size. Which HTML/CSS solution would you use?","o":["Set fixed pixel sizes for every image","Use \u003csvg> format only","Use media queries and percentage widths","Use only \u003ccanvas> tags"],"a":2,"e":"Percentage widths and media queries let images resize.","s":"bank","w":["Fixed sizes do not resize.","SVG suits vector graphics, not all images.","","\u003ccanvas> is for drawing."]},{"id":"b11-91","u":11,"q":"Your team is building a form that collects user names, email addresses, and phone numbers. What HTML5 feature improves input validation without JavaScript?","o":["\u003cselect> dropdowns","\u003cform method=\"get\">","type=\"email\" and type=\"tel\" in \u003cinput>","Placeholder text inside \u003cp> paragraphs"],"a":2,"e":"type='email' and type='tel' give built-in browser validation.","s":"bank","w":["\u003cselect> limits choices; it does not validate email.","method=\"get\" sets how data is sent.","","Placeholders are hints, not validation."]},{"id":"b11-92","u":11,"q":"The training coordinator wants a clear separation between each section of content. Which HTML5 semantic element should be used to wrap each logical section?","o":["\u003cdiv>","\u003csection>","\u003cp>","\u003caside>"],"a":1,"e":"\u003csection> wraps a logical section of content.","s":"bank","w":["\u003cdiv> has no meaning.","","\u003cp> is a paragraph.","\u003caside> is side content."]},{"id":"b11-93","u":11,"q":"You are building a job portal website. One of the users requests that the site should support screen readers and allow navigation using keyboard. What key principle is being requested?","o":["Flexibility","Accessibility","Robustness","Findability"],"a":1,"e":"Screen readers and keyboard navigation = accessibility.","s":"bank","w":["Flexibility is adapting.","","Robustness is lasting.","Findability is locating content."]},{"id":"b11-94","u":11,"q":"You are creating a website for your college. The homepage needs a section for navigation, main content, and a footer.\nWhich HTML5 structure best follows semantic conventions?","o":["\u003cdiv id=\"nav\"> \u003cdiv id=\"main\"> \u003cdiv id=\"footer\">","\u003cnav> \u003csection> \u003cfooter>","\u003cheader> \u003cbody> \u003cfooter>","\u003csection> \u003carticle> \u003caside>"],"a":1,"e":"\u003cnav>, \u003csection>, \u003cfooter> are the semantic elements for those parts.","s":"bank","w":["\u003cdiv>s have no semantic meaning.","","\u003cbody> is not a section element.","These lack nav and footer."]},{"id":"b11-95","u":11,"q":"You created a table showing student grades, but your supervisor says it’s not accessible to screen readers.\nWhat should you add?","o":["\u003ccaption> and scope attributes in \u003cth>","\u003cb> tags for headers","Inline styles with background colors","\u003cfont> tags for readability"],"a":0,"e":"\u003ccaption> and scope make the table understandable to screen readers.","s":"bank","w":["","\u003cb> is visual only.","Colours do not help screen readers.","\u003cfont> is obsolete."]},{"id":"b11-96","u":11,"q":"A webpage uses both inline CSS and an external stylesheet. The external stylesheet sets \u003cp> text to blue, but one paragraph is manually styled with style=\"color: red\".\nWhat color will that paragraph appear as?","o":["Blue, because external stylesheets override inline styles","Red, because inline styles have higher specificity","Depends on browser settings","It won’t display any color"],"a":1,"e":"Inline styles beat external stylesheets, so the paragraph is red.","s":"bank","w":["Inline styles beat external styles.","","CSS rules decide, not settings.","The colour will show."]},{"id":"b11-97","u":11,"q":"A website looks perfect in Chrome but breaks in Internet Explorer.\nWhat should the developer do first?","o":["Remove all CSS animations","Validate the code using the W3C validator","Rewrite all HTML using \u003cdiv> tags only","Disable JavaScript"],"a":1,"e":"Validate first: invalid markup is a common cause of browser differences.","s":"bank","w":["Animations are not the first suspect.","","Rewriting with divs is extreme.","Disabling JavaScript breaks features."]},{"id":"b11-98","u":11,"q":"Your manager asks why the company website looks too small on mobile phones.\nWhat CSS technique will best fix this issue?","o":["Set fixed pixel widths","Use \u003ctable> layouts","Use media queries","Use only inline CSS"],"a":2,"e":"Media queries adjust the layout to the screen width.","s":"bank","w":["Fixed widths cause the problem.","Tables are not responsive.","","Inline CSS cannot target screens."]},{"id":"b11-99","u":11,"q":"While developing a new website for students, you find many users struggling to locate the “Apply Now” button.\nWhat is the best step to take?","o":["Make the button larger and place it in a consistent position","Remove the button and replace it with a small text link in the footer","Reduce contrast to match the site colors","Add more animations to the page"],"a":0,"e":"A larger button in a consistent place is easier to find.","s":"bank","w":["","Hiding it makes it worse.","Low contrast makes it harder to see.","Animations distract."]},{"id":"b11-100","u":11,"q":"A contact form allows users to submit feedback, but hackers started injecting scripts through the input fields.\nWhich security practice will prevent this?","o":["Put the form inside an \u003ciframe>","Add alt text to all the form fields","Sanitise user input to remove code","Send the form using GET requests only"],"a":2,"e":"Sanitising inputs removes injected scripts.","s":"bank","w":["Iframes do not sanitise input.","Alt text is for images.","","GET does not stop injection."]},{"id":"b11-101","u":11,"q":"A client complains that their site does not appear in Google search results.\nWhat should you recommend first?","o":["Add meta tags, alt text, and keywords for SEO","Increase the image size for visibility","Use more \u003cbr> tags for spacing","Move the whole site to a new domain name right away"],"a":0,"e":"Meta tags, alt text and keywords help search engines find the site.","s":"bank","w":["","Bigger images do not help SEO.","\u003cbr> tags do not help SEO.","Changing domain is drastic and loses ranking."]},{"id":"b11-102","u":11,"q":"A student developer uses many outdated \u003cfont> and \u003ccenter> tags in their website.\nWhich W3C standard principle are they violating?","o":["Accessibility","Use of semantic HTML","Security","Findability"],"a":1,"e":"\u003cfont> and \u003ccenter> are presentational; standards call for semantic HTML with CSS for styling.","s":"bank","w":["Accessibility is affected, but the principle broken is semantic HTML.","","Security is unrelated.","Findability is not the main issue."]},{"id":"b12-1","u":12,"q":"Your company wants to instantly share product updates with short messages that include hashtags and links to boost visibility. Which platform best suits this goal?","o":["Twitter","Facebook","LinkedIn","Pinterest"],"a":0,"e":"Twitter (X) is built for short, instant messages with hashtags and links.","s":"bank","k":82,"w":["","Facebook suits communities and longer posts.","LinkedIn suits professional networking.","Pinterest suits visual boards."]},{"id":"b12-2","u":12,"q":"A local café wants to build an online community, share photos, run ads, and engage with customers through comments and groups. Which platform should they focus on?","o":["LinkedIn","Facebook","Pinterest","Twitter"],"a":1,"e":"Facebook combines photos, groups, comments and ads for community building.","s":"bank","k":82,"w":["LinkedIn is for professionals.","","Pinterest is for visual boards.","Twitter is for short messages."]},{"id":"b12-3","u":12,"q":"An HR manager wants to find experienced software developers and post professional job openings. Which social network is best for this?","o":["Facebook","Pinterest","Twitter","LinkedIn"],"a":3,"e":"LinkedIn is the professional network for recruiting and job posts.","s":"bank","k":82,"w":["Facebook is for friends and communities.","Pinterest is for visual ideas.","Twitter is for short updates.",""]},{"id":"b12-4","u":12,"q":"A graphic designer wants to collect and share visual design inspirations, mood boards, and artwork with others in a creative field. Which platform is most appropriate?","o":["Pinterest","Facebook","Twitter","LinkedIn"],"a":0,"e":"Pinterest is for collecting and sharing visual inspiration on boards.","s":"bank","k":82,"w":["","Facebook is general social networking.","Twitter is short messages.","LinkedIn is professional networking."]},{"id":"b12-5","u":12,"q":"A travel enthusiast creates long posts detailing travel experiences, tips, and photos on a personal website updated weekly. What type of social media is this?","o":["Podcast","Blog","Video platform","Image sharing site"],"a":1,"e":"Regular long posts on a personal site = a blog.","s":"bank","k":83,"w":["A podcast is audio.","","A video platform hosts videos.","An image site hosts photos."]},{"id":"b12-6","u":12,"q":"A teacher records weekly discussions about digital marketing trends for students to listen to on Spotify. What form of media is being used?","o":["Video","Blog","Podcast","Social post"],"a":2,"e":"Recorded audio episodes on Spotify = a podcast.","s":"bank","k":83,"w":["Video has pictures.","A blog is written.","","A social post is short and written."]},{"id":"b12-7","u":12,"q":"A photographer uploads portfolios and nature shots to a platform where followers can like and share visual content. What media type does this represent?","o":["Video","Blog","Image","Podcast"],"a":2,"e":"Photo uploads that followers like and share = image media.","s":"bank","k":83,"w":["Video is moving pictures.","A blog is written.","","A podcast is audio."]},{"id":"b12-8","u":12,"q":"A marketing team publishes promotional clips and tutorials on YouTube to increase brand awareness. Which media format are they using?","o":["Audio","Blog","Image","Video"],"a":3,"e":"YouTube clips and tutorials = video.","s":"bank","k":83,"w":["Audio has no pictures.","A blog is written.","An image is a still picture.",""]},{"id":"b12-9","u":12,"q":"A data analyst examines which influencers most effectively spread campaign messages across Instagram by tracking post shares and mentions. What process is being used?","o":["Sentiment analysis","Network analysis","Content curation","Audience targeting"],"a":1,"e":"Tracking how messages spread between users is network analysis.","s":"bank","k":84,"w":["Sentiment analysis measures feelings in posts.","","Curation selects content.","Targeting chooses audiences."]},{"id":"b12-10","u":12,"q":"To understand how news spreads online, a researcher maps how users share articles between groups. What is this mapping activity an example of?","o":["Content scheduling","Keyword tracking","Network analysis","Trend forecasting"],"a":2,"e":"Mapping who shares with whom is network analysis.","s":"bank","k":84,"w":["Scheduling plans posts.","Keyword tracking follows words.","","Forecasting predicts trends."]},{"id":"b12-11","u":12,"q":"Your website allows users to click “Share on Facebook” to publish your site’s article directly on their feed. Which API function is being used?","o":["Pull data from Facebook","Post data to Facebook","Embed live video","Read user comments"],"a":1,"e":"'Share on Facebook' sends (posts) data to Facebook.","s":"bank","k":85,"w":["Pulling reads data from Facebook.","","Live video is embedding.","Reading comments is pulling."]},{"id":"b12-12","u":12,"q":"A “Tweet This” button on a webpage lets visitors automatically post a quote from your article to their Twitter account. What type of integration is this?","o":["Data pull API","Data push (post) API","Database connection","Web scraping"],"a":1,"e":"'Tweet This' pushes content to Twitter, a post/push integration.","s":"bank","k":85,"w":["A pull API reads data.","","No database is involved.","Scraping copies data from pages."]},{"id":"b12-13","u":12,"q":"A website shows the latest posts from a company’s LinkedIn page using an embedded API feed. Which operation is this?","o":["Posting information","Pulling and displaying information","Authenticating the site's users","Uploading media"],"a":1,"e":"Showing LinkedIn posts on your site pulls data from the API.","s":"bank","k":85,"w":["Posting sends data out.","","Authentication is login.","Uploading sends files."]},{"id":"b12-14","u":12,"q":"You add a section on your homepage that displays your latest tweets automatically. Which API feature is used?","o":["Post information","Pull and display data","User login","Share via link"],"a":1,"e":"A live tweet feed pulls and displays data.","s":"bank","k":85,"w":["Posting sends tweets out.","","Login is authentication.","A share link posts content."]},{"id":"b12-15","u":12,"q":"An e-commerce website shows customer reviews from Facebook pages in real time. This is achieved through what API function?","o":["Post data","Retrieve data","Store data","Upload file"],"a":1,"e":"Showing Facebook reviews means retrieving data from the API.","s":"bank","k":85,"w":["Posting sends data.","","Storing is a database task.","Uploading sends files."]},{"id":"b12-16","u":12,"q":"A university’s career page displays alumni LinkedIn profiles directly on its website. Which two concepts are combined here?","o":["Network analysis and podcasts","Social networking (LinkedIn) and API data pull","Facebook marketing and video sharing on the page","Pinterest boards and data posting"],"a":1,"e":"LinkedIn (social networking) data is pulled through the API.","s":"bank","k":85,"w":["Podcasts are not involved.","","Facebook and video are not involved.","Pinterest is not involved."]},{"id":"b12-17","u":12,"q":"A blog site lets users post YouTube videos directly from its editor to their YouTube channel with one click. Which API action is taking place?","o":["Pulling information","Posting information","Sharing image data","Tracking views"],"a":1,"e":"Uploading from your editor to YouTube is posting information.","s":"bank","k":83,"w":["Pulling reads data.","","The content is video, not images.","Tracking views reads statistics."]},{"id":"b12-18","u":12,"q":"A company identifies top influencers in their campaign by measuring the number of retweets and mentions each user generates. What analytical method is applied?","o":["Social listening","Network analysis","SEO optimization","Trend monitoring"],"a":1,"e":"Counting retweets/mentions to find influencers is network analysis.","s":"bank","k":84,"w":["Social listening follows conversations.","","SEO is about search ranking.","Trend monitoring follows topics."]},{"id":"b12-19","u":12,"q":"An artist’s website shows their latest Instagram images using the Instagram API. Which kind of media and API process is involved?","o":["Image media and data pull","Video media and data push","Blog content and data post","Podcast and data retrieval"],"a":0,"e":"Instagram images (image media) pulled into the site.","s":"bank","k":83,"w":["","Instagram images are pulled into the site, not videos pushed out.","A blog post is written content.","A podcast is audio."]},{"id":"b12-20","u":12,"q":"For a UI inspiration board with clickable references, which network style is most aligned?","o":["Facebook","LinkedIn","Twitter","Pinterest"],"a":3,"e":"Pinterest boards are built for visual inspiration with clickable pins.","s":"bank","k":82,"w":["Facebook is general.","LinkedIn is professional.","Twitter is short text.",""]},{"id":"b12-21","u":12,"q":"What is the main use of the \"Retweet\" feature?","o":["Messaging friends","Sharing others' content","Creating groups","Posting images"],"a":1,"e":"Retweet shares someone else's content with your followers.","s":"bank","k":82,"w":["Messaging uses direct messages.","","Groups are a separate feature.","Posting images is a normal tweet."]},{"id":"b12-22","u":12,"q":"Which platform is primarily used for professional networking?","o":["Instagram","LinkedIn","Pinterest","Facebook"],"a":1,"e":"LinkedIn is for professional networking.","s":"bank","k":82,"w":["Instagram is for photos.","","Pinterest is for visual ideas.","Facebook is for general social networking."]},{"id":"b12-23","u":12,"q":"In Facebook, what feature enables organizing promotional activities?","o":["News Feed","Messenger","Events","Reactions"],"a":2,"e":"Facebook Events organise and promote activities.","s":"bank","k":82,"w":["The News Feed shows posts.","Messenger is chat.","","Reactions are likes."]},{"id":"b12-24","u":12,"q":"What does the acronym \"API\" stand for in web technologies?","o":["Automated Personal Interaction","Application Programming Interface","Applied Program Integration","Advanced Protocol Internet"],"a":1,"e":"API = Application Programming Interface.","s":"bank","k":85,"w":["Wrong expansion; API means Application Programming Interface.","","Wrong expansion; API means Application Programming Interface.","Wrong expansion; API means Application Programming Interface."]},{"id":"b12-25","u":12,"q":"Which is an example of a blog platform?","o":["WordPress","Twitter","LinkedIn","Facebook"],"a":0,"e":"WordPress is a blogging platform/CMS.","s":"bank","k":82,"w":["","Twitter is microblogging, not a blog platform.","LinkedIn is professional networking.","Facebook is social networking."]},{"id":"b12-26","u":12,"q":"Which protocol is commonly used for securing API authentication?","o":["RSS","OAuth 2.0","SMTP","XML"],"a":1,"e":"OAuth 2.0 is the standard for secure API authorisation.","s":"bank","k":85,"w":["RSS is a feed format.","","SMTP sends email.","XML is a data format."]},{"id":"b12-27","u":12,"q":"What is the function of a hashtag on social platforms?","o":["Register a new account","Group topics so people can find them","Increase the number of followers automatically","Send a private direct message"],"a":1,"e":"Hashtags group posts by topic so people can discover them.","s":"bank","w":["Registering uses a sign-up form.","","Followers are not automatic.","Direct messages are private chat."]},{"id":"b12-28","u":12,"q":"Which type of markup is required for structuring web pages?","o":["Markdown","HTML","Python","SQL"],"a":1,"e":"HTML structures web pages.","s":"bank","k":86,"w":["Markdown is converted to HTML.","","Python is a programming language.","SQL queries databases."]},{"id":"b12-29","u":12,"q":"Which tool is used for visual network analysis?","o":["NodeXL","Adobe Photoshop","Microsoft Word","Instagram"],"a":0,"e":"NodeXL draws and analyses social network graphs.","s":"bank","k":84,"w":["","Photoshop edits images.","Word edits documents.","Instagram is a social network."]},{"id":"b12-30","u":12,"q":"What is the purpose of CSS in web development?","o":["Storing data","Styling and layout","User authentication","Data analysis"],"a":1,"e":"CSS handles styling and layout.","s":"bank","k":86,"w":["Storing data is a database's job.","","Authentication is back-end.","Analysis uses other tools."]},{"id":"b12-31","u":12,"q":"Which is NOT a common element in a blog?","o":["Chronological Posts","Categories","News Feed","Comments Section"],"a":2,"e":"A news feed belongs to social networks, not blogs.","s":"bank","k":85,"w":["Chronological posts are a blog feature.","Categories are a blog feature.","","Comments are a blog feature."]},{"id":"b12-32","u":12,"q":"What is required to post content from your site to Twitter using its API?","o":["API keys and OAuth authentication","The tweet's text in HTML format","An RSS feed of the site's posts","A CSS file for the tweet's style"],"a":0,"e":"Posting through Twitter's API needs API keys and OAuth.","s":"bank","k":85,"w":["","Tweets are plain text.","RSS publishes feeds; it does not post tweets.","CSS does not style tweets."]},{"id":"b12-33","u":12,"q":"Which file format is NOT typically used for images on social media?","o":["JPEG","GIF","PDF","PNG"],"a":2,"e":"PDF is a document format, not a social media image format.","s":"bank","k":83,"w":["JPEG is common on social media.","GIF is common on social media.","","PNG is common on social media."]},{"id":"b12-34","u":12,"q":"What feature in LinkedIn allows users to validate each other's skills?","o":["Groups","Endorsements","Messaging","Posts"],"a":1,"e":"LinkedIn Endorsements let connections vouch for skills.","s":"bank","k":82,"w":["Groups are communities.","","Messaging is chat.","Posts share updates."]},{"id":"b12-35","u":12,"q":"What is a key requirement for XHTML documents?","o":["All tags lowercase and properly nested","Hashtags used in every heading tag","A responsive page layout","No limit on line length"],"a":0,"e":"XHTML: lowercase tags, properly nested and closed.","s":"bank","k":86,"w":["","Hashtags are not markup rules.","Responsiveness is not an XHTML rule.","Line length is not the rule."]},{"id":"b12-36","u":12,"q":"What kind of API request is typically used to fetch public data from Twitter?","o":["POST","DELETE","PUT","GET"],"a":3,"e":"GET requests read (fetch) data.","s":"bank","k":85,"w":["POST creates data.","DELETE removes data.","PUT updates data.",""]},{"id":"b12-37","u":12,"q":"The college wants to build a professional presence and showcase student projects to employers. Which platform best fits this NETWORKING goal?","o":["Twitter (X)","Facebook","Pinterest","LinkedIn"],"a":3,"e":"LinkedIn showcases professional work to employers.","s":"bank","k":82,"w":["Twitter suits quick updates.","Facebook suits communities.","Pinterest suits visual ideas.",""]},{"id":"b12-38","u":12,"q":"You are tasked to grow a tech community with Q&A and study groups. Which social network feature supports threaded discussions and membership rules?","o":["Twitter Hashtags","Pinterest Boards","LinkedIn Job Listings","Facebook Groups"],"a":3,"e":"Facebook Groups offer threaded discussions and membership rules.","s":"bank","k":82,"w":["Hashtags group posts but do not create threads.","Boards collect images.","Job listings advertise jobs.",""]},{"id":"b12-39","u":12,"q":"The department needs short real‑time announcements (≤280 chars) with topic discovery. Which behavior suits this?","o":["LinkedIn endorsements","Twitter Tweets + Hashtags","Facebook Events","Pinterest Idea Pins"],"a":1,"e":"Short real-time posts with hashtag discovery = Tweets.","s":"bank","k":82,"w":["Endorsements validate skills.","","Events organise activities.","Idea Pins are visual."]},{"id":"b12-40","u":12,"q":"For a UI inspiration board with clickable references, which network style is most aligned?","o":["Pinterest Boards","Twitter Threads","LinkedIn Articles","Facebook Messenger"],"a":0,"e":"Pinterest Boards collect visual references.","s":"bank","k":82,"w":["","Threads are text.","Articles are long text.","Messenger is chat."]},{"id":"b12-41","u":12,"q":"A lecturer wants a serialized course reflection with permalinks and tags. Which SOCIAL MEDIA format fits best?","o":["Podcast series","Developer blog","Short‑form video","Infographic carousel"],"a":1,"e":"A blog gives permalinks, tags and series of posts.","s":"bank","k":83,"w":["Podcasts are audio.","","Short video lacks permalinks and tags.","A carousel is visual summary."]},{"id":"b12-42","u":12,"q":"To reach commuters weekly with career tips, which format should be chosen?","o":["Blog posts","Podcasts with RSS","Static images only","PDF newsletters"],"a":1,"e":"Podcasts (delivered by RSS) suit commuters who listen on the move.","s":"bank","k":83,"w":["Blogs need reading, not listening.","","Static images do not suit commuting.","PDFs need reading."]},{"id":"b12-43","u":12,"q":"A lab manual needs quick visual steps and alt text. Which asset best supports engagement and accessibility?","o":["A long PDF document without images","Plain text emails","Spreadsheet tables","Images with captions/alt text"],"a":3,"e":"Images with captions and alt text engage readers and stay accessible.","s":"bank","k":83,"w":["No images means no visual steps.","Plain text emails are not visual.","Spreadsheets are not visual steps.",""]},{"id":"b12-44","u":12,"q":"Marketing wants a vertical tutorial (9:16) to publish on multiple platforms. Which media type?","o":["Short‑form video","Audio narration only","Static blog image","Slides deck"],"a":0,"e":"Vertical 9:16 tutorials are short-form video.","s":"bank","k":83,"w":["","Audio has no visuals.","A static image is not a tutorial video.","Slides are not vertical video."]},{"id":"b12-45","u":12,"q":"A faculty blog needs comments, categories, and an archive. Which platform capability is essential?","o":["Spreadsheet hosting","Pure HTML with no backend","Binary file uploads only","CMS with posts/tags"],"a":3,"e":"A CMS provides posts, tags, comments and archives.","s":"bank","k":83,"w":["Spreadsheets are not blogs.","Pure HTML cannot manage comments easily.","File uploads alone are not enough.",""]},{"id":"b12-46","u":12,"q":"To summarize an event visually for Instagram, which is best practice?","o":["A raw CSV export of the data","A long paragraph of plain text","An audio recording describing the event","A high-contrast infographic, short text"],"a":3,"e":"A high-contrast infographic with short text suits Instagram.","s":"bank","w":["Raw data is not visual.","Long text does not suit Instagram.","Audio is not visual.",""]},{"id":"b12-47","u":12,"q":"To find influential alumni on Twitter for mentoring, which NETWORK metric is most relevant?","o":["Color contrast ratio","Hashtag frequency only","Centrality","File size"],"a":2,"e":"Centrality measures how influential/connected a user is.","s":"bank","k":82,"w":["Contrast is design.","Hashtag frequency alone does not measure influence.","","File size is unrelated."]},{"id":"b12-48","u":12,"q":"You visualise relationships between student clubs and members. Clubs and students are ______; memberships are ______.","o":["edges; nodes","threads; posts","nodes; edges","feeds; timelines"],"a":2,"e":"In a network graph, things are nodes and relationships are edges.","s":"bank","k":84,"w":["This is reversed.","Threads and posts are not graph terms.","","Feeds and timelines are not graph terms."]},{"id":"b12-49","u":12,"q":"Identifying accounts that act as bridges between otherwise separate communities focuses on:","o":["Contrast ratio","Betweenness centrality","DOM depth","HTTP status"],"a":1,"e":"Betweenness centrality finds bridges between communities.","s":"bank","k":84,"w":["Contrast is design.","","DOM depth is web structure.","HTTP status is a server response code."]},{"id":"b12-50","u":12,"q":"Which tool would you pick to map a social graph visually for class discussion?","o":["WordPad","Paint","Gephi/Graphviz","Spreadsheet formulas only"],"a":2,"e":"Gephi/Graphviz draw network graphs.","s":"bank","w":["WordPad is a text editor.","Paint is for drawing by hand.","","Spreadsheets do not draw graphs of networks well."]},{"id":"b12-51","u":12,"q":"A web form should publish a 'New Project' post to LinkedIn after user consent. Which flow enables posting on the user's behalf?","o":["OAuth 2.0 + POST to API endpoint","Basic auth over HTTP","Anonymous GET request","An HTML form with method='get' to LinkedIn"],"a":0,"e":"Posting for a user needs OAuth 2.0 consent, then a POST to the API.","s":"bank","k":85,"w":["","Basic auth over HTTP is insecure.","Anonymous GET cannot post.","GET reads; LinkedIn needs OAuth and POST."]},{"id":"b12-52","u":12,"q":"The homepage must display a live Twitter feed for #ITCShowcase without exposing secrets in the browser. Which approach?","o":["Embed PNG screenshots of the tweets","Copy and paste the tweets by hand","Call the API from the browser using the keys","Fetch on the server with tokens, then render"],"a":3,"e":"Fetch on the server with secret tokens, then render the JSON; secrets never reach the browser.","s":"bank","k":85,"w":["Screenshots are not live.","Copying by hand is not live.","Browser calls expose the keys.",""]},{"id":"b12-53","u":12,"q":"Your app exceeds a platform's API call limit while pulling events. What concept explains this?","o":["CORS","Rate limiting","Lazy loading","DNS caching"],"a":1,"e":"Platforms cap API calls per period: rate limiting.","s":"bank","k":85,"w":["CORS controls cross-site requests.","","Lazy loading delays loading.","DNS caching stores lookups."]},{"id":"b12-54","u":12,"q":"Security review flags access token exposure in client‑side JS. What immediate fix is best practice?","o":["Use GET requests to post the data","Hide the tokens inside the CSS file","Turn off HTTPS so the token is not logged","Keep tokens on the server and proxy requests"],"a":3,"e":"Keep tokens on the server and proxy API requests.","s":"bank","k":85,"w":["GET does not protect tokens.","CSS is public too.","Turning off HTTPS is less secure.",""]},{"id":"b12-55","u":12,"q":"If the API response fails, what is the best user experience on the Home page feed?","o":["Leave the space blank silently","Freeze the page until it loads","Show fallback content and retry","Show the full error stack trace"],"a":2,"e":"Show fallback content or a retry notice instead of failing silently.","s":"bank","k":85,"w":["Blank space confuses users.","Freezing hurts experience.","","Stack traces expose details."]},{"id":"b12-56","u":12,"q":"To comply with platform terms while posting updates, which practice is key?","o":["Put the secret tokens in the public HTML code","Respect rate limits and content policies","Ignore token expiry","Scrape HTML always"],"a":1,"e":"Follow rate limits and content policies to stay within platform terms.","s":"bank","k":85,"w":["Secret tokens must never be public.","","Expired tokens must be refreshed.","Scraping usually breaks platform terms."]},{"id":"b12-57","u":12,"q":"You need to display LinkedIn recommendations on a portfolio page. What is the correct data flow?","o":["Anonymous POST → save as CSV","FTP download → copy into the page","OAuth → GET → parse JSON → render","Read from localStorage → display"],"a":2,"e":"OAuth → GET → parse JSON → render.","s":"bank","k":85,"w":["Anonymous requests cannot read private data, and CSV is not the display step.","FTP is not how social APIs share data.","","localStorage holds only data already saved in the browser."]},{"id":"b12-58","u":12,"q":"A student asks why their API call succeeds locally but fails in production due to blocked origins. This is related to:","o":["CORS policy","Color contrast","WCAG headings","DNS MX records"],"a":0,"e":"Browsers block cross-origin calls not allowed by the server's CORS policy.","s":"bank","k":85,"w":["","Contrast is design.","Headings are accessibility.","MX records route email."]},{"id":"b12-59","u":12,"q":"You add a social feed widget to the Home page with proper structure and semantics. Which markup is standard?","o":["A binary blob","Plain text only","Semantic HTML5","A custom language"],"a":2,"e":"HTML5 with semantic elements is the standard markup.","s":"bank","k":85,"w":["A binary blob is not markup.","Plain text has no structure.","","Custom languages are not standard."]},{"id":"b12-60","u":12,"q":"To embed a share button and an updates section, which HTML areas are most appropriate?","o":["\u003ctable> for the layout","\u003cmain>/\u003csection> plus \u003caside>","\u003cfont> tags around each area","\u003cmarquee> for the updates"],"a":1,"e":"\u003cmain>/\u003csection> for main content, \u003caside> for secondary content.","s":"bank","k":85,"w":["Tables are not for layout.","","\u003cfont> is obsolete.","\u003cmarquee> is obsolete."]},{"id":"b12-61","u":12,"q":"In an environment that requires strict parsing rules (lowercase tags, proper closing), which markup is most appropriate?","o":["XHTML","HTML 3.2","Markdown","LaTeX"],"a":0,"e":"XHTML enforces strict parsing rules.","s":"bank","k":86,"w":["","HTML 3.2 is old and loose.","Markdown is lightweight text.","LaTeX is for documents."]},{"id":"b12-62","u":12,"q":"Which is NOT a valid XHTML practice?","o":["All attributes quoted","All tags properly nested","Uppercase tags are fine","Self‑closing tags end with />"],"a":2,"e":"XHTML tags must be lowercase, so uppercase is not valid.","s":"bank","k":86,"w":["Quoting attributes is required, so it is valid.","Proper nesting is required, so it is valid.","","Self-closing with /> is required, so it is valid."]},{"id":"b12-63","u":12,"q":"To exchange student profile data between systems, choose a self‑describing format with custom tags. Which format?","o":["XML","BMP","CSS","MP3"],"a":0,"e":"XML is self-describing with custom tags.","s":"bank","k":86,"w":["","BMP is an image.","CSS is styling.","MP3 is audio."]},{"id":"b12-64","u":12,"q":"You need to extract \u003ctitle> and \u003cdate> from an XML events feed for the Info page. Which technique?","o":["SQL JOIN","CSS :hover","XPath selection","ODBC DSN only"],"a":2,"e":"XPath selects nodes such as \u003ctitle> and \u003cdate> from XML.","s":"bank","k":86,"w":["SQL JOIN is for databases.",":hover is a CSS state.","","ODBC connects to databases."]},{"id":"b12-65","u":12,"q":"You must style embedded cards and ensure mobile readability. Which CSS techniques are key?","o":["External CSS with Flex/Grid and media queries","Inline \u003cfont> tags on each card","Tables to position each card","Fixed pixel widths and heights for every card"],"a":0,"e":"External CSS with Flex/Grid and media queries keeps cards readable on mobile.","s":"bank","k":85,"w":["","\u003cfont> is obsolete.","Tables are not for layout.","Fixed sizes break on mobile."]},{"id":"b12-66","u":12,"q":"When embedding short‑form videos, what CSS ensures responsiveness across devices?","o":["CSS aspect-ratio with max-width:100%","A fixed 1200px-wide iframe","Absolute positioning of the video","Height set in pixels, no width"],"a":0,"e":"An aspect-ratio box with max-width:100% keeps video embeds responsive.","s":"bank","k":83,"w":["","A fixed width overflows phones.","Absolute positioning is rigid.","Pixel height without width distorts."]},{"id":"b12-67","u":12,"q":"A company wants its CMS to automatically publish new blog posts to Twitter whenever an editor publishes an article. The system must authenticate securely and avoid re-posting the same content when refreshed. Which approach BEST meets these requirements?","o":["Use a GET request with basic authentication to send tweets after publishing","Trigger an OAuth 2.0–based POST request after detecting a publish event","Store the editor’s password and use it to log in to Twitter via API","Use JavaScript on the client side to post directly to Twitter"],"a":1,"e":"Detect the publish event, then send one OAuth 2.0-authenticated POST; never store passwords.","s":"bank","k":85,"w":["GET should not post data, and basic auth is weak.","","Never store passwords.","Client-side posting exposes secrets."]},{"id":"b12-68","u":12,"q":"Your website must display real-time posts from a company’s Facebook Page using the Graph API. Sometimes the API fails due to rate limiting. What is the BEST fallback strategy?","o":["Remove the feed completely whenever an error occurs","Refresh the whole page every second until the API answers again","Display cached feed data and show a “Currently updating…” message","Directly scrape Facebook HTML as a backup"],"a":2,"e":"Show cached data with an 'updating' notice when the API fails.","s":"bank","k":85,"w":["Removing the feed is a poor experience.","Hammering the API makes rate limiting worse.","","Scraping breaks terms and is fragile."]},{"id":"b12-69","u":12,"q":"A client wants to add a LinkedIn “Share Post” feature that includes automatic link previews. Which requirement is essential for LinkedIn’s share API to generate the preview correctly?","o":["Hosting the website on HTTPS and including proper Open Graph metadata","Using a Webhook to send preview metadata to LinkedIn","Enabling CORS headers so LinkedIn can pull the page's images directly","Installing the LinkedIn SDK locally on the server"],"a":0,"e":"LinkedIn previews read Open Graph meta tags, served over HTTPS.","s":"bank","k":85,"w":["","Webhooks are not how previews are created.","CORS is for browser requests, not LinkedIn's crawler.","An SDK is not needed for previews."]},{"id":"b12-70","u":12,"q":"A university website wants to embed an Instagram feed. Their concern is slow loading times caused by external scripts. Which solution BEST reduces performance impact?","o":["Load the Instagram embed script synchronously in the \u003chead> of every page","Lazy-load the embed script only when the feed section enters the viewport","Self-host the Instagram embed JavaScript file","Disable the embed preview and load images manually"],"a":1,"e":"Lazy-load the embed script only when its section scrolls into view.","s":"bank","k":85,"w":["Synchronous loading in \u003chead> blocks the page.","","Self-hosting can break updates and terms.","Manual loading is fragile."]},{"id":"b12-71","u":12,"q":"A social media strategist wants to identify users who act as “bridges” between different communities on Twitter. Which network metric should they analyse?","o":["Degree centrality","Closeness centrality","Betweenness centrality","Network density"],"a":2,"e":"Betweenness centrality identifies bridge users.","s":"bank","k":82,"w":["Degree counts direct links.","Closeness measures average distance.","","Density describes the whole graph."]},{"id":"b12-72","u":12,"q":"A web app uses OAuth 2.0 to post updates to LinkedIn. Users report random failures saying “token expired.” What is the MOST appropriate solution?","o":["Ask users to log in again each time a token expires","Store access tokens permanently in local storage","Implement token refresh using the OAuth refresh token flow","Increase the rate limit through LinkedIn developer settings"],"a":2,"e":"Use the refresh-token flow to get new access tokens automatically.","s":"bank","k":85,"w":["Logging in each time is a poor experience.","Storing tokens permanently in the browser is unsafe.","","Rate limits are unrelated to expiry."]},{"id":"b12-73","u":12,"q":"A business website wants to show filtered tweets from a specific hashtag, but only if they contain positive sentiment. Which implementation is MOST suitable?","o":["Fetch the hashtag with GET, then analyse sentiment locally","Ask the Twitter API to return only positive tweets","Scrape Twitter's web pages for the hashtag content","Use the Facebook API to check content across platforms"],"a":0,"e":"Social APIs do not reliably filter tweets by sentiment, so GET the hashtag feed and analyse the sentiment in your own code.","s":"bank","k":82,"w":["","Social APIs do not reliably filter by sentiment.","Scraping breaks terms.","Facebook's API does not read tweets."]},{"id":"b12-74","u":12,"q":"A company wants to use Facebook Login to allow users to sign in. They must retrieve the user’s email but NOT store unnecessary data. Which permission should the app request?","o":["user_posts","email","pages_manage_metadata","public_profile and all optional permissions"],"a":1,"e":"Ask only for the email permission (data minimisation).","s":"bank","k":82,"w":["user_posts asks for more data than needed.","","Page metadata is unrelated.","Asking for everything breaks data minimisation."]},{"id":"b12-75","u":12,"q":"A developer embeds a YouTube player using an iframe. The client complains the page loads slowly because of many videos. What is the BEST approach to optimize this?","o":["Remove all the iframes and replace each one with a plain hyperlink","Use a thumbnail image that loads the iframe only when clicked","Compress the iframe using CSS","Preload all videos as hidden iframes"],"a":1,"e":"Show a thumbnail and load the iframe only on click.","s":"bank","k":83,"w":["Plain links remove the embedded player.","","CSS cannot compress iframes.","Preloading makes it slower."]},{"id":"b12-76","u":12,"q":"A data analyst wants to identify tightly connected groups within a LinkedIn follower graph. Which network analysis method is MOST appropriate?","o":["Measuring shortest paths","Community detection (clustering)","Calculating edge weights","Computing the global density of the graph"],"a":1,"e":"Community detection (clustering) finds tightly connected groups.","s":"bank","k":84,"w":["Shortest paths measure distance.","","Edge weights measure link strength.","Density describes the whole graph."]},{"id":"b13-1","u":13,"q":"Which of the following best describes a Java Servlet?","o":["A client-side script that runs in the browser","A server-side program that extends a web server","A query language for relational databases","A processor that applies CSS style sheets"],"a":1,"e":"A servlet is Java code that runs on the server and extends what the web server can do.","s":"bank","k":87,"w":["Scripts that run in the browser are client-side, such as JavaScript.","","A database query language is SQL.","CSS is applied by the browser, not by servlets."]},{"id":"b13-2","u":13,"q":"In PHP, the $_GET superglobal array is mainly used to:","o":["Send data to the database","Retrieve data from a submitted form using the POST method","Retrieve data sent through the URL query string","Store session data"],"a":2,"e":"$_GET reads values from the URL query string (?name=value).","s":"bank","k":87,"w":["Saving to a database is done with SQL, not $_GET.","POST data is read with $_POST.","","Session data uses $_SESSION."]},{"id":"b13-3","u":13,"q":"Which of the following PHP statements is used to include another file in your script?","o":["load()","require()","readfile()","insert()"],"a":1,"e":"require() (and include()) pull another PHP file into the script.","s":"bank","k":87,"w":["load() is not a PHP include function.","","readfile() outputs a file's contents without running it as PHP.","insert() is not a PHP function."]},{"id":"b13-4","u":13,"q":"In JavaScript, what will document.getElementById(\"demo\").innerHTML = \"Hello\"; do?","o":["Create a new HTML element with the id \"demo\"","Put \"Hello\" inside the element with id demo","Remove the element with id demo","Show \"Hello\" in an alert box"],"a":1,"e":"innerHTML replaces the content of the element whose id is 'demo'.","s":"bank","k":88,"w":["innerHTML changes an existing element; it does not create one.","","Removing needs remove().","Alerts use alert()."]},{"id":"b13-5","u":13,"q":"Which of the following is a correct way to declare a JavaScript variable?","o":["variable x = 5;","int x = 5;","let x = 5;","define x = 5;"],"a":2,"e":"JavaScript declares variables with let, const or var. 'int' is Java/C.","s":"bank","k":88,"w":["variable is not a keyword.","int is Java or C.","","define is not JavaScript."]},{"id":"b13-6","u":13,"q":"What is the purpose of the addEventListener() method in JavaScript?","o":["It creates a new event loop","It adds a CSS style dynamically","It registers an event handler for a specific event","It validates all the form inputs on the page automatically"],"a":2,"e":"addEventListener() attaches a handler that runs when the event fires.","s":"bank","k":88,"w":["The event loop already exists.","Styles are set with style or classList.","","It does not validate forms by itself."]},{"id":"b13-7","u":13,"q":"What is the output of typeof 10 in JavaScript?","o":["integer","number","string","float"],"a":1,"e":"Ordinary JavaScript numbers (whole or decimal) all have the type number, so typeof 10 is 'number'.","s":"bank","k":88,"w":["JavaScript has no integer type name.","","10 is a number, not text.","float is not a JavaScript type."]},{"id":"b13-8","u":13,"q":"What is a cookie in web development?","o":["A temporary file that is stored on the web server","A small text file stored on the client’s computer","A type of database","A browser cache"],"a":1,"e":"A cookie is a small text file stored by the browser on the client.","s":"bank","k":89,"w":["Cookies are stored on the client, not the server.","","A database is a server store.","The cache stores copies of resources."]},{"id":"b13-9","u":13,"q":"Which of the following is a security concern when using cookies?","o":["They cannot be shared between domains","They are always encrypted automatically","Unprotected cookies can be read or changed","They expire one second after being set"],"a":2,"e":"Unprotected cookies can be stolen or altered.","s":"bank","k":89,"w":["Domain limits are a protection, not a concern.","Cookies are not encrypted automatically.","","Expiry is set by the developer."]},{"id":"b13-10","u":13,"q":"What is the primary goal of authentication?","o":["To determine what a user can access","To verify a user’s identity","To store user information","To encrypt sensitive data"],"a":1,"e":"Authentication verifies who you are; authorisation decides what you can access.","s":"bank","k":90,"w":["Deciding access is authorisation.","","Storing data is a database task.","Encryption protects data."]},{"id":"b13-11","u":13,"q":"In web applications, which of the following is a common method of authentication?","o":["CAPTCHA verification","Username and password","Session timeout","Cookie expiration"],"a":1,"e":"Username + password is the most common authentication method.","s":"bank","k":90,"w":["CAPTCHA checks for humans, not identity.","","A timeout ends sessions.","Expiry ends cookies."]},{"id":"b13-12","u":13,"q":"Which statement best defines stateless programming?","o":["Each request is handled without memory of earlier ones","The server keeps all of the user's previous data","Data is kept in memory from one session to the next","Every page keeps the user's session automatically"],"a":0,"e":"Stateless = each request stands alone; the server remembers nothing between them.","s":"bank","k":91,"w":["","Keeping data is stateful.","Keeping memory between sessions is stateful.","Automatic sessions are stateful."]},{"id":"b13-13","u":13,"q":"Which protocol is inherently stateless?","o":["FTP","HTTP","SMTP","HTTPS"],"a":1,"e":"HTTP is stateless by design.","s":"bank","k":91,"w":["FTP keeps a session.","","SMTP keeps a session.","HTTPS is also stateless, but HTTP is the base protocol asked about."]},{"id":"b13-14","u":13,"q":"In a stateless system, how can state be maintained between requests?","o":["By using cookies or sessions","By storing data in RAM","By caching pages","By reloading the browser after each request"],"a":0,"e":"Cookies and sessions add state on top of stateless HTTP.","s":"bank","k":91,"w":["","RAM alone is lost between requests.","Caching stores pages, not user state.","Reloading does not keep state."]},{"id":"b13-15","u":13,"q":"What is the main characteristic of stateful programming?","o":["The server does not keep any data about each client","The server maintains the state of each client session","Each request is treated independently","It uses cookies to clear session data"],"a":1,"e":"Stateful = the server keeps each client's session state.","s":"bank","k":91,"w":["Not keeping data is stateless.","","Independent requests are stateless.","Cookies keep data; they do not clear it."]},{"id":"b13-16","u":13,"q":"A web developer builds a Java Servlet that retrieves customer data from a database. Users report that the data from one request sometimes appears in another user’s session.\nWhat is the most likely cause?","o":["The servlet uses doPost() instead of doGet()","User data is stored in an instance field","The servlet is not served over HTTPS","The database connection is never closed"],"a":1,"e":"Servlet instance fields are shared by all requests, so user data leaks between users. Use local variables or the session.","s":"bank","k":87,"w":["The method choice does not mix users' data.","","HTTPS protects transit, not mixing.","Open connections waste resources but do not mix data."]},{"id":"b13-17","u":13,"q":"A PHP developer wants to prevent direct URL access to a dashboard page unless a user is logged in. Which method is most secure?","o":["Hide the dashboard link on the home page","Set a JavaScript variable after login","Check a session variable on every protected page","Use HTML form validation on the login page to block access"],"a":2,"e":"Check the session on the server for every protected page; hiding links or JS checks can be bypassed.","s":"bank","k":90,"w":["Hidden links can still be typed in.","JavaScript can be bypassed.","","Form validation does not protect pages."]},{"id":"b13-18","u":13,"q":"A web form dynamically validates email addresses as the user types.\nWhich feature of JavaScript enables this without refreshing the page?","o":["Server-side scripting","Asynchronous event handling","CSS transitions","Inline attributes on the form fields"],"a":1,"e":"Event handlers (e.g. oninput) run asynchronously as the user types, with no page reload.","s":"bank","k":88,"w":["Server scripting needs a request.","","Transitions are visual.","Inline attributes are not the mechanism."]},{"id":"b13-19","u":13,"q":"A developer finds that a cookie set from https://bank.com is not being sent to http://bank.com. Why?","o":["Cookies can never be sent over HTTP","The Secure flag blocks sending it over HTTP","The two domain names do not match","The cookie expired as soon as it was set"],"a":1,"e":"A cookie marked Secure is only sent over HTTPS, so http://bank.com never receives it.","s":"bank","k":89,"w":["Cookies can be sent over HTTP unless marked Secure.","","bank.com is the same domain in both.","Expiry is not the reason."]},{"id":"b13-20","u":13,"q":"Which of the following best describes multi-factor authentication (MFA)?","o":["Two usernames for extra verification","A password plus another proof, e.g. OTP","Entering the same password twice","Encrypting the password twice"],"a":1,"e":"MFA combines something you know (password) with something you have/are (OTP, fingerprint).","s":"bank","k":90,"w":["Two usernames are one factor.","","The same password twice is one factor.","Double encryption is not MFA."]},{"id":"b13-21","u":13,"q":"The college web app must process form data and store it in the server database. Which type of scripting handles this task?","o":["Client-side scripting","Styling scripts","Server-side scripting","Database triggers"],"a":2,"e":"Processing and storing form data on the server is server-side scripting.","s":"bank","k":87,"w":["Client-side scripts run in the browser.","Styling is CSS.","","Triggers run inside the database."]},{"id":"b13-22","u":13,"q":"When a user fills out a feedback form and clicks Submit, which part of a web application receives and processes the data before it is stored?","o":["The client browser","A server-side script (PHP or servlet)","The database","The web server's hardware and network card"],"a":1,"e":"The server-side script (PHP or a servlet) receives the submitted data, validates and processes it, then stores it in the database.","s":"bank","k":87,"w":["The browser sends the data; it does not process it for storage.","","The database stores data after it is processed.","Hardware passes the request on but does not process the form."]},{"id":"b13-23","u":13,"q":"To dynamically validate input before submission, which type of script is most suitable?","o":["A server-side script","An SQL query","Client-side JavaScript","A back-end batch job"],"a":2,"e":"Client-side JavaScript can check input before it is sent.","s":"bank","k":88,"w":["Server-sid ange internet speed.","Passwords do not affect performance.","Passwords do not save storage."]},{"id":"b14-2","u":14,"q":"Which solution best meets strong password requirements?","o":["Short passwords","Reusing passwords","Complex passwords with symbols","Writing passwords down in a safe place"],"a":2,"e":"Long, complex passwords with symbols resist guessing and brute force.","s":"bank","w":["Short passwords are easy to crack.","Reuse spreads one breach to many accounts.","","Written passwords can be found."]},{"id":"b14-3","u":14,"q":"Why is creating a security policy important?","o":["To make company documents look more professional","To define security rules and procedures","To increase the computer's memory","To reduce internet usage by staff"],"a":1,"e":"A security policy sets the rules and procedures everyone must follow.","s":"bank","w":["Appearance is not the purpose.","","A policy does not add memory.","Reducing internet use is not its purpose."]},{"id":"b14-4","u":14,"q":"What is the benefit of password history?","o":["Prevent reuse","Increase storage","Improve speed","Reduce login time"],"a":0,"e":"Password history stops users re-using recent passwords.","s":"bank","w":["","It does not add storage.","It does not improve speed.","It does not shorten login."]},{"id":"b14-5","u":14,"q":"How can passwords be non-traceable?","o":["Use password manager","Use names","Reuse passwords","Write them down"],"a":0,"e":"A password manager generates random, unrelated passwords that can't be traced to personal details.","s":"bank","w":["","Names are easy to trace.","Reuse links accounts together.","Written passwords can be found."]},{"id":"b14-6","u":14,"q":"What is the role of a firewall?","o":["Store files","Control network traffic","Install apps","Backup data"],"a":1,"e":"A firewall filters (allows/blocks) network traffic.","s":"bank","k":92,"w":["Storage is not a firewall's job.","","Installing apps is not its job.","Backup is a separate tool."]},{"id":"b14-7","u":14 Improve graphics","Verify user identity","Reduce storage","Increase speed"],"a":1,"e":"Authentication verifies who is using the shared resource.","s":"bank","w":["Graphics are unrelated.","","Storage is unrelated.","Speed is unrelated."]},{"id":"b14-40","u":14,"q":"What happens if protocols are not secured?","o":["Faster system","Data can be intercepted","Better design","Improved storage"],"a":1,"e":"Unsecured protocols send data that can be intercepted.","s":"bank","w":["Speed is unrelated.","","Design is unrelated.","Storage is unrelated."]},{"id":"b14-41","u":14,"q":"Why enforce password expiration?","o":["Increase workload","Improve design","Reduce storage","Limit exposure"],"a":3,"e":"Expiry limits how long a stolen password stays useful.","s":"bank","w":["Workload is not the aim.","Design is unrelated.","Storage is unrelated.",""]},{"id":"b14-42","u":14,"q":"Which password solution provides the highest level of security?","o":["Reusing passwords","Short passwords","Writing passwords down in a notebook","Multi-factor authentication"],"a":3,"e":"MFA adds a second factor, giving the strongest protection listed.","s":"bank","w":["Reuse is weak.","Short is weak.","Written passwords can be found.",""]},{"id":"b14-43","u":14,"q":"What is the best method to ensure compliance with a security policy?","o":["Ignore updates","Train users and enforce rules","Let users make their own decisions","Remove restrictions"],"a":1,"e":"Train users and enforce the rules.","s":"bank","w":["Ignoring updates is unsafe.","","Free choice breaks the policy.","Removing restrictions breaks it."]},{"id":"b14-44","u":14,"q":"What is the goal of reviewing a security policy?","o":["Remove old rules","Update and improve security","Reduce the number of users","Delete unused files"],"a":1,"e":"Reviews keep the policy current and stronger.","s":"bank","w":["Removing rules is not the goal.","","User count is unrelated.","File clean-up is unrelated."]},{"id":"b14-45","u":14,"q":"Why update antivirus P is plain text.","","Telnet is plain text."]},{"id":"b15-1","u":15,"q":"Which statement best distinguishes the logical data model from the physical data model?","o":["The logical model defines table storage and indexes","The logical model uses DBMS-specific data types","The logical model shows structure without DBMS details","The logical model includes backup and recovery"],"a":2,"e":"Logical = entities, attributes, relationships with no DBMS-specific detail. Physical = actual tables, data types, indexes, storage.","s":"bank","k":102,"w":["Table storage and indexes belong to the physical model.","DBMS-specific data types belong to the physical model.","","Backup and recovery are physical and operational details."]},{"id":"b15-2","u":15,"q":"In a hierarchical database model, which of the following is not true?","o":["Each child has only one parent.","Many-to-many relationships are easily supported","Data is organized in a tree-like structure.","Pointers are used to define relationships."],"a":1,"e":"Hierarchical (tree) models give each child one parent, so many-to-many is NOT easily supported.","s":"bank","k":103,"w":["This is true of hierarchical models, so it is not the answer.","","This is true: data forms a tree.","This is true: pointers link parents and children."]},{"id":"b15-3","u":15,"q":"Which SQL command combination would permanently delete all rows from a table and reset auto-increment values?","o":["DELETE FROM table;","DROP TABLE table;","TRUNCATE TABLE table;","ALTER TABLE table;"],"a":2,"e":"TRUNCATE removes all rows quickly and resets auto-increment; DELETE does not reset it; DROP removes the table itself.","s":"bank","k":106,"w":["DELETE removes rows but does not reset auto-increment.","DROP removes the whole table.","","ALTER changes the table's structure."]},{"id":"b15-4","u":15,"q":"Which of the following components ensures ACID compliance within a DBMS?","o":["Query Processor","Transaction Manager","Storage Manager","Authorization Manager"],"a":1,"e":"The transaction manager enforces Atomicity, Consistency, Isolation, Durability.","s":"bank","k":102,"w":["The query processor parses and runs queries.","","The storage manager handles files on disk.","The authorisation manager checks permissions."]},{"id":"b15-5","u":15,"q":"Which scenario would most likely benefit from using a NoSQL database rather than a relational DBMS?","o":["A web app storing unstructured activity logs","A banking system with complex joins","A student system with a fixed schema","An inventory system that uses many foreign keys"],"a":0,"e":"NoSQL suits unstructured, fast-changing data like activity logs.","s":"bank","k":106,"w":["","Complex joins suit relational databases.","A fixed schema suits relational databases.","Many foreign keys suit relational databases."]},{"id":"b15-6","u":15,"q":"What is the main disadvantage of a flat-file database?","o":["It always requires a DBMS to be installed","Supports complex queries","Causes redundancy and inconsistency","Uses relational joins"],"a":2,"e":"Flat files repeat data, which leads to redundancy and inconsistency.","s":"bank","k":103,"w":["Flat files do not need a DBMS.","Flat files do not support complex queries well.","","Flat files have no joins."]},{"id":"b15-7","u":15,"q":"In SQL, which clause is evaluated first in a SELECT query execution order?","o":["WHERE","SELECT","ORDER BY","FROM"],"a":3,"e":"Logical order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.","s":"bank","k":106,"w":["WHERE filters rows after FROM.","SELECT is evaluated late.","ORDER BY is last.",""]},{"id":"b15-8","u":15,"q":"Which statement about database security is most accurate?","o":["Encryption replaces the need for authentication.","Role-Based Access Control assigns permissions to data, not users.","Auditing tracks and records user activities in the database.","Triggers prevent unauthorized logins automatically."],"a":2,"e":"Auditing records who did what in the database.","s":"bank","k":105,"w":["Authentication is still needed.","RBAC assigns permissions to roles that users hold.","","Triggers react to data changes, not logins."]},{"id":"b15-9","u":15,"q":"Which of the following best explains the purpose of a schema in a database?","o":["It defines user access roles and privileges.","It specifies how data is stored physically on the disk.","It is the logical blueprint describing tables, columns, and relationships.","It stores the actual data and records that the applications use every day."],"a":2,"e":"A schema is the logical blueprint: tables, columns, relationships.","s":"bank","k":105,"w":["Access roles are security settings.","Physical storage is the internal level.","","The data itself is the instance, not the schema."]},{"id":"b15-10","u":15,"q":"Which of the following best describes a Primary Key in a relational database?","o":["A field that allows duplicate values but not NULLs.","A unique identifier for each record in a table that cannot be NULL.","A field that is automatically indexed but can contain NULL values.","A key that defines relationships between multiple tables."],"a":1,"e":"A primary key is unique and never NULL.","s":"bank","k":103,"w":["Primary keys cannot repeat.","","Primary keys cannot be NULL.","Linking tables is the foreign key's role."]},{"id":"b15-11","u":15,"q":"What happens if you try to insert a duplicate Primary Key value into a table?","o":["The DBMS automatically overwrites the previous record.","The new record is inserted, and the old record is marked as inactive.","The DBMS rejects the insertion and throws a constraint violation error.","The duplicate value is allowed if auto-increment is used."],"a":2,"e":"The DBMS rejects the duplicate with a constraint-violation error.","s":"bank","k":102,"w":["The DBMS does not overwrite.","The DBMS does not mark records inactive.","","Auto-increment avoids duplicates; it does not allow them."]},{"id":"b15-12","u":15,"q":"Which of the following statements about Primary Key vs. Foreign Key is true?","o":["A Foreign Key uniquely identifies each record within its own table only.","A Primary Key can contain NULL values; a Foreign Key cannot.","A Foreign Key links to a Primary Key in another table to maintain referential integrity.","Both keys are used only for indexing, not relationships."],"a":2,"e":"A foreign key references a primary key in another table, enforcing referential integrity.","s":"bank","k":106,"w":["Unique identification is the primary key's role.","This reverses it: primary keys cannot be NULL.","","Keys define relationships too."]},{"id":"b15-13","u":15,"q":"A college library database allows students to search for and borrow books through a web interface. A student tries to borrow a 6th book but receives an error message.\nWhich UI feature is most responsible for preventing this action?","o":["Data visualization panel","Role-based access control","Data validation constraint","Query optimization function"],"a":2,"e":"A validation rule (max 5 books) blocks the 6th loan.","s":"bank","k":105,"w":["Visualisation shows data.","RBAC controls who, not how many.","","Optimisation speeds queries."]},{"id":"b15-14","u":15,"q":"A developer modifies the “Students” table in the college database by adding a new column for “Email.”\nWhich DBMS component processes this structural change?","o":["Query Processor","Authorization Manager","Transaction Manager","Storage Manager"],"a":0,"e":"The query processor parses and executes the ALTER TABLE (DDL) command.","s":"bank","k":102,"w":["","The authorisation manager checks permission.","The transaction manager handles ACID.","The storage manager writes to disk."]},{"id":"b15-15","u":15,"q":"A company keeps employee details in a .csv file that can be opened in Excel, but relationships between employees and departments cannot be linked.\nWhich type of database structure is being used?","o":["Relational","Flat-file","Hierarchical","Network"],"a":1,"e":"A single CSV with no links between data is a flat file.","s":"bank","k":103,"w":["Relational links tables.","","Hierarchical uses trees.","Network uses pointers."]},{"id":"b15-16","u":15,"q":"A hospital database stores patient records under departments, and each patient can be linked to multiple doctors across departments.\nWhich database structure best fits this requirement?","o":["Hierarchical","Relational","Network","Flat-file"],"a":2,"e":"Patients linked to many doctors is a many-to-many relationship, which the network model handles with pointers. A relational database could also do this in practice, but exam questions expect the network model here.","s":"bank","k":103,"w":["Hierarchical allows only one parent.","Relational could work, but the exam expects network for many-to-many.","","Flat files have no links."]},{"id":"b15-17","u":15,"q":"During planning, a team draws a diagram showing “Students,” “Courses,” and “Enrollments” with relationships but no data types or keys yet.\n\nWhich data model level are they working on?","o":["Physical Data Model","Logical Data Model","Conceptual Data Model","Relational Schema Model"],"a":2,"e":"Entities and relationships only, no keys or types = conceptual model.","s":"bank","k":103,"w":["Physical includes storage and types.","Logical adds keys and attributes.","","A relational schema has tables and types."]},{"id":"b15-18","u":15,"q":"A database administrator ensures that even after a system crash, all completed transactions remain saved.\n\nWhich DBMS feature ensures this property?","o":["Concurrency Control","Normalization","Durability (ACID)","Data Independence"],"a":2,"e":"Durability keeps committed transactions after a crash.","s":"bank","k":102,"w":["Concurrency control handles many users.","Normalisation removes redundancy.","","Data independence separates levels."]},{"id":"b15-19","u":15,"q":"An HR manager accidentally deletes employee records and wants to undo the last transaction.\nWhich SQL command should be used?","o":["ROLLBACK","COMMIT","TRUNCATE","ALTER"],"a":0,"e":"ROLLBACK undoes uncommitted changes.","s":"bank","k":106,"w":["","COMMIT saves changes.","TRUNCATE removes all rows.","ALTER changes structure."]},{"id":"b15-20","u":15,"q":"A librarian wants to find all books written by authors whose names start with \"A\".\nWhich SQL operator is appropriate for this query?","o":["BETWEEN","IN","LIKE","DISTINCT"],"a":2,"e":"LIKE 'A%' matches names starting with A.","s":"bank","k":106,"w":["BETWEEN matches ranges.","IN matches a list.","","DISTINCT removes duplicates."]},{"id":"b15-21","u":15,"q":"After adding a new member to the system, the librarian updates their email address.\nWhich SQL command is used for this action?","o":["INSERT","UPDATE","ALTER","GRANT"],"a":1,"e":"UPDATE changes existing rows.","s":"bank","k":105,"w":["INSERT adds new rows.","","ALTER changes structure.","GRANT gives permissions."]},{"id":"b15-22","u":15,"q":"A database admin wants teachers to view student grades but not modify them.\n\nWhich DBMS feature should be used to enforce this restriction?","o":["A stored procedure","A view of the table","Role-based access control (RBAC)","Encryption of the grades column in the table"],"a":2,"e":"RBAC gives teachers a read-only role.","s":"bank","k":102,"w":["A procedure runs code; it does not set roles.","A view can help, but RBAC enforces the permission.","","Encryption hides data; it does not give read-only access."]},{"id":"b15-23","u":15,"q":"A college library app allows students to borrow and return books through forms and buttons without typing SQL. Which part of the database system is this?","o":["Database engine","Query processor","User interface (UI)","Backup system"],"a":2,"e":"Forms and buttons are the user interface.","s":"bank","k":102,"w":["The engine works behind the scenes.","The query processor runs SQL.","","Backup is recovery."]},{"id":"b15-24","u":15,"q":"An IT department uses MySQL to create, query, update and secure its tables. Which part of a database system is MySQL?","o":["DBMS","Data dictionary","Log analyser","User interface"],"a":0,"e":"MySQL is a database management system (DBMS): the software that defines, queries, updates and secures data.","s":"bank","k":102,"w":["","The data dictionary is metadata inside a DBMS.","A log analyser reads logs.","A UI is the front end."]},{"id":"b15-25","u":15,"q":"A database designer creates diagrams showing entities like STUDENT and CLASS with their relationships. What tool is this?","o":["UML diagram","Storyboard","Data dictionary","Flowchart"],"a":0,"e":"UML/ER-style diagrams model entities and relationships.","s":"bank","k":104,"w":["","A storyboard shows screens.","A data dictionary is metadata.","A flowchart shows process steps."]},{"id":"b15-26","u":15,"q":"A company stores customer data in one CSV file without relationships between records. Which structure is used?","o":["Hierarchical","Relational","Network","Flat-file"],"a":3,"e":"One CSV, no relationships = flat file.","s":"bank","k":103,"w":["Hierarchical uses trees.","Relational links tables.","Network uses pointers.",""]},{"id":"b15-27","u":15,"q":"An airline stores routes where each city connects to many other cities using links. Which structure suits best?","o":["Flat-file","Hierarchical","Network","Relational"],"a":2,"e":"Cities linked to many cities = many-to-many = network model.","s":"bank","k":103,"w":["Flat files have no links.","Hierarchical allows one parent.","","Relational could work, but the many-to-many web is the network model."]},{"id":"b15-28","u":15,"q":"A government system arranges records where each employee has exactly one manager. Which model describes it?","o":["Object-oriented","Relational","Network","Hierarchical"],"a":3,"e":"Exactly one manager (one parent) = hierarchical.","s":"bank","k":103,"w":["OO stores objects.","Relational uses tables.","Network allows many parents.",""]},{"id":"b15-29","u":15,"q":"A university system connects teachers, classes, and students using primary and foreign keys. Which structure is used?","o":["Relational","Hierarchical","Tree","Flat-file"],"a":0,"e":"Primary and foreign keys linking tables = relational.","s":"bank","k":103,"w":["","Hierarchical uses trees.","A tree is hierarchical.","Flat files have one table."]},{"id":"b15-30","u":15,"q":"A DBA ensures only registered users can access the system and maintains backups. Which database function is this?","o":["Data querying","Security and recovery","Data redundancy","Normalization"],"a":1,"e":"Controlling access and keeping backups = security and recovery.","s":"bank","k":105,"w":["Querying is reading data.","","Redundancy is duplication.","Normalisation is design."]},{"id":"b15-31","u":15,"q":"A bank stores customer data in documents and JSON format to allow flexible schema changes. Which DBMS type fits best?","o":["Hierarchical","Flat-file","NoSQL","Relational"],"a":2,"e":"JSON documents with flexible schema = NoSQL (document store).","s":"bank","k":103,"w":["Hierarchical uses trees.","Flat files are simple.","","Relational needs a fixed schema."]},{"id":"b15-32","u":15,"q":"A student executes `CREATE TABLE Students (...)`. What SQL category does this belong to?","o":["TCL","DQL","DML","DDL"],"a":3,"e":"CREATE is Data Definition Language (DDL).","s":"bank","k":106,"w":["TCL is COMMIT and ROLLBACK.","DQL is SELECT.","DML is INSERT, UPDATE and DELETE.",""]},{"id":"b15-33","u":15,"q":"A librarian retrieves a list of borrowed books using `SELECT * FROM BorrowedBooks;`. What SQL type is used?","o":["DDL","DQL","DCL","DML"],"a":1,"e":"SELECT is Data Query Language (DQL).","s":"bank","k":106,"w":["DDL is CREATE and ALTER.","","DCL is GRANT and REVOKE.","DML changes data."]},{"id":"b15-34","u":15,"q":"A user mistakenly deletes data and uses `ROLLBACK;` to undo the changes. What SQL feature is applied?","o":["Transaction control","Indexing","Data integrity","Normalization"],"a":0,"e":"ROLLBACK is Transaction Control Language.","s":"bank","k":106,"w":["","Indexing speeds queries.","Integrity is accuracy.","Normalisation is design."]},{"id":"b15-35","u":15,"q":"An organization assigns roles like Admin, Editor, and Viewer with specific permissions. What security method is applied?","o":["Normalization","Backup","Encryption","Role-Based Access Control"],"a":3,"e":"Roles with set permissions = RBAC.","s":"bank","k":105,"w":["Normalisation is design.","Backup is recovery.","Encryption hides data.",""]},{"id":"b15-36","u":15,"q":"A developer grants read-only access using `GRANT SELECT ON table_name TO user;`. What SQL command type is used?","o":["DCL","DML","DDL","DQL"],"a":0,"e":"GRANT/REVOKE are Data Control Language (DCL).","s":"bank","k":106,"w":["","DML changes data.","DDL changes structure.","DQL reads data."]},{"id":"b15-37","u":15,"q":"A company ensures all user input is validated before database submission to prevent SQL injection. What practice is this?","o":["Input sanitization","Rollback handling","Query optimization","Backup management"],"a":0,"e":"Validating/sanitising input prevents SQL injection.","s":"bank","k":105,"w":["","Rollback undoes changes.","Optimisation speeds queries.","Backup is recovery."]},{"id":"b15-38","u":15,"q":"What is the primary purpose of a database?","o":["Encrypt messages","Store and organize data","Create user interfaces","Write software code"],"a":1,"e":"Databases store and organise data.","s":"bank","k":102,"w":["Encryption is security.","","UIs are front ends.","Code is written in IDEs."]},{"id":"b15-39","u":15,"q":"Which component manages the operations of a database system?","o":["Compiler","Operating System","DBMS","Protocol Manager"],"a":2,"e":"The DBMS manages the database's operations.","s":"bank","k":102,"w":["A compiler translates code.","The OS manages the computer.","","\"Protocol Manager\" is not a database component."]},{"id":"b15-40","u":15,"q":"What does a table in a relational database represent?","o":["A single value","A field","An entity","A process"],"a":2,"e":"A table represents one entity (e.g. Student).","s":"bank","k":103,"w":["A single value is a cell.","A field is a column.","","A process is not a table."]},{"id":"b15-41","u":15,"q":"In a table, columns are also referred to as:","o":["Rows","Fields","Records","Pages"],"a":1,"e":"Columns = fields; rows = records.","s":"bank","w":["Rows are records.","","Records are rows.","Pages are storage units."]},{"id":"b15-42","u":15,"q":"Which type of database organizes data in a tree structure?","o":["Flat-file","Relational","Hierarchical","Object-oriented"],"a":2,"e":"Hierarchical = tree structure.","s":"bank","k":103,"w":["Flat files are a single table.","Relational uses tables.","","OO stores objects."]},{"id":"b15-43","u":15,"q":"Flat-file databases are most suitable for:","o":["Managing multimedia","Small, simple datasets","Web development","Cloud storage"],"a":1,"e":"Flat files suit small, simple datasets.","s":"bank","k":103,"w":["Multimedia needs richer databases.","","Web apps need more.","Cloud storage is broader."]},{"id":"b15-44","u":15,"q":"What is a primary key used for?","o":["Encrypting data","Linking two databases","Uniquely identifying records","Sorting values alphabetically"],"a":2,"e":"A primary key uniquely identifies each record.","s":"bank","k":106,"w":["Keys do not encrypt.","Linking tables is a foreign key's role.","","Sorting uses ORDER BY."]},{"id":"b15-45","u":15,"q":"Which key is used to establish relationships between tables?","o":["Foreign key","Composite key","Static key","Magic key"],"a":0,"e":"Foreign keys link tables.","s":"bank","k":106,"w":["","A composite key is made of several columns.","\"Static key\" is not a database term.","\"Magic key\" is not a database term."]},{"id":"b15-46","u":15,"q":"What is the function of UML in database design?","o":["Encrypting the schema","Showing data relationships","Writing SQL queries","Formatting the output of each table"],"a":1,"e":"UML diagrams visualise data and relationships for design.","s":"bank","k":104,"w":["UML does not encrypt.","","Queries are wri
